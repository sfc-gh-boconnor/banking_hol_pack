 at the top left back to <strong>Home<\/strong>.<\/li>\n<li>Open <strong>Projects &gt; Workspaces<\/strong>.<\/li>\n<li>Open the <strong>My Workspace<\/strong> dropdown (top left) and pick <strong>banking-hol-pack<\/strong>.<\/li>\n<\/ol>\n<p><strong>Important:<\/strong> go back to <strong>Home<\/strong> first. Workspaces isn&#x27;t on the CoCo side, where you worked in DS0.<\/p>\n<p>What&#x27;s in the Workspace:<\/p>\n<ul>\n<li>the file explorer (left) holds the lab: <code>notebooks/<\/code>, <code>vignettes/<\/code><\/li>\n<li>Cortex Code is here too, as a sidebar: the round button at the bottom right<\/li>\n<\/ul>\n<p><strong>Tip:<\/strong> Snowsight sometimes reopens <strong>My Workspace<\/strong>. Check the name at the top left whenever you come back.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> the banking-hol-pack Workspace open, with <code>notebooks/<\/code> and <code>vignettes/<\/code> in the file explorer<\/p>\n<h4>Open the starter notebook and create its service<\/h4>\n<p class=\"where\">the <strong>banking-hol-pack<\/strong> Workspace (not My Workspace) &gt; file explorer &gt; <code>notebooks/ds1_attrition_model.ipynb<\/code><\/p>\n<ol>\n<li>Open <code>notebooks/<\/code> &gt; <strong>ds1_attrition_model.ipynb<\/strong> in the file explorer.<\/li>\n<\/ol>\n<ul>\n<li>Can&#x27;t see <code>notebooks/<\/code> and <code>vignettes/<\/code>? You&#x27;re in the wrong Workspace. Pick <strong>banking-hol-pack<\/strong> from the Workspace dropdown (top left).<\/li>\n<\/ul>\n<ol>\n<li>In the notebook toolbar, click the arrow next to the status dot (right of the blue run button).<\/li>\n<li>Choose <strong>Create new service<\/strong>.<\/li>\n<\/ol>\n<ul>\n<li>Already created one in another module? Pick it under <strong>Select service<\/strong> instead, usually <code>USER_SERVICE_1<\/code>.<\/li>\n<\/ul>\n<ol>\n<li>Expand <strong>Service settings<\/strong> in <strong>Connect your notebook<\/strong> and fill it in as below. Only the three <strong>bold<\/strong> rows change.<\/li>\n<\/ol>\n<table>\n<tr><td>Setting<\/td><td>Value<\/td><\/tr>\n<tr><td>Service name<\/td><td>leave the default (e.g. <code>USER_SERVICE_1<\/code>)<\/td><\/tr>\n<tr><td>Runtime<\/td><td>leave as is (v3.0 \u00b7 Python 3.12)<\/td><\/tr>\n<tr><td>Compute type<\/td><td>CPU<\/td><\/tr>\n<tr><td><strong>Compute pool<\/strong><\/td><td><strong>NOTEBOOK_POOL<\/strong> (change it from HOL_COMPUTE_POOL_CPU)<\/td><\/tr>\n<tr><td><strong>Idle timeout<\/strong><\/td><td><strong>1 hour<\/strong> (change it from 24 hours)<\/td><\/tr>\n<tr><td><strong>External access integrations<\/strong><\/td><td><strong>HOL_NOTEBOOK_ACCESS_INTEGRATION<\/strong><\/td><\/tr>\n<\/table>\n<p><strong>Trial accounts:<\/strong> there&#x27;s no HOL_NOTEBOOK_ACCESS_INTEGRATION (trials don&#x27;t allow external access). Leave <strong>External access integrations<\/strong> empty: this module works without it.<\/p>\n<ol>\n<li>Click <strong>Create and connect<\/strong>. The first start takes 1-2 minutes.<\/li>\n<li>Check the role is <strong>HOL_PARTICIPANT<\/strong> and the warehouse is <strong>BANKING_WH<\/strong> (role and warehouse button in the notebook toolbar).<\/li>\n<\/ol>\n<p>The notebook runtime already has <code>snowflake-ml-python<\/code>, scikit-learn and XGBoost.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> the starter notebook open in banking-hol-pack with its numbered headings, and the status dot showing the service connected<\/p>\n<h4>Build point-in-time features<\/h4>\n<p class=\"where\">the Cortex Code sidebar, with <code>ds1_attrition_model<\/code> open<\/p>\n<ol>\n<li>With <code>ds1_attrition_model<\/code> open, click the round <strong>Cortex Code<\/strong> button at the bottom right of the Workspace.<\/li>\n<li>In the sidebar, press <strong>New chat<\/strong> if it opens an earlier chat.<\/li>\n<li>Paste the prompt below into the <strong>Ask, build<\/strong> box and press <strong>Enter<\/strong>.<\/li>\n<li><strong>Allow<\/strong> each command Cortex Code wants to run, then run the cells it adds.<\/li>\n<\/ol>\n<p><strong>Tip:<\/strong> keep the notebook open while you work in the sidebar, so Cortex Code adds the cells to it.<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>In the open notebook ds1_attrition_model, put each cell I ask for under its matching numbered heading. Under heading 1, add a SQL cell named features that creates the view BANKING_HOL.ML.RB_CHURN_FEATURES with one row per retail customer who was still a customer on the observation date 31 Aug 2026. Use only data from on or before that date: tenure, age, segment, IMD decile, housing tenure, credit score, digital active, whether their home branch is one of BR-MAN-90, BR-LDS-90 or BR-CDF-90, drive minutes to it, and from RB_MONTHLY_SNAPSHOT the last 3 months&#x27; average logins, branch visits and card spend, latest balances and products held, salary trend (last 3 months against the 3 before), and from RB_ACCOUNTS joined to RB_PRODUCTS the lowest savings rate and whether they hold \u00a315,000 or more on a legacy saver. The label CHURNED_NEXT_3M is 1 if CHURN_DATE falls in the 3 months after the observation date. Don&#x27;t use CHURNED, CHURN_REASON, CHURNED_FLAG, CLOSED_DATE or STATUS. Then add a SQL cell named class_balance and run both.<\/pre><\/div>\n<p><strong>Important:<\/strong> the label comes from after the observation date, and every feature from before it. That&#x27;s what stops the model seeing the future.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> about 18,400 customers, of whom about 2% leave in the next 3 months<\/p>\n<h4>Train two models and track them in an experiment<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Under heading 2, add a Python cell named load that shows the row count and label balance of RB_CHURN_FEATURES with the active Snowpark session (don&#x27;t pull it into pandas here). Then add a cell named train_and_track that first sets the session&#x27;s database and schema to BANKING_HOL.ML (an ML Job needs them), then runs the training as a Snowflake ML Job, using the @remote decorator from snowflake.ml.jobs with compute pool DS_TRAINING_POOL and stage BANKING_HOL.ML.JOB_STAGE, so the training data and models never sit in this notebook&#x27;s memory. Inside the job function: get the session with get_active_session, read RB_CHURN_FEATURES into pandas, split 70/30 stratified, and train a logistic regression baseline (balanced class weights, scaled features) and an XGBoost classifier (scale_pos_weight for the imbalance) as scikit-learn pipelines. Track each as a run in the Snowflake experiment RB_ATTRITION in BANKING_HOL.ML with snowflake.ml.experiment.ExperimentTracking, logging parameters including the observation date, and metrics AUC, average precision, precision in the top decile and lift in the top decile, with a unique timestamped run name each. Then log the best run&#x27;s pipeline to the Model Registry in BANKING_HOL.ML as RB_ATTRITION_MODEL (metrics, sample input, target platform WAREHOUSE, a comment naming the experiment), let it generate the version name, make it the default, and return the metrics. Submit the job, wait for it, and print its status and result. Run both cells.<\/pre><\/div>\n<p><strong>Tip:<\/strong> the first job takes a few minutes while DS_TRAINING_POOL starts. The notebook stays responsive: it only waits for the result.<\/p>\n<p>Then compare the runs:<\/p>\n<ol>\n<li>Open <strong>AI &amp; ML &gt; Experiments<\/strong> in Snowsight (in a new browser tab).<\/li>\n<li>Open <strong>RB_ATTRITION<\/strong>, tick both runs and press <strong>Compare<\/strong>.<\/li>\n<\/ol>\n<p><strong>Tip:<\/strong> accuracy would be about 98% for a model that predicts nobody leaves. Lift in the top decile is what the retention team cares about.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> the job finishes as DONE with two runs in the experiment. Both score an AUC of about 0.83 to 0.87, XGBoost slightly ahead, and the top decile holds about 7 times the average rate of leavers.<\/p>\n<h4>Check the registered model<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Under heading 3, add a Python cell named register that opens the Snowflake Model Registry (snowflake.ml.registry.Registry) in BANKING_HOL.ML and shows the versions of RB_ATTRITION_MODEL, which version is the default, and its metrics and comment. Run it.<\/pre><\/div>\n<p>Then look at it: <strong>AI &amp; ML &gt; Models<\/strong> &gt; <strong>RB_ATTRITION_MODEL<\/strong> shows the version, its metrics and the comment.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> RB_ATTRITION_MODEL with one version (more if you re-run), metrics attached and set as the default<\/p>\n<h4>Score every customer<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Under heading 4, add a Python cell named score that runs the default version of RB_ATTRITION_MODEL from the registry with predict_proba on every row of RB_CHURN_FEATURES, and writes CUSTOMER_ID, CHURN_PROBABILITY and RISK_BAND (HIGH for the top 5%, MEDIUM for the next 15%, LOW otherwise) to the table BANKING_HOL.ML.RB_ATTRITION_SCORES. Then add a SQL cell named risk_bands showing, per band, the customer count, average probability and the actual share who left. Run both.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> about 900 HIGH, 2,800 MEDIUM and 14,800 LOW customers. About a third of the HIGH band really did leave, against about 2% overall.<\/p>\n<h4>Explain the drivers<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Under heading 5, add a Python cell named drivers that shows the XGBoost feature importances as a bar chart and explains the top five in plain English for a retention manager. Then add a SQL cell named retention_list that joins RB_ATTRITION_SCORES to RB_CUSTOMERS and RETAIL.BRANCHES for the 20 HIGH-risk customers with the highest probability: name, city, home branch, products held and a suggested retention action for each. Run both.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the top drivers include complaints, short tenure, falling salary credits and branch reliance at a closure branch, then a call list of 20 customers with an action each<\/p>\n<h3>Check your work<\/h3>\n<p>The feature view, an experiment with at least two runs, a registered model and the scores table all exist in <code>BANKING_HOL.ML<\/code>.<\/p>\n<h3>In your bank<\/h3>\n<p>At a bank a model like this goes to model risk review before anyone acts on it. Here, the review evidence comes built in: the experiment holds every run that was tried, the registry holds the exact version that scored customers, and lineage links the two.<\/p>", "sql": "-- =====================================================\n-- DS1: PREDICT ATTRITION - reference SQL\n-- Point-in-time features for the attrition model: what we knew about each customer on\n-- 31 Aug 2026, and whether they left in the 3 months after. Run as HOL_PARTICIPANT.\n-- The notebook (notebooks/ds1_attrition_model.ipynb) trains on this view; this file is\n-- the fallback and the answer key.\n-- =====================================================\nUSE SECONDARY ROLES NONE;\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ML;\n\nCREATE OR REPLACE VIEW RB_CHURN_FEATURES COMMENT = 'DS1 point-in-time attrition features, observed 2026-08-31, label = left by 2026-11-30' AS\nWITH obs AS (SELECT '2026-08-31'::DATE AS OBS_DATE),\nsnap AS (  -- only months up to the observation date: no peeking at the future\n    SELECT s.CUSTOMER_ID,\n           AVG(IFF(s.MONTH >  DATEADD(month, -3, o.OBS_DATE), s.SALARY_IN_GBP, NULL)) AS SALARY_L3M,\n           AVG(IFF(s.MONTH <= DATEADD(month, -3, o.OBS_DATE), s.SALARY_IN_GBP, NULL)) AS SALARY_P3M,\n           AVG(IFF(s.MONTH >  DATEADD(month, -3, o.OBS_DATE), s.APP_LOGINS, NULL))    AS LOGINS_L3M,\n           AVG(IFF(s.MONTH >  DATEADD(month, -3, o.OBS_DATE), s.BRANCH_VISITS, NULL)) AS BRANCH_VISITS_L3M,\n           AVG(IFF(s.MONTH >  DATEADD(month, -3, o.OBS_DATE), s.CARD_SPEND_GBP, NULL)) AS CARD_SPEND_L3M,\n           MAX_BY(s.CURRENT_BALANCE_GBP, s.MONTH) AS CURRENT_BALANCE,\n           MAX_BY(s.SAVINGS_BALANCE_GBP, s.MONTH) AS SAVINGS_BALANCE,\n           MAX_BY(s.PRODUCTS_HELD, s.MONTH)       AS PRODUCTS_HELD,\n           SUM(s.PROFIT_GBP)                      AS PROFIT_TO_DATE\n    FROM BANKING_HOL.RAW_DATA.RB_MONTHLY_SNAPSHOT s, obs o\n    WHERE s.MONTH <= o.OBS_DATE\n    GROUP BY s.CUSTOMER_ID\n),\nsav AS (\n    SELECT a.CUSTOMER_ID, MIN(a.INTEREST_RATE_PCT) AS MIN_SAVINGS_RATE,\n           -- \u00a315k+ sitting on a closed, low-rate legacy saver: the rate-sensitive savers who leave\n           MAX(IFF(p.TIER = 'LEGACY' AND a.BALANCE_GBP >= 15000, 1, 0)) AS ON_LEGACY_SAVER\n    FROM BANKING_HOL.RAW_DATA.RB_ACCOUNTS a JOIN BANKING_HOL.RAW_DATA.RB_PRODUCTS p ON p.PRODUCT_ID = a.PRODUCT_ID, obs o\n    WHERE p.PRODUCT_FAMILY = 'SAVINGS' AND a.OPENED_DATE <= o.OBS_DATE\n    GROUP BY a.CUSTOMER_ID\n)\nSELECT c.CUSTOMER_ID,\n       DATEDIFF(month, c.CUSTOMER_SINCE, o.OBS_DATE) AS TENURE_MONTHS,\n       c.AGE, c.SEGMENT, c.IMD_DECILE, c.HOUSING_TENURE, c.CREDIT_SCORE,\n       IFF(c.DIGITAL_ACTIVE, 1, 0) AS DIGITAL_ACTIVE,\n       IFF(c.HOME_BRANCH_ID IN ('BR-MAN-90', 'BR-LDS-90', 'BR-CDF-90'), 1, 0) AS BRANCH_AT_RISK,\n       c.HOME_BRANCH_DRIVE_S / 60 AS BRANCH_DRIVE_MIN,\n       s.PRODUCTS_HELD, s.CURRENT_BALANCE, s.SAVINGS_BALANCE, s.CARD_SPEND_L3M, s.LOGINS_L3M, s.BRANCH_VISITS_L3M,\n       s.SALARY_L3M / NULLIF(s.SALARY_P3M, 0) AS SALARY_TREND,  -- below 1: pay starting to go elsewhere\n       COALESCE(sv.MIN_SAVINGS_RATE, 0) AS MIN_SAVINGS_RATE, COALESCE(sv.ON_LEGACY_SAVER, 0) AS ON_LEGACY_SAVER,\n       s.PROFIT_TO_DATE,\n       -- the label: left in the 3 months after the observation date\n       IFF(c.CHURN_DATE > o.OBS_DATE AND c.CHURN_DATE <= DATEADD(month, 3, o.OBS_DATE), 1, 0) AS CHURNED_NEXT_3M\nFROM BANKING_HOL.RAW_DATA.RB_CUSTOMERS c\nJOIN snap s ON s.CUSTOMER_ID = c.CUSTOMER_ID\nLEFT JOIN sav sv ON sv.CUSTOMER_ID = c.CUSTOMER_ID\nCROSS JOIN obs o\nWHERE c.CUSTOMER_SINCE <= o.OBS_DATE\n  AND (c.CHURN_DATE IS NULL OR c.CHURN_DATE > o.OBS_DATE);  -- still a customer on the observation date\n\n-- Class balance: about 2-3% leave in the next 3 months\nSELECT CHURNED_NEXT_3M, COUNT(*) AS CUSTOMERS, ROUND(RATIO_TO_REPORT(COUNT(*)) OVER () * 100, 1) AS PCT\nFROM RB_CHURN_FEATURES GROUP BY 1 ORDER BY 1;\n\n-- Leakage traps to leave out: CHURN_DATE, CHURN_REASON, CHURNED, RB_MONTHLY_SNAPSHOT.CHURNED_FLAG,\n-- any snapshot month after OBS_DATE, RB_ACCOUNTS.CLOSED_DATE and STATUS.\n\n-- After the notebook: the experiment, the registered model and the scores\nSHOW EXPERIMENTS IN SCHEMA BANKING_HOL.ML;\nSHOW MODELS IN SCHEMA BANKING_HOL.ML;\nSELECT RISK_BAND, COUNT(*) AS CUSTOMERS FROM BANKING_HOL.ML.RB_ATTRITION_SCORES GROUP BY 1 ORDER BY 1;\n", "sql_name": "vignettes/ds1_attrition_model/ds1.sql"}, {"code": "DS2", "title": "Fraud anomaly detection", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Scientist<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~40 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>DS0 recommended (DS1 if you want the service already created). Uses <code>BANKING_HOL.RAW_DATA.RB_TRANSACTIONS<\/code> and the <code>BANKING_HOL.ML<\/code> schema<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>New fraud patterns arrive before anyone has labelled them. Can we flag transactions that don&#x27;t look like the customer, without training on labels, and how much fraud would the fraud team catch?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>View <code>ML.RB_TXN_FEATURES<\/code>: behaviour per outgoing transaction (amount against the customer&#x27;s usual, time of day, new payee, abroad, velocity, country change)<\/li>\n<li>Experiment <code>ML.RB_FRAUD<\/code> with two isolation forest runs, measured against the fraud labels<\/li>\n<li>Model <code>ML.RB_FRAUD_ANOMALY<\/code> in the Model Registry<\/li>\n<li>Table <code>ML.RB_FRAUD_ALERTS<\/code>: the top 0.5% most anomalous transactions, for the fraud team to review<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Open the starter notebook<\/h4>\n<p class=\"where\">the <strong>banking-hol-pack<\/strong> Workspace &gt; file explorer &gt; <code>notebooks/ds2_fraud_anomaly.ipynb<\/code><\/p>\n<ol>\n<li>Open <code>notebooks/<\/code> &gt; <strong>ds2_fraud_anomaly.ipynb<\/strong> in the file explorer.<\/li>\n<li>In the notebook toolbar, click the arrow next to the status dot and pick your service under <strong>Select service<\/strong> (usually <code>USER_SERVICE_1<\/code>, from DS1).<\/li>\n<\/ol>\n<ul>\n<li>No service yet? Choose <strong>Create new service<\/strong> and fill it in as in DS1: <strong>NOTEBOOK_POOL<\/strong>, <strong>1 hour<\/strong> idle timeout, <strong>HOL_NOTEBOOK_ACCESS_INTEGRATION<\/strong>.<\/li>\n<\/ul>\n<ol>\n<li>Check the role is <strong>HOL_PARTICIPANT<\/strong> and the warehouse is <strong>BANKING_WH<\/strong>.<\/li>\n<\/ol>\n<p class=\"expect\"><strong>What you should see:<\/strong> the starter notebook open with its numbered headings, connected to your service<\/p>\n<h4>Build behavioural features<\/h4>\n<p class=\"where\">the Cortex Code sidebar, with <code>ds2_fraud_anomaly<\/code> open<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>In the open notebook ds2_fraud_anomaly, put each cell I ask for under its matching numbered heading. Under heading 1, add a SQL cell named features that creates the view BANKING_HOL.ML.RB_TXN_FEATURES with one row per outgoing transaction (AMOUNT_GBP below 0) in BANKING_HOL.RAW_DATA.RB_TRANSACTIONS. Features: log amount, amount divided by that customer&#x27;s median, hour of day, is night (midnight to 5am), is online, is new payee, is abroad, is a Faster Payment, the customer&#x27;s number of payments in the previous 30 minutes, whether the country changed within 2 hours of their previous payment, and whether the customer is 65 or over (from RB_CUSTOMERS). Keep IS_FRAUD and FRAUD_TYPE for evaluation only. Run it and show the fraud rate.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> about 1.2 million outgoing transactions, 0.4% of them labelled fraud<\/p>\n<h4>Train anomaly models without labels and track them<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Under heading 2, add a Python cell named train_and_track that first sets the session&#x27;s database and schema to BANKING_HOL.ML (an ML Job needs them), then runs the training as a Snowflake ML Job, using the @remote decorator from snowflake.ml.jobs with compute pool DS_TRAINING_POOL and stage BANKING_HOL.ML.JOB_STAGE, so the sample and models never sit in this notebook&#x27;s memory. Inside the job function: get the session with get_active_session, sample 300,000 rows of RB_TXN_FEATURES, and train two scikit-learn IsolationForest models on the features only (no labels): 100 trees with contamination 0.005, and 300 trees with contamination 0.01. Track each as a run in the Snowflake experiment RB_FRAUD in BANKING_HOL.ML with ExperimentTracking, using unique timestamped run names. Score with -score_samples, flag the top 0.5% as alerts, and log the parameters, AUC and average precision against IS_FRAUD, precision and recall at the 0.5% alert rate, and recall for each FRAUD_TYPE. Then log the run with the best average precision to the Model Registry in BANKING_HOL.ML as RB_FRAUD_ANOMALY (sample input, metrics, target platform WAREHOUSE, a comment saying it was trained without labels), make it the default version, and return the metrics. Submit the job, wait for it, and print its status and result. Run it.<\/pre><\/div>\n<p><strong>Tip:<\/strong> the job runs on DS_TRAINING_POOL, not your notebook service. The first one takes a few minutes while the pool starts.<\/p>\n<p><strong>Important:<\/strong> the labels never touch training. They&#x27;re only there to tell you whether the model would have caught real fraud.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> both runs score an AUC of about 0.99 against the labels. At a 0.5% alert rate, about 6 in 10 alerts are real fraud and about 2 in 3 to 3 in 4 frauds are caught: nearly all APP scams and account takeovers, most card testing, but only about 1 in 8 impossible-travel payments.<\/p>\n<h4>Register and score every transaction<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Under heading 3, add a Python cell named register_and_score that gets the default version of RB_FRAUD_ANOMALY from the Model Registry in BANKING_HOL.ML, runs it with score_samples on a Snowpark DataFrame of every row of RB_TXN_FEATURES (so the scoring runs in the warehouse, not the notebook) and saves the top 0.5% most anomalous transactions to the table BANKING_HOL.ML.RB_FRAUD_ALERTS with TXN_ID, CUSTOMER_ID, TXN_TS and ANOMALY_SCORE. Then add a SQL cell named alerts_by_type counting the alerts by FRAUD_TYPE (null means not labelled fraud). Run both.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> about 6,000 alerts, about 3,800 of them labelled fraud. The rest are unusual but genuine payments, which the fraud team would clear.<\/p>\n<h4>Find what the model misses<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Under heading 4, add a SQL cell named misses that shows the fraud the model didn&#x27;t flag, by FRAUD_TYPE, and explains why impossible travel slips through when each payment looks normal on its own. Then test a simple rule, COUNTRY_CHANGE_2H = 1, on its own: how many transactions it flags and how many are impossible travel. Suggest how to combine the model and the rule.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> most of the missed fraud is impossible travel. The country-change rule flags about 2,100 transactions, about 300 of them impossible travel. Models and rules work best together.<\/p>\n<p><strong>Tip:<\/strong> the alerts link to the fraud case notes, SAR narratives and evidence files in AI4, where AI SQL reads them.<\/p>\n<h3>Check your work<\/h3>\n<p>An experiment with at least two runs, a registered anomaly model and the alerts table all exist in <code>BANKING_HOL.ML<\/code>.<\/p>\n<h3>In your bank<\/h3>\n<p>Fraud models change often, so the registry&#x27;s versions and the experiment&#x27;s runs are how a bank shows which model was live when a payment was stopped, and why it was chosen.<\/p>", "sql": "-- =====================================================\n-- DS2: FRAUD ANOMALY DETECTION - reference SQL\n-- Per-transaction behavioural features for an unsupervised anomaly model. Labels\n-- (IS_FRAUD, FRAUD_TYPE) are kept only to evaluate it. Run as HOL_PARTICIPANT.\n-- The notebook (notebooks/ds2_fraud_anomaly.ipynb) trains on this view.\n-- =====================================================\nUSE SECONDARY ROLES NONE;\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ML;\n\nCREATE OR REPLACE VIEW RB_TXN_FEATURES COMMENT = 'DS2 behavioural features per outgoing retail transaction; IS_FRAUD kept for evaluation only' AS\nWITH t AS (\n    SELECT TXN_ID, CUSTOMER_ID, TXN_TS, -AMOUNT_GBP AS AMOUNT, CHANNEL, CATEGORY, MERCHANT_COUNTRY,\n           IS_ONLINE, IS_NEW_PAYEE, IS_FRAUD, FRAUD_TYPE\n    FROM BANKING_HOL.RAW_DATA.RB_TRANSACTIONS\n    WHERE AMOUNT_GBP < 0  -- money going out\n),\nusual AS (\n    SELECT CUSTOMER_ID, MEDIAN(AMOUNT) AS MEDIAN_AMOUNT, STDDEV(AMOUNT) AS SD_AMOUNT\n    FROM t GROUP BY 1\n)\nSELECT t.TXN_ID, t.CUSTOMER_ID, t.TXN_TS,\n       LN(1 + t.AMOUNT) AS LOG_AMOUNT,\n       t.AMOUNT / NULLIF(u.MEDIAN_AMOUNT, 0) AS AMOUNT_VS_USUAL,  -- how unusual for this customer\n       HOUR(t.TXN_TS) AS HOUR_OF_DAY,\n       IFF(HOUR(t.TXN_TS) BETWEEN 0 AND 5, 1, 0) AS IS_NIGHT,\n       IFF(t.IS_ONLINE, 1, 0) AS IS_ONLINE,\n       IFF(t.IS_NEW_PAYEE, 1, 0) AS IS_NEW_PAYEE,\n       IFF(t.MERCHANT_COUNTRY <> 'GB', 1, 0) AS IS_ABROAD,\n       IFF(t.CHANNEL = 'FPS_OUT', 1, 0) AS IS_FASTER_PAYMENT,\n       -- velocity: this customer's payments in the 30 minutes before\n       COUNT(*) OVER (PARTITION BY t.CUSTOMER_ID ORDER BY t.TXN_TS\n                      RANGE BETWEEN INTERVAL '30 minutes' PRECEDING AND CURRENT ROW) - 1 AS TXNS_PRIOR_30M,\n       -- impossible travel: a different country within 2 hours\n       IFF(LAG(t.MERCHANT_COUNTRY) OVER (PARTITION BY t.CUSTOMER_ID ORDER BY t.TXN_TS) <> t.MERCHANT_COUNTRY\n           AND DATEDIFF(minute, LAG(t.TXN_TS) OVER (PARTITION BY t.CUSTOMER_ID ORDER BY t.TXN_TS), t.TXN_TS) <= 120, 1, 0) AS COUNTRY_CHANGE_2H,\n       IFF(c.AGE >= 65, 1, 0) AS CUSTOMER_65_PLUS,\n       IFF(t.IS_FRAUD, 1, 0) AS IS_FRAUD, t.FRAUD_TYPE  -- evaluation only, never a feature\nFROM t\nJOIN usual u ON u.CUSTOMER_ID = t.CUSTOMER_ID\nJOIN BANKING_HOL.RAW_DATA.RB_CUSTOMERS c ON c.CUSTOMER_ID = t.CUSTOMER_ID;\n\nSELECT COUNT(*) AS TXNS, SUM(IS_FRAUD) AS FRAUD, ROUND(100 * AVG(IS_FRAUD), 2) AS FRAUD_PCT FROM RB_TXN_FEATURES;\n\n-- After the notebook: how many of the flagged transactions are labelled fraud, by type\nSELECT f.FRAUD_TYPE, COUNT(*) AS FLAGGED\nFROM BANKING_HOL.ML.RB_FRAUD_ALERTS a JOIN RB_TXN_FEATURES f ON f.TXN_ID = a.TXN_ID\nGROUP BY 1 ORDER BY 2 DESC;\nSHOW MODELS LIKE 'RB_FRAUD_ANOMALY' IN SCHEMA BANKING_HOL.ML;\n", "sql_name": "vignettes/ds2_fraud_anomaly/ds2.sql"}, {"code": "DS3", "title": "Model risk evidence pack", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Scientist<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~40 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>DS1, or <code>setup/catchup/ds1_model.sql<\/code><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Model risk will ask what this model is, who owns it, what it may be used for, how well it really works, why we picked it over the alternative, and who approved it. Can we answer from the platform the model runs on, instead of a slide deck that&#x27;s out of date by the next release?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li><code>ML.MODEL_INVENTORY<\/code> from the Model Registry, with owner, permitted use, risk tier and status<\/li>\n<li><code>ML.MODEL_VALIDATION<\/code> (predicted vs actual leavers) and <code>ML.MODEL_CHALLENGERS<\/code> (every experiment run)<\/li>\n<li><code>ML.MODEL_CARD<\/code> drafted by AI from that evidence, and <code>ML.MODEL_APPROVALS<\/code> with the decision and its conditions<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Put the model on the inventory<\/h4>\n<p class=\"where\">the Cortex Code sidebar<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Run SHOW VERSIONS IN MODEL BANKING_HOL.ML.RB_ATTRITION_MODEL, then create a table BANKING_HOL.ML.MODEL_INVENTORY from its result (RESULT_SCAN of LAST_QUERY_ID) with MODEL_NAME, VERSION, IS_DEFAULT, PURPOSE (the version comment), FRAMEWORK (from model_attributes), AUC (from metadata metrics), REGISTERED_ON, and these fixed values cast to VARCHAR: OWNER &#x27;Retail Analytics&#x27;, PERMITTED_USE &#x27;Rank customers for retention offers; never used to refuse a product or set a price&#x27;, RISK_TIER &#x27;MEDIUM&#x27;, TRAINING_DATA &#x27;ML.RB_CHURN_FEATURES (observed 2026-08-31, label: left by 2026-11-30)&#x27;, STATUS &#x27;PENDING_VALIDATION&#x27;. Show it.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> one row per registered version, with the registry&#x27;s own metrics next to what model risk needs<\/p>\n<h4>Validate it against what really happened<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a table BANKING_HOL.ML.MODEL_VALIDATION comparing the model&#x27;s average CHURN_PROBABILITY in ML.RB_ATTRITION_SCORES with the actual leave rate (CHURNED_NEXT_3M in ML.RB_CHURN_FEATURES), as percentages, with columns CUT, GROUP_NAME, CUSTOMERS, PREDICTED_PCT and ACTUAL_PCT: one set of rows by RISK_BAND and one by SEGMENT. Show it, and tell me in two sentences whether the model ranks customers well and whether its probabilities can be taken at face value.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the high band leaves far more often than the low band (it ranks well), but the predicted rates sit well above the actual ones (balanced class weights inflate them)<\/p>\n<h4>Compare the champion with the challenger<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Run SHOW RUN METRICS IN EXPERIMENT BANKING_HOL.ML.RB_ATTRITION and pivot it into a table BANKING_HOL.ML.MODEL_CHALLENGERS with one row per run (RUN_NAME, AUC, AVG_PRECISION, LIFT_TOP_DECILE, PRECISION_TOP_DECILE). Mark which run is the registered default (its name starts the default version&#x27;s comment in MODEL_INVENTORY) and explain the trade-off between the two runs.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> two runs; the one with the higher AUC isn&#x27;t necessarily the one with the best lift in the top decile, which is the number a retention team acts on<\/p>\n<h4>Draft the model card<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a table BANKING_HOL.ML.MODEL_CARD with one row for the default version in MODEL_INVENTORY: MODEL_NAME, VERSION, DRAFTED_AT and CARD, a plain-English model card under 200 words written by AI_COMPLETE (claude-sonnet-4-5) from MODEL_INVENTORY, MODEL_VALIDATION and MODEL_CHALLENGERS only, as labelled lines: Purpose, Permitted use, Data, Performance, Champion vs challenger, Known limitations, Conditions for use. Show the card.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a card that says what the evidence says, including the calibration limitation<\/p>\n<h4>Record the decision<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a table BANKING_HOL.ML.MODEL_APPROVALS (MODEL_NAME, VERSION, DECISION, CONDITIONS, APPROVER, DECIDED_AT) and insert a row for the default version: decision APPROVED_WITH_CONDITIONS, conditions &#x27;Use for ranking only: probabilities run high against actual outcomes, so recalibrate before quoting them. Review quarterly.&#x27;, approver CURRENT_USER(). Then update MODEL_INVENTORY.STATUS from the decision and show the inventory with the approval.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the inventory now says who approved the model, when, and on what conditions<\/p>\n<h3>Check your work<\/h3>\n<p><code>MODEL_INVENTORY<\/code> shows <code>RB_ATTRITION_MODEL<\/code> as <code>APPROVED_WITH_CONDITIONS<\/code>, and <code>MODEL_VALIDATION<\/code> and <code>MODEL_CARD<\/code> explain why.<\/p>\n<h3>In your bank<\/h3>\n<p>SS1/23 sets the PRA&#x27;s expectations for UK banks with internal-model approval for regulatory capital, across all their model types, and expects validation to be independent of the people who built the model. In production the inventory would cover every model, read straight from the registry, and monitoring would add drift over time. The executive demo&#x27;s &quot;Every model on the record&quot; stop is this module, finished.<\/p>", "sql": "-- =====================================================\n-- DS3: Model risk evidence pack (solution / catch-up)\n-- The PRA's SS1/23 principles (model identification, governance, development and use,\n-- independent validation, risk mitigants) applied to the DS1 attrition model: an inventory\n-- from the Model Registry, validation against what really happened, champion vs challenger\n-- from the experiment, an AI-drafted model card, and a recorded approval.\n-- Run as HOL_PARTICIPANT after DS1 (or setup/catchup/ds1_model.sql).\n-- =====================================================\nUSE ROLE HOL_PARTICIPANT;\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ML;\n\n-- 1. Inventory: every version of every model in the registry, plus what model risk asks for\nSHOW VERSIONS IN MODEL RB_ATTRITION_MODEL;\nCREATE OR REPLACE TABLE MODEL_INVENTORY AS\nSELECT \"model_name\" AS MODEL_NAME, \"name\" AS VERSION, \"is_default_version\"::BOOLEAN AS IS_DEFAULT, \"comment\" AS PURPOSE,\n       PARSE_JSON(\"model_attributes\"):framework::VARCHAR AS FRAMEWORK,\n       PARSE_JSON(\"metadata\"):metrics:auc::FLOAT AS AUC,\n       \"created_on\"::TIMESTAMP_LTZ AS REGISTERED_ON,\n       'Retail Analytics' AS OWNER,\n       'Rank customers for retention offers; never used to refuse a product or set a price' AS PERMITTED_USE,\n       'MEDIUM' AS RISK_TIER,\n       'ML.RB_CHURN_FEATURES (observed 2026-08-31, label: left by 2026-11-30)' AS TRAINING_DATA,\n       'PENDING_VALIDATION'::VARCHAR AS STATUS\nFROM TABLE(RESULT_SCAN(LAST_QUERY_ID()));\nSELECT * FROM MODEL_INVENTORY;\n\n-- 2. Validation: predicted vs actual, by risk band and by segment\nCREATE OR REPLACE TABLE MODEL_VALIDATION AS\nWITH s AS (\n  SELECT f.SEGMENT, sc.RISK_BAND, sc.CHURN_PROBABILITY, f.CHURNED_NEXT_3M\n  FROM RB_ATTRITION_SCORES sc JOIN RB_CHURN_FEATURES f USING (CUSTOMER_ID))\nSELECT 'RISK_BAND' AS CUT, RISK_BAND AS GROUP_NAME, COUNT(*) AS CUSTOMERS,\n       ROUND(100 * AVG(CHURN_PROBABILITY), 1) AS PREDICTED_PCT, ROUND(100 * AVG(CHURNED_NEXT_3M), 1) AS ACTUAL_PCT\nFROM s GROUP BY 2\nUNION ALL\nSELECT 'SEGMENT', SEGMENT, COUNT(*), ROUND(100 * AVG(CHURN_PROBABILITY), 1), ROUND(100 * AVG(CHURNED_NEXT_3M), 1)\nFROM s GROUP BY 2;\nSELECT * FROM MODEL_VALIDATION ORDER BY CUT, PREDICTED_PCT DESC;\n\n-- 3. Champion vs challenger: every run in the experiment, one row per run\nSHOW RUN METRICS IN EXPERIMENT RB_ATTRITION;\nCREATE OR REPLACE TABLE MODEL_CHALLENGERS AS\nSELECT \"run_name\" AS RUN_NAME,\n       MAX(IFF(\"name\" = 'auc', \"value\", NULL)) AS AUC,\n       MAX(IFF(\"name\" = 'avg_precision', \"value\", NULL)) AS AVG_PRECISION,\n       MAX(IFF(\"name\" = 'lift_top_decile', \"value\", NULL)) AS LIFT_TOP_DECILE,\n       MAX(IFF(\"name\" = 'precision_top_decile', \"value\", NULL)) AS PRECISION_TOP_DECILE\nFROM TABLE(RESULT_SCAN(LAST_QUERY_ID())) GROUP BY 1;\nSELECT c.*, STARTSWITH(i.PURPOSE, SPLIT_PART(c.RUN_NAME, '_1', 1)) AS IS_CHAMPION\nFROM MODEL_CHALLENGERS c CROSS JOIN (SELECT PURPOSE FROM MODEL_INVENTORY WHERE IS_DEFAULT) i\nORDER BY AUC DESC;\n\n-- 4. Model card, drafted by AI from the evidence only; a person signs it off\nCREATE OR REPLACE TABLE MODEL_CARD AS\nSELECT i.MODEL_NAME, i.VERSION,\n       AI_COMPLETE('claude-sonnet-4-5',\n         'Write a model card in plain English, under 200 words, as short labelled lines (no markdown): Purpose, Permitted use, Data, '\n         || 'Performance, Champion vs challenger, Known limitations, Conditions for use. Only state what these facts support. '\n         || 'Model ' || i.MODEL_NAME || ' ' || i.VERSION || ' (' || COALESCE(i.FRAMEWORK, 'scikit-learn') || '), AUC ' || ROUND(i.AUC, 3)\n         || '. Purpose: ' || i.PURPOSE || '. Permitted use: ' || i.PERMITTED_USE || '. Data: ' || i.TRAINING_DATA\n         || '. Predicted vs actual leave rate (%) by group: ' || v.SUMMARY || '. Experiment runs: ' || c.SUMMARY || '.') AS CARD,\n       CURRENT_TIMESTAMP() AS DRAFTED_AT\nFROM MODEL_INVENTORY i\nCROSS JOIN (SELECT LISTAGG(CUT || ' ' || GROUP_NAME || ' ' || PREDICTED_PCT || ' vs ' || ACTUAL_PCT, '; ') AS SUMMARY FROM MODEL_VALIDATION) v\nCROSS JOIN (SELECT LISTAGG(RUN_NAME || ' AUC ' || AUC || ' lift ' || LIFT_TOP_DECILE, '; ') AS SUMMARY FROM MODEL_CHALLENGERS) c\nWHERE i.IS_DEFAULT;\nSELECT CARD FROM MODEL_CARD;\n\n-- 5. Approval: who decided what, with conditions; the inventory status follows the decision\nCREATE OR REPLACE TABLE MODEL_APPROVALS (\n    MODEL_NAME VARCHAR, VERSION VARCHAR, DECISION VARCHAR, CONDITIONS VARCHAR, APPROVER VARCHAR, DECIDED_AT TIMESTAMP_LTZ\n);\nINSERT INTO MODEL_APPROVALS\nSELECT MODEL_NAME, VERSION, 'APPROVED_WITH_CONDITIONS',\n       'Use for ranking only: probabilities run high against actual outcomes, so recalibrate before quoting them. Review quarterly.',\n       CURRENT_USER(), CURRENT_TIMESTAMP()\nFROM MODEL_INVENTORY WHERE IS_DEFAULT;\nUPDATE MODEL_INVENTORY i SET STATUS = a.DECISION FROM MODEL_APPROVALS a WHERE a.MODEL_NAME = i.MODEL_NAME AND a.VERSION = i.VERSION;\nSELECT i.MODEL_NAME, i.VERSION, i.STATUS, a.CONDITIONS, a.APPROVER, a.DECIDED_AT\nFROM MODEL_INVENTORY i JOIN MODEL_APPROVALS a USING (MODEL_NAME, VERSION);\n", "sql_name": "vignettes/ds3_model_risk/ds3.sql"}, {"code": "DS4", "title": "Calibrate the attrition model and predict customer margin", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Scientist<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~45 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>DS1, or <code>setup/catchup/ds1_model.sql<\/code> (uses <code>ML.RB_CHURN_FEATURES<\/code> and the <code>RB_ATTRITION<\/code> experiment)<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>The retention team wants to put a value on every customer at risk. Are DS1&#x27;s churn scores real probabilities they can multiply by money, and how much will each customer actually be worth over the next few months?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>Two new runs in experiment <code>ML.RB_ATTRITION<\/code>, comparing DS1&#x27;s class-weighted XGBoost with an isotonic-calibrated one on AUC, Brier score and calibration error<\/li>\n<li>A calibrated version of <code>ML.RB_ATTRITION_MODEL<\/code> in the Model Registry, registered as a challenger (not the default)<\/li>\n<li>Experiment <code>ML.RB_MARGIN<\/code>: a &quot;margin stays flat&quot; baseline against Ridge and XGBoost models of next-3-month margin<\/li>\n<li>Model <code>ML.RB_MARGIN_MODEL<\/code> in the Model Registry<\/li>\n<li>Table <code>ML.RB_CUSTOMER_PREDICTIONS<\/code>: every customer&#x27;s calibrated chance of leaving and predicted monthly margin, which DA5 turns into lifetime value and value at risk<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Open the starter notebook<\/h4>\n<p class=\"where\">the <strong>banking-hol-pack<\/strong> Workspace &gt; file explorer &gt; <code>notebooks/ds4_customer_value.ipynb<\/code><\/p>\n<ol>\n<li>Open <code>notebooks/<\/code> &gt; <strong>ds4_customer_value.ipynb<\/strong>.<\/li>\n<li>Connect it to the notebook service you made in DS1 (the arrow next to the status dot &gt; <strong>Select service<\/strong>, usually <code>USER_SERVICE_1<\/code>). No service yet? Create one as in DS1: <strong>NOTEBOOK_POOL<\/strong>, <strong>1 hour<\/strong>, <strong>HOL_NOTEBOOK_ACCESS_INTEGRATION<\/strong> (leave it empty on a trial account).<\/li>\n<li>Check the role is <strong>HOL_PARTICIPANT<\/strong> and the warehouse is <strong>BANKING_WH<\/strong>.<\/li>\n<li>Open the <strong>Cortex Code<\/strong> sidebar (round button, bottom right). You&#x27;ll paste each step&#x27;s prompt there.<\/li>\n<\/ol>\n<p class=\"expect\"><strong>What you should see:<\/strong> the starter notebook open with four numbered headings<\/p>\n<h4>Are the scores probabilities?<\/h4>\n<p class=\"where\">the Cortex Code sidebar, with <code>ds4_customer_value<\/code> open<\/p>\n<p>A score can rank customers well and still not be a probability. DS1 trained XGBoost with <code>scale_pos_weight<\/code> to handle the imbalance, which pushes its scores up.<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>In the open notebook ds4_customer_value, put each cell I ask for under its matching numbered heading. Under heading 1, add a SQL cell named score_check that joins BANKING_HOL.ML.RB_ATTRITION_SCORES to RB_CHURN_FEATURES and shows, for each of 10 score deciles, the customer count, the average CHURN_PROBABILITY and the share who actually left (CHURNED_NEXT_3M). Then add a Python cell named reliability that draws the same as a reliability chart: average score against actual leave rate per decile, with the diagonal for a perfectly calibrated model. Run both.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the points sit far above the diagonal. The top decile&#x27;s average score is far higher than the share who really left (2% leave overall). The model ranks well; its numbers just aren&#x27;t probabilities.<\/p>\n<h4>Calibrate, and track it<\/h4>\n<p class=\"where\">the Cortex Code sidebar<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Under heading 2, add a Python cell named calibrate that sets the session&#x27;s database and schema to BANKING_HOL.ML and runs the training as a Snowflake ML Job with the @remote decorator from snowflake.ml.jobs (compute pool DS_TRAINING_POOL, stage BANKING_HOL.ML.JOB_STAGE). Inside the job: read RB_CHURN_FEATURES into pandas, split 70/30 stratified (random_state 42), and train two scikit-learn pipelines on the same features as DS1: XGBoost with scale_pos_weight (DS1&#x27;s approach) and XGBoost without it wrapped in CalibratedClassifierCV with method isotonic and cv 3. Track each as a run in the experiment RB_ATTRITION with snowflake.ml.experiment.ExperimentTracking, with timestamped run names, logging AUC, Brier score, calibration error (the size-weighted average gap between predicted and actual leave rate across 10 score deciles), mean predicted and actual leave rate. Log the calibrated model to the Model Registry as a new version of RB_ATTRITION_MODEL with conda_dependencies scikit-learn and xgboost, target platform WAREHOUSE and a comment saying it is a calibrated challenger, and do not make it the default. Return the metrics, submit the job, wait and print the result. Run it.<\/pre><\/div>\n<p><strong>Tip:<\/strong> a calibrator wraps the pipeline, which hides XGBoost from the registry&#x27;s dependency detection. Naming <code>conda_dependencies<\/code> avoids a &quot;No module named xgboost&quot; error when it registers.<\/p>\n<p>Then compare the runs: <strong>AI &amp; ML &gt; Experiments<\/strong> &gt; <strong>RB_ATTRITION<\/strong>, tick the two new runs, <strong>Compare<\/strong>.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> similar AUC (the ranking barely changes), but the calibrated run&#x27;s Brier score and calibration error are far lower, and its mean predicted leave rate matches the actual rate of about 2%<\/p>\n<h4>Predict margin, against a baseline<\/h4>\n<p class=\"where\">the Cortex Code sidebar<\/p>\n<p>Lifetime value needs a margin per customer. The simplest assumption is that next month looks like the last 12: that&#x27;s the baseline any model has to beat.<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Under heading 3, add a Python cell named margin that runs as an ML Job the same way. Inside the job: build a training set from RB_CHURN_FEATURES plus, from BANKING_HOL.RAW_DATA.RB_MONTHLY_SNAPSHOT up to 31 Aug 2026, each customer&#x27;s average monthly PROFIT_GBP over the last 3 and last 12 months and average REVENUE_GBP and COST_TO_SERVE_GBP over the last 3 months. The target MARGIN_NEXT_3M is their average monthly PROFIT_GBP in the 3 months after 31 Aug 2026, excluding churned months; train only on customers who have it. Split 70/30 (random_state 42). In a new experiment RB_MARGIN, log a run for the flat baseline (the last-12-month average as the prediction), then Ridge and XGBoost regressors (reg:absoluteerror) as scikit-learn pipelines, each with mean absolute error, MAE against the baseline in percent and total error in percent. Register the model with the lowest MAE as RB_MARGIN_MODEL (conda_dependencies scikit-learn and xgboost, target platform WAREHOUSE, a comment naming the experiment), make it the default, and return the metrics. Run it.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the flat baseline is hard to beat. A simple linear model edges it (a few percent lower error); XGBoost may do worse. Register the one that wins, not the one that sounds cleverest.<\/p>\n<h4>Score every customer with both models<\/h4>\n<p class=\"where\">the Cortex Code sidebar<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Under heading 4, add a Python cell named predictions that scores every customer in RB_CHURN_FEATURES with the calibrated version of RB_ATTRITION_MODEL (predict_proba) and the default version of RB_MARGIN_MODEL (predict, on the same inputs as training), and writes CUSTOMER_ID, CHURN_3M, PREDICTED_MONTHLY_MARGIN_GBP and both model version names to BANKING_HOL.ML.RB_CUSTOMER_PREDICTIONS. Then add a SQL cell named prediction_summary showing the customer count, average CHURN_3M against the actual leave rate, and total predicted monthly margin. Run both.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> about 18,400 customers, an average chance of leaving of about 2% (matching what really happened), and about \u00a320 of predicted margin per customer a month<\/p>\n<h3>Check your work<\/h3>\n<ul>\n<li>Experiment <code>RB_ATTRITION<\/code> has the calibrated run, and <code>RB_ATTRITION_MODEL<\/code> has a calibrated version that isn&#x27;t the default<\/li>\n<li>Experiment <code>RB_MARGIN<\/code> has a baseline and at least one model, and <code>RB_MARGIN_MODEL<\/code> is registered<\/li>\n<li><code>RB_CUSTOMER_PREDICTIONS<\/code> has a calibrated chance of leaving and a predicted margin for every customer<\/li>\n<\/ul>\n<h3>In your bank<\/h3>\n<ul>\n<li><strong>Calibrate before anyone multiplies.<\/strong> Pricing, provisions, lifetime value and campaign budgets all treat model outputs as probabilities. A model trained with class weights or resampling needs calibrating first, and calibration error belongs in its validation pack alongside AUC.<\/li>\n<li><strong>Champion and challenger.<\/strong> The calibrated model is a new version, not a replacement: DS3&#x27;s model risk process decides whether it becomes the default.<\/li>\n<li><strong>Always log the baseline.<\/strong> &quot;Margin stays flat&quot; is a model too. Recording it in the experiment is what shows a reviewer the new model earns its complexity.<\/li>\n<li><strong>Hand over a table, not a notebook.<\/strong> <code>RB_CUSTOMER_PREDICTIONS<\/code> records which model versions produced each number, so DA5&#x27;s lifetime value and every campaign built on it trace back to the registry.<\/li>\n<\/ul>", "sql": "-- =====================================================\n-- VIGNETTE DS4: CALIBRATE THE ATTRITION MODEL AND PREDICT CUSTOMER MARGIN   (~45 min)\n-- Persona:  Data Scientist\n-- Question: \"Are DS1's churn scores real probabilities, and how much will each\n--            customer be worth over the next few months?\"\n-- Prereq:   DS1, or setup/catchup/ds1_model.sql\n-- In the lab you build this in notebooks/ds4_customer_value.ipynb with Cortex Code; the models\n-- are trained by vignettes/ds4_customer_value/ds4_reference.py. This file is the SQL answer key.\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ML;\n\n-- 1. score_check: DS1's scores against what really happened, by decile\nWITH d AS (SELECT NTILE(10) OVER (ORDER BY s.CHURN_PROBABILITY) AS DECILE, s.CHURN_PROBABILITY, f.CHURNED_NEXT_3M\n           FROM RB_ATTRITION_SCORES s JOIN RB_CHURN_FEATURES f USING (CUSTOMER_ID))\nSELECT DECILE, COUNT(*) AS CUSTOMERS, ROUND(AVG(CHURN_PROBABILITY), 3) AS AVG_SCORE, ROUND(AVG(CHURNED_NEXT_3M), 4) AS ACTUALLY_LEFT\nFROM d GROUP BY 1 ORDER BY 1;\n\n-- 2. and 3. the experiments and the registry\nSHOW RUNS IN EXPERIMENT RB_ATTRITION;\nSHOW RUNS IN EXPERIMENT RB_MARGIN;\nSHOW VERSIONS IN MODEL RB_ATTRITION_MODEL;\nSHOW VERSIONS IN MODEL RB_MARGIN_MODEL;\n\n-- 4. prediction_summary\nSELECT COUNT(*) AS CUSTOMERS, ROUND(AVG(p.CHURN_3M), 4) AS AVG_CHANCE_OF_LEAVING, ROUND(AVG(f.CHURNED_NEXT_3M), 4) AS ACTUALLY_LEFT,\n       ROUND(SUM(p.PREDICTED_MONTHLY_MARGIN_GBP)) AS PREDICTED_MONTHLY_MARGIN_GBP\nFROM RB_CUSTOMER_PREDICTIONS p JOIN RB_CHURN_FEATURES f USING (CUSTOMER_ID);\n", "sql_name": "vignettes/ds4_customer_value/ds4.sql"}, {"code": "OPS1", "title": "Corporate Payments 360 agent", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Payments Ops analyst<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~45 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>DA1 (<code>SV_CLIENT_360<\/code>), or run <code>client_360.sql<\/code> if you skipped it<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Before I call a client, tell me everything: payments health, open incidents and what they have been complaining about.<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>Agent <code>SNOWFLAKE_INTELLIGENCE.AGENTS.CORPORATE_PAYMENTS_360<\/code> with an Analyst tool on your <code>SV_CLIENT_360<\/code> and charting<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Create the agent with Cortex Code<\/h4>\n<p class=\"where\">banking-hol-pack Workspace &gt; <strong>+ &gt; Agent<\/strong> &gt; <strong>Create with CoCo<\/strong> (recommended)<\/p>\n<ol>\n<li>Rename the new agent file to <code>corporate_payments_360<\/code> straight away. It opens as &quot;Untitled&quot;.<\/li>\n<li>Paste this brief into Cortex Code.<\/li>\n<\/ol>\n<p>Cortex Code then guides you through the configuration.<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a Cortex Agent SNOWFLAKE_INTELLIGENCE.AGENTS.CORPORATE_PAYMENTS_360 with display name &quot;Corporate Payments 360&quot;. It supports Payments Operations and Relationship Managers in a UK corporate bank. Tools: a Cortex Analyst tool Client360 on semantic view BANKING_HOL.ANALYTICS.SV_CLIENT_360 (client health, alerts, sentiment) on warehouse BANKING_WH, plus charting. Response instructions: lead with a one-line summary, format money in GBP with thousands separators and percentages to 1 dp, and when briefing on a client always cover payment volume and success rate, failed value, open and critical alerts, and feedback sentiment with the main topic. Sample questions: &quot;Brief me on the client with the most failed payment value&quot;, &quot;Which relationship managers have the most open critical alerts?&quot;, &quot;Which clients have negative sentiment and a success rate below 96%?&quot;, &quot;Show failed payment value by sector as a chart&quot;. Deploy it.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the agent deployed as <code>CORPORATE_PAYMENTS_360<\/code> in <code>SNOWFLAKE_INTELLIGENCE.AGENTS<\/code><\/p>\n<h4>Ask it in Snowflake CoWork<\/h4>\n<p class=\"where\">Snowsight &gt; <strong>AI &amp; ML &gt; CoWork<\/strong> (formerly Snowflake Intelligence) &gt; <strong>Corporate Payments 360<\/strong><\/p>\n<ol>\n<li>Run the four sample questions.<\/li>\n<li>Start with &quot;Brief me on the client with the most failed payment value&quot;.<\/li>\n<\/ol>\n<p class=\"expect\"><strong>What you should see:<\/strong> a briefing naming the client, failed value, open and critical alerts, and the main feedback topic. The sector question returns a chart.<\/p>\n<h4>See how it answered<\/h4>\n<ol>\n<li>Expand <strong>Show details<\/strong> on an answer.<\/li>\n<\/ol>\n<p>It shows which tool the agent chose and the SQL that ran.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> each answer used <code>Client360<\/code>, with the SQL it generated over <code>SV_CLIENT_360<\/code><\/p>\n<h4>Improve it<\/h4>\n<p class=\"where\">the Cortex Code sidebar, with <code>corporate_payments_360<\/code> open<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Add a sample question to CORPORATE_PAYMENTS_360 for &quot;Which of Priya Sharma&#x27;s clients have open critical alerts?&quot; and update its orchestration instructions so questions about a named RM always filter on RM name. Redeploy it.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the new sample question appears in CoWork<\/p>\n<h3>Check your work<\/h3>\n<p>&quot;Brief me on the client with the most failed payment value&quot; returns a briefing naming the client, failed value, open/critical alerts and feedback topic.<\/p>\n<h3>In your bank<\/h3>\n<p>Agents run with the caller&#x27;s role, so RM-level entitlements (GOV1) apply automatically.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE OPS1: CORPORATE PAYMENTS 360 AGENT   (~45 min)\n-- Persona: Payments Operations analyst (no SQL needed after setup)\n-- Question: \"Before I call a client, tell me everything: payments health,\n--            open incidents, and what they have been complaining about.\"\n-- Prereq:   DA1 (SV_CLIENT_360), or setup/catchup/client_360.sql if you skipped it\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BANKING_WH;\n\n-- -----------------------------------------------------\n-- OPS1.1 The agent: the DA1 semantic view as a tool + charting\n-- Created in SNOWFLAKE_INTELLIGENCE.AGENTS so it appears in Snowflake CoWork\n-- for everyone with access.\n-- (Snowsight alternative: AI & ML > Agents > Create agent - same settings.)\n-- -----------------------------------------------------\nCREATE OR REPLACE AGENT SNOWFLAKE_INTELLIGENCE.AGENTS.CORPORATE_PAYMENTS_360\n  COMMENT = 'Banking HOL - Corporate Payments 360: client payments health, incidents and sentiment'\n  PROFILE = '{\"display_name\": \"Corporate Payments 360\", \"color\": \"blue\"}'\n  FROM SPECIFICATION\n  $$\n  models:\n    orchestration: auto\n\n  orchestration:\n    budget:\n      seconds: 90\n      tokens: 20000\n\n  instructions:\n    response: >\n      You support Payments Operations and Relationship Managers in a UK corporate bank.\n      Lead with a one-line summary, then the supporting numbers.\n      Format money in GBP with thousands separators and percentages to 1 decimal place.\n      When briefing on a client, always cover: payment volume and success rate,\n      failed value, open and critical alerts, and feedback sentiment with the main topic.\n      If the data cannot answer the question, say so - never guess.\n    orchestration: >\n      Use Client360 for questions about clients, relationship managers,\n      KYC status, payment totals and success rates, alerts or incidents, and client feedback.\n      For a client briefing you may need Client360 more than once.\n    sample_questions:\n      - question: \"Brief me on the client with the most failed payment value\"\n      - question: \"Which relationship managers have the most open critical alerts?\"\n      - question: \"Which clients have negative sentiment and a success rate below 96%?\"\n      - question: \"Show failed payment value by sector as a chart\"\n\n  tools:\n    - tool_spec:\n        type: cortex_analyst_text_to_sql\n        name: Client360\n        description: >\n          Corporate client 360: one row per client with sector, country, KYC status and RM;\n          payment totals, success rate and failed value per client; AI-scored feedback\n          sentiment and topic; and operational alerts with severity, status and resolution time.\n    - tool_spec:\n        type: data_to_chart\n        name: data_to_chart\n        description: Generates charts from query results\n\n  tool_resources:\n    Client360:\n      semantic_view: BANKING_HOL.ANALYTICS.SV_CLIENT_360\n      execution_environment:\n        type: warehouse\n        warehouse: BANKING_WH\n  $$;\n\n-- -----------------------------------------------------\n-- OPS1.2 Use it - Snowflake CoWork (formerly Snowflake Intelligence)\n-- Select \"Corporate Payments 360\" and try:\n--   1. \"Brief me on the client with the most failed payment value\"\n--   2. \"Which of Priya Sharma's clients have open critical alerts?\"\n--   3. \"Show failed payment value by sector as a chart\"\n--   4. \"Which clients have negative sentiment AND a success rate below 96%?\"\n-- Expand \"Show details\" on each answer to see the tool and SQL used.\n-- -----------------------------------------------------\n\n-- OPS1.3 The same agent from SQL (e.g. embedding in a process or app)\nSELECT SNOWFLAKE.CORTEX.DATA_AGENT_RUN(\n  'SNOWFLAKE_INTELLIGENCE.AGENTS.CORPORATE_PAYMENTS_360',\n  $${\"messages\":[{\"role\":\"user\",\"content\":[{\"type\":\"text\",\"text\":\"Which relationship managers have the most open critical alerts?\"}]}]}$$\n) AS RESPONSE;\n\n-- In your bank: agents inherit the caller's role - an RM only ever\n-- sees what their role is granted (see GOV1 for masking and row access).\n\nSELECT 'OPS1 complete' AS STATUS;\n", "sql_name": "vignettes/ops1_payments_360_agent/ops1.sql"}, {"code": "OPS2", "title": "Alert triage with AI next actions", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Payments Ops analyst / team lead<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~30 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td><code>setup/catchup/core_analytics.sql<\/code><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Which open alerts should my team work first, what should we do, and which unhappy clients are linked to them?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li><code>DT_NEGATIVE_SENTIMENT_FEED<\/code><\/li>\n<li><code>V_ALERT_TRIAGE_QUEUE<\/code> with an explainable priority score<\/li>\n<li><code>ALERT_RECOMMENDATIONS<\/code> (AI next actions for the top 10)<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Feed negative sentiment to the escalation queue<\/h4>\n<p class=\"where\">the Cortex Code sidebar<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a dynamic table BANKING_HOL.ANALYTICS.DT_NEGATIVE_SENTIMENT_FEED with TARGET_LAG = &#x27;5 minutes&#x27; on BANKING_WH, selecting the NEGATIVE rows of FEEDBACK_ENRICHED with feedback id, date, customer id, name, sector, RM name, payment id, payment type, feedback text, sentiment score and topic.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a dynamic table of negative feedback that stays fresh on its own<\/p>\n<h4>Build the prioritised triage queue<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a view BANKING_HOL.ANALYTICS.V_ALERT_TRIAGE_QUEUE of open alerts (STATUS &lt;&gt; &#x27;RESOLVED&#x27;) from BANKING_HOL.RAW_DATA.OPERATIONAL_ALERTS, joined to STG_PAYMENTS, RAW_DATA.ERROR_CODES, STG_ACCOUNTS (on ORIGINATOR_ACCOUNT_ID), STG_CUSTOMERS and DT_NEGATIVE_SENTIMENT_FEED. Include alert, payment, error and client columns (ALERT_ID, SEVERITY, PAYMENT_TYPE, ALERT_DESCRIPTION, AMOUNT, CURRENCY, ERROR_DESCRIPTION, ERROR_CATEGORY, IS_RETRYABLE, CUSTOMER_NAME, RM_NAME), CLIENT_NEGATIVE_FEEDBACK (count) and an explainable PRIORITY_SCORE: severity CRITICAL 40 / HIGH 25 / MEDIUM 10, plus 30 for amounts of 1m or more or 15 for 100k or more, plus negative feedback count capped at 20, plus 10 for COMPLIANCE errors. Show the top 10.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the queue ordered by <code>PRIORITY_SCORE<\/code>, with critical, high-value alerts for unhappy clients at the top<\/p>\n<h4>Generate AI next actions<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a table BANKING_HOL.ANALYTICS.ALERT_RECOMMENDATIONS for the top 10 alerts in V_ALERT_TRIAGE_QUEUE by PRIORITY_SCORE, keeping ALERT_ID, SEVERITY, PAYMENT_TYPE, CUSTOMER_NAME, RM_NAME and PRIORITY_SCORE, with a RECOMMENDED_ACTION column from AI_COMPLETE (claude-sonnet-4-5) acting as a senior payments operations analyst at a UK bank: at most 3 short bullets covering whether to retry the payment and whether to contact the client or their RM, based on the alert, scheme, error, retryability, amount and negative feedback count.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> 10 recommendations. A critical compliance-hold alert should say not to retry and to escalate.<\/p>\n<h4>Optional: hand it to the business as an app<\/h4>\n<p class=\"where\">banking-hol-pack Workspace &gt; <strong>+ &gt; Streamlit App<\/strong>, then the Cortex Code sidebar<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Build a Streamlit app called Alert Triage that shows V_ALERT_TRIAGE_QUEUE ordered by PRIORITY_SCORE, with the matching ALERT_RECOMMENDATIONS alongside each alert and a filter by severity.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a triage app your team lead could use on the ops floor<\/p>\n<h3>Check your work<\/h3>\n<p>The top recommendation for a critical compliance-hold alert says not to retry and to escalate.<\/p>\n<h3>In your bank<\/h3>\n<p>Recommendations are decision support for an analyst, not automated actions.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE OPS2: ALERT TRIAGE + NEGATIVE SENTIMENT FEED   (~30 min)\n-- Persona: Payments Operations analyst / team lead\n-- Question: \"Which open alerts should my team work first, what should we do,\n--            and which unhappy clients are linked to them?\"\n-- Prereq:   setup/catchup/core_analytics.sql (FEEDBACK_ENRICHED, STG_* views)\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ANALYTICS;\n\n-- -----------------------------------------------------\n-- OPS2.1 Live negative-sentiment feed for the CX escalation queue\n-- -----------------------------------------------------\nCREATE OR REPLACE DYNAMIC TABLE DT_NEGATIVE_SENTIMENT_FEED\n    TARGET_LAG = '5 minutes'\n    WAREHOUSE  = BANKING_WH\nAS\nSELECT FEEDBACK_ID, FEEDBACK_DATE, CUSTOMER_ID, CUSTOMER_NAME, CUSTOMER_SECTOR,\n       RM_NAME, PAYMENT_ID, PAYMENT_TYPE, FEEDBACK_TEXT, SENTIMENT_SCORE, TOPIC_CATEGORY\nFROM FEEDBACK_ENRICHED\nWHERE SENTIMENT_LABEL = 'NEGATIVE';\n\n-- -----------------------------------------------------\n-- OPS2.2 Prioritised triage queue: open alerts, scored for urgency\n-- -----------------------------------------------------\nCREATE OR REPLACE VIEW V_ALERT_TRIAGE_QUEUE AS\nSELECT al.ALERT_ID, al.ALERT_TIME, al.SEVERITY, al.STATUS, al.ASSIGNED_TO,\n       al.PAYMENT_TYPE, al.ALERT_DESCRIPTION,\n       p.PAYMENT_ID, p.AMOUNT, p.CURRENCY, p.STATUS AS PAYMENT_STATUS,\n       e.ERROR_CODE, e.ERROR_DESCRIPTION, e.ERROR_CATEGORY, e.IS_RETRYABLE,\n       c.CUSTOMER_NAME, c.RM_NAME,\n       COUNT(n.FEEDBACK_ID) AS CLIENT_NEGATIVE_FEEDBACK,\n       -- simple, explainable priority score\n       DECODE(al.SEVERITY, 'CRITICAL', 40, 'HIGH', 25, 'MEDIUM', 10, 0)\n         + IFF(p.AMOUNT >= 1000000, 30, IFF(p.AMOUNT >= 100000, 15, 0))\n         + LEAST(COUNT(n.FEEDBACK_ID), 20)\n         + IFF(e.ERROR_CATEGORY = 'COMPLIANCE', 10, 0)        AS PRIORITY_SCORE\nFROM BANKING_HOL.RAW_DATA.OPERATIONAL_ALERTS al\nJOIN STG_PAYMENTS p          ON al.PAYMENT_ID = p.PAYMENT_ID\nLEFT JOIN BANKING_HOL.RAW_DATA.ERROR_CODES e ON p.ERROR_CODE = e.ERROR_CODE\nLEFT JOIN STG_ACCOUNTS a     ON p.ORIGINATOR_ACCOUNT_ID = a.ACCOUNT_ID\nLEFT JOIN STG_CUSTOMERS c    ON a.CUSTOMER_ID = c.CUSTOMER_ID\nLEFT JOIN DT_NEGATIVE_SENTIMENT_FEED n ON n.CUSTOMER_ID = c.CUSTOMER_ID\nWHERE al.STATUS <> 'RESOLVED'\nGROUP BY ALL;\n\nSELECT ALERT_ID, SEVERITY, PAYMENT_TYPE, AMOUNT, ERROR_DESCRIPTION, CUSTOMER_NAME,\n       CLIENT_NEGATIVE_FEEDBACK, PRIORITY_SCORE\nFROM V_ALERT_TRIAGE_QUEUE\nORDER BY PRIORITY_SCORE DESC\nLIMIT 10;\n\n-- -----------------------------------------------------\n-- OPS2.3 AI-recommended next action for the top of the queue\n-- -----------------------------------------------------\nCREATE OR REPLACE TABLE ALERT_RECOMMENDATIONS AS\nSELECT ALERT_ID, SEVERITY, PAYMENT_TYPE, CUSTOMER_NAME, RM_NAME, PRIORITY_SCORE,\n       AI_COMPLETE('claude-sonnet-4-5',\n         'You are a senior payments operations analyst at a UK bank. In at most 3 short bullet points, '\n         || 'give the next actions for this alert, including whether to retry the payment and whether to contact the client or their RM. '\n         || 'Alert: ' || ALERT_DESCRIPTION\n         || ' | Scheme: ' || PAYMENT_TYPE\n         || ' | Error: ' || COALESCE(ERROR_DESCRIPTION, 'none') || ' (' || COALESCE(ERROR_CATEGORY, 'n/a')\n         || ', retryable=' || COALESCE(IS_RETRYABLE::STRING, 'unknown') || ')'\n         || ' | Amount: ' || AMOUNT || ' ' || CURRENCY\n         || ' | Client negative feedback items: ' || CLIENT_NEGATIVE_FEEDBACK) AS RECOMMENDED_ACTION\nFROM V_ALERT_TRIAGE_QUEUE\nORDER BY PRIORITY_SCORE DESC\nLIMIT 10;\n\nSELECT ALERT_ID, SEVERITY, CUSTOMER_NAME, RECOMMENDED_ACTION\nFROM ALERT_RECOMMENDATIONS ORDER BY PRIORITY_SCORE DESC;\n\n-- -----------------------------------------------------\n-- OPS2.4 Hand it to the business\n--  * Add V_ALERT_TRIAGE_QUEUE to SV_CLIENT_360 (ask CoCo to extend DA1's view), or\n--  * Open payments-dashboard/ (Streamlit) and ask CoCo:\n--    \"Add a 'Triage' page to the Streamlit app that shows V_ALERT_TRIAGE_QUEUE\n--     ordered by PRIORITY_SCORE with ALERT_RECOMMENDATIONS alongside.\"\n-- -----------------------------------------------------\n\nSELECT 'OPS2 complete' AS STATUS;\n", "sql_name": "vignettes/ops2_alert_triage/ops2.sql"}, {"code": "OPS3", "title": "Payments operations in Snowflake CoWork", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Payments Ops lead / relationship manager (business user)<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~45 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>C1 only. Uses the ready-made agent <strong>Payments Ops CoWork<\/strong> (<code>SNOWFLAKE_INTELLIGENCE.AGENTS.PAYMENTS_OPS_COWORK<\/code>), built at provisioning<\/td><\/tr>\n<tr><td><strong>Reference<\/strong><\/td><td><span class=\"ref\"><code>ops3.sql<\/code><\/span><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>I run payments operations, not SQL. Can I ask about failures in plain English, get a chart I can keep, investigate why a sector is getting worse, have the weekly numbers sent to me automatically, hand a relationship manager a briefing deck, and publish a dashboard my team opens every morning?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>A saved <strong>chart artifact<\/strong> and a shared <strong>thread<\/strong> from a CoWork conversation<\/li>\n<li>A <strong>Deep Research<\/strong> report on why a sector&#x27;s payment failures are rising<\/li>\n<li>A weekly CoWork <strong>automation<\/strong><\/li>\n<li>A generated <strong>PowerPoint briefing<\/strong> for a relationship manager<\/li>\n<li>An <strong>AI dashboard<\/strong> built by Cortex Code in the Workspace, published as a dashboard artifact and opened in CoWork<\/li>\n<\/ul>\n<h3>Snowflake CoWork<\/h3>\n<p>Snowflake CoWork (formerly Snowflake Intelligence) is the agentic app for business users: they ask questions in plain English and agents answer with governed SQL, charts and documents. Everything respects the same row access policies, masking and roles as the rest of Snowflake. The agent you use here, <strong>Payments Ops CoWork<\/strong>, has two tools: a Cortex Analyst tool over the semantic view <code>BANKING_HOL.COWORK_PACK.SV_PAYMENTS_OPS<\/code> (a year of payments with client, sector, relationship manager and client feedback), and the <strong>code execution<\/strong> tool, which CoWork uses to build documents.<\/p>\n<h3>Steps<\/h3>\n<h4>Open CoWork with the payments agent<\/h4>\n<p class=\"where\">Snowsight &gt; <strong>AI &amp; ML &gt; CoWork<\/strong> (or the CoWork app), then choose the agent <strong>Payments Ops CoWork<\/strong><\/p>\n<p>CoWork opens on its own page.<\/p>\n<ol>\n<li>Pick <strong>Payments Ops CoWork<\/strong> in the agent picker.<\/li>\n<li>Open the settings under your name.<\/li>\n<li>Check the role is <strong>HOL_PARTICIPANT<\/strong> and the warehouse is <strong>BANKING_WH<\/strong>.<\/li>\n<\/ol>\n<p class=\"where\">Paste into: the <strong>CoWork<\/strong> chat box (not the Cortex Code sidebar)<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>What can you tell me about our payments? Give me a short overview of volume, failures and the clients and schemes that matter most this year.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a plain-English overview with a few numbers and a table or chart. Open <strong>Show details<\/strong> under the answer to see the SQL the agent generated and the semantic view it used: every answer is traceable.<\/p>\n<h4>Make a chart and save it<\/h4>\n<p class=\"where\">Paste into: the <strong>CoWork<\/strong> chat box<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Show monthly failed payment value by scheme for the last 12 months as a stacked bar chart, with SEPA in red.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a stacked bar chart, with a note on how it was built. Use the chart&#x27;s <strong>Save<\/strong> option to keep it as a <strong>chart artifact<\/strong>: it re-runs its query when you open it, with your own access, so it stays current. Then use <strong>Share<\/strong> on the conversation to save it as a <strong>thread<\/strong> snapshot. Find both under <strong>Projects &gt; Artifacts<\/strong>.<\/p>\n<h4>Investigate with Deep Research<\/h4>\n<p class=\"where\">Paste into: the <strong>CoWork<\/strong> chat box. Choose <strong>+ &gt; Deep Research<\/strong> first.<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>What are Logistics clients saying in their feedback over the last four months compared with the rest of the year, are any of them talking about leaving us, do their payment failures explain it, and what should their relationship managers do first?<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> CoWork splits the question into several investigations, runs them in parallel and writes a structured report in up to 10 minutes, with every claim traced to its query. Logistics feedback has turned negative recently, and Logistics clients are the only ones talking about reviewing other banks, moving their payments or tendering their banking (the same story DA2 finds). Their payment failure rate isn&#x27;t unusually high, so the report should point at service and communication rather than payment failures: that&#x27;s the kind of conclusion a single chart wouldn&#x27;t give you. Ask a follow-up such as &quot;break that down by relationship manager&quot;: it runs as a normal chat turn on top of the report.<\/p>\n<h4>Get the numbers every week<\/h4>\n<p class=\"where\">Paste into: the <strong>CoWork<\/strong> chat box<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Every Monday at 8am, show me the 5 clients with the most failed payment value in the previous week, with their relationship manager and main failing scheme. Set this up as an automation.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> CoWork offers to create an <strong>automation<\/strong> that re-runs the question on fresh data on that schedule. Accept it, then open the <strong>Automations<\/strong> tab to see it, run it once now and read the result there. (Lab users have no email address, so the result isn&#x27;t emailed.) Pause or delete it at the end of the lab.<\/p>\n<h4>Generate a briefing for the relationship manager<\/h4>\n<p class=\"where\">Paste into: the <strong>CoWork<\/strong> chat box<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a one-page PowerPoint briefing for Crown Logistics&#x27; relationship manager: payment volume and success rate over the last 12 months, failed payments by scheme, what the client has said in recent feedback, and three recommended actions for the next client call.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a <strong>.pptx<\/strong> you can preview and download, built by the agent&#x27;s code execution tool from the data it just queried. You can upload your own PowerPoint template so documents match house style. The file can be saved as a <strong>file artifact<\/strong> to share.<\/p>\n<h4>Build an AI dashboard with Cortex Code<\/h4>\n<p class=\"where\">banking-hol-pack Workspace &gt; <strong>+ &gt; Dashboard<\/strong> (Preview), then the Cortex Code sidebar<\/p>\n<ol>\n<li>Create a dashboard named <code>payments_ops<\/code>.<\/li>\n<li>Ask Cortex Code to build it with the prompt below.<\/li>\n<\/ol>\n<p>Dashboards are stored as a <code>.dash<\/code> file in the Workspace.<\/p>\n<p>Each tile is a SQL query rendered as a chart, table or text.<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Using the /dashboard skill, build the open dashboard payments_ops on the semantic view BANKING_HOL.COWORK_PACK.SV_PAYMENTS_OPS (or the views PAYMENT_ACTIVITY and CLIENT_FEEDBACK in BANKING_HOL.COWORK_PACK). Add a scorecard row with total payment value, success rate and failed value for the selected period; a stacked bar chart of monthly failed value by scheme; a table of the top 10 clients by failed value with sector and relationship manager; and a bar chart of failed payments by error code. Add filters for scheme and sector and a date range defaulting to the last 12 months, and make clicking a scheme in the failed value chart filter the other tiles.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a dashboard with live tiles, filters and a chart action, all SQL you can open and edit. Iterate in plain English (&quot;make the trend weekly&quot;, &quot;add a feedback rating tile&quot;). Check the numbers match what CoWork told you.<\/p>\n<h4>Publish the dashboard to CoWork<\/h4>\n<p class=\"where\">the open <code>payments_ops<\/code> dashboard &gt; <strong>Share<\/strong><\/p>\n<ol>\n<li>Under <strong>Who has access<\/strong>, add the role <strong>HOL_PARTICIPANT<\/strong> with <strong>Can view<\/strong>.<\/li>\n<li>Click <strong>Create<\/strong>. The link is copied to your clipboard.<\/li>\n<li>Open the link. The dashboard opens in <strong>CoWork<\/strong>.<\/li>\n<li>Ask a follow-up on any tile, for example &quot;why did SEPA failures jump in this month?&quot;.<\/li>\n<\/ol>\n<p class=\"expect\"><strong>What you should see:<\/strong> the published dashboard in CoWork and under <strong>Projects &gt; Artifacts<\/strong>. Tiles run with each viewer&#x27;s own privileges (caller&#x27;s rights), so a viewer who can&#x27;t see a table sees no data. Publishing later changes from the Workspace keeps the same link.<\/p>\n<h3>Check your work<\/h3>\n<p><code>ops3_cowork_used<\/code> passes once you&#x27;ve asked <strong>Payments Ops CoWork<\/strong> a question. The chart, thread, automation, document and dashboard are artifacts you can see under <strong>Projects &gt; Artifacts<\/strong> and in CoWork&#x27;s Automations tab; Snowflake doesn&#x27;t yet expose artifacts to SQL, so there&#x27;s no automatic check for them.<\/p>\n<h3>In your bank<\/h3>\n<p>The payments ops lead gets answers, investigations, recurring reports, client-ready documents and a team dashboard in one governed place, from the same semantic view and with the same access controls the data team set up, instead of waiting for a new report.<\/p>", "sql": "-- =====================================================\n-- OPS3: Payments operations in Snowflake CoWork - reference SQL\n-- OPS3 is done in the CoWork UI and a Workspace dashboard; this is the SQL behind it.\n-- The agent and semantic view are built at provisioning (setup/09_cowork_pack.sql).\n-- =====================================================\nUSE ROLE HOL_PARTICIPANT;\nUSE WAREHOUSE BANKING_WH;\n\n-- 1. The agent CoWork lists, and its tools (Analyst + code execution)\nSHOW AGENTS IN SCHEMA SNOWFLAKE_INTELLIGENCE.AGENTS;\nDESCRIBE AGENT SNOWFLAKE_INTELLIGENCE.AGENTS.PAYMENTS_OPS_COWORK;\n\n-- 2. The semantic view it answers from\nSHOW SEMANTIC METRICS IN BANKING_HOL.COWORK_PACK.SV_PAYMENTS_OPS;\n\n-- 3. The same numbers as the chart step: monthly failed value by scheme, last 12 months\nSELECT * FROM SEMANTIC_VIEW(\n    BANKING_HOL.COWORK_PACK.SV_PAYMENTS_OPS\n    DIMENSIONS payments.payment_month, payments.payment_type\n    METRICS payments.failed_value\n    WHERE payments.payment_month >= DATEADD('month', -12, DATE_TRUNC('month', CURRENT_DATE()))\n)\nORDER BY PAYMENT_MONTH, PAYMENT_TYPE;\n\n-- 4. The Logistics story behind the Deep Research step: feedback that mentions leaving, by sector,\n--    and the sector's payment failure rate (which isn't unusual - the issue is service, not failures)\nWITH feedback AS (\n    SELECT CUSTOMER_SECTOR,\n           COUNT_IF(FEEDBACK_MONTH >= DATEADD('month', -4, DATE_TRUNC('month', CURRENT_DATE()))) AS RECENT_FEEDBACK,\n           COUNT_IF(FEEDBACK_TEXT ILIKE ANY ('%other banking providers%', '%another bank%', '%tender%')) AS CHURN_MENTIONS\n    FROM BANKING_HOL.COWORK_PACK.CLIENT_FEEDBACK\n    GROUP BY 1\n), payments AS (\n    SELECT CUSTOMER_SECTOR, ROUND(COUNT_IF(STATUS = 'FAILED') / COUNT(*) * 100, 1) AS FAILURE_RATE_PCT\n    FROM BANKING_HOL.COWORK_PACK.PAYMENT_ACTIVITY\n    WHERE PAYMENT_DATE >= DATEADD('month', -4, CURRENT_DATE())\n    GROUP BY 1\n)\nSELECT f.CUSTOMER_SECTOR, f.RECENT_FEEDBACK, f.CHURN_MENTIONS, p.FAILURE_RATE_PCT\nFROM feedback f LEFT JOIN payments p USING (CUSTOMER_SECTOR)\nORDER BY f.CHURN_MENTIONS DESC, f.CUSTOMER_SECTOR;\n\n-- 5. The automation step's question: top 5 clients by failed value last week\nSELECT CUSTOMER_NAME, RM_NAME, PAYMENT_TYPE AS MAIN_FAILING_SCHEME, FAILED_VALUE\nFROM (\n    SELECT CUSTOMER_NAME, RM_NAME, PAYMENT_TYPE, SUM(AMOUNT) AS FAILED_VALUE,\n           SUM(SUM(AMOUNT)) OVER (PARTITION BY CUSTOMER_NAME) AS CLIENT_FAILED_VALUE,\n           ROW_NUMBER() OVE
