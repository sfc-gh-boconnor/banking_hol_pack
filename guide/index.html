<style>
:root{--blue:#29B5E8;--navy:#11567F;--ink:#1F2937;--muted:#6B7280;--line:#E5E7EB;--bg:#F7FAFC}

.item .c{display:inline-block;min-width:42px;font-weight:700;color:var(--navy)}.item .done{float:right;color:#15803D}

.sqlbar{display:flex;justify-content:space-between;align-items:center;margin-top:24px}
.arch{margin:16px 0}.arch-lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.arch-lane{background:#11567F0d;border-radius:10px;padding:10px}.arch-lane small{color:#5F6E73;font-size:10px}.arch-lane h4{margin:0 0 4px;color:#11567F;text-transform:uppercase;font-size:12px;letter-spacing:.04em}.arch-lane p{font-size:11px;color:#5F6E73;margin:0 0 8px}.arch-item{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px;font-size:11px}.arch-item b,.arch-item span{display:block}.arch-item span{color:#5F6E73;margin:2px 0 6px}.chip{display:inline-block;border:1px solid #29B5E880;color:#11567F;border-radius:99px;padding:0 6px;margin:0 3px 3px 0;font-size:10px;font-weight:700}.arch-gov{margin-top:10px;background:#11567F;color:#fff;border-radius:10px;padding:12px;font-size:12px}.arch-gov span{display:block;margin:4px 0 8px;opacity:.9}.arch-gov .chip{color:#fff;border-color:#ffffff80}
.where{color:var(--muted);font-size:13px;margin:-4px 0 8px}

.prompt .plabel{display:flex;justify-content:space-between;align-items:center;background:#E6F5FB;padding:6px 12px;font-weight:600;color:var(--navy);font-size:13px}

.code{position:relative;margin:12px 0}.code .cp{position:absolute;top:8px;right:8px}

</style></head><body>
<header><h1>Banking HOL pack - Hands-on Labs</h1>
<p>Corporate banking payments data product on Snowflake - Iceberg to governed AI agents. Synthetic data only.</p></header>
<div class="wrap"><nav>
<h3>Choose your pathway</h3><div class="persona" id="personas"></div>
<h3>Shared core</h3><div id="core"></div>
<h3>Vignettes</h3><div id="vign"></div>
<h3>Catch-up scripts</h3><div id="catch"></div>
</nav><main id="main"></main></div>
<script>
const D = {"modules": [{"code": "C1", "title": "Explore the Iceberg data product", "body": "<p>Shared core for every pathway. Read the published Iceberg tables, prove the read-only guard-rails and build a first client 360 query.<\/p>", "sql": "-- =====================================================\n-- BANKING HOL PACK - SHARED CORE\n-- C1: EXPLORE THE PUBLISHED ICEBERG DATA PRODUCT  (~25 min, all personas)\n--\n-- Business context: you are part of Payments Operations for Corporate\n-- Banking. The platform team has published nine source tables to the\n-- enterprise data platform as Iceberg tables. You can read them but you\n-- cannot load or change them - exactly like a bank's data platform.\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.RAW_DATA;\n\n-- C1.1 What has been published to us?\nSHOW ICEBERG TABLES IN SCHEMA BANKING_HOL.RAW_DATA;\n-- Note the catalog (SNOWFLAKE) and that storage is Snowflake-managed.\n-- At a bank the same tables sit on the bank's own object storage\n-- via an external volume; the SQL you write is identical.\n\n-- C1.2 Iceberg tables keep open metadata - this is what lets other engines\n-- (Spark, Trino, etc.) read the same data with no copy.\nSELECT SYSTEM$GET_ICEBERG_TABLE_INFORMATION('BANKING_HOL.RAW_DATA.PAYMENTS') AS ICEBERG_METADATA;\n\n-- C1.3 Prove the guard-rails: attendees cannot load or modify source data.\n-- Expect: \"Insufficient privileges\". This is intentional.\n-- INSERT INTO PAYMENTS (PAYMENT_ID) VALUES ('TEST');\n\n-- C1.4 Get to know the data model (see docs/data_sources.md for the ERD)\nSELECT 'PAYMENTS' AS TABLE_NAME, COUNT(*) AS ROW_COUNT FROM PAYMENTS\nUNION ALL SELECT 'CUSTOMER_FEEDBACK',     COUNT(*) FROM CUSTOMER_FEEDBACK\nUNION ALL SELECT 'OPERATIONAL_ALERTS',    COUNT(*) FROM OPERATIONAL_ALERTS\nUNION ALL SELECT 'CUSTOMERS',             COUNT(*) FROM CUSTOMERS\nUNION ALL SELECT 'ACCOUNTS',              COUNT(*) FROM ACCOUNTS\nUNION ALL SELECT 'RELATIONSHIP_MANAGERS', COUNT(*) FROM RELATIONSHIP_MANAGERS\nORDER BY ROW_COUNT DESC;\n\n-- C1.5 Payments mix by scheme - the six UK/international rails\nSELECT PAYMENT_TYPE,\n       COUNT(*)                                        AS PAYMENTS,\n       ROUND(SUM(AMOUNT) / 1e6, 1)                     AS VOLUME_M,\n       ROUND(COUNT_IF(STATUS = 'COMPLETED') / COUNT(*) * 100, 2) AS SUCCESS_RATE_PCT\nFROM PAYMENTS\nGROUP BY PAYMENT_TYPE\nORDER BY PAYMENTS DESC;\n\n-- C1.6 A corporate client 360 in one query: customer -> RM -> accounts -> payments -> feedback\nSELECT c.CUSTOMER_NAME, c.SECTOR, r.RM_NAME, r.TEAM,\n       COUNT(DISTINCT a.ACCOUNT_ID)                    AS ACCOUNTS,\n       COUNT(DISTINCT p.PAYMENT_ID)                    AS PAYMENTS,\n       COUNT(DISTINCT IFF(p.STATUS = 'FAILED', p.PAYMENT_ID, NULL)) AS FAILED,\n       COUNT(DISTINCT f.FEEDBACK_ID)                   AS FEEDBACK_ITEMS\nFROM CUSTOMERS c\nJOIN RELATIONSHIP_MANAGERS r ON c.RM_ID = r.RM_ID\nJOIN ACCOUNTS a              ON a.CUSTOMER_ID = c.CUSTOMER_ID\nLEFT JOIN PAYMENTS p         ON p.ORIGINATOR_ACCOUNT_ID = a.ACCOUNT_ID\nLEFT JOIN CUSTOMER_FEEDBACK f ON f.CUSTOMER_ID = c.CUSTOMER_ID\nGROUP BY ALL\nORDER BY FAILED DESC\nLIMIT 10;\n\n-- C1.7 Iceberg time travel works too: what did PAYMENTS look like an hour ago?\n-- (Uncomment once the tables are at least a few minutes old.)\n-- SELECT COUNT(*) FROM PAYMENTS AT (OFFSET => -60*5);\n\n-- C1.8 Ask Cortex Code (CoCo panel in your Workspace):\n--   \"Describe the tables in BANKING_HOL.RAW_DATA and how they join together.\"\n--   \"Which customers have the highest payment failure rate? Write the SQL and run it.\"\n\nSELECT 'Core C1 complete - pick your pathway in pathways/' AS STATUS;\n", "sql_name": "core/C1_explore_iceberg.sql"}, {"code": "C2", "title": "Data product tour", "body": "<p>A guided look at the end state everyone will be building towards, so each pathway knows where its work fits.<\/p>\n<div class=\"arch\"><div class=\"arch-lanes\"><div class=\"arch-lane\"><small>Step 1<\/small><h4>Sources<\/h4><p>The bank&#x27;s systems of record and outside data<\/p><div class=\"arch-item\"><b>Corporate and retail data<\/b><span>payments, clients, accounts, retail customers, calls, complaints, fraud<\/span><div><span class=\"chip\">C0<\/span><\/div><\/div><div class=\"arch-item\"><b>Snowflake Postgres<\/b><span>live payment events from an operational database<\/span><div><span class=\"chip\">DE3<\/span><\/div><\/div><div class=\"arch-item\"><b>Marketplace<\/b><span>the Snowflake Docs knowledge extension<\/span><div><span class=\"chip\">AI3<\/span><\/div><\/div><div class=\"arch-item\"><b>OpenRouteService<\/b><span>road routing inside Snowflake, precomputed into an H3 drive-time matrix<\/span><div><span class=\"chip\">DA3<\/span><span class=\"chip\">DA4<\/span><\/div><\/div><\/div><div class=\"arch-lane\"><small>Step 2<\/small><h4>Open storage<\/h4><p>Published once as open Iceberg tables, read-only<\/p><div class=\"arch-item\"><b>Iceberg in RAW_DATA<\/b><span>Snowflake-managed, readable by other engines<\/span><div><span class=\"chip\">C0<\/span><span class=\"chip\">C1<\/span><\/div><\/div><div class=\"arch-item\"><b>Postgres mirror<\/b><span>PAYMENTS_MIRROR, kept current as Iceberg<\/span><div><span class=\"chip\">DE3<\/span><\/div><\/div><\/div><div class=\"arch-lane\"><small>Step 3<\/small><h4>Transform<\/h4><p>Pipelines that keep it fresh and tested<\/p><div class=\"arch-item\"><b>dbt project<\/b><span>staging and marts, with tests<\/span><div><span class=\"chip\">DE1<\/span><\/div><\/div><div class=\"arch-item\"><b>Dynamic tables<\/b><span>incremental refresh, data quality, Pipeline Builder<\/span><div><span class=\"chip\">DE2<\/span><\/div><\/div><div class=\"arch-item\"><b>Notebooks<\/b><span>Python and SQL on notebook services<\/span><div><span class=\"chip\">DE3<\/span><span class=\"chip\">DA2<\/span><span class=\"chip\">DA3<\/span><span class=\"chip\">DS1<\/span><\/div><\/div><div class=\"arch-item\"><b>Spark (Snowpark Connect)<\/b><span>PySpark sessions and batch jobs on a warehouse<\/span><div><span class=\"chip\">DE4<\/span><\/div><\/div><\/div><div class=\"arch-lane\"><small>Step 4<\/small><h4>Serve<\/h4><p>Governed data products others can reuse<\/p><div class=\"arch-item\"><b>Marts and data products<\/b><span>ANALYTICS, DP_* Iceberg data products, customer value<\/span><div><span class=\"chip\">DE1<\/span><span class=\"chip\">DE2<\/span><span class=\"chip\">DA5<\/span><\/div><\/div><div class=\"arch-item\"><b>Interactive warehouse<\/b><span>low-latency serving for the ops floor<\/span><div><span class=\"chip\">DE3<\/span><\/div><\/div><\/div><div class=\"arch-lane\"><small>Step 5<\/small><h4>Understand<\/h4><p>Business meaning and AI on top of the data<\/p><div class=\"arch-item\"><b>Semantic views<\/b><span>one set of business definitions for people and AI, with level of detail metrics<\/span><div><span class=\"chip\">DA1<\/span><span class=\"chip\">DA3<\/span><span class=\"chip\">DA6<\/span><\/div><\/div><div class=\"arch-item\"><b>Cortex AI SQL<\/b><span>sentiment, classify, extract, images and PDFs<\/span><div><span class=\"chip\">DA2<\/span><span class=\"chip\">AI4<\/span><\/div><\/div><div class=\"arch-item\"><b>ML models<\/b><span>experiments, the Model Registry, calibration, model risk<\/span><div><span class=\"chip\">DS1<\/span><span class=\"chip\">DS2<\/span><span class=\"chip\">DS3<\/span><span class=\"chip\">DS4<\/span><\/div><\/div><div class=\"arch-item\"><b>Cortex Search<\/b><span>semantic search over calls and case notes<\/span><div><span class=\"chip\">AI5<\/span><\/div><\/div><\/div><div class=\"arch-lane\"><small>Step 6<\/small><h4>Act<\/h4><p>Where the business uses it<\/p><div class=\"arch-item\"><b>Cortex Agents and MCP<\/b><span>agents with tools, a governed MCP server<\/span><div><span class=\"chip\">OPS1<\/span><span class=\"chip\">OPS2<\/span><span class=\"chip\">AI1<\/span><span class=\"chip\">AI2<\/span><span class=\"chip\">AI3<\/span><\/div><\/div><div class=\"arch-item\"><b>Snowflake CoWork<\/b><span>chat, dashboards, Deep Research, automations<\/span><div><span class=\"chip\">OPS3<\/span><span class=\"chip\">OPS4<\/span><\/div><\/div><div class=\"arch-item\"><b>Apps and reports<\/b><span>Streamlit, App Runtime, interactive reports<\/span><div><span class=\"chip\">DA0<\/span><span class=\"chip\">DA3<\/span><span class=\"chip\">APP0<\/span><span class=\"chip\">APP1<\/span><\/div><\/div><\/div><\/div><div class=\"arch-gov\"><b>Govern, across every step<\/b><span>roles and read-only sources, masking and tags, lineage and access history, the AI Gateway, data requests. Agents run as the user, so policies follow the data all the way to the answer<\/span><div><span class=\"chip\">GOV1<\/span><span class=\"chip\">GOV2<\/span><span class=\"chip\">GOV3<\/span><span class=\"chip\">GOV4<\/span><\/div><\/div><\/div>\n<h3>Talking points<\/h3>\n<ol>\n<li><strong>Iceberg is the contract.<\/strong> Source data arrives centrally as Iceberg, so the same files can be read by other engines. Attendees cannot load or change it, and that is deliberate.<\/li>\n<li><strong>Build data products, not copies.<\/strong> Everything downstream is a view, dynamic table or mart. DE1 publishes a mart back out as Iceberg.<\/li>\n<li><strong>A semantic view is the trust layer for AI.<\/strong> Business definitions (success rate, value at risk, open alerts) live in one place. Analyst, agents and MCP clients all use it.<\/li>\n<li><strong>Adopt at your own pace.<\/strong> Each capability is a separate module, so you can switch on what your organisation has approved and leave the rest. AI3 answers from a Marketplace knowledge extension, and AI5 shows Cortex Search over your own data.<\/li>\n<li><strong>Governance follows the data.<\/strong> Policies on the source flow through every model, view and agent, because agents run as the user.<\/li>\n<\/ol>\n<h3>Demo (facilitator, 5 min)<\/h3>\n<p>If the facilitator has run the full build, open Snowflake CoWork and ask <strong>Corporate Payments 360<\/strong>: &quot;Brief me on the client with the most failed payment value.&quot; Then show the lineage graph for <code>RAW_DATA.PAYMENTS<\/code> in Catalog.<\/p>", "sql": "", "sql_name": ""}, {"code": "DE1", "title": "Iceberg + dbt pipeline with Cortex Code", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Engineer<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~60 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>Core C1 only<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Turn the published Iceberg sources into governed, tested data products - and publish them back to the lake as Iceberg.<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>The dbt project in the Workspace (4 staging views, 2 marts, pre-written tests), run from the Workspace dbt pane<\/li>\n<li>Two Cortex Code-built marts: <code>mart_customer_payments<\/code>, <code>mart_rm_performance<\/code><\/li>\n<li>Nightly task <code>TSK_DBT_NIGHTLY_BUILD<\/code> (suspended)<\/li>\n<li>Iceberg data product <code>DP_SLA_COMPLIANCE<\/code><\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Open the dbt project in the Workspace<\/h4>\n<p class=\"where\">Snowsight &gt; <strong>Projects &gt; Workspaces<\/strong> &gt; <strong>My Workspace<\/strong> dropdown &gt; <strong>banking-hol-pack<\/strong>, then <code>dbt/<\/code> in the file explorer<\/p>\n<ol>\n<li>Open <code>dbt/models/staging/schema.yml<\/code> in the file explorer.<\/li>\n<li>Paste this prompt into the Cortex Code sidebar.<\/li>\n<\/ol>\n<p>The sources in <code>schema.yml<\/code> point straight at the <code>RAW_DATA<\/code> Iceberg tables. dbt reads Iceberg exactly like native tables.<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Walk me through the dbt project in the dbt/ folder of this Workspace: what each staging and mart model does, where the sources come from, and which models are defined in models/marts/schema.yml but have no .sql file yet.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> 4 staging models and 2 marts (<code>mart_payment_kpis<\/code>, <code>mart_sla_compliance<\/code>). <code>mart_customer_payments<\/code> and <code>mart_rm_performance<\/code> have tests in <code>schema.yml<\/code> but no SQL yet. Those are the two you&#x27;ll build.<\/p>\n<h4>Run dbt build from the dbt pane<\/h4>\n<p class=\"where\">the bottom panel of the Workspace &gt; <strong>dbt<\/strong> tab (next to Query History)<\/p>\n<ol>\n<li>Open the <strong>dbt<\/strong> tab in the bottom panel. It shows Profile <strong>dev<\/strong> and a blue <strong>Run<\/strong> button.<\/li>\n<li>Click the arrow next to <strong>Run<\/strong> to open <strong>Select Operation<\/strong>.<\/li>\n<li>Choose <strong>Build<\/strong> and press <strong>Execute<\/strong>.<\/li>\n<\/ol>\n<p><strong>Important:<\/strong> choose <strong>Build<\/strong>, not <strong>Run<\/strong>. Run only creates the models and skips the tests that prove Cortex Code&#x27;s marts are correct.<\/p>\n<p>Build runs the models and their tests in dependency order.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> the Output tab ends with every model and test passing (<code>ERROR=0<\/code>). Open the <strong>DAG<\/strong> tab to see the lineage from the Iceberg sources to the marts.<\/p>\n<h4>Generate mart_customer_payments with Cortex Code<\/h4>\n<p class=\"where\">the Cortex Code sidebar, with the banking-hol-pack Workspace open<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a dbt mart model dbt/models/marts/mart_customer_payments.sql that summarises payment activity per customer. Join stg_payments -&gt; stg_accounts (on originator_account_id) -&gt; stg_customers and follow the patterns in mart_payment_kpis.sql. Output one row per customer with these columns: customer_id, customer_name, customer_sector, rm_name, total_payments, total_volume_gbp, success_rate_pct (a float percentage, 0-100), avg_processing_time_ms and most_used_scheme. Keep the column names and tests already defined for this model in models/marts/schema.yml.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a new file <code>dbt/models/marts/mart_customer_payments.sql<\/code>. DE2 builds on this mart, so keep these column names.<\/p>\n<h4>Generate mart_rm_performance with Cortex Code<\/h4>\n<p class=\"where\">the Cortex Code sidebar<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create dbt/models/marts/mart_rm_performance.sql: one row per relationship manager with rm_id, rm_name, client_count, total_volume_gbp, avg_success_rate_pct and the name of their client with the lowest success rate. Build it from mart_customer_payments and stg_customers, and keep the column names and tests in models/marts/schema.yml. Then run dbt build for mart_rm_performance and its upstream models in this Workspace, and fix the model until every test passes.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a new file <code>dbt/models/marts/mart_rm_performance.sql<\/code>, and Cortex Code reporting the tests passing. If it only compiles the model, that&#x27;s fine: the next step builds everything.<\/p>\n<h4>Build the whole project and check the tests<\/h4>\n<p class=\"where\">the bottom panel of the Workspace &gt; <strong>dbt<\/strong> tab<\/p>\n<ol>\n<li>Click the arrow next to <strong>Run<\/strong> to open <strong>Select Operation<\/strong>.<\/li>\n<li>Choose <strong>Build<\/strong> and press <strong>Execute<\/strong>.<\/li>\n<\/ol>\n<p>Writing or compiling a model doesn&#x27;t create its table. Only a build does.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> the Output shows 8 models and every test passing (<code>ERROR=0<\/code>), including the tests for both Cortex Code marts. If a test fails, paste the error into Cortex Code, ask it to fix the model, and Build again.<\/p>\n<h4>Deploy the project<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Deploy the dbt project in my banking-hol-pack Workspace (snow://workspace/DEFAULT_DATABASE.PUBLIC.&quot;banking-hol-pack&quot;/versions/live/dbt) to the existing dbt project object BANKING_HOL.ANALYTICS.BANKING_DBT with ALTER DBT PROJECT ... ADD VERSION FROM. Then list the models in the deployed project to confirm MART_CUSTOMER_PAYMENTS and MART_RM_PERFORMANCE are included.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> &quot;Successfully deployed new files&quot;, and both Cortex Code marts listed in the deployed project. The nightly task in the next step now builds what you developed.<\/p>\n<p>The Workspace is where you develop. The deployed project object <code>BANKING_HOL.ANALYTICS.BANKING_DBT<\/code> is what production runs.<\/p>\n<p>It was deployed when the lab was set up, so it doesn&#x27;t have the marts you just wrote yet.<\/p>\n<h4>Schedule the project<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a task BANKING_HOL.ANALYTICS.TSK_DBT_NIGHTLY_BUILD on warehouse BANKING_WH that runs EXECUTE DBT PROJECT BANKING_HOL.ANALYTICS.BANKING_DBT ARGS = &#x27;build&#x27; every day at 05:00 Europe/London. Leave it suspended.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the task created and suspended, on a 05:00 Europe/London schedule. In production you&#x27;d resume it. No external orchestrator needed.<\/p>\n<p><strong>Autonomous Data Engineering:<\/strong> native orchestration with a task, so the data product rebuilds itself every night with no external orchestrator.<\/p>\n<h4>Publish the data product back to the lake as Iceberg<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a Snowflake-managed Iceberg table BANKING_HOL.ANALYTICS.DP_SLA_COMPLIANCE (CATALOG = &#x27;SNOWFLAKE&#x27;) from MART_SLA_COMPLIANCE, casting PAYMENT_DAY to TIMESTAMP_NTZ(6) because Iceberg stores microseconds. Add a comment describing it as a data product, then show its Iceberg metadata location.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> <code>DP_SLA_COMPLIANCE<\/code> listed by <code>SHOW ICEBERG TABLES IN SCHEMA BANKING_HOL.ANALYTICS<\/code>, with a metadata location other engines can read<\/p>\n<h3>Check your work<\/h3>\n<p><code>dbt build<\/code> in the dbt pane passes with <code>ERROR=0<\/code> once the two Cortex Code marts exist, and <code>DP_SLA_COMPLIANCE<\/code> is an Iceberg table in <code>ANALYTICS<\/code>.<\/p>\n<h3>In your bank<\/h3>\n<p>Production Iceberg tables use the bank&#x27;s external volume (one volume, one IAM role across accounts) rather than Snowflake-managed storage. dbt models and SQL are otherwise identical.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE DE1: ICEBERG + dbt PIPELINE WITH CORTEX CODE   (~60 min)\n-- Persona: Data Engineer\n-- Question: \"Turn the published Iceberg sources into governed, tested\n--            data products - and publish them back to the lake as Iceberg.\"\n-- Prereq:   Core C1 only. (Produces everything core_analytics.sql would.)\n--\n-- Work in the lab Workspace banking-hol-pack (Projects > Workspaces > My Workspace dropdown), which is\n-- already in your account. On your own account, create one from\n-- https://github.com/sfc-gh-boconnor/banking_hol_pack (Projects > Workspaces >\n-- From Git repository).\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ANALYTICS;\n\n-- -----------------------------------------------------\n-- DE1.1 Walk the dbt project (Workspace file explorer: dbt/)\n--   models/staging/schema.yml  - sources point at BANKING_HOL.RAW_DATA (Iceberg)\n--   models/staging/*.sql       - 4 views: cast, clean, denormalise\n--   models/marts/*.sql         - mart_payment_kpis, mart_sla_compliance\n--   macros/generate_schema_name.sql - land models in ANALYTICS, not ANALYTICS_ANALYTICS\n-- dbt reads Iceberg sources exactly like native tables. No code changes.\n-- -----------------------------------------------------\n\n-- -----------------------------------------------------\n-- DE1.2 Deploy and run as a dbt Project on Snowflake\n-- In the Workspace: open the dbt tab in the bottom panel, choose build from the\n-- Run dropdown and run it.\n-- Or from SQL / a task (this is how you would schedule it in production):\n-- -----------------------------------------------------\nEXECUTE DBT PROJECT BANKING_HOL.ANALYTICS.BANKING_DBT ARGS = 'build';\n-- Expect: Done. PASS=27 WARN=0 ERROR=0\n\n-- Schedule it - one task, no external orchestrator\nCREATE OR REPLACE TASK TSK_DBT_NIGHTLY_BUILD\n    WAREHOUSE = BANKING_WH\n    SCHEDULE  = 'USING CRON 0 5 * * * Europe/London'\nAS\n    EXECUTE DBT PROJECT BANKING_HOL.ANALYTICS.BANKING_DBT ARGS = 'build';\n-- Left suspended for the lab. In production: ALTER TASK TSK_DBT_NIGHTLY_BUILD RESUME;\n\n-- -----------------------------------------------------\n-- DE1.3 Accelerate with Cortex Code (CoCo panel in the Workspace)\n-- Prompt 1:\n--   \"Create a dbt mart model mart_customer_payments in dbt/models/marts that\n--    summarises payment activity per customer: total payments, total volume,\n--    success rate and most-used payment scheme. Join stg_payments -> stg_accounts\n--    -> stg_customers and follow the patterns in mart_payment_kpis.sql.\"\n-- Prompt 2:\n--   \"Create mart_rm_performance: one row per relationship manager with rm_id,\n--    rm_name, client_count, total volume, average success rate and their client\n--    with the lowest success rate. Then run dbt build and fix any failing tests.\"\n-- The tests for both models already exist in models/marts/schema.yml, so\n-- `dbt build` proves CoCo's code is correct.\n-- -----------------------------------------------------\n\n-- -----------------------------------------------------\n-- DE1.4 Validate\n-- -----------------------------------------------------\nSELECT 'STG_PAYMENTS' AS OBJ, COUNT(*) AS ROWS_ FROM STG_PAYMENTS\nUNION ALL SELECT 'MART_PAYMENT_KPIS',   COUNT(*) FROM MART_PAYMENT_KPIS\nUNION ALL SELECT 'MART_SLA_COMPLIANCE', COUNT(*) FROM MART_SLA_COMPLIANCE;\n\nSELECT SLA_STATUS, COUNT(*) AS SCHEME_DAYS\nFROM MART_SLA_COMPLIANCE GROUP BY SLA_STATUS ORDER BY SCHEME_DAYS DESC;\n\n-- -----------------------------------------------------\n-- DE1.5 Publish the data product back to the lake as Iceberg\n-- Consumers on other engines (Spark, Trino, etc.) can now read the mart with no copy.\n-- Iceberg stores microsecond precision, so timestamps are cast to scale 6.\n-- -----------------------------------------------------\nCREATE OR REPLACE ICEBERG TABLE DP_SLA_COMPLIANCE\n    CATALOG = 'SNOWFLAKE'\n    COMMENT = 'Data product: daily SLA compliance per payment scheme (Iceberg)'\nAS SELECT * REPLACE (PAYMENT_DAY::TIMESTAMP_NTZ(6) AS PAYMENT_DAY)\n   FROM MART_SLA_COMPLIANCE;\n\nSELECT SYSTEM$GET_ICEBERG_TABLE_INFORMATION('BANKING_HOL.ANALYTICS.DP_SLA_COMPLIANCE') AS METADATA_LOCATION;\n\n-- In your bank: in production the Iceberg table would use the bank's\n-- EXTERNAL_VOLUME (one volume and one IAM role, shared across accounts)\n-- instead of Snowflake-managed storage. The SQL above is otherwise unchanged.\n\nSELECT 'DE1 complete' AS STATUS;\n", "sql_name": "vignettes/de1_iceberg_dbt_pipeline/de1.sql"}, {"code": "DE2", "title": "Dynamic Tables + data quality", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Engineer<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~45 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td><code>setup/catchup/core_analytics.sql<\/code> (or DE1 + DA2)<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Keep an ops-floor SLA monitor fresh without orchestration code, and prove the data feeding it is trustworthy.<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li><code>DT_LIVE_SLA_BREACHES<\/code> (1-minute lag)<\/li>\n<li><code>DT_FAILED_PAYMENT_TRIAGE<\/code> reading Iceberg directly, chained to <code>DT_RETRYABLE_SUMMARY<\/code><\/li>\n<li>System and custom data metric functions with an expectation on <code>MART_CUSTOMER_PAYMENTS<\/code><\/li>\n<li>A Pipeline Builder task graph <code>payments_nightly<\/code> that orchestrates the dbt build, DT refresh and DQ checks<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Build the SLA breach monitor<\/h4>\n<p class=\"where\">the Cortex Code sidebar<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a dynamic table BANKING_HOL.ANALYTICS.DT_LIVE_SLA_BREACHES with TARGET_LAG = &#x27;1 minute&#x27; on warehouse BANKING_WH. From MART_SLA_COMPLIANCE where SLA_STATUS = &#x27;BREACH&#x27;, group by PAYMENT_TYPE and return total payments, breached (failed) payments, breach rate % and the earliest and latest breach day.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> one row per payment scheme with breaches.<\/p>\n<p>To browse it in the UI, see the <strong>Watch them refresh<\/strong> step.<\/p>\n<h4>Build the failed-payment triage feed straight off Iceberg<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a dynamic table BANKING_HOL.ANALYTICS.DT_FAILED_PAYMENT_TRIAGE with TARGET_LAG = DOWNSTREAM on BANKING_WH. Read directly from the Iceberg tables in BANKING_HOL.RAW_DATA: PAYMENTS with STATUS FAILED or RETURNED, joined to ERROR_CODES, ACCOUNTS (on ORIGINATOR_ACCOUNT_ID), CUSTOMERS and RELATIONSHIP_MANAGERS. Include payment id, date, type, amount, currency, error code, description, category, IS_RETRYABLE, customer name, sector and RM name. Then create DT_RETRYABLE_SUMMARY with TARGET_LAG = &#x27;5 minutes&#x27; that groups DT_FAILED_PAYMENT_TRIAGE by PAYMENT_TYPE, ERROR_CATEGORY and IS_RETRYABLE with a payment count and VALUE_AT_RISK (sum of amount).<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> two chained dynamic tables. In Snowsight, <strong>Monitoring &gt; Dynamic Tables &gt; DT_RETRYABLE_SUMMARY &gt; Graph<\/strong> shows the pipeline from the Iceberg sources.<\/p>\n<h4>Watch them refresh<\/h4>\n<p class=\"where\">the Cortex Code sidebar, then optionally Snowsight &gt; <strong>Catalog &gt; Database Explorer &gt; BANKING_HOL &gt; ANALYTICS &gt; Dynamic Tables &gt; DT_LIVE_SLA_BREACHES<\/strong>, with the <strong>Data Preview<\/strong> and <strong>Lineage<\/strong> tabs (lineage back to <code>MART_SLA_COMPLIANCE<\/code> and the Iceberg sources)<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Show me the refresh history for the DT_ dynamic tables in BANKING_HOL.ANALYTICS, and how many rows DT_RETRYABLE_SUMMARY has. If it has not refreshed yet, refresh it.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> successful refreshes and rows in <code>DT_RETRYABLE_SUMMARY<\/code><\/p>\n<h4>Add data quality checks<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>On BANKING_HOL.ANALYTICS.MART_CUSTOMER_PAYMENTS: set DATA_METRIC_SCHEDULE = &#x27;TRIGGER_ON_CHANGES&#x27;, attach SNOWFLAKE.CORE.NULL_COUNT on RM_NAME and SNOWFLAKE.CORE.DUPLICATE_COUNT on CUSTOMER_ID, create a custom data metric function INVALID_SUCCESS_RATE_COUNT that counts rows where SUCCESS_RATE_PCT (FLOAT) is null, below 0 or above 100, and attach it. Add an expectation NO_DUPLICATE_CUSTOMERS (VALUE = 0) on the duplicate check. Then run all three checks on demand.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> three data metric functions attached, and the on-demand checks return <code>0, 0, 0<\/code><\/p>\n<h4>Orchestrate the pipeline with Pipeline Builder<\/h4>\n<p class=\"where\">banking-hol-pack Workspace <strong>Home<\/strong> page &gt; <strong>Pipeline Builder<\/strong> (Preview)<\/p>\n<ol>\n<li>In the <strong>banking-hol-pack<\/strong> Workspace, open the Workspace <strong>Home<\/strong> tab (the house icon at the top of the file explorer). This is the Home tab inside Workspaces, not the main Snowsight Home.<\/li>\n<li>Press the <strong>Pipeline Builder<\/strong> icon.<\/li>\n<li>In the <strong>Create Pipeline Builder<\/strong> dialog, set:<\/li>\n<\/ol>\n<ul>\n<li>name: <code>payments_nightly<\/code><\/li>\n<li><strong>Database and schema<\/strong>: <strong>BANKING_HOL.ANALYTICS<\/strong><\/li>\n<\/ul>\n<ol>\n<li>Click <strong>Generate with Cortex<\/strong> at the bottom left of the dialog.<\/li>\n<li>In the <strong>Prompt<\/strong> box that opens, paste this prompt and click <strong>Generate<\/strong>.<\/li>\n<\/ol>\n<p><strong>Important:<\/strong> don&#x27;t pick <code>RAW_DATA<\/code>. The Iceberg sources are read-only, so creating it there fails with &quot;must have CREATE DCM PROJECT&quot;.<\/p>\n<p><strong>Tip:<\/strong> click <strong>Generate with Cortex<\/strong>, not <strong>Create<\/strong>. Create opens an empty canvas.<\/p>\n<p class=\"where\">Paste into: the <strong>Prompt<\/strong> box in Create Pipeline Builder, then click <strong>Generate<\/strong> (not the Cortex Code sidebar)<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Build a nightly pipeline in BANKING_HOL.ANALYTICS on warehouse BANKING_WH, scheduled at 05:00 Europe/London. Task 1 BANKING_HOL.ANALYTICS.PIPE_DBT_BUILD runs EXECUTE DBT PROJECT BANKING_HOL.ANALYTICS.BANKING_DBT ARGS = &#x27;build&#x27;. Task 2 BANKING_HOL.ANALYTICS.PIPE_REFRESH_SLA runs after it: ALTER DYNAMIC TABLE BANKING_HOL.ANALYTICS.DT_LIVE_SLA_BREACHES REFRESH. Task 3 BANKING_HOL.ANALYTICS.PIPE_DQ_CHECKS runs after task 1: SELECT the NULL_COUNT on RM_NAME and DUPLICATE_COUNT on CUSTOMER_ID of BANKING_HOL.ANALYTICS.MART_CUSTOMER_PAYMENTS. Set warehouse BANKING_WH on each of the three tasks itself, not as a task-graph default. Set the task graph&#x27;s desired state to Suspended so nothing runs after deploy.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> Cortex first drafts a plan (the three tasks, their order, the 05:00 schedule and the warehouse) and asks you to <strong>Proceed<\/strong>, <strong>Modify<\/strong> or <strong>Cancel<\/strong>. Check the plan matches the prompt and choose <strong>Proceed<\/strong> (or <strong>Modify<\/strong> to correct it). You then get a canvas with three connected tasks (dbt build, then the dynamic table refresh and the data quality checks). Before you deploy, open the task graph&#x27;s settings (<strong>Objects &gt; Task graphs<\/strong>, or select a task &gt; <strong>Graph<\/strong> tab &gt; <strong>Edit graph settings<\/strong>) and check <strong>Desired state<\/strong> is <strong>Suspended<\/strong>: Generate with Cortex can set it to Resumed, and the canvas Deploy uses whatever the project files say. Then <strong>Deploy<\/strong>, review the planned changes and <strong>Deploy<\/strong> again. Once it&#x27;s created, refresh the file explorer if needed and open <code>payments_nightly<\/code> from the sidebar. Click any step on the canvas to see its details, and use <strong>Deploy<\/strong> to run the pipeline or create a task from it. To view the pipeline later, open it from its <code>payments_nightly<\/code> link in the Workspace (or hover over the folder in the file explorer and select the <strong>Open pipeline builder<\/strong> icon); after the first deploy, <strong>Deployed Project<\/strong> on the canvas toolbar opens it in Snowsight, where the task graph&#x27;s <strong>Graph<\/strong> tab shows the run order. The tasks and the task graph are created suspended in <code>ANALYTICS<\/code>, and you can see them under <strong>Monitoring &gt; Task History<\/strong>. Pipeline Builder orchestrates tasks; it doesn&#x27;t create the dynamic tables themselves, which is why you built those first. If you build the pipeline a second time and <strong>Deploy<\/strong> fails with &quot;cannot change orchestration model while ... PIPE_DBT_BUILD is not suspended&quot;, tasks from your first attempt are still running: ask Cortex Code to suspend <code>BANKING_HOL.ANALYTICS.PIPE_DBT_BUILD<\/code>, then deploy again.<\/p>\n<p>Dynamic tables keep themselves fresh, but the dbt build and the data quality checks need scheduling. Pipeline Builder draws that as a task graph.<\/p>\n<p><strong>Autonomous Data Engineering:<\/strong> describe a pipeline in plain English, refine it visually, and deploy it as a native <strong>task graph<\/strong> (public preview). No external orchestrator needed.<\/p>\n<h3>Check your work<\/h3>\n<p><code>SELECT * FROM DT_RETRYABLE_SUMMARY<\/code> returns rows; the on-demand data metric checks return <code>0, 0, 0<\/code>.<\/p>\n<h3>In your bank<\/h3>\n<p>Real-time payments streaming is out of scope at many banks today; dynamic tables give near-real-time freshness over data the platform already lands.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE DE2: DYNAMIC TABLES + DATA QUALITY   (~45 min)\n-- Persona: Data Engineer\n-- Question: \"How do I keep an ops-floor SLA monitor fresh without writing\n--            orchestration, and prove the data feeding it is trustworthy?\"\n-- Prereq:   setup/catchup/core_analytics.sql  (or DE1 + DA2)\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ANALYTICS;\n\n-- -----------------------------------------------------\n-- DE2.1 Dynamic Tables: declare the result, Snowflake keeps it fresh\n-- -----------------------------------------------------\n\n-- Ops-floor SLA breach monitor: never more than 1 minute stale\nCREATE OR REPLACE DYNAMIC TABLE DT_LIVE_SLA_BREACHES\n    TARGET_LAG = '1 minute'\n    WAREHOUSE  = BANKING_WH\nAS\nSELECT PAYMENT_TYPE,\n       SUM(TOTAL_PAYMENTS)  AS TOTAL_PAYMENTS,\n       SUM(FAILED_PAYMENTS) AS BREACHED_PAYMENTS,\n       ROUND(SUM(FAILED_PAYMENTS)::FLOAT / NULLIF(SUM(TOTAL_PAYMENTS), 0) * 100, 2) AS BREACH_RATE_PCT,\n       MIN(PAYMENT_DAY) AS EARLIEST_BREACH,\n       MAX(PAYMENT_DAY) AS LATEST_BREACH\nFROM MART_SLA_COMPLIANCE\nWHERE SLA_STATUS = 'BREACH'\nGROUP BY PAYMENT_TYPE;\n\n-- Failed-payment triage feed built straight off the Iceberg source.\n-- Dynamic tables can read Iceberg tables directly - no copy into Snowflake storage.\nCREATE OR REPLACE DYNAMIC TABLE DT_FAILED_PAYMENT_TRIAGE\n    TARGET_LAG = DOWNSTREAM\n    WAREHOUSE  = BANKING_WH\nAS\nSELECT p.PAYMENT_ID, p.PAYMENT_DATE, p.PAYMENT_TYPE, p.AMOUNT, p.CURRENCY,\n       p.ERROR_CODE, e.ERROR_DESCRIPTION, e.ERROR_CATEGORY, e.IS_RETRYABLE,\n       c.CUSTOMER_NAME, c.SECTOR, r.RM_NAME\nFROM BANKING_HOL.RAW_DATA.PAYMENTS p\nJOIN BANKING_HOL.RAW_DATA.ERROR_CODES e  ON p.ERROR_CODE = e.ERROR_CODE\nJOIN BANKING_HOL.RAW_DATA.ACCOUNTS a     ON p.ORIGINATOR_ACCOUNT_ID = a.ACCOUNT_ID\nJOIN BANKING_HOL.RAW_DATA.CUSTOMERS c    ON a.CUSTOMER_ID = c.CUSTOMER_ID\nJOIN BANKING_HOL.RAW_DATA.RELATIONSHIP_MANAGERS r ON c.RM_ID = r.RM_ID\nWHERE p.STATUS IN ('FAILED', 'RETURNED');\n\n-- Downstream summary chained off the triage feed\nCREATE OR REPLACE DYNAMIC TABLE DT_RETRYABLE_SUMMARY\n    TARGET_LAG = '5 minutes'\n    WAREHOUSE  = BANKING_WH\nAS\nSELECT PAYMENT_TYPE, ERROR_CATEGORY, IS_RETRYABLE,\n       COUNT(*) AS PAYMENTS, ROUND(SUM(AMOUNT), 2) AS VALUE_AT_RISK\nFROM DT_FAILED_PAYMENT_TRIAGE\nGROUP BY ALL;\n\nSHOW DYNAMIC TABLES IN SCHEMA BANKING_HOL.ANALYTICS;\n\n-- Refresh history and the pipeline graph are also visible in Snowsight:\n-- Monitoring > Dynamic Tables > DT_RETRYABLE_SUMMARY > Graph\nSELECT NAME, STATE, REFRESH_ACTION, REFRESH_TRIGGER, DATA_TIMESTAMP\nFROM TABLE(INFORMATION_SCHEMA.DYNAMIC_TABLE_REFRESH_HISTORY())\nWHERE NAME LIKE 'DT_%'\nORDER BY DATA_TIMESTAMP DESC\nLIMIT 10;\n\n-- -----------------------------------------------------\n-- DE2.2 Data Metric Functions: quality checks that run on a schedule\n-- -----------------------------------------------------\n\n-- Schedule is set per table; changes also trigger a check\nALTER TABLE MART_CUSTOMER_PAYMENTS SET DATA_METRIC_SCHEDULE = 'TRIGGER_ON_CHANGES';\n\n-- System DMFs\nALTER TABLE MART_CUSTOMER_PAYMENTS ADD DATA METRIC FUNCTION\n    SNOWFLAKE.CORE.NULL_COUNT ON (RM_NAME);\nALTER TABLE MART_CUSTOMER_PAYMENTS ADD DATA METRIC FUNCTION\n    SNOWFLAKE.CORE.DUPLICATE_COUNT ON (CUSTOMER_ID);\n\n-- A custom, business-rule DMF: success rate must be a valid percentage\n-- (the argument type must match the column type - SUCCESS_RATE_PCT is FLOAT)\nCREATE OR REPLACE DATA METRIC FUNCTION INVALID_SUCCESS_RATE_COUNT(\n    t TABLE (SUCCESS_RATE_PCT FLOAT))\nRETURNS NUMBER\nAS\n$$\n    SELECT COUNT(*) FROM t\n    WHERE SUCCESS_RATE_PCT IS NULL OR SUCCESS_RATE_PCT < 0 OR SUCCESS_RATE_PCT > 100\n$$;\n\nALTER TABLE MART_CUSTOMER_PAYMENTS ADD DATA METRIC FUNCTION\n    INVALID_SUCCESS_RATE_COUNT ON (SUCCESS_RATE_PCT);\n\n-- Expectations: turn a metric into a pass/fail rule\nALTER TABLE MART_CUSTOMER_PAYMENTS MODIFY DATA METRIC FUNCTION\n    SNOWFLAKE.CORE.DUPLICATE_COUNT ON (CUSTOMER_ID)\n    ADD EXPECTATION NO_DUPLICATE_CUSTOMERS (VALUE = 0);\n\n-- Which checks are attached?\nSELECT METRIC_NAME, REF_ARGUMENTS, SCHEDULE, SCHEDULE_STATUS\nFROM TABLE(INFORMATION_SCHEMA.DATA_METRIC_FUNCTION_REFERENCES(\n    REF_ENTITY_NAME   => 'BANKING_HOL.ANALYTICS.MART_CUSTOMER_PAYMENTS',\n    REF_ENTITY_DOMAIN => 'TABLE'));\n\n-- Run the checks on demand (scheduled results land in\n-- SNOWFLAKE.LOCAL.DATA_QUALITY_MONITORING_RESULTS after a few minutes)\nSELECT SNOWFLAKE.CORE.NULL_COUNT(SELECT RM_NAME FROM MART_CUSTOMER_PAYMENTS)        AS NULL_RM_NAMES,\n       SNOWFLAKE.CORE.DUPLICATE_COUNT(SELECT CUSTOMER_ID FROM MART_CUSTOMER_PAYMENTS) AS DUPLICATE_CUSTOMERS,\n       INVALID_SUCCESS_RATE_COUNT(SELECT SUCCESS_RATE_PCT FROM MART_CUSTOMER_PAYMENTS) AS INVALID_RATES;\n\n-- -----------------------------------------------------\n-- DE2.3 Cortex Code prompts (try in the CoCo panel)\n-- -----------------------------------------------------\n--  \"Add a dynamic table DT_HIGH_VALUE_FAILURES in BANKING_HOL.ANALYTICS showing\n--   failed CHAPS payments over 1m GBP with the customer and RM, refreshing every\n--   2 minutes. Then show me its refresh history.\"\n--  \"Add a data metric function to MART_PAYMENT_KPIS that counts rows where\n--   P95_PROCESSING_TIME_MS is less than AVG_PROCESSING_TIME_MS, and attach it.\"\n\nSELECT 'DE2 complete' AS STATUS;\n", "sql_name": "vignettes/de2_dynamic_tables_quality/de2.sql"}, {"code": "DE3", "title": "Real-time payments: stream, mirror, serve, act", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Engineer (Payments Operations)<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~45 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>C1 only. Uses <code>BANKING_HOL.REALTIME<\/code>, the shared interactive warehouse <code>HOL_INTERACTIVE_WH<\/code>, and grants to create a Snowflake Postgres instance and mirror it (all set up at provisioning)<\/td><\/tr>\n<tr><td><strong>Reference<\/strong><\/td><td><span class=\"ref\"><code>de3.sql<\/code><\/span>, <span class=\"ref\"><code>de3_postgres.py<\/code><\/span><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>A corporate client&#x27;s payments are failing right now. How does the operations floor see it within seconds, not after tonight&#x27;s dbt build, and serve that view to everyone watching at once?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>A <strong>Snowflake Postgres<\/strong> instance <code>HOL_PAYMENTS_PG<\/code>: the operational payments database the payment engine writes to<\/li>\n<li>A live feed of payment events into Postgres, with an incident hidden in the stream<\/li>\n<li>A <strong>Data Mirror<\/strong> that streams every change from Postgres into <strong>Snowflake-managed Iceberg<\/strong> tables in <code>PAYMENTS_MIRROR<\/code>, with <code>$live<\/code> (seconds behind) and <code>$changes<\/code> (the change feed)<\/li>\n<li>Ops-floor queries served from the <strong>interactive warehouse<\/strong> <code>HOL_INTERACTIVE_WH<\/code>, straight off the mirrored table<\/li>\n<li>Dynamic table <code>DT_PAYMENT_INCIDENTS<\/code> that flags failing payment clusters within a minute<\/li>\n<\/ul>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>Stream script (notebook)\n        |  ~20 events/s\n        v\nSnowflake Postgres  HOL_PAYMENTS_PG\n        |  Data Mirror\n        v\nIceberg  PAYMENTS_MIRROR  ($live, $changes)\n        |                      |\n        v                      v\nInteractive warehouse     Dynamic table\nHOL_INTERACTIVE_WH        DT_PAYMENT_INCIDENTS\n(sub-second ops queries)  (flags failing clusters)<\/pre><\/div>\n<h3>End-to-end real-time analytics in Snowflake<\/h3>\n<ul>\n<li><strong>Connectivity:<\/strong> <strong>Snowflake Postgres<\/strong> runs the operational database inside Snowflake, and <strong>Data Mirroring<\/strong> (preview) streams its changes continuously into open Iceberg tables, with no pipeline to run. For events from apps and Kafka, <strong>Snowpipe Streaming<\/strong> (GA) writes rows into tables seconds after they happen through a pipe and named channels, and <strong>Elastic Channels<\/strong> scale it. (Snowpipe Streaming isn&#x27;t used in this notebook: Workspace notebooks run in Snowpark Container Services, where its key-pair sign-in is rejected. <span class=\"ref\"><code>de3_stream.py<\/code><\/span> shows the SDK for an app outside Snowflake.)<\/li>\n<li><strong>Transformation:<\/strong> dynamic tables refresh on a target lag measured in minutes or seconds. <strong>Streaming transformations<\/strong> (private preview) transform rows as they arrive.<\/li>\n<li><strong>Serving:<\/strong> <strong>Interactive Analytics<\/strong> (GA): interactive warehouses return sub-second answers at high concurrency, directly on standard, dynamic or Iceberg tables, with no copy. They&#x27;re built for dashboards, APIs and agents, with a 5 second statement limit and a 24 hour minimum run time once resumed, which is why the lab shares one.<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Open the starter notebook and create its service<\/h4>\n<p class=\"where\">the <strong>banking-hol-pack<\/strong> Workspace (not My Workspace) &gt; file explorer &gt; <code>notebooks/de3_realtime_payments.ipynb<\/code><\/p>\n<ol>\n<li>Open <code>notebooks/<\/code> &gt; <strong>de3_realtime_payments.ipynb<\/strong> in the file explorer.<\/li>\n<\/ol>\n<ul>\n<li>Can&#x27;t see <code>notebooks/<\/code> and <code>vignettes/<\/code>? You&#x27;re in the wrong Workspace. Pick <strong>banking-hol-pack<\/strong> from the Workspace dropdown (top left).<\/li>\n<\/ul>\n<ol>\n<li>In the notebook toolbar, click the arrow next to the status dot (right of the blue run button).<\/li>\n<li>Choose <strong>Create new service<\/strong>.<\/li>\n<\/ol>\n<ul>\n<li>Already created one in another module? Pick it under <strong>Select service<\/strong> instead, usually <code>USER_SERVICE_1<\/code>.<\/li>\n<\/ul>\n<ol>\n<li>Expand <strong>Service settings<\/strong> in <strong>Connect your notebook<\/strong> and fill it in as below. Only the three <strong>bold<\/strong> rows change.<\/li>\n<\/ol>\n<table>\n<tr><td>Setting<\/td><td>Value<\/td><\/tr>\n<tr><td>Service name<\/td><td>leave the default (e.g. <code>USER_SERVICE_1<\/code>)<\/td><\/tr>\n<tr><td>Artifact repositories<\/td><td>leave as is (<code>SNOWFLAKE.SNOWPARK.PYPI_SHARED_REPOSITORY<\/code>)<\/td><\/tr>\n<tr><td>Enable distributed compute<\/td><td>off<\/td><\/tr>\n<tr><td>Runtime<\/td><td>leave as is (v3.0 \u00b7 Python 3.12)<\/td><\/tr>\n<tr><td>Compute type<\/td><td>CPU<\/td><\/tr>\n<tr><td>Custom image<\/td><td>leave empty<\/td><\/tr>\n<tr><td><strong>Compute pool<\/strong><\/td><td><strong>NOTEBOOK_POOL<\/strong> (change it from HOL_COMPUTE_POOL_CPU)<\/td><\/tr>\n<tr><td><strong>Idle timeout<\/strong><\/td><td><strong>1 hour<\/strong> (change it from 24 hours)<\/td><\/tr>\n<tr><td><strong>External access integrations<\/strong><\/td><td><strong>HOL_NOTEBOOK_ACCESS_INTEGRATION<\/strong> (lets notebooks reach Postgres and the AI Gateway; set it here so one service works for every notebook module)<\/td><\/tr>\n<tr><td>Secrets<\/td><td>leave empty<\/td><\/tr>\n<\/table>\n<ol>\n<li>Click <strong>Create and connect<\/strong>. The first start takes 1-2 minutes.<\/li>\n<li>Check the role is <strong>HOL_PARTICIPANT<\/strong> and the warehouse is <strong>BANKING_WH<\/strong> (role and warehouse button in the notebook toolbar).<\/li>\n<\/ol>\n<p>The starter notebook has one numbered heading per step, so Cortex Code puts each cell in the right place.<\/p>\n<p>A notebook runs on its own <strong>notebook service<\/strong>, which you create once.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> the starter notebook open in banking-hol-pack with its numbered headings, and the status dot showing the service connected<\/p>\n<h4>Create the Postgres instance<\/h4>\n<p class=\"where\">the Cortex Code sidebar, with <code>de3_realtime_payments<\/code> open<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>In the open notebook de3_realtime_payments, put each cell I ask for under its matching numbered heading. Under heading 1, add a Python cell named create_pg that runs !pip install psycopg2-binary, makes vignettes/de3_realtime_payments/de3_postgres.py importable (search upwards from the current working directory for a folder containing vignettes/de3_realtime_payments/de3_postgres.py and add that folder to sys.path), imports de3_postgres as pg, and runs host = pg.create_postgres(get_active_session()). Don&#x27;t rewrite the helper and never print the password. Then add a markdown cell explaining what create_postgres does: the instance size and why, the network policy, and what happens to the one-time password.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the cell prints the instance moving through CREATING, STARTING and FINALIZING, then returns its host after 3 to 5 minutes. <code>HOL_PAYMENTS_PG<\/code> uses <code>STANDARD_M<\/code>, the smallest size Data Mirroring supports, with the network policy <code>HOL_PG_POLICY<\/code>. Its <code>snowflake_admin<\/code> password is shown only once, in the CREATE result, so the helper saves it straight into the secret <code>BANKING_HOL.REALTIME.PG_ADMIN_SECRET<\/code> without printing it.<\/p>\n<p>You don&#x27;t write the Postgres code yourself. The cells import a tested helper in the Workspace, <code>vignettes/de3_realtime_payments/de3_postgres.py<\/code>.<\/p>\n<h4>Reveal the connection and connect<\/h4>\n<p class=\"where\">the Lab Companion &gt; <strong>DE3<\/strong> &gt; <strong>Reveal Postgres connection<\/strong>, then the notebook<\/p>\n<ol>\n<li>In the Lab Companion, click <strong>Reveal Postgres connection<\/strong>. It shows the host, user and password with copy buttons.<\/li>\n<li>In the notebook, find the connection cell under heading 2 (<code>PG_HOST<\/code>, <code>PG_USER<\/code>, <code>PG_PASS<\/code>).<\/li>\n<li>Replace each <code>&lt;...&gt;<\/code> placeholder with the value you copied, keeping the quotes.<\/li>\n<li>Run the cell.<\/li>\n<li>Paste this prompt into the Cortex Code sidebar:<\/li>\n<\/ol>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Under heading 2, after my connection cell, add a Python cell named source_table that opens conn = pg.connect(PG_HOST, PG_USER, PG_PASS) and runs pg.create_source_table(conn), printing the row count it returns. Then explain the table it created in Postgres and why it has a primary key.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> <code>0<\/code> rows in the new Postgres table <code>payments.payment_events<\/code>. The primary key lets the mirror carry updates and deletes as well as inserts. Keep the password out of anything you share. You can reveal it again any time, for example after a kernel restart. If the Lab Companion says the password wasn&#x27;t saved, run <code>pg.reset_password(get_active_session())<\/code> and reveal again. The instance only accepts connections from Snowflake (its network policy allows Snowflake&#x27;s egress IP ranges), so connect from the notebook: a desktop client such as psql or DBeaver on your laptop will time out.<\/p>\n<h4>Mirror Postgres into Snowflake<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Under heading 3, add a Python cell named mirror that runs pg.start_mirror(get_active_session()) and shows the result as a table. Then add a markdown cell explaining Snowflake Postgres Data Mirroring: what CREATE_MIRROR creates in PAYMENTS_MIRROR (an Iceberg table plus $live and $changes), who owns it, and what refresh_interval means.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> <code>payments.payment_events<\/code> in state <code>REPLICATING<\/code> in the new database <code>PAYMENTS_MIRROR<\/code>. The mirror owns <code>PAYMENTS_MIRROR.PAYMENTS.PAYMENT_EVENTS<\/code>, a Snowflake-managed Iceberg table in open Parquet, plus <code>PAYMENT_EVENTS$live<\/code> (the table plus changes not merged yet, so it&#x27;s seconds behind) and <code>PAYMENT_EVENTS$changes<\/code> (the change feed). Changes merge into the base table every minute (<code>refresh_interval<\/code>). Nothing to schedule or run: the mirror keeps going on its own.<\/p>\n<h4>Stream payments into Postgres<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Under heading 4, add a Python cell named stream that runs pg.stream_payments(conn, get_active_session()) to insert about 20 payment events a second into Postgres for 5 minutes, and prints the total it returns. Then explain in a markdown cell what the stream sends, including the SEPA incident in the second half.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the cell runs for 5 minutes, printing progress every 30 seconds, and sends about 6,000 events. While it runs, open a SQL worksheet and run <code>SELECT COUNT(*) FROM PAYMENTS_MIRROR.PAYMENTS.PAYMENT_EVENTS$live<\/code> a few times: the count climbs about 20 to 40 seconds behind Postgres. Halfway through, one corporate client&#x27;s SEPA payments start failing with &quot;Beneficiary bank unavailable&quot;. The stream cell itself only prints how many events it sent (it doesn&#x27;t report failures): you&#x27;ll see the failed payments in the freshness check in the next step, spread through the run.<\/p>\n<h4>Measure how fresh the data is<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Under heading 5, add a SQL cell named freshness: events and failed events per minute for the last 15 minutes from PAYMENTS_MIRROR.PAYMENTS.PAYMENT_EVENTS$live, then the seconds between the newest EVENT_TS and SYSDATE() in both PAYMENT_EVENTS$live and the base table PAYMENT_EVENTS, then the count of rows per _CHANGE_TYPE in PAYMENT_EVENTS$changes. Run it and explain what the numbers say about end-to-end latency from Postgres to Snowflake.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> about 1,200 events a minute while streaming, with <code>$live<\/code> about 20 to 40 seconds behind and the base table up to a minute behind (its refresh interval). Failures jump in the second half: that&#x27;s the incident. <code>$changes<\/code> shows one <code>I<\/code> (insert) per event; an update would appear as a <code>D<\/code> and an <code>I<\/code>.<\/p>\n<h4>Serve the ops floor from the interactive warehouse<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Under heading 6, add a SQL cell named ops_floor that runs USE WAREHOUSE HOL_INTERACTIVE_WH, then the queries a payments operations dashboard would refresh every few seconds directly on PAYMENTS_MIRROR.PAYMENTS.PAYMENT_EVENTS: failed payments and failed value by scheme in the last 15 minutes, and the 10 clients with the most failed value in the last 15 minutes joined to BANKING_HOL.RAW_DATA.CUSTOMERS for the name. Then switch back with USE WAREHOUSE BANKING_WH. Run it and explain zero-copy interactive analytics on an Iceberg table: why there&#x27;s no copy or conversion, and when the 5 second statement limit matters.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> answers from <code>HOL_INTERACTIVE_WH<\/code> in well under a second once it&#x27;s warm, straight off the mirrored Iceberg table, with no copy. SEPA stands out, and one client has a cluster of failed SEPA payments. On a few thousand rows a standard warehouse is quick too: the interactive warehouse earns its keep when hundreds of screens, APIs or agents run these queries every few seconds at once. Heavy one-off analysis belongs on a standard warehouse, and DML is rejected, which is why the cell switches back.<\/p>\n<h4>Flag incidents automatically<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Under heading 7, add a SQL cell named incidents that creates the dynamic table BANKING_HOL.REALTIME.DT_PAYMENT_INCIDENTS with TARGET_LAG &#x27;1 minute&#x27; on warehouse BANKING_WH: failed payments in PAYMENTS_MIRROR.PAYMENTS.PAYMENT_EVENTS from the last 15 minutes grouped by CUSTOMER_ID (with CUSTOMER_NAME from BANKING_HOL.RAW_DATA.CUSTOMERS), SCHEME and FAILURE_REASON, with the failed count, failed value, first and last failure, keeping groups with at least 5 failures. Then query it, largest first, then add a Python cell named draft_message that takes the top incident&#x27;s real values (client, RM, scheme, failure reason, failed count and value, first and last failure) and fills them into a message template to the client&#x27;s relationship manager, rendered with st.markdown or display(Markdown(...)) so the actual numbers appear.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> one incident: Crown Logistics&#x27; SEPA payments failing with &quot;Beneficiary bank unavailable&quot;, with the count, value and time window. The table refreshes every minute on its own, so the moment a new cluster starts in Postgres, it appears here. This is the same pattern as DE2&#x27;s live SLA breaches, now on data streaming out of an operational database. Cortex Code automations (GOV2) could post it to the ops team.<\/p>\n<h3>Check your work<\/h3>\n<p><code>HOL_PAYMENTS_PG<\/code> is READY, <code>PAYMENTS_MIRROR.PAYMENTS.PAYMENT_EVENTS<\/code> is replicating with at least 1,000 events, and <code>DT_PAYMENT_INCIDENTS<\/code> exists.<\/p>\n<h3>After the lab<\/h3>\n<p>The Postgres instance bills while it runs. Suspend it when you&#x27;re done (<code>ALTER POSTGRES INSTANCE HOL_PAYMENTS_PG SUSPEND<\/code>); the facilitator&#x27;s teardown drops the mirror and the instance.<\/p>\n<h3>In your bank<\/h3>\n<p>One platform takes payments from the operational database to an answer in seconds: written to Snowflake Postgres, mirrored continuously into open Iceberg tables, flagged by a dynamic table, and served to every screen on the ops floor by an interactive warehouse, with the same governance as the rest of the data.<\/p>", "sql": "-- =====================================================\n-- DE3: Real-time payments - reference SQL\n-- The Postgres side is Python (de3_postgres.py); this is the Snowflake SQL around it.\n-- Flow: Snowflake Postgres HOL_PAYMENTS_PG -> Data Mirror -> Snowflake-managed Iceberg\n--       PAYMENTS_MIRROR.PAYMENTS.PAYMENT_EVENTS (+ $live, $changes) -> interactive warehouse, dynamic table\n-- =====================================================\nUSE ROLE HOL_PARTICIPANT;\nUSE WAREHOUSE BANKING_WH;\n\n-- 1. The instance (create_postgres runs the CREATE and saves the one-time password in the secret):\n--    CREATE POSTGRES INSTANCE HOL_PAYMENTS_PG COMPUTE_FAMILY = 'STANDARD_M' STORAGE_SIZE_GB = 10\n--      AUTHENTICATION_AUTHORITY = POSTGRES POSTGRES_VERSION = 18 NETWORK_POLICY = 'HOL_PG_POLICY';\nSHOW POSTGRES INSTANCES LIKE 'HOL_PAYMENTS_PG';\nDESCRIBE SECRET BANKING_HOL.REALTIME.PG_ADMIN_SECRET;   -- metadata only: the password isn't shown\n\n-- 2. The mirror (start_mirror runs these)\nGRANT USAGE ON POSTGRES INSTANCE HOL_PAYMENTS_PG TO APPLICATION SNOWFLAKE;\n-- CALL SNOWFLAKE.POSTGRES.CREATE_MIRROR(\n--     mirror_name => 'payments_mirror', postgres_instance => 'HOL_PAYMENTS_PG', postgres_database => 'postgres',\n--     target_database => 'PAYMENTS_MIRROR', postgres_schemas => ['payments'],\n--     refresh_interval => '1 minute', target_table_type => 'ICEBERG');\nSELECT * FROM TABLE(SNOWFLAKE.POSTGRES.LIST_MIRRORS());\nCALL SNOWFLAKE.POSTGRES.LIST_MIRRORED_TABLES('payments_mirror');\nSHOW TABLES IN DATABASE PAYMENTS_MIRROR;   -- PAYMENT_EVENTS (Iceberg) and PAYMENT_EVENTS$CHANGES, owned by the mirror\n\n-- 3. Freshness: volume and failures per minute, and how far each view is behind\nSELECT DATE_TRUNC('minute', EVENT_TS) AS MINUTE, COUNT(*) AS EVENTS, COUNT_IF(STATUS = 'FAILED') AS FAILED\nFROM PAYMENTS_MIRROR.PAYMENTS.PAYMENT_EVENTS$live\nWHERE EVENT_TS >= DATEADD('minute', -15, SYSDATE())\nGROUP BY 1\nORDER BY 1;\n\nSELECT 'live' AS VIEW_NAME, DATEDIFF('second', MAX(EVENT_TS), SYSDATE()) AS SECONDS_BEHIND FROM PAYMENTS_MIRROR.PAYMENTS.PAYMENT_EVENTS$live\nUNION ALL\nSELECT 'base Iceberg table', DATEDIFF('second', MAX(EVENT_TS), SYSDATE()) FROM PAYMENTS_MIRROR.PAYMENTS.PAYMENT_EVENTS;\n\n-- The change feed: I = insert, D = delete (an update is a D plus an I)\nSELECT _CHANGE_TYPE, COUNT(*) AS CHANGES FROM PAYMENTS_MIRROR.PAYMENTS.PAYMENT_EVENTS$changes GROUP BY 1;\n\n-- 4. Ops floor on the shared interactive warehouse: zero-copy, straight off the mirrored Iceberg table\nUSE WAREHOUSE HOL_INTERACTIVE_WH;\n\nSELECT SCHEME, COUNT(*) AS FAILED_PAYMENTS, SUM(AMOUNT) AS FAILED_VALUE\nFROM PAYMENTS_MIRROR.PAYMENTS.PAYMENT_EVENTS\nWHERE STATUS = 'FAILED' AND EVENT_TS >= DATEADD('minute', -15, SYSDATE())\nGROUP BY SCHEME\nORDER BY FAILED_VALUE DESC;\n\nSELECT c.CUSTOMER_NAME, e.SCHEME, COUNT(*) AS FAILED_PAYMENTS, SUM(e.AMOUNT) AS FAILED_VALUE\nFROM PAYMENTS_MIRROR.PAYMENTS.PAYMENT_EVENTS e\nJOIN BANKING_HOL.RAW_DATA.CUSTOMERS c ON c.CUSTOMER_ID = e.CUSTOMER_ID\nWHERE e.STATUS = 'FAILED' AND e.EVENT_TS >= DATEADD('minute', -15, SYSDATE())\nGROUP BY 1, 2\nORDER BY FAILED_VALUE DESC\nLIMIT 10;\n\n-- Interactive warehouses reject DML and procedures: switch back before creating anything\nUSE WAREHOUSE BANKING_WH;\n\n-- 5. Incidents: failing clusters in the last 15 minutes, refreshed every minute\nCREATE OR REPLACE DYNAMIC TABLE BANKING_HOL.REALTIME.DT_PAYMENT_INCIDENTS\n  TARGET_LAG = '1 minute'\n  WAREHOUSE = BANKING_WH\n  COMMENT = 'DE3: failing payment clusters in the last 15 minutes, refreshed every minute'\nAS\nSELECT e.CUSTOMER_ID,\n       c.CUSTOMER_NAME,\n       e.SCHEME,\n       e.FAILURE_REASON,\n       COUNT(*)         AS FAILED_PAYMENTS,\n       SUM(e.AMOUNT)    AS FAILED_VALUE,\n       MIN(e.EVENT_TS)  AS FIRST_FAILURE,\n       MAX(e.EVENT_TS)  AS LAST_FAILURE\nFROM PAYMENTS_MIRROR.PAYMENTS.PAYMENT_EVENTS e\nJOIN BANKING_HOL.RAW_DATA.CUSTOMERS c ON c.CUSTOMER_ID = e.CUSTOMER_ID\nWHERE e.STATUS = 'FAILED'\n  AND e.EVENT_TS >= DATEADD('minute', -15, SYSDATE())\nGROUP BY 1, 2, 3, 4\nHAVING COUNT(*) >= 5;\n\nSELECT * FROM BANKING_HOL.REALTIME.DT_PAYMENT_INCIDENTS ORDER BY FAILED_PAYMENTS DESC;\n\n-- 6. After the lab: the instance bills while it runs\n-- ALTER POSTGRES INSTANCE HOL_PAYMENTS_PG SUSPEND;\n-- Facilitator teardown: CALL SNOWFLAKE.POSTGRES.DROP_MIRROR(mirror_name => 'payments_mirror', drop_target_database => TRUE);\n--                       DROP POSTGRES INSTANCE HOL_PAYMENTS_PG;\n", "sql_name": "vignettes/de3_realtime_payments/de3.sql"}, {"code": "DE4", "title": "Spark on Snowflake: run your PySpark and monitor it", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Engineer<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~40 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>C1 only. Uses the raw status feed <code>BANKING_HOL.SPARK_LAB.PAYMENT_STATUS_UPDATES<\/code> and the Iceberg payments, both built at provisioning<\/td><\/tr>\n<tr><td><strong>Reference<\/strong><\/td><td><span class=\"ref\"><code>de4_pipeline.py<\/code><\/span>, <span class=\"ref\"><code>de4.sql<\/code><\/span><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Our nightly payments pipelines are PySpark jobs on clusters we size, patch and pay for when they&#x27;re idle. Can we run the same Spark code on Snowflake, against the same governed data, and see every run, failure and slow step in one place?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>An interactive <strong>Spark session<\/strong> in a Workspace notebook, named so it shows up in <strong>Monitoring &gt; Spark &gt; Spark Sessions<\/strong><\/li>\n<li>A starter notebook with the PySpark already in it, and a bronze to silver to gold pipeline: quarantine bad rows, change data capture (duplicates and late arrivals handled), apply the latest status over the Iceberg payments, reconcile, and summarise failed payments for operations<\/li>\n<li>Tables <code>PAYMENT_UPDATES_QUARANTINE<\/code>, <code>PAYMENTS_CURRENT<\/code>, <code>PIPELINE_RECONCILIATION<\/code> and <code>FAILED_PAYMENTS_BY_SCHEME<\/code> in <code>BANKING_HOL.SPARK_LAB<\/code><\/li>\n<li>The same pipeline as a <strong>batch job<\/strong> with <code>EXECUTE CODE BUNDLE<\/code>, straight from the lab&#x27;s git repo, scheduled nightly by a task<\/li>\n<li>A deliberately failed run, found and diagnosed in <strong>Monitoring &gt; Spark<\/strong>, and an alert <code>SPARK_JOB_FAILURE_ALERT<\/code> that records every failed Spark job<\/li>\n<\/ul>\n<h3>Spark on Snowflake<\/h3>\n<ul>\n<li><strong>Snowpark Connect for Spark<\/strong> runs PySpark (and Scala and Java) DataFrame code on Snowflake. The client sends the Spark plan; Snowflake runs it as SQL on a warehouse. No cluster, no executors, no autoscaling to tune, and the code reads governed tables, including Iceberg, with masking and row access policies applied.<\/li>\n<li><strong>Interactive<\/strong>: start a session from a notebook, a laptop or an IDE with <code>init_spark_session()<\/code>. <strong>Batch<\/strong>: submit a <code>.py<\/code> file with <code>EXECUTE CODE BUNDLE<\/code> (SQL), the REST API or <code>snowpark-submit<\/code>, and schedule it with a task.<\/li>\n<li><strong>Monitoring &gt; Spark<\/strong> in Snowsight lists every <strong>Spark Session<\/strong> with its queries, and every <strong>Batch Job<\/strong> with its status, duration, owner, logs and an OpenTelemetry trace. It&#x27;s built on the table function <code>SNOWFLAKE.SNOWPARK_CONNECT.GET_SPARK_APPLICATION_HISTORY<\/code>, which you can query yourself.<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Open the starter notebook<\/h4>\n<p class=\"where\">the <strong>banking-hol-pack<\/strong> Workspace &gt; file explorer &gt; <code>notebooks/de4_spark_on_snowflake.ipynb<\/code><\/p>\n<ol>\n<li>Open <code>notebooks/<\/code> &gt; <strong>de4_spark_on_snowflake.ipynb<\/strong>. The PySpark is already in it: one numbered heading per step, the cells underneath, and the prompt to paste above them.<\/li>\n<li>Connect it to your notebook service (the arrow next to the status dot &gt; <strong>Select service<\/strong>). No service yet? Create one as in DE3&#x27;s first step: compute pool <strong>NOTEBOOK_POOL<\/strong>, idle timeout <strong>1 hour<\/strong>.<\/li>\n<li>Under heading 0, run the <strong>install<\/strong> cell. It installs <code>snowpark-connect<\/code> (PySpark plus a Java runtime) from the Snowflake PyPI repository on your notebook service. If it says <strong>Installed<\/strong>, restart the kernel (Connect &gt; <strong>Restart kernel<\/strong>).<\/li>\n<li>Run the <strong>context<\/strong> cell. It sets the role, warehouse, database and schema: Snowpark Connect needs them before the session starts.<\/li>\n<li>Open Snowsight &gt; <strong>Monitoring &gt; Spark<\/strong> in a second browser tab and keep it open.<\/li>\n<\/ol>\n<p class=\"expect\"><strong>What you should see:<\/strong> your user, <code>HOL_PARTICIPANT<\/code>, <code>BANKING_HOL<\/code> and <code>SPARK_LAB<\/code> printed. The install takes a minute or two the first time; the service keeps it until it&#x27;s recreated.<\/p>\n<h4>Start a Spark session<\/h4>\n<p class=\"where\">the Cortex Code sidebar, with <code>de4_spark_on_snowflake<\/code> open<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Explain the spark_session cell in de4_spark_on_snowflake: what Snowpark Connect for Spark is, what runs where when I call a DataFrame action, and where the app name appears in Snowsight. Then run it.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a Spark version and your session name, <code>de4_&lt;your user&gt;<\/code>, printed in a few seconds. Spark Monitoring in the Snowsight UI comes in the last step; if you opened it earlier, the session is listed there by that name with you as the owner.<\/p>\n<h4>Explore the feed with PySpark<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Run the explore cell in de4_spark_on_snowflake and explain each number: what would break downstream if we loaded this feed as it is, ordered by LOADED_AT? Then open my session in Monitoring &gt; Spark and tell me what I&#x27;ll find there.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> about 10,800 events but about 500 fewer distinct ones (duplicate deliveries), 40 rows with no payment id or an unknown status, about 20 payments the bank doesn&#x27;t hold, and several hundred payments whose PROCESSING event arrived after their final status. Exact counts vary a little by account, because the payments are generated when the lab is installed. Load by <code>LOADED_AT<\/code> and those payments would go back to PROCESSING. In <strong>Monitoring &gt; Spark<\/strong>, open your session: every DataFrame action is listed as a Snowflake query, each linked to its Query Profile.<\/p>\n<h4>Build the pipeline<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Run the pipeline cell in de4_spark_on_snowflake, then walk me through it step by step: the quarantine rules, how the row_number window handles duplicates and late arrivals, and what the reconciliation proves.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> 60 rows quarantined, 20 for each reason, <code>PAYMENTS_CURRENT<\/code> with 50,000 rows (the same as the source) and about 5,200 payments updated by the feed: both reconciliation lines <code>True<\/code>.<\/p>\n<h4>Run it as a nightly batch job<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Run the batch_job, reconciliation and gold cells in de4_spark_on_snowflake and explain what EXECUTE CODE BUNDLE did. Then tell me what to look at for the payments_nightly run in Monitoring &gt; Spark &gt; Batch Jobs, including the Trace tab.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the <strong>batch_job<\/strong> cell takes about 30 to 60 seconds on the warehouse, with no cluster to start. Both reconciliation checks pass, and the gold table shows failed and returned payments by scheme. In <strong>Monitoring &gt; Spark &gt; Batch Jobs<\/strong>, open <code>payments_nightly<\/code>: the command, its queries, its logs and the <strong>Trace<\/strong> tab, one span per DataFrame action.<\/p>\n<h4>Schedule it<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Run the schedule cell in de4_spark_on_snowflake and explain the task: when it runs, what it runs, and how I&#x27;d chain it after the dbt build from DE1.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the task created and resumed, to run at 02:00 London time. The scheduler is Snowflake itself: no Airflow or cluster scheduler to run.<\/p>\n<h4>Break it and find out why<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>The broken_run cell in de4_spark_on_snowflake failed. Find out why from Snowflake: query SNOWFLAKE.SNOWPARK_CONNECT.GET_SPARK_APPLICATION_HISTORY for my latest failed run, then its ERROR logs in SNOWFLAKE.TELEMETRY.EVENTS_VIEW (filter RESOURCE_ATTRIBUTES[&#x27;snow.query.id&#x27;] on the run&#x27;s EXECUTE_QUERY_ID), and tell me the root cause and the fix.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the <strong>broken_run<\/strong> cell fails in about 20 seconds, as intended: upstream &quot;renamed&quot; the feed. In <strong>Monitoring &gt; Spark &gt; Batch Jobs<\/strong>, <code>payments_nightly_broken<\/code> is <strong>FAILED<\/strong>, and its <strong>Logs<\/strong> show <code>AnalysisException: [TABLE_OR_VIEW_NOT_FOUND] ... PAYMENT_STATUS_UPDATES_V2<\/code> with the stack trace (logs can take a minute or two to arrive). Cortex Code finds the same from SQL and names the fix: drop <code>--source<\/code> or point it at <code>PAYMENT_STATUS_UPDATES<\/code>.<\/p>\n<p>Then: don&#x27;t fix the cell. The fix is the <strong>batch_job<\/strong> cell from step 4, which already reads the real feed. Leave the failed run in place, because the alert in the next step has to find it, and go on to heading 7.<\/p>\n<h4>Alert on failed Spark jobs<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Run the cells under heading 7 (spark_history through failures) in de4_spark_on_snowflake and explain how the alert finds each failure exactly once. How would I change the action to email the on-call engineer?<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> your sessions and batch runs as a table, the same data as <strong>Monitoring &gt; Spark<\/strong>, then <code>payments_nightly_broken<\/code> in <code>SPARK_JOB_FAILURES<\/code> about a minute after <strong>alert_now<\/strong>. In production the action would email the on-call engineer or open a ticket; here it records the failure so nothing leaves the lab.<\/p>\n<h4>See it all in Spark Monitoring<\/h4>\n<p class=\"where\">Snowsight &gt; <strong>Monitoring &gt; Spark<\/strong><\/p>\n<p>You&#x27;ve worked in the notebook so far. Now look at the same work from the UI.<\/p>\n<ol>\n<li>Open <strong>Monitoring &gt; Spark<\/strong> and select the warehouse <strong>BANKING_WH<\/strong>.<\/li>\n<li><strong>Spark Sessions<\/strong> lists your session, <code>de4_&lt;your user&gt;<\/code>, with you as the owner and its queries.<\/li>\n<li><strong>Batch Jobs<\/strong> lists <code>payments_nightly<\/code> (succeeded) and <code>payments_nightly_broken<\/code> (failed), with logs and the Telemetry trace.<\/li>\n<\/ol>\n<p class=\"expect\"><strong>What you should see:<\/strong> your session and both batch runs listed, matching what you ran in the notebook<\/p>\n<p>Note: the clips in the earlier steps show what this screen looks like at that point in the lab.<\/p>\n<h3>Check your work<\/h3>\n<p>Your Spark session is listed under your name, <code>PAYMENTS_CURRENT<\/code> matches the source, a <code>payments_nightly<\/code> batch job succeeded, a failed run is recorded, and <code>SPARK_JOB_FAILURE_ALERT<\/code> exists.<\/p>\n<h3>After the lab<\/h3>\n<p>Suspend the task so it doesn&#x27;t run every night: <code>ALTER TASK BANKING_HOL.SPARK_LAB.PAYMENTS_NIGHTLY_SPARK SUSPEND<\/code>.<\/p>\n<h3>In your bank<\/h3>\n<p>Bring the Spark code, leave the clusters. The same PySpark runs on Snowflake warehouses against governed Iceberg and Snowflake tables, interactive or batch, and every session, job, log and trace is in one place: Monitoring &gt; Spark.<\/p>", "sql": "-- =====================================================\n-- DE4: Spark on Snowflake - reference SQL\n-- Run as HOL_PARTICIPANT. The PySpark itself is in de4_pipeline.py\n-- (the batch job) and notebooks/de4_spark_on_snowflake.ipynb (interactive).\n-- =====================================================\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.SPARK_LAB;\n\n-- -----------------------------------------------------\n-- DE4.1 The raw feed: duplicates, late arrivals and bad rows\n-- -----------------------------------------------------\nSELECT COUNT(*) AS EVENTS, COUNT(DISTINCT EVENT_ID) AS DISTINCT_EVENTS,\n       COUNT(*) - COUNT(DISTINCT EVENT_ID) AS DUPLICATE_DELIVERIES,\n       COUNT_IF(PAYMENT_ID IS NULL) AS NO_PAYMENT_ID\nFROM PAYMENT_STATUS_UPDATES;\n\n-- -----------------------------------------------------\n-- DE4.4 Run the pipeline as a batch job, straight from the lab's git repo.\n-- No cluster: it runs on the session warehouse. The query ID is the job ID.\n-- -----------------------------------------------------\nEXECUTE CODE BUNDLE FROM '@BANKING_HOL_SETUP.PUBLIC.HOL_REPO/branches/main/vignettes/de4_spark_on_snowflake'\n  ENTRYPOINT = 'de4_pipeline.py'\n  ARGUMENTS = ('--schema', 'BANKING_HOL.SPARK_LAB', '--app-name', 'payments_nightly')\n  EXECUTION_NAME = 'payments_nightly'\n  WITH SPECIFICATION $$\nbundle:\n  type: spark\n  compute_type: warehouse\n  language: python\n  compute_options: {}\n$$;\n\nSELECT * FROM PIPELINE_RECONCILIATION ORDER BY CHECKED_AT DESC;\nSELECT REJECT_REASON, COUNT(*) AS ROWS_HELD FROM PAYMENT_UPDATES_QUARANTINE GROUP BY 1;\nSELECT * FROM FAILED_PAYMENTS_BY_SCHEME ORDER BY PAYMENTS DESC;\n\n-- -----------------------------------------------------\n-- DE4.5 Schedule it: a task runs the same statement every night\n-- -----------------------------------------------------\nCREATE OR REPLACE TASK PAYMENTS_NIGHTLY_SPARK\n  WAREHOUSE = BANKING_WH\n  SCHEDULE = 'USING CRON 0 2 * * * Europe/London'\n  COMMENT = 'DE4: nightly PySpark payments pipeline'\nAS\n  EXECUTE CODE BUNDLE FROM '@BANKING_HOL_SETUP.PUBLIC.HOL_REPO/branches/main/vignettes/de4_spark_on_snowflake'\n    ENTRYPOINT = 'de4_pipeline.py'\n    ARGUMENTS = ('--schema', 'BANKING_HOL.SPARK_LAB', '--app-name', 'payments_nightly')\n    EXECUTION_NAME = 'payments_nightly'\n    WITH SPECIFICATION $$\nbundle:\n  type: spark\n  compute_type: warehouse\n  language: python\n  compute_options: {}\n$$;\nALTER
