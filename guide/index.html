TASK PAYMENTS_NIGHTLY_SPARK RESUME;\n\n-- -----------------------------------------------------\n-- DE4.6 Break it: upstream renamed the feed. The run fails, and the error\n-- is in Monitoring > Spark > Batch Jobs (and CODE_BUNDLE_HISTORY).\n-- -----------------------------------------------------\n-- (wrapped so the expected failure doesn't stop the rest of this file; the reason is returned)\nEXECUTE IMMEDIATE $$\nBEGIN\n  EXECUTE CODE BUNDLE FROM '@BANKING_HOL_SETUP.PUBLIC.HOL_REPO/branches/main/vignettes/de4_spark_on_snowflake'\n    ENTRYPOINT = 'de4_pipeline.py'\n    ARGUMENTS = ('--schema', 'BANKING_HOL.SPARK_LAB', '--source', 'PAYMENT_STATUS_UPDATES_V2', '--app-name', 'payments_nightly_broken')\n    EXECUTION_NAME = 'payments_nightly_broken'\n    WITH SPECIFICATION '\nbundle:\n  type: spark\n  compute_type: warehouse\n  language: python\n  compute_options: {}\n';\n  RETURN 'Unexpected: the broken run succeeded';\nEXCEPTION\n  WHEN OTHER THEN RETURN 'Failed as intended: ' || LEFT(SQLERRM, 300);\nEND;\n$$;\n\n-- -----------------------------------------------------\n-- DE4.7 The data behind Monitoring > Spark, as SQL\n-- -----------------------------------------------------\nSELECT NAME, MODE, OWNER, EXECUTION_STATUS, CREATED_ON,\n       DATEDIFF('second', STARTED_ON, COMPLETED_ON) AS SECONDS, ERROR_CODE\nFROM TABLE(SNOWFLAKE.SNOWPARK_CONNECT.GET_SPARK_APPLICATION_HISTORY(\n    CREATION_TIME_START => DATEADD('day', -1, CURRENT_TIMESTAMP()), RESULT_LIMIT => 100))\nORDER BY CREATED_ON DESC;\n\n-- why it failed: the job's ERROR logs in the event table\nSELECT e.TIMESTAMP, e.RECORD['severity_text']::STRING AS SEVERITY, LEFT(e.VALUE::STRING, 300) AS MESSAGE\nFROM SNOWFLAKE.TELEMETRY.EVENTS_VIEW e\nWHERE e.TIMESTAMP > DATEADD('hour', -2, SYSDATE())\n  AND e.RECORD_TYPE = 'LOG' AND e.RECORD['severity_text']::STRING IN ('ERROR', 'FATAL')\n  AND e.RESOURCE_ATTRIBUTES['snow.query.id']::STRING = (\n      SELECT EXECUTE_QUERY_ID FROM TABLE(SNOWFLAKE.SNOWPARK_CONNECT.GET_SPARK_APPLICATION_HISTORY(RESULT_LIMIT => 100))\n      WHERE NAME ILIKE '%payments_nightly_broken%' ORDER BY CREATED_ON DESC LIMIT 1)\nORDER BY e.TIMESTAMP;\n\n-- -----------------------------------------------------\n-- DE4.8 Alert on failed Spark jobs: every 5 minutes, record new failures\n-- -----------------------------------------------------\nCREATE TABLE IF NOT EXISTS SPARK_JOB_FAILURES (\n    APPLICATION_ID VARCHAR, NAME VARCHAR, MODE VARCHAR, OWNER VARCHAR,\n    COMPLETED_ON TIMESTAMP_LTZ, ERROR_CODE VARCHAR, RECORDED_AT TIMESTAMP_LTZ DEFAULT CURRENT_TIMESTAMP());\n\nCREATE OR REPLACE ALERT SPARK_JOB_FAILURE_ALERT\n  WAREHOUSE = BANKING_WH\n  SCHEDULE = '5 MINUTE'\n  IF (EXISTS (\n    SELECT ID, NAME, MODE, OWNER, COMPLETED_ON, ERROR_CODE\n    FROM TABLE(SNOWFLAKE.SNOWPARK_CONNECT.GET_SPARK_APPLICATION_HISTORY(\n        CREATION_TIME_START => DATEADD('day', -1, SNOWFLAKE.ALERT.SCHEDULED_TIME()), RESULT_LIMIT => 10000))\n    WHERE EXECUTION_STATUS = 'FAILED' AND MODE <> 'SCOS_CLIENT'\n      AND ID NOT IN (SELECT APPLICATION_ID FROM BANKING_HOL.SPARK_LAB.SPARK_JOB_FAILURES)))\n  THEN\n    INSERT INTO BANKING_HOL.SPARK_LAB.SPARK_JOB_FAILURES (APPLICATION_ID, NAME, MODE, OWNER, COMPLETED_ON, ERROR_CODE)\n    SELECT ID, NAME, MODE, OWNER, COMPLETED_ON, ERROR_CODE\n    FROM TABLE(RESULT_SCAN(SNOWFLAKE.ALERT.GET_CONDITION_QUERY_UUID()));\nALTER ALERT SPARK_JOB_FAILURE_ALERT RESUME;\nEXECUTE ALERT SPARK_JOB_FAILURE_ALERT;  -- don't wait 5 minutes\n\nSELECT * FROM SPARK_JOB_FAILURES ORDER BY RECORDED_AT DESC;\n", "sql_name": "vignettes/de4_spark_on_snowflake/de4.sql"}, {"code": "DA0", "title": "Interactive payments report with Cortex Code", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Analyst<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~30 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>Core C1 only<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Can ops and RMs get the client 360 from C1 as a live, interactive report they can filter themselves, refreshed every morning?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>An interactive, bank-branded HTML payments report, built by Cortex Code<\/li>\n<li>Your own variation of it: new brand, charts or filters<\/li>\n<li>A daily Cortex Code automation that rebuilds the report with fresh data<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Build an interactive report<\/h4>\n<p class=\"where\">the <strong>CoCo<\/strong> tab, in your C1 session or a <strong>New session<\/strong><\/p>\n<ol>\n<li>Paste the prompt below into the <strong>How can I help?<\/strong> box.<\/li>\n<li>Press <strong>Allow<\/strong> on each <strong>Run this command?<\/strong> card while it queries and builds.<\/li>\n<li>Open the preview link Cortex Code gives you.<\/li>\n<\/ol>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Using the payments, accounts, customers, relationship managers and feedback tables in BANKING_HOL.RAW_DATA, build an interactive HTML report of corporate payments health. Show headline figures, a monthly trend, a breakdown by payment type, and a sortable table of clients with their RM, failed payments and feedback. Let me filter by payment type, region and channel. Brand it as a UK bank (navy and cyan, red for failures). My role is read-only. Preview it and give me the link.<\/pre><\/div>\n<p class=\"where\">Paste into: the <strong>How can I help?<\/strong> box in the <strong>CoCo<\/strong> tab<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> Cortex Code explores the tables, builds the report and gives you a preview link<\/p>\n<h4>Make it yours<\/h4>\n<p class=\"where\">the same CoCo session<\/p>\n<p>Now ask for your own changes, one prompt at a time. Some ideas:<\/p>\n<ul>\n<li><strong>Rebrand it:<\/strong> &quot;Re-skin the report in Snowflake brand colours: Snowflake Blue #29B5E8, Mid Blue #11567F, Midnight #000000.&quot;<\/li>\n<li><strong>Add a chart:<\/strong> &quot;Add a heatmap of failure rate by region and payment type.&quot;<\/li>\n<li><strong>Add a filter:<\/strong> &quot;Add a relationship manager filter that also filters the client table.&quot;<\/li>\n<li><strong>Explain the numbers:<\/strong> &quot;Add a short summary at the top of the three things ops should act on this week.&quot;<\/li>\n<li><strong>Make it for one audience:<\/strong> &quot;Make a one-page version for RMs that only shows their own clients.&quot;<\/li>\n<\/ul>\n<ol>\n<li>Paste one idea, or write your own.<\/li>\n<li>Open the new preview link and check the change.<\/li>\n<li>Repeat until you&#x27;re happy with it.<\/li>\n<\/ol>\n<p><strong>Tip:<\/strong> ask for one change at a time. If something breaks, say &quot;undo the last change&quot;.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> an updated preview after each prompt, with your changes and the totals unchanged<\/p>\n<h4>Refresh the report every morning<\/h4>\n<p class=\"where\">the same CoCo session<\/p>\n<p>The report embeds its data, so it shows the numbers from when it was built. A daily automation rebuilds it with fresh data.<\/p>\n<ol>\n<li>Paste the prompt below.<\/li>\n<li>Check the summary Cortex Code shows: name, schedule and read-only.<\/li>\n<li>Let it run once now, so you can see the refreshed report.<\/li>\n<li>Find it later under <strong>Automations<\/strong> in the CoCo side nav (below <strong>New session<\/strong>).<\/li>\n<\/ol>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Set up a daily Cortex Code automation called PAYMENTS_REPORT_REFRESH that runs at 07:00 Europe/London. Each run: re-run the queries behind the interactive payments report we just built, rebuild the same report with today&#x27;s data, check the totals against BANKING_HOL.RAW_DATA, and save it in the same place with today&#x27;s date in the definitions section. It runs unattended, so it must not ask questions and must stay read-only. Create it paused, run it once now so I can see the result, then start the schedule.<\/pre><\/div>\n<p class=\"where\">Paste into: the <strong>How can I help?<\/strong> box in the <strong>CoCo<\/strong> tab<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> Cortex Code summarises the automation, creates it paused, runs it once and shows the rebuilt report, then asks before starting the schedule. Each run uses your default role (<code>HOL_PARTICIPANT<\/code>).<\/p>\n<h3>Check your work<\/h3>\n<p>Your report preview opens, filters change the headline figures, and <strong>Reset<\/strong> brings them back to 50,000 payments.<\/p>\n<h3>In your bank<\/h3>\n<p>At a bank the same report would read from the governed data product views rather than RAW_DATA, and be shared through Snowflake Intelligence instead of a preview link.<\/p>", "sql": "-- DA0: the totals the interactive report must match (Cortex Code builds the report itself).\n-- Run as HOL_PARTICIPANT on BANKING_WH. Expect 50,000 payments and about 96% success; the exact counts differ per account (the data is generated at install).\nSELECT COUNT(*)                                                       AS payments,\n       COUNT_IF(STATUS = 'FAILED')                                    AS failed,\n       COUNT_IF(STATUS = 'RETURNED')                                  AS returned,\n       ROUND(100 * COUNT_IF(STATUS = 'COMPLETED') / COUNT(*), 2)      AS success_rate_pct,\n       ROUND(SUM(IFF(CURRENCY = 'GBP', AMOUNT, AMOUNT * FX_RATE)) / 1e9, 1) AS gbp_volume_bn\nFROM BANKING_HOL.RAW_DATA.PAYMENTS;\n", "sql_name": "vignettes/da0_interactive_report/da0_report_totals.sql"}, {"code": "DA1", "title": "One trusted answer on client health, for every RM and every agent", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Analyst<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~90 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td><code>setup/catchup/core_analytics.sql<\/code><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>An RM is about to call a corporate client whose payments are failing. The payments report, the RM&#x27;s spreadsheet and the ops dashboard each give a different success rate. Give the bank one trusted answer that anyone, and any AI agent, can get in plain English.<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li><code>SV_CLIENT_360<\/code>: the bank&#x27;s single definition of client payments health, alerts and sentiment<\/li>\n<li>The bank&#x27;s rules and a checked answer, so a question RMs actually ask is answered the same way every time<\/li>\n<li>A quality score that proves the answers are right before RMs and agents rely on them<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>The problem this solves<\/h4>\n<p>Read this first: it&#x27;s the story you&#x27;ll tell the business.<\/p>\n<ul>\n<li><strong>Today:<\/strong> &quot;success rate&quot;, &quot;value at risk&quot; and &quot;open incidents&quot; are calculated differently in every report. An RM walks into a client call with one number; the client&#x27;s ops team has another.<\/li>\n<li><strong>The cost:<\/strong> wasted time reconciling numbers, awkward client conversations, and AI that guesses: ask a chatbot &quot;which clients are unhappy?&quot; and it writes its own SQL, with its own definitions.<\/li>\n<li><strong>The fix:<\/strong> a semantic view. The bank writes each definition once, in business language, next to the data. People, BI tools, Cortex Analyst and every agent in this lab (OPS1, AI1, AI2, AI3) get the same answer from it.<\/li>\n<\/ul>\n<p>By the end of this module an RM can ask &quot;Which clients have negative sentiment and a success rate below 96%?&quot; and get the bank&#x27;s answer, checked, monitored and scored.<\/p>\n<p>What you&#x27;ll bring together around each client:<\/p>\n<table>\n<tr><td>For the RM<\/td><td>Comes from<\/td><\/tr>\n<tr><td>Client, sector and relationship manager<\/td><td><code>STG_CUSTOMERS<\/code><\/td><\/tr>\n<tr><td>Payment volume, success rate and value at risk<\/td><td><code>V_CLIENT_PAYMENT_SUMMARY<\/code> (you build it next)<\/td><\/tr>\n<tr><td>What the client is saying, and how they feel<\/td><td><code>FEEDBACK_ENRICHED<\/code><\/td><\/tr>\n<tr><td>Open and critical incidents<\/td><td><code>V_CLIENT_ALERTS<\/code> (you build it next)<\/td><\/tr>\n<\/table>\n<p class=\"expect\"><strong>What you should see:<\/strong> you can explain, in one sentence, why one definition beats three reports<\/p>\n<h4>Give the data a stable shape<\/h4>\n<p class=\"where\">the Cortex Code sidebar<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>In BANKING_HOL.ANALYTICS create two views. V_CLIENT_PAYMENT_SUMMARY: one row per CUSTOMER_ID from STG_PAYMENTS joined to STG_ACCOUNTS (on ORIGINATOR_ACCOUNT_ID), with TOTAL_PAYMENTS, SUCCESSFUL_PAYMENTS, FAILED_PAYMENTS, TOTAL_VOLUME_GBP and FAILED_VOLUME_GBP. V_CLIENT_ALERTS: one row per ALERT_ID from BANKING_HOL.RAW_DATA.OPERATIONAL_ALERTS joined through STG_PAYMENTS and STG_ACCOUNTS to get CUSTOMER_ID, with SEVERITY, ALERT_STATUS, ALERT_TIME and RESOLUTION_TIME_MIN. Show 5 rows from each.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> two views, with one row per client in the payment summary<\/p>\n<p>These views are a contract: if the source systems change, you fix one view, and every RM question keeps working.<\/p>\n<h4>Write the bank&#x27;s definitions once<\/h4>\n<p class=\"where\">banking-hol-pack Workspace &gt; <strong>+ Add new &gt; Semantic view<\/strong><\/p>\n<ol>\n<li>Click <strong>+ Add new &gt; Semantic view<\/strong> and name the file <code>sv_client_360<\/code>.<\/li>\n<li>Cortex Code opens beside it with its own starter, &quot;Help me create a semantic view&quot;, and a <strong>Questions<\/strong> card asking which source tables to use. Click <strong>Cancel<\/strong> on the card.<\/li>\n<li>Paste the brief below into the same Cortex Code chat. It names every table and key, so there&#x27;s nothing left to ask.<\/li>\n<li>Press <strong>Allow<\/strong> on each <strong>Run this command?<\/strong> card.<\/li>\n<\/ol>\n<p><strong>Important:<\/strong> if Cortex Code still asks about sources, don&#x27;t pick the RAW_DATA tables or the staging list it suggests. Choose <strong>Other...<\/strong> and reply &quot;Use exactly the four tables in my brief&quot;.<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a semantic view BANKING_HOL.ANALYTICS.SV_CLIENT_360 with four logical tables: clients (STG_CUSTOMERS, key CUSTOMER_ID), payments (V_CLIENT_PAYMENT_SUMMARY, key CUSTOMER_ID), feedback (FEEDBACK_ENRICHED, key FEEDBACK_ID) and alerts (V_CLIENT_ALERTS, key ALERT_ID), with payments, feedback and alerts each related to clients on CUSTOMER_ID. Add dimensions including clients.customer_name, clients.sector, clients.rm_name (synonyms &quot;relationship manager&quot;, &quot;RM&quot;) and feedback.sentiment_label, and metrics including payments.payment_volume (sum of total volume GBP), payments.success_rate_pct, feedback.avg_sentiment, alerts.open_alert_count (status not RESOLVED) and alerts.critical_alert_count. Add business comments and synonyms, then deploy it. Use exactly these four tables and names, and don&#x27;t ask me which sources to use.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> <code>SV_CLIENT_360<\/code> exists. Keep the logical names <code>clients<\/code>, <code>payments<\/code>, <code>rm_name<\/code> and <code>payment_volume<\/code>: the check queries them.<\/p>\n<ul>\n<li><strong>Success rate<\/strong> is now defined once: successful over total payments for the client, not an average of averages.<\/li>\n<li><strong>Synonyms<\/strong> mean &quot;RM&quot;, &quot;banker&quot; and &quot;relationship manager&quot; all find the same person.<\/li>\n<\/ul>\n<h4>Answer the RM&#x27;s question without writing a join<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Query SV_CLIENT_360 with the SEMANTIC_VIEW function: payment volume, success rate and open alert count by RM name, ordered by open alerts. Then explain which joins the semantic view did for me, and list each metric with the calculation it uses from BANKING_HOL.INFORMATION_SCHEMA.SEMANTIC_METRICS.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> one row per RM with volume, success rate and open alerts; an explanation that clients, payments and alerts were joined for you; then each metric with its calculation<\/p>\n<ul>\n<li>Analysts get the same numbers as the agents, without rewriting the joins.<\/li>\n<li>Every KPI&#x27;s definition is documented and queryable, which model risk and audit teams will ask for.<\/li>\n<\/ul>\n<h4>Open the definition where the business can refine it<\/h4>\n<p class=\"where\">Snowsight &gt; <strong>AI &gt; Analyst<\/strong>, then the banking-hol-pack Workspace<\/p>\n<ol>\n<li>If you&#x27;re on the CoCo side, switch the toggle at the top left to <strong>Home<\/strong>.<\/li>\n<li>Open <strong>AI &gt; Analyst<\/strong>.<\/li>\n<li>In the database picker, choose <strong>BANKING_HOL<\/strong>, then the <strong>ANALYTICS<\/strong> schema.<\/li>\n<li>Click <strong>SV_CLIENT_360<\/strong>.<\/li>\n<li>In <strong>Open semantic view in Workspaces<\/strong>, open the <strong>Destination Workspace<\/strong> dropdown (it says <strong>My Workspace<\/strong>) and pick <strong>banking-hol-pack<\/strong>.<\/li>\n<li>Click <strong>Open<\/strong>.<\/li>\n<\/ol>\n<p><strong>Tip:<\/strong> tick <strong>Always open semantic views in this workspace<\/strong> so you don&#x27;t have to pick it again.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> <code>SV_CLIENT_360.sv.yaml<\/code> open in the banking-hol-pack Workspace, under a <code>cortex_project<\/code> folder<\/p>\n<p>This is <strong>Semantic Studio<\/strong>. You change a working copy here; RMs and agents only see a change once you <strong>Deploy<\/strong> it.<\/p>\n<h4>See what the RM&#x27;s question relies on<\/h4>\n<p class=\"where\">Semantic Studio, <code>SV_CLIENT_360.sv.yaml<\/code><\/p>\n<ol>\n<li>On <strong>Visual<\/strong>, expand <strong>Metrics<\/strong> under PAYMENTS: these are the bank&#x27;s KPIs.<\/li>\n<li>Click <strong>Diagram<\/strong>: the client sits in the middle, with payments, feedback and alerts around it.<\/li>\n<li>Click <strong>YAML<\/strong>: the same definition as text, ready for change control in Git.<\/li>\n<li>Go back to <strong>Visual<\/strong> and note the four tabs on the right. You&#x27;ll use each one next.<\/li>\n<\/ol>\n<table>\n<tr><td>Tab<\/td><td>What it gives the bank<\/td><\/tr>\n<tr><td><strong>Playground<\/strong><\/td><td>try an RM&#x27;s question before anyone relies on it<\/td><\/tr>\n<tr><td><strong>Monitoring<\/strong><\/td><td>every question RMs and agents ask, and the SQL behind each answer<\/td><\/tr>\n<tr><td><strong>Suggestions<\/strong><\/td><td>KPIs and questions people need that the definition doesn&#x27;t cover yet<\/td><\/tr>\n<tr><td><strong>Evaluations<\/strong><\/td><td>a quality score, re-run before every change ships<\/td><\/tr>\n<\/table>\n<p class=\"expect\"><strong>What you should see:<\/strong> the Diagram shows CLIENTS in the middle, with ALERTS, FEEDBACK and PAYMENTS joined to it<\/p>\n<h4>Ask the RM&#x27;s question<\/h4>\n<p class=\"where\">Semantic Studio &gt; <strong>Playground<\/strong> tab (right-hand panel)<\/p>\n<ol>\n<li>Open the <strong>Playground<\/strong> tab.<\/li>\n<li>Type this question in <strong>Enter prompt<\/strong> and click <strong>Run<\/strong>: &quot;Which clients have negative sentiment and a success rate below 96%?&quot;<\/li>\n<li>Read the SQL in the answer. Look at how it filters on sentiment.<\/li>\n<\/ol>\n<p class=\"expect\"><strong>What you should see:<\/strong> an answer with its SQL. Check how it reads &quot;negative sentiment&quot;: the data stores labels in upper case (<code>NEGATIVE<\/code>), so a filter on <code>&#x27;negative&#x27;<\/code> returns no clients, and &quot;negative&quot; could mean one bad comment or a negative average<\/p>\n<p>An RM never sees that SQL. They&#x27;d just hear &quot;no clients at risk&quot; before a difficult call. The next two steps fix it the way a bank would: write the rule down, then sign off the answer.<\/p>\n<h4>Write down the bank&#x27;s rules<\/h4>\n<p class=\"where\">Semantic Studio &gt; <strong>Visual<\/strong> &gt; <strong>Custom instructions<\/strong> &gt; <strong>SQL generation<\/strong><\/p>\n<ol>\n<li>Under <strong>Custom instructions<\/strong>, hover <strong>SQL generation<\/strong> and click its edit (pencil) button.<\/li>\n<li>Paste the rules below into the box.<\/li>\n<li>Click the tick at the top right of the box to save the change to your file.<\/li>\n<\/ol>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Sentiment labels are stored in upper case: POSITIVE, NEUTRAL or NEGATIVE. &quot;Negative sentiment&quot; for a client means their average sentiment score is below 0. Client names are stored in upper case: match them with ILIKE. Round percentages to 1 decimal place.<\/pre><\/div>\n<p class=\"where\">Paste into: the <strong>SQL generation<\/strong> box in Semantic Studio (not the Cortex Code sidebar)<\/p>\n<ol>\n<li>Ask the Playground question again.<\/li>\n<\/ol>\n<p class=\"expect\"><strong>What you should see:<\/strong> a list of at-risk clients, with SQL that uses the average sentiment (or <code>&#x27;NEGATIVE&#x27;<\/code> in upper case)<\/p>\n<p>The bank&#x27;s definition of an unhappy client now applies to every question and every agent, without retraining anyone.<\/p>\n<h4>Sign off the answer<\/h4>\n<p class=\"where\">Semantic Studio &gt; <strong>Playground<\/strong> answer, then <strong>Verified queries<\/strong><\/p>\n<ol>\n<li>Check the second answer&#x27;s SQL and results. Only sign it off if it&#x27;s right.<\/li>\n<li>Under the answer, click <strong>Add to verified query<\/strong>, check the question and SQL, and save it.<\/li>\n<\/ol>\n<ul>\n<li>Or, as in the clip: in <strong>Visual<\/strong>, click <strong>+<\/strong> next to <strong>Verified queries<\/strong>, paste the question, click <strong>Generate SQL<\/strong>, <strong>Run<\/strong> it to check the result, then save with the tick.<\/li>\n<\/ul>\n<p class=\"expect\"><strong>What you should see:<\/strong> the question listed under <strong>Verified queries<\/strong> with a green tick<\/p>\n<p>A signed-off answer is reused whenever anyone asks something similar, so the RM, the ops dashboard and the agent all get the same list of clients.<\/p>\n<h4>Make it live for RMs and agents<\/h4>\n<p class=\"where\">Semantic Studio &gt; top bar &gt; <strong>Deploy<\/strong><\/p>\n<ol>\n<li>Click <strong>Deploy<\/strong> in the top bar.<\/li>\n<li>In <strong>Deploy changes to...<\/strong>, tick the <strong>default<\/strong> target, <code>BANKING_HOL.ANALYTICS<\/code>. If it says <strong>Up to date<\/strong>, you haven&#x27;t saved a change yet.<\/li>\n<li>Click <strong>Deploy<\/strong>.<\/li>\n<\/ol>\n<p class=\"expect\"><strong>What you should see:<\/strong> the deploy succeeds and <strong>Errors (0)<\/strong> shows at the bottom of the editor<\/p>\n<p>From now on, every agent built on <code>SV_CLIENT_360<\/code> (OPS1, AI1) uses the bank&#x27;s rules and the signed-off answer. In production you&#x27;d deploy through Git after review, like any other change.<\/p>\n<h4>See what RMs are asking<\/h4>\n<p class=\"where\">Semantic Studio &gt; <strong>Monitoring<\/strong> tab<\/p>\n<ol>\n<li>Open the <strong>Monitoring<\/strong> tab.<\/li>\n<li>Click one of your Playground questions.<\/li>\n<li>Read the question, the SQL behind the answer and any user feedback.<\/li>\n<\/ol>\n<p class=\"expect\"><strong>What you should see:<\/strong> each question asked, newest first, with the SQL behind it<\/p>\n<ul>\n<li>This is your early warning: the questions the business really asks, and the answers it got.<\/li>\n<li>A wrong answer has a <strong>Request ID<\/strong>: give it to Cortex Code with the right answer and it traces what went wrong.<\/li>\n<\/ul>\n<h4>Find what the definition is missing<\/h4>\n<p class=\"where\">Semantic Studio &gt; <strong>Suggestions<\/strong> tab<\/p>\n<ol>\n<li>Open the <strong>Suggestions<\/strong> tab.<\/li>\n<li>Expand <strong>Metrics<\/strong> and read what it proposes.<\/li>\n<li>Pick the one an RM would use before a client call, and leave the rest.<\/li>\n<\/ol>\n<p class=\"expect\"><strong>What you should see:<\/strong> suggested KPIs, filters and questions based on the definition and how it&#x27;s used<\/p>\n<p><strong>Tip:<\/strong> add synonyms yourself from the words your RMs really use. Auto-generated synonyms often make answers worse.<\/p>\n<h4>Prove it&#x27;s right before anyone relies on it<\/h4>\n<p class=\"where\">Semantic Studio &gt; <strong>Evaluations<\/strong> tab<\/p>\n<ol>\n<li>Open the <strong>Evaluations<\/strong> tab and click <strong>Create evaluation run<\/strong>.<\/li>\n<li>Fill it in as below.<\/li>\n<li>Click <strong>Run evaluation<\/strong>. It runs in the background for a few minutes.<\/li>\n<\/ol>\n<table>\n<tr><td>Setting<\/td><td>Value<\/td><\/tr>\n<tr><td><strong>Name<\/strong><\/td><td><code>da1_baseline<\/code><\/td><\/tr>\n<tr><td>Warehouse<\/td><td>leave as is (<code>BANKING_WH<\/code>)<\/td><\/tr>\n<tr><td><strong>Metric version<\/strong><\/td><td><strong>v3<\/strong> (change it from v1: v1 has been retired, so v1 runs fail)<\/td><\/tr>\n<tr><td><strong>Select verified queries<\/strong><\/td><td><strong>Select all<\/strong><\/td><\/tr>\n<\/table>\n<p class=\"expect\"><strong>What you should see:<\/strong> <code>da1_baseline<\/code> listed under <strong>Evaluations<\/strong>. Open it when it finishes to see the accuracy score and, for each question, the signed-off SQL next to what Analyst wrote on its own<\/p>\n<ul>\n<li>The score is evidence for model risk and the business that AI answers are right, not just plausible.<\/li>\n<li>Re-run it before every change. If a question that used to pass now fails, you catch it before an RM or an agent does.<\/li>\n<\/ul>\n<h3>Check your work<\/h3>\n<p><code>SV_CLIENT_360<\/code> is live with the bank&#x27;s sentiment rule and a signed-off answer, and &quot;Which clients have negative sentiment and a success rate below 96%?&quot; returns the list of at-risk clients.<\/p>\n<h3>In your bank<\/h3>\n<p>RMs, ops, BI tools and every AI agent give the same answer on client health, because the bank wrote the definition once. Every question is monitored and every change is scored before it ships, which is what model risk and audit need to approve AI for client-facing work.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE DA1: BUILD A SEMANTIC VIEW + ASK CORTEX ANALYST   (~60 min)\n-- Persona: Data Analyst\n-- Question: \"Give RMs and ops a single, trusted definition of a corporate\n--            client's payments health that anyone can query in plain English.\"\n-- Prereq:   setup/catchup/core_analytics.sql  (STG_* views, FEEDBACK_ENRICHED)\n-- Builds:   V_CLIENT_PAYMENT_SUMMARY, V_CLIENT_ALERTS, SV_CLIENT_360\n-- Skipped DA1? setup/catchup/client_360.sql builds the same objects.\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ANALYTICS;\n\n-- -----------------------------------------------------\n-- DA1.1 Stable interface views (semantic views should sit on contracts, not raw)\n-- -----------------------------------------------------\nCREATE OR REPLACE VIEW V_CLIENT_PAYMENT_SUMMARY\n    COMMENT = 'One row per corporate client: payment volumes, success and latency'\nAS\nSELECT c.CUSTOMER_ID,\n       COUNT(*)                                                     AS TOTAL_PAYMENTS,\n       COUNT_IF(p.IS_SUCCESSFUL)                                    AS SUCCESSFUL_PAYMENTS,\n       COUNT_IF(p.IS_FAILED)                                        AS FAILED_PAYMENTS,\n       SUM(p.AMOUNT)                                                AS TOTAL_VOLUME_GBP,\n       SUM(IFF(p.IS_FAILED, p.AMOUNT, 0))                           AS FAILED_VOLUME_GBP,\n       ROUND(AVG(p.PROCESSING_TIME_MS), 0)                          AS AVG_PROCESSING_TIME_MS,\n       MAX(p.PAYMENT_DATE)                                          AS LAST_PAYMENT_DATE\nFROM STG_PAYMENTS p\nJOIN STG_ACCOUNTS  a ON p.ORIGINATOR_ACCOUNT_ID = a.ACCOUNT_ID\nJOIN STG_CUSTOMERS c ON a.CUSTOMER_ID = c.CUSTOMER_ID\nGROUP BY c.CUSTOMER_ID;\n\nCREATE OR REPLACE VIEW V_CLIENT_ALERTS\n    COMMENT = 'Operational alerts attributed to the originating corporate client'\nAS\nSELECT al.ALERT_ID, a.CUSTOMER_ID, al.ALERT_TIME::TIMESTAMP AS ALERT_TIME,\n       al.SEVERITY, al.PAYMENT_TYPE, al.STATUS AS ALERT_STATUS,\n       al.ASSIGNED_TO, al.RESOLUTION_TIME_MIN, al.ALERT_DESCRIPTION\nFROM BANKING_HOL.RAW_DATA.OPERATIONAL_ALERTS al\nJOIN BANKING_HOL.RAW_DATA.PAYMENTS p ON al.PAYMENT_ID = p.PAYMENT_ID\nJOIN BANKING_HOL.RAW_DATA.ACCOUNTS a ON p.ORIGINATOR_ACCOUNT_ID = a.ACCOUNT_ID;\n\n-- -----------------------------------------------------\n-- DA1.2 The semantic view: business names, relationships, metrics, synonyms\n-- Tip: you can also build this in Snowsight (AI & ML > Cortex Analyst > Create)\n-- or ask CoCo: \"Create a semantic view over STG_CUSTOMERS, V_CLIENT_PAYMENT_SUMMARY,\n-- FEEDBACK_ENRICHED and V_CLIENT_ALERTS joined on CUSTOMER_ID.\"\n-- -----------------------------------------------------\nCREATE OR REPLACE SEMANTIC VIEW SV_CLIENT_360\n\n  TABLES (\n    clients AS BANKING_HOL.ANALYTICS.STG_CUSTOMERS\n      PRIMARY KEY (CUSTOMER_ID)\n      WITH SYNONYMS = ('customers', 'corporate clients', 'accounts')\n      COMMENT = 'Corporate banking clients with KYC status and assigned relationship manager',\n    payments AS BANKING_HOL.ANALYTICS.V_CLIENT_PAYMENT_SUMMARY\n      PRIMARY KEY (CUSTOMER_ID)\n      COMMENT = 'Payment activity summary per client',\n    feedback AS BANKING_HOL.ANALYTICS.FEEDBACK_ENRICHED\n      PRIMARY KEY (FEEDBACK_ID)\n      WITH SYNONYMS = ('complaints', 'customer feedback', 'sentiment')\n      COMMENT = 'Client feedback with AI sentiment and topic',\n    alerts AS BANKING_HOL.ANALYTICS.V_CLIENT_ALERTS\n      PRIMARY KEY (ALERT_ID)\n      WITH SYNONYMS = ('incidents', 'operational alerts')\n      COMMENT = 'Operational payment alerts per client'\n  )\n\n  RELATIONSHIPS (\n    payments_to_clients AS payments (CUSTOMER_ID) REFERENCES clients,\n    feedback_to_clients AS feedback (CUSTOMER_ID) REFERENCES clients,\n    alerts_to_clients   AS alerts   (CUSTOMER_ID) REFERENCES clients\n  )\n\n  FACTS (\n    payments.total_payments      AS TOTAL_PAYMENTS,\n    payments.successful_payments AS SUCCESSFUL_PAYMENTS,\n    payments.failed_payments     AS FAILED_PAYMENTS,\n    payments.total_volume_gbp    AS TOTAL_VOLUME_GBP,\n    payments.failed_volume_gbp   AS FAILED_VOLUME_GBP,\n    feedback.sentiment_score     AS SENTIMENT_SCORE,\n    feedback.rating              AS RATING,\n    alerts.resolution_time_min   AS RESOLUTION_TIME_MIN\n  )\n\n  DIMENSIONS (\n    clients.customer_name AS CUSTOMER_NAME\n      WITH SYNONYMS = ('client', 'client name', 'company')\n      COMMENT = 'Registered legal entity name (upper case)',\n    clients.sector        AS SECTOR WITH SYNONYMS = ('industry'),\n    clients.country       AS COUNTRY COMMENT = 'ISO alpha-3 country code',\n    clients.kyc_status    AS KYC_STATUS COMMENT = 'APPROVED, PENDING_REVIEW, EXPIRED',\n    clients.rm_name       AS RM_NAME WITH SYNONYMS = ('relationship manager', 'RM', 'banker'),\n    clients.rm_team       AS RM_TEAM COMMENT = 'Corporate, Institutional or SME banking team',\n    feedback.sentiment_label AS SENTIMENT_LABEL COMMENT = 'POSITIVE, NEUTRAL, NEGATIVE',\n    feedback.topic_category  AS TOPIC_CATEGORY,\n    feedback.feedback_payment_type AS PAYMENT_TYPE COMMENT = 'Payment scheme the feedback refers to',\n    feedback.feedback_date   AS FEEDBACK_DATE,\n    alerts.severity       AS SEVERITY COMMENT = 'LOW, MEDIUM, HIGH, CRITICAL',\n    alerts.alert_status   AS ALERT_STATUS COMMENT = 'OPEN, ACKNOWLEDGED, INVESTIGATING, RESOLVED',\n    alerts.alert_time     AS ALERT_TIME\n  )\n\n  METRICS (\n    payments.payment_count     AS SUM(payments.total_payments) WITH SYNONYMS = ('number of payments'),\n    payments.payment_volume    AS SUM(payments.total_volume_gbp) WITH SYNONYMS = ('volume', 'value'),\n    payments.failed_volume     AS SUM(payments.failed_volume_gbp) WITH SYNONYMS = ('value at risk'),\n    payments.success_rate_pct  AS ROUND(SUM(payments.successful_payments) / NULLIF(SUM(payments.total_payments), 0) * 100, 2)\n      COMMENT = 'Weighted payment success rate %',\n    feedback.avg_sentiment     AS ROUND(AVG(feedback.sentiment_score), 3),\n    feedback.negative_feedback_count AS COUNT_IF(feedback.sentiment_label = 'NEGATIVE'),\n    alerts.open_alert_count    AS COUNT_IF(alerts.alert_status <> 'RESOLVED') WITH SYNONYMS = ('open incidents'),\n    alerts.critical_alert_count AS COUNT_IF(alerts.severity = 'CRITICAL'),\n    alerts.avg_resolution_min  AS ROUND(AVG(alerts.resolution_time_min), 0)\n  )\n\n  COMMENT = 'Corporate Client 360 for Payments Operations: payments health, feedback sentiment and operational alerts per client'\n\n  AI_SQL_GENERATION 'Sentiment labels are stored in upper case: POSITIVE, NEUTRAL or NEGATIVE. \"Negative sentiment\" for a client means their average sentiment score is below 0. Client names are stored in upper case; match them case-insensitively with ILIKE. Round percentages to 1 decimal place.'\n\n  AI_VERIFIED_QUERIES (\n    worst_clients AS (\n      QUESTION 'Which 5 clients have the lowest payment success rate?'\n      ONBOARDING_QUESTION TRUE\n      SQL 'SELECT c.CUSTOMER_NAME, ROUND(SUM(p.SUCCESSFUL_PAYMENTS) / NULLIF(SUM(p.TOTAL_PAYMENTS), 0) * 100, 2) AS success_rate_pct\n           FROM BANKING_HOL.ANALYTICS.V_CLIENT_PAYMENT_SUMMARY p\n           JOIN BANKING_HOL.ANALYTICS.STG_CUSTOMERS c ON p.CUSTOMER_ID = c.CUSTOMER_ID\n           GROUP BY c.CUSTOMER_NAME ORDER BY success_rate_pct ASC LIMIT 5'\n    ),\n    rm_open_alerts AS (\n      QUESTION 'How many open alerts does each relationship manager have across their clients?'\n      ONBOARDING_QUESTION TRUE\n      SQL 'SELECT c.RM_NAME, COUNT_IF(a.ALERT_STATUS <> ''RESOLVED'') AS open_alerts\n           FROM BANKING_HOL.ANALYTICS.V_CLIENT_ALERTS a\n           JOIN BANKING_HOL.ANALYTICS.STG_CUSTOMERS c ON a.CUSTOMER_ID = c.CUSTOMER_ID\n           GROUP BY c.RM_NAME ORDER BY open_alerts DESC'\n    ),\n    negative_sentiment_low_success AS (\n      QUESTION 'Which clients have negative sentiment and a success rate below 96%?'\n      SQL 'WITH s AS (SELECT CUSTOMER_ID, AVG(SENTIMENT_SCORE) AS avg_sentiment\n                     FROM BANKING_HOL.ANALYTICS.FEEDBACK_ENRICHED GROUP BY CUSTOMER_ID)\n           SELECT c.CUSTOMER_NAME, ROUND(s.avg_sentiment, 3) AS avg_sentiment,\n                  ROUND(p.SUCCESSFUL_PAYMENTS / NULLIF(p.TOTAL_PAYMENTS, 0) * 100, 1) AS success_rate_pct\n           FROM BANKING_HOL.ANALYTICS.V_CLIENT_PAYMENT_SUMMARY p\n           JOIN BANKING_HOL.ANALYTICS.STG_CUSTOMERS c ON p.CUSTOMER_ID = c.CUSTOMER_ID\n           JOIN s ON s.CUSTOMER_ID = p.CUSTOMER_ID\n           WHERE s.avg_sentiment < 0 AND p.SUCCESSFUL_PAYMENTS / NULLIF(p.TOTAL_PAYMENTS, 0) * 100 < 96\n           ORDER BY success_rate_pct'\n    )\n  );\n\nSHOW SEMANTIC METRICS IN SV_CLIENT_360;\n\n-- -----------------------------------------------------\n-- DA1.3 Query the semantic view with SQL (no joins to remember)\n-- -----------------------------------------------------\nSELECT * FROM SEMANTIC_VIEW(\n    SV_CLIENT_360\n    DIMENSIONS clients.rm_name\n    METRICS payments.payment_volume, payments.success_rate_pct, alerts.open_alert_count\n) ORDER BY open_alert_count DESC;\n\n-- -----------------------------------------------------\n-- DA1.4 Semantic Studio (UI): AI > Analyst > SV_CLIENT_360 > open in banking-hol-pack.\n-- Visual / YAML / Diagram views; Playground, Monitoring, Suggestions, Evaluations tabs.\n-- The AI_SQL_GENERATION rules and the negative_sentiment_low_success verified query above\n-- are what attendees add in the Playground steps, then Deploy.\n-- Evaluation (UI): Evaluations > Create evaluation run > da1_baseline, metric version v3,\n-- select all verified queries. Results also in SQL:\n--   SELECT * FROM TABLE(SNOWFLAKE.LOCAL.GET_ANALYST_AI_EVALUATION_DATA(\n--     'BANKING_HOL', 'ANALYTICS', 'SV_CLIENT_360', 'SEMANTIC VIEW', 'da1_baseline'));\n-- Try:\n--   \"Which clients have negative sentiment and a success rate below 96%?\"\n--   \"Which clients in Manufacturing have open critical alerts?\"\n--   \"Compare success rate and average sentiment for each RM team\"\n-- Check the generated SQL each time - that is the point of a trusted semantic layer.\n-- -----------------------------------------------------\n\nSELECT 'DA1 complete' AS STATUS;\n", "sql_name": "vignettes/da1_semantic_view_analyst/da1.sql"}, {"code": "DA2", "title": "AI SQL on customer feedback", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Analyst<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~45 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td><code>setup/catchup/core_analytics.sql<\/code> (or DE1)<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>What are corporate clients actually complaining about, by scheme and by relationship manager - without reading 2,000 comments?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li><code>FEEDBACK_ENRICHED<\/code> (sentiment + topic)<\/li>\n<li><code>RM_FEEDBACK_THEMES<\/code> (AI_AGG themes and actions per RM)<\/li>\n<li>Notebook <code>da2_feedback_analysis<\/code> with the whole analysis and a sentiment-by-sector chart<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Open the starter notebook and create its service<\/h4>\n<p class=\"where\">the <strong>banking-hol-pack<\/strong> Workspace (not My Workspace) &gt; file explorer &gt; <code>notebooks/da2_feedback_analysis.ipynb<\/code><\/p>\n<ol>\n<li>Open <code>notebooks/<\/code> &gt; <strong>da2_feedback_analysis.ipynb<\/strong> in the file explorer.<\/li>\n<\/ol>\n<ul>\n<li>Can&#x27;t see <code>notebooks/<\/code> and <code>vignettes/<\/code>? You&#x27;re in the wrong Workspace. Pick <strong>banking-hol-pack<\/strong> from the Workspace dropdown (top left).<\/li>\n<\/ul>\n<ol>\n<li>In the notebook toolbar, click the arrow next to the status dot (right of the blue run button).<\/li>\n<li>Choose <strong>Create new service<\/strong>.<\/li>\n<\/ol>\n<ul>\n<li>Already created one in another module? Pick it under <strong>Select service<\/strong> instead, usually <code>USER_SERVICE_1<\/code>.<\/li>\n<\/ul>\n<ol>\n<li>Expand <strong>Service settings<\/strong> in <strong>Connect your notebook<\/strong> and fill it in as below. Only the three <strong>bold<\/strong> rows change.<\/li>\n<\/ol>\n<table>\n<tr><td>Setting<\/td><td>Value<\/td><\/tr>\n<tr><td>Service name<\/td><td>leave the default (e.g. <code>USER_SERVICE_1<\/code>)<\/td><\/tr>\n<tr><td>Artifact repositories<\/td><td>leave as is (<code>SNOWFLAKE.SNOWPARK.PYPI_SHARED_REPOSITORY<\/code>)<\/td><\/tr>\n<tr><td>Enable distributed compute<\/td><td>off<\/td><\/tr>\n<tr><td>Runtime<\/td><td>leave as is (v3.0 \u00b7 Python 3.12)<\/td><\/tr>\n<tr><td>Compute type<\/td><td>CPU<\/td><\/tr>\n<tr><td>Custom image<\/td><td>leave empty<\/td><\/tr>\n<tr><td><strong>Compute pool<\/strong><\/td><td><strong>NOTEBOOK_POOL<\/strong> (change it from HOL_COMPUTE_POOL_CPU)<\/td><\/tr>\n<tr><td><strong>Idle timeout<\/strong><\/td><td><strong>1 hour<\/strong> (change it from 24 hours)<\/td><\/tr>\n<tr><td><strong>External access integrations<\/strong><\/td><td><strong>HOL_NOTEBOOK_ACCESS_INTEGRATION<\/strong> (lets notebooks reach Postgres and the AI Gateway; set it here so one service works for every notebook module)<\/td><\/tr>\n<tr><td>Secrets<\/td><td>leave empty<\/td><\/tr>\n<\/table>\n<p><strong>Trial accounts:<\/strong> there&#x27;s no HOL_NOTEBOOK_ACCESS_INTEGRATION (trials don&#x27;t allow external access). Leave <strong>External access integrations<\/strong> empty: this module works without it.<\/p>\n<ol>\n<li>Click <strong>Create and connect<\/strong>. The first start takes 1-2 minutes.<\/li>\n<li>Check the role is <strong>HOL_PARTICIPANT<\/strong> and the warehouse is <strong>BANKING_WH<\/strong> (role and warehouse button in the notebook toolbar).<\/li>\n<\/ol>\n<p>The starter notebook has one numbered heading per step, so Cortex Code puts each cell in the right place.<\/p>\n<p>A notebook runs on its own <strong>notebook service<\/strong>, which you create once.<\/p>\n<p>SQL cells run on the warehouse. Python and charts run on the service.<\/p>\n<p>You&#x27;ll build this whole module as cells in this notebook: Cortex Code adds them, and you run each one.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> the starter notebook open in banking-hol-pack with its numbered headings, and the status dot showing the service connected<\/p>\n<h4>Score sentiment by aspect<\/h4>\n<p class=\"where\">the Cortex Code sidebar, with <code>da2_feedback_analysis<\/code> open<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>In the open notebook da2_feedback_analysis, put each cell I ask for under its matching numbered heading. Under heading 1, add a SQL cell named aspect_sentiment that uses AI_SENTIMENT to score 5 rows of FEEDBACK_TEXT from BANKING_HOL.ANALYTICS.STG_FEEDBACK overall and for the aspects speed, communication and fees. Run it and explain the output.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the cell&#x27;s result shows an overall sentiment plus a separate one for each aspect (positive, negative, neutral, mixed or unknown)<\/p>\n<h4>Enrich all feedback once<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Add a SQL cell named enrich that creates the table BANKING_HOL.ANALYTICS.FEEDBACK_ENRICHED from STG_FEEDBACK left-joined to STG_CUSTOMERS. Keep the feedback columns plus CUSTOMER_NAME, CUSTOMER_SECTOR and RM_NAME. Add SENTIMENT_SCORE from AI_SENTIMENT&#x27;s overall sentiment (positive = 1, negative = -1, neutral or mixed = 0; don&#x27;t use the legacy SNOWFLAKE.CORTEX.SENTIMENT, which is blocked on new accounts), SENTIMENT_LABEL (POSITIVE above 0.3, NEGATIVE below -0.3, otherwise NEUTRAL) and TOPIC_CATEGORY from AI_CLASSIFY into one of: Performance Issue, Service Quality, Technical Problem, Positive Experience, Feature Request. Then add a SQL cell named by_scheme showing average sentiment and % negative by PAYMENT_TYPE, and run both.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> about 2,000 scored rows, every one with a topic, and a per-scheme summary. Score once, query many times.<\/p>\n<h4>Find churn risk in plain English<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Add a SQL cell named churn_risk that uses AI_FILTER on BANKING_HOL.ANALYTICS.FEEDBACK_ENRICHED with exactly this question: &#x27;Does the client in this feedback explicitly state that they will or may leave the bank, move their business to another bank, review other banking providers, or tender their banking? Complaints without a stated intention to leave do not count. Feedback: {0}&#x27;. Show customer, payment type and the first 120 characters of the feedback, grouped by distinct feedback text with a count. Run it.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a short list - three distinct churn statements (reviewing other providers, moving to another bank, tendering their banking) - found by meaning rather than keywords. Ordinary complaints about delays or outages are left out. That&#x27;s the difference between AI_FILTER and a sentiment score. They all come from Logistics clients, which the next step explains<\/p>\n<h4>Chart sentiment by sector<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Add a SQL cell named sector_trend with one row per complete month and customer sector from BANKING_HOL.ANALYTICS.FEEDBACK_ENRICHED: MONTH, CUSTOMER_SECTOR, AVG_SENTIMENT and FEEDBACK_COUNT, excluding the current partial month. Run it and tell me which sectors are getting worse.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a result table with one row per month and sector<\/p>\n<p>Now chart it with the built-in chart tool, no Python needed: under the <code>sector_trend<\/code> result select <strong>Chart<\/strong>, set <strong>Chart type<\/strong> to <strong>Line chart<\/strong>, <strong>X axis<\/strong> to <strong>MONTH<\/strong> (sort ascending), <strong>Y axis<\/strong> to <strong>AVG_SENTIMENT<\/strong>, and group by <strong>CUSTOMER_SECTOR<\/strong>. Logistics falls clearly over the last four months (the same clients who talk about leaving), while Pharmaceuticals improves; other sectors move around without a trend.<\/p>\n<p><strong>Tip:<\/strong> the result panel also has a <strong>Quick insights<\/strong> button that summarises a result in the UI. Try it on <code>sector_trend<\/code>.<\/p>\n<h4>Summarise complaint themes per RM<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Add a SQL cell named rm_themes that creates the table BANKING_HOL.ANALYTICS.RM_FEEDBACK_THEMES with one row per RM_NAME from the NEGATIVE rows of FEEDBACK_ENRICHED: NEGATIVE_FEEDBACK (count) and TOP_THEMES using AI_AGG with the instruction &quot;You are briefing a corporate banking relationship manager. List the top 3 recurring complaint themes in this client feedback, each with a one-line recommended action. Be concise.&quot; Run it, then add a cell that selects from RM_FEEDBACK_THEMES and shows the results.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the table is created (the first cell only reports success); the second cell shows one row per RM with three themes and actions<\/p>\n<h4>Draft a client reply<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Add a SQL cell named draft_reply that uses AI_COMPLETE to draft a short, professional reply from a UK corporate bank to the most negative item in FEEDBACK_ENRICHED: acknowledge the issue, avoid admitting liability and offer a follow-up call. Run it, then print the draft reply as plain text under the cell so it is easy to read.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a client-ready draft for a human to review. The notebook is now a complete, re-runnable analysis you could share or schedule.<\/p>\n<h3>Check your work<\/h3>\n<p><code>RM_FEEDBACK_THEMES<\/code> has one row per RM with three themes and actions.<\/p>\n<h3>In your bank<\/h3>\n<p>AI functions run inside Snowflake&#x27;s security boundary - no data leaves the platform and nothing is vectorised or stored by the model.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE DA2: AI SQL ON CUSTOMER FEEDBACK   (~45 min)\n-- Persona: Data Analyst\n-- Question: \"What are corporate clients actually complaining about, by\n--            scheme and by relationship manager - without reading 2,000 comments?\"\n-- Prereq:   setup/catchup/core_analytics.sql (for STG_* views), or DE1\n-- All functions run inside Snowflake: no data leaves the platform, no model training.\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ANALYTICS;\n\n-- -----------------------------------------------------\n-- DA2.1 Overall and aspect-based sentiment\n-- AI_SENTIMENT scores the whole text and named aspects separately\n-- -----------------------------------------------------\nSELECT LEFT(FEEDBACK_TEXT, 90) AS FEEDBACK,\n       AI_SENTIMENT(FEEDBACK_TEXT, ['speed', 'communication', 'fees']) AS ASPECT_SENTIMENT\nFROM STG_FEEDBACK\nLIMIT 5;\n\n-- -----------------------------------------------------\n-- DA2.2 Build the enriched feedback table (score once, query many times)\n-- -----------------------------------------------------\nCREATE OR REPLACE TABLE FEEDBACK_ENRICHED AS\nWITH ai_scored AS (\n    SELECT f.*, c.CUSTOMER_NAME, c.SECTOR AS CUSTOMER_SECTOR, c.RM_NAME,\n           -- AI_SENTIMENT returns a label, so map the overall label to -1, 0 or 1\n           -- (legacy SNOWFLAKE.CORTEX.SENTIMENT is blocked on new accounts)\n           DECODE(GET(FILTER(AI_SENTIMENT(f.FEEDBACK_TEXT):categories, c -> c:name::STRING = 'overall'), 0):sentiment::STRING,\n                  'positive', 1, 'negative', -1, 0)::FLOAT AS SENTIMENT_SCORE,\n           AI_CLASSIFY(f.FEEDBACK_TEXT,\n               ['Performance Issue','Service Quality','Technical Problem',\n                'Positive Experience','Feature Request']) AS CLASSIFICATION_RESULT\n    FROM STG_FEEDBACK f\n    LEFT JOIN STG_CUSTOMERS c ON f.CUSTOMER_ID = c.CUSTOMER_ID\n)\nSELECT FEEDBACK_ID, FEEDBACK_DATE, CUSTOMER_ID, CUSTOMER_NAME, CUSTOMER_SECTOR, RM_NAME,\n       PAYMENT_ID, FEEDBACK_CHANNEL, FEEDBACK_TEXT, PAYMENT_TYPE, RATING, SENTIMENT_SCORE,\n       CASE WHEN SENTIMENT_SCORE >  0.3 THEN 'POSITIVE'\n            WHEN SENTIMENT_SCORE < -0.3 THEN 'NEGATIVE'\n            ELSE 'NEUTRAL' END                  AS SENTIMENT_LABEL,\n       CLASSIFICATION_RESULT:labels[0]::STRING  AS TOPIC_CATEGORY\nFROM ai_scored;\n\nSELECT PAYMENT_TYPE, COUNT(*) AS FEEDBACK,\n       ROUND(AVG(SENTIMENT_SCORE), 3) AS AVG_SENTIMENT,\n       ROUND(COUNT_IF(SENTIMENT_LABEL = 'NEGATIVE') / COUNT(*) * 100, 1) AS NEGATIVE_PCT\nFROM FEEDBACK_ENRICHED\nGROUP BY PAYMENT_TYPE ORDER BY AVG_SENTIMENT;\n\n-- -----------------------------------------------------\n-- DA2.3 AI_FILTER: natural-language WHERE clause\n-- -----------------------------------------------------\nSELECT CUSTOMER_NAME, PAYMENT_TYPE, LEFT(FEEDBACK_TEXT, 120) AS FEEDBACK\nFROM FEEDBACK_ENRICHED\nWHERE SENTIMENT_LABEL = 'NEGATIVE'\n  AND AI_FILTER(PROMPT('Does the client in this feedback explicitly state that they will or may leave the bank, move their business to another bank, review other banking providers, or tender their banking? Complaints without a stated intention to leave do not count. Feedback: {0}', FEEDBACK_TEXT))\nLIMIT 10;\n\n-- -----------------------------------------------------\n-- DA2.4 AI_AGG: themes across many rows, per relationship manager\n-- One LLM summary per group - no row limit, no prompt stuffing\n-- -----------------------------------------------------\nCREATE OR REPLACE TABLE RM_FEEDBACK_THEMES AS\nSELECT RM_NAME,\n       COUNT(*) AS NEGATIVE_FEEDBACK,\n       AI_AGG(FEEDBACK_TEXT,\n              'You are briefing a corporate banking relationship manager. List the top 3 recurring complaint themes in this client feedback, each with a one-line recommended action. Be concise.') AS TOP_THEMES\nFROM FEEDBACK_ENRICHED\nWHERE SENTIMENT_LABEL = 'NEGATIVE' AND RM_NAME IS NOT NULL\nGROUP BY RM_NAME;\n\nSELECT RM_NAME, NEGATIVE_FEEDBACK, TOP_THEMES FROM RM_FEEDBACK_THEMES ORDER BY NEGATIVE_FEEDBACK DESC;\n\n-- -----------------------------------------------------\n-- DA2.5 AI_COMPLETE: draft a client-ready response for the worst item\n-- -----------------------------------------------------\nSELECT CUSTOMER_NAME, FEEDBACK_TEXT,\n       AI_COMPLETE('claude-sonnet-4-5',\n         'Draft a short, professional reply from a UK corporate bank to this client feedback. Acknowledge the issue, avoid admitting liability, offer a follow-up call. Feedback: ' || FEEDBACK_TEXT) AS DRAFT_REPLY\nFROM FEEDBACK_ENRICHED\nWHERE SENTIMENT_LABEL = 'NEGATIVE'\nORDER BY SENTIMENT_SCORE\nLIMIT 1;\n\n-- -----------------------------------------------------\n-- DA2.6 Cortex Code prompts\n--  \"Using FEEDBACK_ENRICHED, show me which customer sectors have worsening\n--   sentiment month over month and chart it.\"\n--  \"Use AI_EXTRACT on FEEDBACK_TEXT to pull out any payment reference or amount\n--   mentioned, into a new table FEEDBACK_ENTITIES.\"\n-- -----------------------------------------------------\n\nSELECT 'DA2 complete' AS STATUS;\n", "sql_name": "vignettes/da2_aisql_feedback/da2.sql"}, {"code": "DA3", "title": "Branch network and catchment analysis", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Analyst (Retail Banking)<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~45 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>C1 only. Uses the retail branch network in <code>BANKING_HOL.RETAIL<\/code>, built at provisioning<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Which branches could we consolidate, which nearby branches would absorb their customers, and how much longer would those customers have to travel?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>Notebook <code>da3_branch_network<\/code> with a network map, drive-time catchments and an H3 density map<\/li>\n<li>Table <code>CUSTOMER_NEAREST_BRANCH<\/code> (every customer&#x27;s fastest and second-fastest branch by real drive time)<\/li>\n<li>Table <code>BRANCH_CLOSURE_IMPACT<\/code> (saving, footfall, added drive time, lost walk-in access and disruption risk per branch)<\/li>\n<li>Table <code>BUSINESS_CLOSURE_IMPACT<\/code> (the small businesses, charities and clubs that pay cash in at each branch, and how many a closure would leave more than 20 minutes from a counter)<\/li>\n<li>Streamlit app <code>BRANCH_NETWORK_MAP<\/code> with a real basemap: catchments, customer density and a closure what-if<\/li>\n<li>Semantic view <code>SV_BRANCH_NETWORK<\/code> and agent <code>BRANCH_NETWORK_ADVISOR<\/code> that answers consolidation questions in plain English<\/li>\n<\/ul>\n<h3>Real travel times, not straight lines<\/h3>\n<p>Straight-line distance understates real journeys: rivers, one-way systems and motorways all change how far a branch really is. The retail data includes travel times from <span class=\"ref\">OpenRouteService<\/span> (ORS), an open-source routing engine over OpenStreetMap roads:<\/p>\n<ul>\n<li><code>BRANCH_CELL_TRAVEL<\/code>: drive and walk time and distance from every branch to every H3 cell (about 0.7 km\u00b2) around it, from the ORS <strong>MATRIX<\/strong> function<\/li>\n<li><code>BRANCH_ISOCHRONES<\/code>: the area reachable from each branch within a 10 and 20 minute drive and a 15 minute walk, from the ORS <strong>ISOCHRONES<\/strong> function, stored as <code>GEOGRAPHY<\/code> polygons<\/li>\n<\/ul>\n<p>These were precomputed once so the lab runs in any account.<\/p>\n<p><strong>Compute your own:<\/strong> OpenRouteService runs natively in Snowflake on Snowpark Container Services, so you can calculate travel times, isochrones and route optimisations for your own branches and customers without data leaving Snowflake. It exposes SQL functions such as <code>OPENROUTESERVICE_APP.CORE.MATRIX<\/code>, <code>ISOCHRONES<\/code>, <code>DIRECTIONS<\/code> and <code>OPTIMIZATION<\/code>. Module <span class=\"ref\">DA4<\/span> goes deeper into the matrix and how to build your own, following the quickstart <span class=\"ref\">Build Routing Solution in Snowflake with Snowflake CoCo<\/span>.<\/p>\n<h3>Steps<\/h3>\n<h4>Open the starter notebook and create its service<\/h4>\n<p class=\"where\">the <strong>banking-hol-pack<\/strong> Workspace (not My Workspace) &gt; file explorer &gt; <code>notebooks/da3_branch_network.ipynb<\/code><\/p>\n<ol>\n<li>Open <code>notebooks/<\/code> &gt; <strong>da3_branch_network.ipynb<\/strong> in the file explorer.<\/li>\n<\/ol>\n<ul>\n<li>Can&#x27;t see <code>notebooks/<\/code> and <code>vignettes/<\/code>? You&#x27;re in the wrong Workspace. Pick <strong>banking-hol-pack<\/strong> from the Workspace dropdown (top left).<\/li>\n<\/ul>\n<ol>\n<li>In the notebook toolbar, click the arrow next to the status dot (right of the blue run button).<\/li>\n<li>Choose <strong>Create new service<\/strong>.<\/li>\n<\/ol>\n<ul>\n<li>Already created one in another module? Pick it under <strong>Select service<\/strong> instead, usually <code>USER_SERVICE_1<\/code>.<\/li>\n<\/ul>\n<ol>\n<li>Expand <strong>Service settings<\/strong> in <strong>Connect your notebook<\/strong> and fill it in as below. Only the three <strong>bold<\/strong> rows change.<\/li>\n<\/ol>\n<table>\n<tr><td>Setting<\/td><td>Value<\/td><\/tr>\n<tr><td>Service name<\/td><td>leave the default (e.g. <code>USER_SERVICE_1<\/code>)<\/td><\/tr>\n<tr><td>Artifact repositories<\/td><td>leave as is (<code>SNOWFLAKE.SNOWPARK.PYPI_SHARED_REPOSITORY<\/code>)<\/td><\/tr>\n<tr><td>Enable distributed compute<\/td><td>off<\/td><\/tr>\n<tr><td>Runtime<\/td><td>leave as is (v3.0 \u00b7 Python 3.12)<\/td><\/tr>\n<tr><td>Compute type<\/td><td>CPU<\/td><\/tr>\n<tr><td>Custom image<\/td><td>leave empty<\/td><\/tr>\n<tr><td><strong>Compute pool<\/strong><\/td><td><strong>NOTEBOOK_POOL<\/strong> (change it from HOL_COMPUTE_POOL_CPU)<\/td><\/tr>\n<tr><td><strong>Idle timeout<\/strong><\/td><td><strong>1 hour<\/strong> (change it from 24 hours)<\/td><\/tr>\n<tr><td><strong>External access integrations<\/strong><\/td><td><strong>HOL_NOTEBOOK_ACCESS_INTEGRATION<\/strong> (lets notebooks reach Postgres and the AI Gateway; set it here so one service works for every notebook module)<\/td><\/tr>\n<tr><td>Secrets<\/td><td>leave empty<\/td><\/tr>\n<\/table>\n<p><strong>Trial accounts:<\/strong> there&#x27;s no HOL_NOTEBOOK_ACCESS_INTEGRATION (trials don&#x27;t allow external access). Leave <strong>External access integrations<\/strong> empty: this module works without it.<\/p>\n<ol>\n<li>Click <strong>Create and connect<\/strong>. The first start takes 1-2 minutes.<\/li>\n<li>Check the role is <strong>HOL_PARTICIPANT<\/strong> and the warehouse is <strong>BANKING_WH<\/strong> (role and warehouse button in the notebook toolbar).<\/li>\n<\/ol>\n<p>The starter notebook has one numbered heading per step, so Cortex Code puts each cell in the right place.<\/p>\n<p>A notebook runs on its own <strong>notebook service<\/strong>, which you create once.<\/p>\n<p>You&#x27;ll build the analysis as cells in this notebook: Cortex Code adds them, and you run each one.<\/p>\n<p>The data is a synthetic UK retail network in <code>BANKING_HOL.RETAIL<\/code>:<\/p>\n<ul>\n<li>about 60 branches in 8 cities<\/li>\n<li>ATMs<\/li>\n<li>20,000 retail customers, each with a home location and H3 cell<\/li>\n<li>a year of branch visits<\/li>\n<li>the ORS travel times and catchments described above<\/li>\n<\/ul>\n<p class=\"expect\"><strong>What you should see:<\/strong> the starter notebook open in banking-hol-pack with its numbered headings, and the status dot showing the service connected<\/p>\n<h4>Map the branch network<\/h4>\n<p class=\"where\">the Cortex Code sidebar, with <code>da3_branch_network<\/code> open<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>In the open notebook da3_branch_network, put each cell I ask for under its matching numbered heading. Under heading 1, add a SQL cell named network that returns every branch from BANKING_HOL.RETAIL.BRANCHES (BRANCH_NAME, CITY, FORMAT, LAT, LON) plus the standalone ATMs from BANKING_HOL.RETAIL.ATMS. Then add a Python cell that plots network as an altair map: LON on x, LAT on y, branches coloured by CITY and sized by FORMAT, ATMs as small grey points, with a tooltip showing the name. Run both.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a scatter map of the UK with clusters of branches around eight cities. Hover over a point to see the branch.<\/p>\n<h4>Measure drive-time catchments<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Add a SQL cell named catchments that uses BANKING_HOL.RETAIL.BRANCH_ISOCHRONES (the driving-car rows, 10 and 20 minutes) to count how many customers in BANKING_HOL.RETAIL.RETAIL_CUSTOMERS live inside each branch&#x27;s catchment, with ST_WITHIN(HOME_LOCATION, CATCHMENT) and only customers in the branch&#x27;s own city. Also show each catchment&#x27;s area in km2 with ST_AREA. Then add a Python cell that draws the 10 minute drive catchments for Leeds as altair polygons (convert CATCHMENT with ST_ASGEOJSON) with the Leeds branches on top. Run both and explain what an isochrone is.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a table of customers within 10 and 20 minutes of each branch, and a Leeds map where the city-centre catchments almost completely overlap. An isochrone follows the road network, so catchments are irregular shapes, not circles.<\/p>\n<h4>Find each customer&#x27;s fastest branch<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Add a SQL cell named nearest that creates the table BANKING_HOL.ANALYTICS.CUSTOMER_NEAREST_BRANCH: for every customer in BANKING_HOL.RETAIL.RETAIL_CUSTOMERS, the fastest and second-fastest branch in the same city by drive time, joining BANKING_HOL.RETAIL.BRANCH_CELL_TRAVEL on the customer&#x27;s HOME_H3_CELL with PROFILE &#x27;driving-car&#x27;. Columns: CUSTOMER_ID, CITY, AGE_BAND, SEGMENT, DIGITAL_ACTIVE, NEAREST_BRANCH_ID, NEAREST_DRIVE_MIN, NEAREST_DRIVE_KM, SECOND_BRANCH_ID, SECOND_DRIVE_MIN, and NEAREST_WALK_MIN (the shortest &#x27;foot-walking&#x27; time to any branch). Run it and show the median drive and walk minutes per city.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> all 20,000 customers, each with two branches. The median drive to a branch is about 7 minutes; walking times are much longer and vary more by city.<\/p>\n<h4>Find overlapping branches<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Add a SQL cell named overlaps that finds pairs of branches in the same city whose 10 minute drive catchments in BANKING_HOL.RETAIL.BRANCH_ISOCHRONES overlap by 80% or more (area of ST_INTERSECTION divided by the smaller catchment), with the straight-line distance between them in km. Run it and explain why these pairs are consolidation candidates.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the Manchester, Glasgow and Leeds city-centre pairs at the top. Their customers can reach either branch in the same drive time.<\/p>\n<h4>Map customer density with H3<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Add a SQL cell named density that counts BANKING_HOL.RETAIL.RETAIL_CUSTOMERS per HOME_H3_CELL (H3 resolution 8), returning each cell&#x27;s centre LAT and LON from H3_CELL_TO_POINT, CITY and customer count. Then add a Python cell with an altair map of the cells for Cardiff, coloured by customer count, with the Cardiff branches from network layered on top. Run both.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a heat map of Cardiff with customers clustered around the city, and a separate pocket to the south-west around <strong>Barry<\/strong>, served by one branch. That&#x27;s the branch that would be hardest to close.<\/p>\n<h4>Model the closure impact<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Add a SQL cell named closure_impact that creates the table BANKING_HOL.ANALYTICS.BRANCH_CLOSURE_IMPACT from CUSTOMER_NEAREST_BRANCH, BANKING_HOL.RETAIL.BRANCHES, BANKING_HOL.RETAIL.BRANCH_VISITS and BANKING_HOL.RETAIL.BRANCH_CELL_TRAVEL. One row per branch: assume it closes and its customers move to their second-fastest branch. Columns: BRANCH_ID, BRANCH_NAME, CITY, FORMAT, ANNUAL_SAVING_GBP (the branch&#x27;s ANNUAL_COST_GBP), VISITS_12M, COST_PER_VISIT_GBP, CUSTOMERS_AFFECTED, AVG_ADDED_DRIVE_MIN and P90_ADDED_DRIVE_MIN (SECOND_DRIVE_MIN minus NEAREST_DRIVE_MIN), LOSE_WALK_IN_ACCESS (customers within a 15 minute walk of the closing branch but not of the receiving branch, using the &#x27;foot-walking&#x27; rows), VULNERABLE_CUSTOMERS (not digitally active or aged 75+), MAIN_RECEIVING_BRANCH (the most common second-fastest branch) and DISRUPTION_RISK (HIGH if P90_ADDED_DRIVE_MIN is 10 or more or VULNERABLE_CUSTOMERS is 200 or more, MEDIUM if P90_ADDED_DRIVE_MIN is 4 or more or LOSE_WALK_IN_ACCESS is 100 or more, otherwise LOW). Run it and list the 5 best candidates: LOW risk, highest cost per visit.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> Leeds Boar Lane and Manchester King Street at the top: high cost, low footfall, and only a minute or two of extra driving. Barry is HIGH risk: a much longer drive for hundreds of vulnerable customers.<\/p>\n<h4>Count the businesses who pay in at each branch<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Add a SQL cell named business_impact that creates the table BANKING_HOL.ANALYTICS.BUSINESS_CLOSURE_IMPACT from BANKING_HOL.RETAIL.BUSINESS_CUSTOMERS (small businesses, charities and clubs, each with a HOME_BRANCH_ID, HOME_H3_CELL and TREASURER_DIGITAL), BANKING_HOL.RETAIL.BUSINESS_CASH_DEPOSITS (CASH_GBP and CHEQUES_GBP paid in at the counter) and the &#x27;driving-car&#x27; rows of BANKING_HOL.RETAIL.BRANCH_CELL_TRAVEL. One row per home branch: BRANCH_ID, BRANCH_NAME, CITY, BUSINESSES, SMALL_BUSINESSES, CHARITIES, CLUBS, TREASURER_NOT_DIGITAL, CASH_PAID_IN_12M_GBP, AVG_ADDED_DRIVE_MIN (drive to the fastest other branch minus drive to the home branch) and BUSINESSES_OVER_20_MIN (within 20 minutes of their home branch today, over 20 if it closed). Run it and list the 5 branches with the most businesses newly over 20 minutes.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> <strong>Barry<\/strong> far ahead: over 200 businesses, most of them charities and clubs, paying in millions of pounds of cash a year, many with a treasurer who doesn&#x27;t bank online. Leeds Boar Lane barely appears. The UK&#x27;s largest high-street banks are designated under the FCA&#x27;s access to cash rules (PS24/8), which require an assessment of cash deposit needs for business accounts as well as personal ones before a closure.<\/p>\n<h4>Build the semantic view<\/h4>\n<p class=\"where\">the Cortex Code sidebar<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a semantic view BANKING_HOL.ANALYTICS.SV_BRANCH_NETWORK over BANKING_HOL.ANALYTICS.BRANCH_CLOSURE_IMPACT (logical table closures, primary key BRANCH_ID) and BANKING_HOL.ANALYTICS.CUSTOMER_NEAREST_BRANCH (logical table customers, primary key CUSTOMER_ID, related to closures on NEAREST_BRANCH_ID). Facts for saving, visits, cost per visit, added drive minutes, lost walk-in access and vulnerable customers; dimensions for branch name, city, format, disruption risk, receiving branch, age band, segment and digital active; metrics total_saving_gbp, branch_count, customer_count and avg_drive_min. Describe the travel times as OpenRouteService drive minutes. Add a verified query for &quot;Which branches could close with the least added travel time?&quot;. Then query it with SEMANTIC_VIEW for total saving and branch count by city and disruption risk.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the semantic view created, and a table of savings by city and risk tier<\/p>\n<h4>Build the branch network map app<\/h4>\n<p><strong>Trial accounts:<\/strong> this app installs its packages from PyPI, which needs external access, and trials don&#x27;t allow it. Skip this step there; the rest of DA3 works.<\/p>\n<p class=\"where\">banking-hol-pack Workspace &gt; <strong>+ &gt; Streamlit App<\/strong>, then the Cortex Code sidebar<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Build a Streamlit in Snowflake app BANKING_HOL.ANALYTICS.BRANCH_NETWORK_MAP titled &quot;Branch network map&quot; on the container runtime (RUNTIME_NAME SYSTEM$ST_CONTAINER_RUNTIME_PY3_11, compute pool HOL_COMPUTE_POOL_CPU, query warehouse BANKING_WH, external access integration PYPI_ACCESS_INTEGRATION). Use st.connection(&quot;snowflake&quot;).session(). Include a pyproject.toml next to the app file with requires-python &quot;&gt;=3.11&quot; and dependencies &quot;streamlit&gt;=1.50&quot;, &quot;snowflake-snowpark-python&quot; and &quot;pydeck&quot;, because the container runtime installs them from PyPI. Sidebar: a city picker (default Leeds) from BANKING_HOL.RETAIL.BRANCHES (columns BRANCH_ID, BRANCH_NAME, CITY, FORMAT, LAT, LON), a catchment picker mapping &quot;10 min drive&quot;, &quot;20 min drive&quot; and &quot;15 min walk&quot; to BRANCH_ISOCHRONES PROFILE/MINUTES values driving-car/10, driving-car/20 and foot-walking/15, and a customer density toggle. Draw one st.pydeck_chart with map_style &quot;light&quot; (a Carto basemap), centred on the mean LAT/LON of the city&#x27;s branches at zoom 10.5, with three layers: a semi-transparent blue PolygonLayer of the city&#x27;s BANKING_HOL.RETAIL.BRANCH_ISOCHRONES catchments (select ST_ASGEOJSON(CATCHMENT)::STRING, parse it with json, and take the outer ring of a Polygon or the first polygon of a MultiPolygon), an orange H3HexagonLayer of BANKING_HOL.RETAIL.RETAIL_CUSTOMERS counted by HOME_H3_CELL for the city with opacity scaled by count, and a dark blue ScatterplotLayer of branches (radius 180 m) on top. pydeck uses one tooltip template for all layers, so add a TIP text column to each layer&#x27;s dataframe (&quot;&lt;BRANCH_NAME&gt; (&lt;FORMAT&gt;)&quot; for branches, &quot;&lt;BRANCH_NAME&gt;: &lt;catchment&gt; catchment&quot; for polygons, &quot;&lt;n&gt; customers&quot; for hexagons) and set tooltip={&quot;text&quot;: &quot;{TIP}&quot;}. Below the map, show &quot;What if a branch closes?&quot; as a table from BANKING_HOL.ANALYTICS.BRANCH_CLOSURE_IMPACT for the city with BRANCH_NAME, ANNUAL_SAVING_GBP, COST_PER_VISIT_GBP, AVG_ADDED_DRIVE_MIN, P90_ADDED_DRIVE_MIN, LOSE_WALK_IN_ACCESS, VULNERABLE_CUSTOMERS, DISRUPTION_RISK and MAIN_RECEIVING_BRANCH, LOW risk first. Cache queries with st.cache_data.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a map of Leeds with streets underneath, overlapping blue catchments around Boar Lane and the city centre, orange customer hexagons and the closure table below. The first start takes a minute or two while the container starts. A reference version is in <code>da3_branch_map.py<\/code> and <code>pyproject.toml<\/code>. If the app reports a missing pyproject.toml, Streamlit version or snowflake module, ask Cortex Code to add that file with those dependencies and attach PYPI_ACCESS_INTEGRATION.<\/p>\n<p>Notebook charts have no basemap, so this Streamlit app draws the network on a real map.<\/p>\n<h4>Ask Cortex Analyst<\/h4>\n<p class=\"where\">Snowsight &gt; <strong>AI &amp; ML &gt; Cortex Analyst<\/strong> &gt; <code>SV_BRANCH_NETWORK<\/code><\/p>\n<p>Ask these in plain English, one at a time:<\/p>\n<ol>\n<li>&quot;Which 3 branches in Manchester could close with the least added travel time?&quot;<\/li>\n<li>&quot;How much could we save by closing all LOW risk branches with fewer than 500 visits?&quot;<\/li>\n<li>&quot;Which branch closure would cost the most customers their walk-in access?&quot;<\/li>\n<\/ol>\n<p class=\"expect\"><strong>What you should see:<\/strong> SQL generated over the semantic view, and answers that match your notebook<\/p>\n<h4>Create the branch network advisor agent<\/h4>\n<p class=\"where\">banking-hol-pack Workspace &gt; <strong>+ &gt; Agent<\/strong> &gt; <strong>Create with CoCo<\/strong> (recommended)<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a Cortex Agent BANKING_HOL.ANALYTICS.BRANCH_NETWORK_ADVISOR with display name &quot;Branch Network Advisor&quot; that advises a UK retail bank on its branch network. Tool: a Cortex Analyst tool Analyst on semantic view BANKING_HOL.ANALYTICS.SV_BRANCH_NETWORK, on warehouse BANKING_WH. Response instructions: for a consolidation question, return a ranked list of candidate branches with annual saving and cost per visit, the branch that absorbs their customers and the added drive time (average and p90 minutes), customers who lose walk-in access, the disruption risk and vulnerable customers affected, and a short 90-day transition plan. Never recommend closing a HIGH disruption-risk branch without saying why and what mitigation is needed. Sample questions: &quot;What is the consolidation opportunity in Leeds?&quot;, &quot;Which 3 branches could close with the least added travel time?&quot;, &quot;Which branch would be hardest to close, and why?&quot;<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> Cortex Code drafts the agent, you review it, and it&#x27;s created. It appears in Snowsight under <strong>AI &amp; ML &gt; Agents<\/strong>.<\/p>\n<h4>Ask for a consolidation plan<\/h4>\n<p class=\"where\">Snowsight &gt; <strong>AI &amp; ML &gt; Agents &gt; BRANCH_NETWORK_ADVISOR<\/strong><\/p>\n<p class=\"where\">Paste into: the <strong>BRANCH_NETWORK_ADVISOR<\/strong> agent chat (not the Cortex Code sidebar)<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>What is the consolidation opportunity in Leeds? Give me the candidates, the saving, which branch absorbs the customers, the extra drive time, the risk, and a 90-day transition plan.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> Leeds Boar Lane recommended, with about GBP 690,000 a year saved, customers moving to Leeds City Centre for a minute or two of extra driving, LOW risk and a phased 90-day plan. Then ask &quot;Should we close Barry?&quot; and see it explain the HIGH risk. Compare the answers with your map app.<\/p>\n<h3>Check your work<\/h3>\n<p><code>CUSTOMER_NEAREST_BRANCH<\/code> covers all 20,000 customers with drive times, <code>BRANCH_CLOSURE_IMPACT<\/code> ranks Leeds Boar Lane and Manchester King Street as the best LOW-risk candidates, and <code>BRANCH_NETWORK_ADVISOR<\/code> answers consolidation questions over <code>SV_BRANCH_NETWORK<\/code>.<\/p>\n<h3>In your bank<\/h3>\n<p>The same pattern works on real data: geocode branch addresses to <code>GEOGRAPHY<\/code>, use customer postcode centroids, and run OpenRouteService on Snowpark Container Services for live travel times and catchments. Spatial joins, H3, routing and the agent all run in Snowflake, so customer locations never leave the governed platform.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE DA3: BRANCH NETWORK AND CATCHMENT ANALYSIS   (~45 min)\n-- Persona:  Data Analyst (Retail Banking)\n-- Question: \"Which branches could we consolidate, who absorbs their\n--            customers, and how much longer would those customers travel?\"\n-- Prereq:   C1 only. Uses BANKING_HOL.RETAIL (setup/07_retail_geo_seed.sql),\n--           including real road-network travel times and catchments that were\n--           precomputed with OpenRouteService on Snowpark Container Services.\n-- In the lab you build this in a Workspace Notebook (da3_branch_network)\n-- with Cortex Code; this file is the reference SQL for each cell.\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ANALYTICS;\n\n-- -----------------------------------------------------\n-- DA3.1 Map the network (notebook: SQL cell + altair map of LON/LAT)\n-- -----------------------------------------------------\nSELECT 'BRANCH' AS KIND, BRANCH_NAME AS NAME, CITY, LAT, LON FROM BANKING_HOL.RETAIL.BRANCHES\nUNION ALL\nSELECT 'ATM', ATM_ID, NULL, LAT, LON FROM BANKING_HOL.RETAIL.ATMS WHERE SITE_TYPE = 'STANDALONE';\n\n-- -----------------------------------------------------\n-- DA3.2 Drive-time catchments: who lives within a 10 and 20 minute drive\n-- of each branch (ORS isochrones + ST_WITHIN)\n-- -----------------------------------------------------\nSELECT b.BRANCH_NAME, b.CITY, i.MINUTES,\n       ROUND(ANY_VALUE(ST_AREA(i.CATCHMENT)) / 1e6, 1) AS CATCHMENT_KM2,\n       COUNT(c.CUSTOMER_ID) AS CUSTOMERS_IN_CATCHMENT\nFROM BANKING_HOL.RETAIL.BRANCH_ISOCHRONES i\nJOIN BANKING_HOL.RETAIL.BRANCHES b USING (BRANCH_ID)\nLEFT JOIN BANKING_HOL.RETAIL.RETAIL_CUSTOMERS c\n  ON c.CITY = b.CITY AND ST_WITHIN(c.HOME_LOCATION, i.CATCHMENT)\nWHERE i.PROFILE = 'driving-car'\nGROUP BY 1, 2, 3\nORDER BY b.CITY, b.BRANCH_NAME, i.MINUTES;\n\n-- -----------------------------------------------------\n-- DA3.3 Nearest branch by real drive time: each customer's fastest and\n-- second-fastest branch from the ORS matrix (by the customer's H3 cell)\n-- -----------------------------------------------------\nCREATE OR REPLACE TABLE CUSTOMER_NEAREST_BRANCH AS\nWITH ranked AS (\n    SELECT c.CUSTOMER_ID, t.BRANCH_ID, t.DURATION_S / 60 AS DRIVE_MIN, t.DISTANCE_M / 1000 AS DRIVE_KM,\n           ROW_NUMBER() OVER (PARTITION BY c.CUSTOMER_ID ORDER BY t.DURATION_S) AS RN\n    FROM BANKING_HOL.RETAIL.RETAIL_CUSTOMERS c\n    JOIN BANKING_HOL.RETAIL.BRANCH_CELL_TRAVEL t\n      ON t.H3_CELL = c.HOME_H3_CELL AND t.PROFILE = 'driving-car'\n    JOIN BANKING_HOL.RETAIL.BRANCHES b ON b.BRANCH_ID = t.BRANCH_ID AND b.CITY = c.CITY\n    QUALIFY RN <= 2\n),\nwalk AS (\n    SELECT c.CUSTOMER_ID, MIN(t.DURATION_S) / 60 AS NEAREST_WALK_MIN\n    FROM BANKING_HOL.RETAIL.RETAIL_CUSTOMERS c\n    JOIN BANKING_HOL.RETAIL.BRANCH_CELL_TRAVEL t ON t.H3_CELL = c.HOME_H3_CELL AND t.PROFILE = 'foot-walking'\n    GROUP BY 1\n)\nSELECT c.CUSTOMER_ID, c.CITY, c.AGE_BAND, c.SEGMENT, c.DIGITAL_ACTIVE,\n       MAX(IFF(r.RN = 1, r.BRANCH_ID, NULL))          AS NEAREST_BRANCH_ID,\n       ROUND(MAX(IFF(r.RN = 1, r.DRIVE_MIN, NULL)), 1) AS NEAREST_DRIVE_MIN,\n       ROUND(MAX(IFF(r.RN = 1, r.DRIVE_KM, NULL)), 2)  AS NEAREST_DRIVE_KM,\n       MAX(IFF(r.RN = 2, r.BRANCH_ID, NULL))          AS SECOND_BRANCH_ID,\n       ROUND(MAX(IFF(r.RN = 2, r.DRIVE_MIN, NULL)), 1) AS SECOND_DRIVE_MIN,\n       ROUND(ANY_VALUE(w.NEAREST_WALK_MIN), 1)        AS NEAREST_WALK_MIN\nFROM BANKING_HOL.RETAIL.RETAIL_CUSTOMERS c\nJOIN ranked r USING (CUSTOMER_ID)\nLEFT JOIN walk w USING (CUSTOMER_ID)\nGROUP BY c.CUSTOMER_ID, c.CITY, c.AGE_BAND, c.SEGMENT, c.DIGITAL_ACTIVE;\n\n-- -----------------------------------------------------\n-- DA3.4 Overlapping catchments: branch pairs whose 10 minute drive\n-- catchments overlap most (ST_INTERSECTION of the isochrones)\n-- -----------------------------------------------------\nSELECT * FROM (\nSELECT a.CITY, a.BRANC
