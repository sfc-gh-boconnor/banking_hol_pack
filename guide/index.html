t_clients AS (\n      QUESTION 'Which 5 clients have the lowest payment success rate?'\n      ONBOARDING_QUESTION TRUE\n      SQL 'SELECT c.CUSTOMER_NAME, ROUND(SUM(p.SUCCESSFUL_PAYMENTS) / NULLIF(SUM(p.TOTAL_PAYMENTS), 0) * 100, 2) AS success_rate_pct\n           FROM BANKING_HOL.ANALYTICS.V_CLIENT_PAYMENT_SUMMARY p\n           JOIN BANKING_HOL.ANALYTICS.STG_CUSTOMERS c ON p.CUSTOMER_ID = c.CUSTOMER_ID\n           GROUP BY c.CUSTOMER_NAME ORDER BY success_rate_pct ASC LIMIT 5'\n    ),\n    rm_open_alerts AS (\n      QUESTION 'How many open alerts does each relationship manager have across their clients?'\n      ONBOARDING_QUESTION TRUE\n      SQL 'SELECT c.RM_NAME, COUNT_IF(a.ALERT_STATUS <> ''RESOLVED'') AS open_alerts\n           FROM BANKING_HOL.ANALYTICS.V_CLIENT_ALERTS a\n           JOIN BANKING_HOL.ANALYTICS.STG_CUSTOMERS c ON a.CUSTOMER_ID = c.CUSTOMER_ID\n           GROUP BY c.RM_NAME ORDER BY open_alerts DESC'\n    ),\n    negative_sentiment_low_success AS (\n      QUESTION 'Which clients have negative sentiment and a success rate below 96%?'\n      SQL 'WITH s AS (SELECT CUSTOMER_ID, AVG(SENTIMENT_SCORE) AS avg_sentiment\n                     FROM BANKING_HOL.ANALYTICS.FEEDBACK_ENRICHED GROUP BY CUSTOMER_ID)\n           SELECT c.CUSTOMER_NAME, ROUND(s.avg_sentiment, 3) AS avg_sentiment,\n                  ROUND(p.SUCCESSFUL_PAYMENTS / NULLIF(p.TOTAL_PAYMENTS, 0) * 100, 1) AS success_rate_pct\n           FROM BANKING_HOL.ANALYTICS.V_CLIENT_PAYMENT_SUMMARY p\n           JOIN BANKING_HOL.ANALYTICS.STG_CUSTOMERS c ON p.CUSTOMER_ID = c.CUSTOMER_ID\n           JOIN s ON s.CUSTOMER_ID = p.CUSTOMER_ID\n           WHERE s.avg_sentiment < 0 AND p.SUCCESSFUL_PAYMENTS / NULLIF(p.TOTAL_PAYMENTS, 0) * 100 < 96\n           ORDER BY success_rate_pct'\n    )\n  );\n\nSELECT 'Client 360 catch-up complete' AS STATUS,\n       (SELECT COUNT(*) FROM V_CLIENT_PAYMENT_SUMMARY) AS CLIENTS,\n       (SELECT COUNT(*) FROM FEEDBACK_ENRICHED)        AS FEEDBACK_ROWS;\n", "sql_name": "setup/catchup/client_360.sql"}, {"code": "core_analytics", "title": "Catch-up: core analytics", "body": "<p>Run this if a vignette lists it as a prerequisite and you have not built it yet.<\/p>", "sql": "-- =====================================================\n-- BANKING HOL PACK - CATCH-UP SCRIPT\n-- CORE ANALYTICS LAYER (pure SQL equivalent of the dbt project + AI enrichment)\n--\n-- Run this if your chosen vignette needs the analytics layer and you have\n-- not completed DE1 (dbt) / DA2 (AI enrichment). Safe to re-run.\n-- Objects match dbt/models exactly so later vignettes behave the same.\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ANALYTICS;\n\n-- ---------- Staging views ----------\nCREATE OR REPLACE VIEW STG_PAYMENTS AS\nSELECT\n    PAYMENT_ID,\n    PAYMENT_DATE::TIMESTAMP                             AS PAYMENT_DATE,\n    DATE_TRUNC('DAY', PAYMENT_DATE::TIMESTAMP)          AS PAYMENT_DAY,\n    ORIGINATOR_ACCOUNT_ID,\n    BENEFICIARY_ACCOUNT_ID,\n    UPPER(TRIM(PAYMENT_TYPE))                           AS PAYMENT_TYPE,\n    UPPER(TRIM(CHANNEL))                                AS CHANNEL,\n    UPPER(TRIM(CURRENCY))                               AS CURRENCY,\n    AMOUNT::NUMBER(15,2)                                AS AMOUNT,\n    FX_RATE,\n    UPPER(TRIM(STATUS))                                 AS STATUS,\n    PROCESSING_TIME_MS::NUMBER                          AS PROCESSING_TIME_MS,\n    ERROR_CODE,\n    UPPER(TRIM(REGION))                                 AS REGION,\n    SETTLEMENT_DATE,\n    CASE WHEN STATUS = 'COMPLETED' THEN TRUE ELSE FALSE END  AS IS_SUCCESSFUL,\n    CASE WHEN STATUS = 'FAILED'    THEN TRUE ELSE FALSE END  AS IS_FAILED,\n    CASE WHEN ERROR_CODE IS NOT NULL THEN TRUE ELSE FALSE END AS HAS_ERROR\nFROM BANKING_HOL.RAW_DATA.PAYMENTS;\n\nCREATE OR REPLACE VIEW STG_FEEDBACK AS\nSELECT\n    FEEDBACK_ID,\n    FEEDBACK_DATE::TIMESTAMP            AS FEEDBACK_DATE,\n    DATE_TRUNC('DAY', FEEDBACK_DATE)    AS FEEDBACK_DAY,\n    CUSTOMER_ID,\n    PAYMENT_ID,\n    UPPER(TRIM(FEEDBACK_CHANNEL))       AS FEEDBACK_CHANNEL,\n    TRIM(FEEDBACK_TEXT)                 AS FEEDBACK_TEXT,\n    UPPER(TRIM(PAYMENT_TYPE))           AS PAYMENT_TYPE,\n    RATING::NUMBER(1)                   AS RATING,\n    LENGTH(TRIM(FEEDBACK_TEXT))         AS FEEDBACK_LENGTH,\n    CASE WHEN RATING >= 4 THEN 'SATISFIED'\n         WHEN RATING = 3  THEN 'NEUTRAL'\n         ELSE 'DISSATISFIED' END        AS SATISFACTION_TIER\nFROM BANKING_HOL.RAW_DATA.CUSTOMER_FEEDBACK\nWHERE FEEDBACK_TEXT IS NOT NULL AND LENGTH(TRIM(FEEDBACK_TEXT)) > 0;\n\nCREATE OR REPLACE VIEW STG_CUSTOMERS AS\nSELECT\n    c.CUSTOMER_ID,\n    UPPER(TRIM(c.CUSTOMER_NAME))        AS CUSTOMER_NAME,\n    UPPER(TRIM(c.SECTOR))               AS SECTOR,\n    c.COUNTRY,\n    c.ONBOARDING_DATE,\n    UPPER(TRIM(c.KYC_STATUS))           AS KYC_STATUS,\n    c.RM_ID,\n    r.RM_NAME,\n    r.TEAM                              AS RM_TEAM,\n    r.REGION                            AS RM_REGION\nFROM BANKING_HOL.RAW_DATA.CUSTOMERS c\nLEFT JOIN BANKING_HOL.RAW_DATA.RELATIONSHIP_MANAGERS r ON c.RM_ID = r.RM_ID;\n\nCREATE OR REPLACE VIEW STG_ACCOUNTS AS\nSELECT\n    a.ACCOUNT_ID, a.CUSTOMER_ID, a.SORT_CODE, a.ACCOUNT_NUMBER, a.IBAN, a.BIC,\n    UPPER(TRIM(a.CURRENCY))             AS CURRENCY,\n    UPPER(TRIM(a.ACCOUNT_TYPE))         AS ACCOUNT_TYPE,\n    UPPER(TRIM(a.STATUS))               AS STATUS,\n    a.OPENED_DATE,\n    c.CUSTOMER_NAME,\n    c.SECTOR                            AS CUSTOMER_SECTOR\nFROM BANKING_HOL.RAW_DATA.ACCOUNTS a\nLEFT JOIN BANKING_HOL.RAW_DATA.CUSTOMERS c ON a.CUSTOMER_ID = c.CUSTOMER_ID;\n\n-- ---------- Marts ----------\nCREATE OR REPLACE TABLE MART_PAYMENT_KPIS AS\nSELECT\n    p.PAYMENT_DAY, p.PAYMENT_TYPE, p.REGION, p.CHANNEL,\n    c.SECTOR AS CUSTOMER_SECTOR, c.RM_NAME, c.RM_TEAM,\n    COUNT(*)                                                   AS TOTAL_PAYMENTS,\n    SUM(p.AMOUNT)                                              AS TOTAL_VOLUME_GBP,\n    ROUND(AVG(p.AMOUNT), 2)                                    AS AVG_PAYMENT_AMOUNT,\n    COUNT(CASE WHEN p.IS_SUCCESSFUL THEN 1 END)                AS SUCCESSFUL_PAYMENTS,\n    COUNT(CASE WHEN p.IS_FAILED     THEN 1 END)                AS FAILED_PAYMENTS,\n    ROUND(COUNT(CASE WHEN p.IS_SUCCESSFUL THEN 1 END)::FLOAT / NULLIF(COUNT(*), 0) * 100, 2) AS SUCCESS_RATE_PCT,\n    ROUND(AVG(p.PROCESSING_TIME_MS), 0)                        AS AVG_PROCESSING_TIME_MS,\n    ROUND(PERCENTILE_CONT(0.95) WITHIN GROUP (ORDER BY p.PROCESSING_TIME_MS), 0) AS P95_PROCESSING_TIME_MS\nFROM STG_PAYMENTS p\nLEFT JOIN STG_ACCOUNTS  a ON p.ORIGINATOR_ACCOUNT_ID = a.ACCOUNT_ID\nLEFT JOIN STG_CUSTOMERS c ON a.CUSTOMER_ID = c.CUSTOMER_ID\nGROUP BY p.PAYMENT_DAY, p.PAYMENT_TYPE, p.REGION, p.CHANNEL, c.SECTOR, c.RM_NAME, c.RM_TEAM;\n\nCREATE OR REPLACE TABLE MART_SLA_COMPLIANCE AS\nWITH daily_scheme AS (\n    SELECT PAYMENT_DAY, PAYMENT_TYPE,\n           SUM(TOTAL_PAYMENTS) AS TOTAL_PAYMENTS,\n           SUM(SUCCESSFUL_PAYMENTS) AS SUCCESSFUL_PAYMENTS,\n           SUM(FAILED_PAYMENTS) AS FAILED_PAYMENTS,\n           ROUND(SUM(SUCCESSFUL_PAYMENTS)::FLOAT / NULLIF(SUM(TOTAL_PAYMENTS), 0) * 100, 2) AS SUCCESS_RATE_PCT,\n           MAX(P95_PROCESSING_TIME_MS) AS P95_PROCESSING_TIME_MS\n    FROM MART_PAYMENT_KPIS\n    GROUP BY PAYMENT_DAY, PAYMENT_TYPE\n)\nSELECT\n    d.PAYMENT_DAY, d.PAYMENT_TYPE, s.SLA_NAME,\n    s.TARGET_SUCCESS_RATE    AS SLA_TARGET_PCT,\n    s.MAX_PROCESSING_TIME_MS AS SLA_THRESHOLD_MS,\n    d.SUCCESS_RATE_PCT       AS ACTUAL_SUCCESS_RATE,\n    d.P95_PROCESSING_TIME_MS AS ACTUAL_P95_MS,\n    d.TOTAL_PAYMENTS, d.FAILED_PAYMENTS,\n    CASE WHEN d.SUCCESS_RATE_PCT >= s.TARGET_SUCCESS_RATE\n           AND d.P95_PROCESSING_TIME_MS <= s.MAX_PROCESSING_TIME_MS THEN 'COMPLIANT'\n         WHEN d.SUCCESS_RATE_PCT >= s.TARGET_SUCCESS_RATE * 0.95 THEN 'AT RISK'\n         ELSE 'BREACH' END   AS SLA_STATUS,\n    ROUND(d.SUCCESS_RATE_PCT - s.TARGET_SUCCESS_RATE, 2) AS RATE_GAP_PCT,\n    d.P95_PROCESSING_TIME_MS - s.MAX_PROCESSING_TIME_MS  AS TIME_GAP_MS\nFROM daily_scheme d\nJOIN BANKING_HOL.RAW_DATA.SLA_DEFINITIONS s ON d.PAYMENT_TYPE = s.PAYMENT_TYPE;\n\n-- CoCo-built marts from the original lab (DE1 step 3), pre-built here\nCREATE OR REPLACE TABLE MART_CUSTOMER_PAYMENTS AS\nWITH base AS (\n    SELECT c.CUSTOMER_ID, c.CUSTOMER_NAME, c.SECTOR AS CUSTOMER_SECTOR, c.RM_NAME,\n           p.PAYMENT_TYPE, p.AMOUNT, p.IS_SUCCESSFUL, p.PROCESSING_TIME_MS\n    FROM STG_PAYMENTS p\n    JOIN STG_ACCOUNTS  a ON p.ORIGINATOR_ACCOUNT_ID = a.ACCOUNT_ID\n    JOIN STG_CUSTOMERS c ON a.CUSTOMER_ID = c.CUSTOMER_ID\n), top_scheme AS (\n    SELECT CUSTOMER_ID, PAYMENT_TYPE AS MOST_USED_SCHEME\n    FROM base GROUP BY CUSTOMER_ID, PAYMENT_TYPE\n    QUALIFY ROW_NUMBER() OVER (PARTITION BY CUSTOMER_ID ORDER BY COUNT(*) DESC) = 1\n)\nSELECT b.CUSTOMER_ID, b.CUSTOMER_NAME, b.CUSTOMER_SECTOR, b.RM_NAME,\n       COUNT(*)                                                   AS TOTAL_PAYMENTS,\n       SUM(b.AMOUNT)                                              AS TOTAL_VOLUME_GBP,\n       ROUND(COUNT_IF(b.IS_SUCCESSFUL)::FLOAT / COUNT(*) * 100, 2) AS SUCCESS_RATE_PCT,\n       ROUND(AVG(b.PROCESSING_TIME_MS), 0)                        AS AVG_PROCESSING_TIME_MS,\n       t.MOST_USED_SCHEME\nFROM base b JOIN top_scheme t USING (CUSTOMER_ID)\nGROUP BY b.CUSTOMER_ID, b.CUSTOMER_NAME, b.CUSTOMER_SECTOR, b.RM_NAME, t.MOST_USED_SCHEME;\n\n-- ---------- AI enrichment (DA2 builds this step by step) ----------\nCREATE OR REPLACE TABLE FEEDBACK_ENRICHED AS\nWITH ai_scored AS (\n    SELECT f.*, c.CUSTOMER_NAME, c.SECTOR AS CUSTOMER_SECTOR, c.RM_NAME,\n           -- AI_SENTIMENT returns a label, so map the overall label to -1, 0 or 1\n           -- (legacy SNOWFLAKE.CORTEX.SENTIMENT is blocked on new accounts)\n           DECODE(GET(FILTER(AI_SENTIMENT(f.FEEDBACK_TEXT):categories, c -> c:name::STRING = 'overall'), 0):sentiment::STRING,\n                  'positive', 1, 'negative', -1, 0)::FLOAT AS SENTIMENT_SCORE,\n           AI_CLASSIFY(f.FEEDBACK_TEXT,\n               ['Performance Issue','Service Quality','Technical Problem',\n                'Positive Experience','Feature Request']) AS CLASSIFICATION_RESULT\n    FROM STG_FEEDBACK f\n    LEFT JOIN STG_CUSTOMERS c ON f.CUSTOMER_ID = c.CUSTOMER_ID\n)\nSELECT FEEDBACK_ID, FEEDBACK_DATE, CUSTOMER_ID, CUSTOMER_NAME, CUSTOMER_SECTOR, RM_NAME,\n       PAYMENT_ID, FEEDBACK_CHANNEL, FEEDBACK_TEXT, PAYMENT_TYPE, RATING, SENTIMENT_SCORE,\n       CASE WHEN SENTIMENT_SCORE >  0.3 THEN 'POSITIVE'\n            WHEN SENTIMENT_SCORE < -0.3 THEN 'NEGATIVE'\n            ELSE 'NEUTRAL' END                      AS SENTIMENT_LABEL,\n       CLASSIFICATION_RESULT:labels[0]::STRING      AS TOPIC_CATEGORY\nFROM ai_scored;\n\nSELECT 'Core analytics catch-up complete' AS STATUS,\n       (SELECT COUNT(*) FROM MART_PAYMENT_KPIS)   AS KPI_ROWS,\n       (SELECT COUNT(*) FROM MART_SLA_COMPLIANCE) AS SLA_ROWS,\n       (SELECT COUNT(*) FROM FEEDBACK_ENRICHED)   AS FEEDBACK_ROWS;\n", "sql_name": "setup/catchup/core_analytics.sql"}, {"code": "ds1_model", "title": "Catch-up: ds1 model", "body": "<p>Run this if a vignette lists it as a prerequisite and you have not built it yet.<\/p>", "sql": "-- =====================================================\n-- CATCH-UP: DS1 attrition model (for DS3)\n-- Builds what DS1 leaves behind, without the notebook: the point-in-time features view,\n-- experiment RB_ATTRITION (two runs), model RB_ATTRITION_MODEL in the Model Registry, and\n-- ML.RB_ATTRITION_SCORES. Trains in the warehouse with the DS1 answer key from the lab repo.\n-- Run as HOL_PARTICIPANT; takes a few minutes.\n-- =====================================================\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ML;\n\n-- 1. The features view (DS1 step 1). ds1.sql ends with answer-key queries on the scores, which\n--    don't exist yet, so that last statement's error is expected; the SELECT below proves the view is there.\nEXECUTE IMMEDIATE $$\nBEGIN\n  EXECUTE IMMEDIATE FROM @BANKING_HOL_SETUP.PUBLIC.HOL_REPO/branches/main/vignettes/ds1_attrition_model/ds1.sql;\nEXCEPTION\n  WHEN STATEMENT_ERROR THEN RETURN 'features view created (answer-key queries skipped)';\nEND;\n$$;\nSELECT COUNT(*) AS CUSTOMERS, SUM(CHURNED_NEXT_3M) AS LEFT_NEXT_3M FROM BANKING_HOL.ML.RB_CHURN_FEATURES;\n\n-- 2. Train, track, register and score (DS1 steps 2-4), with vignettes/ds1_attrition_model/ds1_reference.py\nWITH TRAIN_DS1 AS PROCEDURE ()\n  RETURNS VARIANT\n  LANGUAGE PYTHON\n  RUNTIME_VERSION = '3.11'\n  PACKAGES = ('snowflake-snowpark-python', 'snowflake-ml-python==2.9.0', 'scikit-learn', 'xgboost', 'pandas', 'numpy')\n  IMPORTS = ('@BANKING_HOL_SETUP.PUBLIC.HOL_REPO/branches/main/vignettes/ds1_attrition_model/ds1_reference.py')\n  HANDLER = 'ds1_reference.main'\nCALL TRAIN_DS1();\n", "sql_name": "setup/catchup/ds1_model.sql"}, {"code": "ds4_predictions", "title": "Catch-up: ds4 predictions", "body": "<p>Run this if a vignette lists it as a prerequisite and you have not built it yet.<\/p>", "sql": "-- =====================================================\n-- CATCH-UP: DS4 customer predictions (for DA5)\n-- Builds what DS4 leaves behind, without the notebook: a calibrated version of RB_ATTRITION_MODEL\n-- (not the default), RB_MARGIN_MODEL, the RB_ATTRITION and RB_MARGIN experiment runs, and\n-- ML.RB_CUSTOMER_PREDICTIONS. Trains in the warehouse with the DS4 answer key from the lab repo.\n-- Needs DS1's feature view: run setup/catchup/ds1_model.sql first if you skipped DS1.\n-- Run as HOL_PARTICIPANT; takes a few minutes.\n-- =====================================================\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ML;\n\nSELECT COUNT(*) AS CUSTOMERS FROM BANKING_HOL.ML.RB_CHURN_FEATURES;  -- fails here if DS1's features aren't built yet\n\nWITH TRAIN_DS4 AS PROCEDURE ()\n  RETURNS VARIANT\n  LANGUAGE PYTHON\n  RUNTIME_VERSION = '3.11'\n  PACKAGES = ('snowflake-snowpark-python', 'snowflake-ml-python==2.9.0', 'scikit-learn', 'xgboost', 'pandas', 'numpy')\n  IMPORTS = ('@BANKING_HOL_SETUP.PUBLIC.HOL_REPO/branches/main/vignettes/ds4_customer_value/ds4_reference.py')\n  HANDLER = 'ds4_reference.main'\nCALL TRAIN_DS4();\n\nSELECT COUNT(*) AS CUSTOMERS, ROUND(AVG(CHURN_3M), 4) AS AVG_CHANCE_OF_LEAVING FROM BANKING_HOL.ML.RB_CUSTOMER_PREDICTIONS;\n", "sql_name": "setup/catchup/ds4_predictions.sql"}], "pathways": {"Data Engineer": ["DE1", "DE2", "GOV2"], "Data Analyst": ["DA2", "DA1"], "Payments Ops": ["OPS1", "OPS2", "DA2"], "AI Builder": ["AI1", "AI3", "AI2"], "Governance": ["GOV1", "GOV2", "AI3"]}};
const byCode = Object.fromEntries(D.modules.map(m => [m.code, m]));
let persona = localStorage.getItem('hol_persona') || '';
const done = JSON.parse(localStorage.getItem('hol_done') || '{}');
function copyText(s, b){
  const done = () => { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1500); };
  const fallback = () => { const a = document.createElement('textarea'); a.value = s; document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); done(); } catch (e) {} a.remove(); };
  if (navigator.clipboard) navigator.clipboard.writeText(s).then(done, fallback); else fallback();
}
document.addEventListener('click', e => { const b = e.target.closest('.cp'); if (b) copyText(b.parentElement.closest('.prompt,.code').querySelector('pre').textContent, b); });
function esc(s){return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function navItem(m){
  const b = document.createElement('button'); b.className = 'item'; b.dataset.code = m.code;
  b.innerHTML = '<span class="c">' + esc(m.code.length > 6 ? '' : m.code) + '</span>' + esc(m.title) + (done[m.code] ? '<span class="done">done</span>' : '');
  b.onclick = () => show(m.code); return b;
}
function render(){
  const P = document.getElementById('personas'); P.innerHTML = '';
  ['All', ...Object.keys(D.pathways)].forEach(p => {
    const b = document.createElement('button'); b.textContent = p;
    if ((p === 'All' && !persona) || p === persona) b.className = 'on';
    b.onclick = () => { persona = p === 'All' ? '' : p; localStorage.setItem('hol_persona', persona); render(); };
    P.appendChild(b);
  });
  const sets = {core: [], vign: [], catch: []};
  D.modules.forEach(m => (m.code === 'C1' || m.code === 'C2' ? sets.core : m.sql_name.includes('catchup') ? sets.catch : sets.vign).push(m));
  const order = persona ? D.pathways[persona] : null;
  if (order) sets.vign.sort((a, b) => (order.indexOf(a.code) + 1 || 99) - (order.indexOf(b.code) + 1 || 99));
  for (const [id, list] of Object.entries(sets)) {
    const el = document.getElementById(id); el.innerHTML = '';
    list.forEach(m => { const n = navItem(m); if (order && id === 'vign' && !order.includes(m.code)) n.classList.add('dim'); el.appendChild(n); });
  }
}
function show(code){
  const m = byCode[code];
  document.querySelectorAll('.item').forEach(i => i.classList.toggle('on', i.dataset.code === code));
  let h = '<h2>' + esc(m.code) + ': ' + esc(m.title) + '</h2>' + m.body;
  if (m.sql) h += '<div class="sqlbar"><span class="muted">' + esc(m.sql_name) + '</span><span>'
      + '<button class="btn ghost" id="cp">Copy SQL</button> <button class="btn" id="dn">' + (done[code] ? 'Completed' : 'Mark complete') + '</button></span></div>'
      + '<pre>' + esc(m.sql) + '</pre>';
  const main = document.getElementById('main'); main.innerHTML = h; main.scrollTop = 0;
  const cp = document.getElementById('cp');
  if (cp) cp.onclick = () => navigator.clipboard.writeText(m.sql).then(() => cp.textContent = 'Copied');
  const dn = document.getElementById('dn');
  if (dn) dn.onclick = () => { done[code] = !done[code]; localStorage.setItem('hol_done', JSON.stringify(done)); render(); show(code); };
}
render();
show('C1');
</script></body></html>
