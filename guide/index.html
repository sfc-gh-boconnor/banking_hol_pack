H_NAME AS BRANCH_A, b.BRANCH_NAME AS BRANCH_B,\n       ROUND(ST_DISTANCE(a.LOCATION, b.LOCATION) / 1000, 2) AS STRAIGHT_LINE_KM,\n       ROUND(ST_AREA(ST_INTERSECTION(ia.CATCHMENT, ib.CATCHMENT)) / LEAST(ST_AREA(ia.CATCHMENT), ST_AREA(ib.CATCHMENT)) * 100) AS OVERLAP_PCT\nFROM BANKING_HOL.RETAIL.BRANCHES a\nJOIN BANKING_HOL.RETAIL.BRANCHES b ON a.CITY = b.CITY AND a.BRANCH_ID < b.BRANCH_ID\nJOIN BANKING_HOL.RETAIL.BRANCH_ISOCHRONES ia ON ia.BRANCH_ID = a.BRANCH_ID AND ia.PROFILE = 'driving-car' AND ia.MINUTES = 10\nJOIN BANKING_HOL.RETAIL.BRANCH_ISOCHRONES ib ON ib.BRANCH_ID = b.BRANCH_ID AND ib.PROFILE = 'driving-car' AND ib.MINUTES = 10\n) WHERE OVERLAP_PCT >= 80\nORDER BY OVERLAP_PCT DESC, STRAIGHT_LINE_KM;\n\n-- -----------------------------------------------------\n-- DA3.5 Customer density with H3 (resolution 8, ~0.7 km2 cells)\n-- notebook: altair heat map of cells (H3_CELL_TO_POINT gives the centre)\n-- -----------------------------------------------------\nSELECT HOME_H3_CELL AS H3_CELL,\n       ST_Y(H3_CELL_TO_POINT(HOME_H3_CELL)) AS LAT, ST_X(H3_CELL_TO_POINT(HOME_H3_CELL)) AS LON,\n       ANY_VALUE(CITY) AS CITY, COUNT(*) AS CUSTOMERS\nFROM BANKING_HOL.RETAIL.RETAIL_CUSTOMERS\nGROUP BY 1, 2, 3\nORDER BY CUSTOMERS DESC;\n\n-- -----------------------------------------------------\n-- DA3.6 Closure impact: if a branch closes, its customers move to their\n-- second-fastest branch. Added drive time, lost walk-in access, cost saved.\n-- -----------------------------------------------------\nCREATE OR REPLACE TABLE BRANCH_CLOSURE_IMPACT AS\nWITH visits AS (\n    SELECT BRANCH_ID, COUNT(*) AS VISITS_12M FROM BANKING_HOL.RETAIL.BRANCH_VISITS GROUP BY 1\n),\nwalk_after AS (\n    -- walking time to the receiving branch for each customer\n    SELECT n.CUSTOMER_ID, t.DURATION_S / 60 AS WALK_MIN_AFTER\n    FROM CUSTOMER_NEAREST_BRANCH n\n    JOIN BANKING_HOL.RETAIL.RETAIL_CUSTOMERS c USING (CUSTOMER_ID)\n    JOIN BANKING_HOL.RETAIL.BRANCH_CELL_TRAVEL t\n      ON t.H3_CELL = c.HOME_H3_CELL AND t.BRANCH_ID = n.SECOND_BRANCH_ID AND t.PROFILE = 'foot-walking'\n),\nmoved AS (\n    SELECT n.NEAREST_BRANCH_ID AS BRANCH_ID,\n           COUNT(*) AS CUSTOMERS,\n           ROUND(AVG(n.SECOND_DRIVE_MIN - n.NEAREST_DRIVE_MIN), 1) AS AVG_ADDED_DRIVE_MIN,\n           ROUND(APPROX_PERCENTILE(n.SECOND_DRIVE_MIN - n.NEAREST_DRIVE_MIN, 0.9), 1) AS P90_ADDED_DRIVE_MIN,\n           COUNT_IF(n.NEAREST_WALK_MIN <= 15 AND COALESCE(w.WALK_MIN_AFTER, 999) > 15) AS LOSE_WALK_IN_ACCESS,\n           COUNT_IF(NOT n.DIGITAL_ACTIVE OR n.AGE_BAND = '75+') AS VULNERABLE_CUSTOMERS,\n           MODE(n.SECOND_BRANCH_ID) AS MAIN_RECEIVING_BRANCH_ID\n    FROM CUSTOMER_NEAREST_BRANCH n\n    LEFT JOIN walk_after w USING (CUSTOMER_ID)\n    GROUP BY 1\n)\nSELECT b.BRANCH_ID, b.BRANCH_NAME, b.CITY, b.FORMAT, b.ANNUAL_COST_GBP AS ANNUAL_SAVING_GBP,\n       COALESCE(v.VISITS_12M, 0) AS VISITS_12M,\n       ROUND(b.ANNUAL_COST_GBP / NULLIF(v.VISITS_12M, 0), 2) AS COST_PER_VISIT_GBP,\n       m.CUSTOMERS AS CUSTOMERS_AFFECTED, m.AVG_ADDED_DRIVE_MIN, m.P90_ADDED_DRIVE_MIN,\n       m.LOSE_WALK_IN_ACCESS, m.VULNERABLE_CUSTOMERS, r.BRANCH_NAME AS MAIN_RECEIVING_BRANCH,\n       CASE WHEN m.P90_ADDED_DRIVE_MIN >= 10 OR m.VULNERABLE_CUSTOMERS >= 200 THEN 'HIGH'\n            WHEN m.P90_ADDED_DRIVE_MIN >= 4 OR m.LOSE_WALK_IN_ACCESS >= 100 THEN 'MEDIUM' ELSE 'LOW' END AS DISRUPTION_RISK\nFROM BANKING_HOL.RETAIL.BRANCHES b\nJOIN moved m ON m.BRANCH_ID = b.BRANCH_ID\nLEFT JOIN visits v ON v.BRANCH_ID = b.BRANCH_ID\nLEFT JOIN BANKING_HOL.RETAIL.BRANCHES r ON r.BRANCH_ID = m.MAIN_RECEIVING_BRANCH_ID;\n\nSELECT BRANCH_NAME, CITY, ANNUAL_SAVING_GBP, COST_PER_VISIT_GBP, AVG_ADDED_DRIVE_MIN, P90_ADDED_DRIVE_MIN,\n       LOSE_WALK_IN_ACCESS, VULNERABLE_CUSTOMERS, DISRUPTION_RISK, MAIN_RECEIVING_BRANCH\nFROM BRANCH_CLOSURE_IMPACT\nORDER BY DISRUPTION_RISK = 'LOW' DESC, COST_PER_VISIT_GBP DESC\nLIMIT 10;\n\n-- -----------------------------------------------------\n-- DA3.6b Who else pays in here: small businesses, charities and clubs\n-- that deposit cash at the counter. Same move-to-second-fastest rule.\n-- -----------------------------------------------------\nCREATE OR REPLACE TABLE BUSINESS_CLOSURE_IMPACT AS\nWITH ranked AS (\n    SELECT b.BUSINESS_ID, b.BUSINESS_TYPE, b.HOME_BRANCH_ID, b.TREASURER_DIGITAL, t.BRANCH_ID, t.DURATION_S / 60 AS DRIVE_MIN,\n           ROW_NUMBER() OVER (PARTITION BY b.BUSINESS_ID ORDER BY t.DURATION_S) AS RN\n    FROM BANKING_HOL.RETAIL.BUSINESS_CUSTOMERS b\n    JOIN BANKING_HOL.RETAIL.BRANCH_CELL_TRAVEL t ON t.H3_CELL = b.HOME_H3_CELL AND t.PROFILE = 'driving-car'\n),\nper_business AS (\n    SELECT BUSINESS_ID, ANY_VALUE(BUSINESS_TYPE) AS BUSINESS_TYPE, ANY_VALUE(TREASURER_DIGITAL) AS TREASURER_DIGITAL,\n           ANY_VALUE(HOME_BRANCH_ID) AS BRANCH_ID,\n           MAX(IFF(BRANCH_ID = HOME_BRANCH_ID, DRIVE_MIN, NULL)) AS HOME_DRIVE_MIN,\n           MIN(IFF(BRANCH_ID <> HOME_BRANCH_ID, DRIVE_MIN, NULL)) AS NEXT_DRIVE_MIN\n    FROM ranked GROUP BY 1\n),\ncash AS (SELECT BUSINESS_ID, SUM(CASH_GBP + CHEQUES_GBP) AS PAID_IN_GBP FROM BANKING_HOL.RETAIL.BUSINESS_CASH_DEPOSITS GROUP BY 1)\nSELECT p.BRANCH_ID, br.BRANCH_NAME, br.CITY,\n       COUNT(*) AS BUSINESSES,\n       COUNT_IF(p.BUSINESS_TYPE = 'SMALL_BUSINESS') AS SMALL_BUSINESSES,\n       COUNT_IF(p.BUSINESS_TYPE = 'CHARITY') AS CHARITIES,\n       COUNT_IF(p.BUSINESS_TYPE = 'CLUB') AS CLUBS,\n       COUNT_IF(NOT p.TREASURER_DIGITAL) AS TREASURER_NOT_DIGITAL,\n       ROUND(SUM(c.PAID_IN_GBP)) AS CASH_PAID_IN_12M_GBP,\n       ROUND(AVG(COALESCE(p.NEXT_DRIVE_MIN, 60) - p.HOME_DRIVE_MIN), 1) AS AVG_ADDED_DRIVE_MIN,\n       COUNT_IF(p.HOME_DRIVE_MIN <= 20 AND COALESCE(p.NEXT_DRIVE_MIN, 999) > 20) AS BUSINESSES_OVER_20_MIN\nFROM per_business p\nJOIN BANKING_HOL.RETAIL.BRANCHES br ON br.BRANCH_ID = p.BRANCH_ID\nLEFT JOIN cash c USING (BUSINESS_ID)\nGROUP BY 1, 2, 3;\n\nSELECT BRANCH_NAME, CITY, BUSINESSES, CHARITIES, CLUBS, TREASURER_NOT_DIGITAL, CASH_PAID_IN_12M_GBP, BUSINESSES_OVER_20_MIN\nFROM BUSINESS_CLOSURE_IMPACT\nORDER BY BUSINESSES_OVER_20_MIN DESC LIMIT 5;\n\n-- -----------------------------------------------------\n-- DA3.7 Semantic view for Cortex Analyst (drive minutes, no GEOGRAPHY)\n-- -----------------------------------------------------\nCREATE OR REPLACE SEMANTIC VIEW SV_BRANCH_NETWORK\n  TABLES (\n    closures AS BANKING_HOL.ANALYTICS.BRANCH_CLOSURE_IMPACT\n      PRIMARY KEY (BRANCH_ID)\n      WITH SYNONYMS = ('branches', 'branch closures', 'consolidation candidates')\n      COMMENT = 'One row per branch: what happens if it closes',\n    customers AS BANKING_HOL.ANALYTICS.CUSTOMER_NEAREST_BRANCH\n      PRIMARY KEY (CUSTOMER_ID)\n      WITH SYNONYMS = ('retail customers', 'catchment')\n      COMMENT = 'Each retail customer with their fastest and second-fastest branch by drive time'\n  )\n  RELATIONSHIPS (\n    customers (NEAREST_BRANCH_ID) REFERENCES closures\n  )\n  FACTS (\n    closures.annual_saving_gbp AS ANNUAL_SAVING_GBP COMMENT = 'Annual running cost saved if the branch closes (GBP)',\n    closures.visits_12m AS VISITS_12M COMMENT = 'Branch visits in the last 12 months',\n    closures.cost_per_visit_gbp AS COST_PER_VISIT_GBP COMMENT = 'Annual cost divided by visits',\n    closures.avg_added_drive_min AS AVG_ADDED_DRIVE_MIN WITH SYNONYMS = ('extra travel time') COMMENT = 'Average extra drive minutes to the next-fastest branch (OpenRouteService)',\n    closures.p90_added_drive_min AS P90_ADDED_DRIVE_MIN COMMENT = '90th percentile extra drive minutes',\n    closures.lose_walk_in_access AS LOSE_WALK_IN_ACCESS COMMENT = 'Customers who lose a branch within a 15 minute walk',\n    closures.vulnerable_customers AS VULNERABLE_CUSTOMERS COMMENT = 'Affected customers who are 75+ or not digitally active',\n    customers.nearest_drive_min AS NEAREST_DRIVE_MIN COMMENT = 'Drive minutes from home to the fastest branch',\n    customers.nearest_walk_min AS NEAREST_WALK_MIN COMMENT = 'Walking minutes from home to the nearest branch'\n  )\n  DIMENSIONS (\n    closures.branch_name AS BRANCH_NAME WITH SYNONYMS = ('branch') COMMENT = 'Branch name',\n    closures.city AS CITY COMMENT = 'City',\n    closures.format AS FORMAT COMMENT = 'FULL or EXPRESS branch',\n    closures.disruption_risk AS DISRUPTION_RISK COMMENT = 'LOW, MEDIUM or HIGH service disruption if closed',\n    closures.main_receiving_branch AS MAIN_RECEIVING_BRANCH COMMENT = 'Branch that absorbs most customers',\n    customers.age_band AS AGE_BAND COMMENT = 'Customer age band',\n    customers.segment AS SEGMENT COMMENT = 'MASS, AFFLUENT or SMALL_BUSINESS',\n    customers.digital_active AS DIGITAL_ACTIVE COMMENT = 'Customer uses digital banking'\n  )\n  METRICS (\n    closures.total_saving_gbp AS SUM(closures.annual_saving_gbp) COMMENT = 'Total annual saving (GBP)',\n    closures.branch_count AS COUNT(closures.branch_name) COMMENT = 'Number of branches',\n    customers.customer_count AS COUNT(customers.customer_id) COMMENT = 'Number of customers',\n    customers.avg_drive_min AS ROUND(AVG(customers.nearest_drive_min), 1) COMMENT = 'Average drive minutes to the fastest branch'\n  )\n  COMMENT = 'DA3 retail branch network and consolidation impact (OpenRouteService travel times)';\n\nSELECT * FROM SEMANTIC_VIEW(SV_BRANCH_NETWORK\n  METRICS closures.total_saving_gbp, closures.branch_count\n  DIMENSIONS closures.city, closures.disruption_risk)\nORDER BY CITY, DISRUPTION_RISK;\n\n-- -----------------------------------------------------\n-- DA3.8 Branch network agent (in the lab: + > Agent > Create with CoCo)\n-- -----------------------------------------------------\nCREATE OR REPLACE AGENT BANKING_HOL.ANALYTICS.BRANCH_NETWORK_ADVISOR\n  COMMENT = 'DA3: retail branch consolidation advisor'\n  PROFILE = '{\"display_name\": \"Branch Network Advisor\", \"color\": \"orange\"}'\n  FROM SPECIFICATION\n  $$\n  models:\n    orchestration: auto\n  instructions:\n    response: >\n      You advise a UK retail bank on its branch network. For a consolidation question, return:\n      a ranked list of candidate branches with annual saving and cost per visit, the branch that\n      absorbs their customers and the added drive time (average and p90 minutes), customers who\n      lose walk-in access, the disruption risk and vulnerable customers affected, and a short\n      90-day transition plan. Never recommend closing a HIGH disruption-risk branch without\n      saying why and what mitigation is needed.\n    orchestration: \"Use the Analyst tool for every question about branches, closures, catchments, travel time and customers.\"\n    sample_questions:\n      - question: \"What is the consolidation opportunity in Leeds?\"\n      - question: \"Which 3 branches could close with the least added travel time?\"\n      - question: \"Which branch would be hardest to close, and why?\"\n  tools:\n    - tool_spec:\n        type: \"cortex_analyst_text_to_sql\"\n        name: \"Analyst\"\n        description: \"Retail branch network: closure impact per branch (saving, visits, added drive time, lost walk-in access, disruption risk) and customer catchments.\"\n  tool_resources:\n    Analyst:\n      semantic_view: \"BANKING_HOL.ANALYTICS.SV_BRANCH_NETWORK\"\n      execution_environment:\n        type: \"warehouse\"\n        warehouse: \"BANKING_WH\"\n  $$;\n\nSELECT 'DA3 complete' AS STATUS;\n", "sql_name": "vignettes/da3_branch_network_geo/da3.sql"}, {"code": "DA4", "title": "Drive-time matrices with OpenRouteService", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Analyst (Retail Banking), advanced geospatial<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~45 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>DA3 recommended. Uses the drive-time matrix the lab ships in <code>BANKING_HOL.RETAIL<\/code>; nothing to install<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>How do we answer &quot;how far is each neighbourhood from a branch, and from the next one if it closes?&quot; for every neighbourhood at once, from real roads, without customer locations leaving the bank?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>A look inside the lab&#x27;s drive-time matrix: what it holds, and how real roads differ from straight lines<\/li>\n<li>Table <code>MY_CLOSURE_LOOKUP<\/code>: for every neighbourhood, the nearest branch and the next nearest if it closed, the lookup behind the executive demo&#x27;s closure map<\/li>\n<li>A ranking of branches by how many customers a closure would push past 20 minutes<\/li>\n<li>The case for the hexagon size: what a coarser grid hides<\/li>\n<\/ul>\n<h3>Why a precomputed matrix<\/h3>\n<p>DA3 and the executive demo never call a routing engine while you click. Every drive time is a <strong>lookup<\/strong> in a table keyed by branch and H3 cell, built once with OpenRouteService (ORS). This is the pattern in <span class=\"ref\">Snowflake H3: Precomputing Travel-Time Matrices<\/span>:<\/p>\n<ul>\n<li>Tessellate the area into H3 hexagons. Resolution 8 cells are about 0.7 km\u00b2, a neighbourhood.<\/li>\n<li>Ask the routing engine for the travel time from each branch to every cell, in batches.<\/li>\n<li>Store the answers as a table. Queries then take milliseconds on a warehouse, with no routing engine running.<\/li>\n<\/ul>\n<p>OpenRouteService runs <strong>inside Snowflake<\/strong> on Snowpark Container Services, over OpenStreetMap roads, so customer locations never leave the account. It is set up once per account by an admin, which is why the lab ships the matrix ready-made: see <span class=\"ref\">How the matrix was built<\/span> to do it yourself.<\/p>\n<h3>Steps<\/h3>\n<h4>Look inside the matrix<\/h4>\n<p class=\"where\">Snowsight &gt; Projects &gt; Workspaces &gt; + Add new &gt; SQL File, role HOL_PARTICIPANT, warehouse BANKING_WH<\/p>\n<ol>\n<li>Paste and run:<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>USE SCHEMA BANKING_HOL.ANALYTICS;\nSELECT b.CITY, COUNT(DISTINCT t.BRANCH_ID) AS BRANCHES, COUNT(DISTINCT t.H3_CELL) AS CELLS, COUNT(*) AS PAIRS,\n       ROUND(MEDIAN(t.DURATION_S) / 60, 1) AS MEDIAN_DRIVE_MIN\nFROM BANKING_HOL.RETAIL.BRANCH_CELL_TRAVEL t JOIN BANKING_HOL.RETAIL.BRANCHES b USING (BRANCH_ID)\nWHERE t.PROFILE = &#x27;driving-car&#x27; GROUP BY 1 ORDER BY PAIRS DESC;<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> 8 cities. Every branch in a city has a drive time to every cell around it, so London alone has about 35,000 pairs.<\/p>\n<h4>Real roads, not straight lines<\/h4>\n<p class=\"where\">the same SQL file<\/p>\n<ol>\n<li>Pick the neighbourhood around Manchester city centre and see how far each branch really is:<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>SELECT b.BRANCH_NAME, ROUND(t.DURATION_S / 60, 1) AS DRIVE_MIN, ROUND(t.DISTANCE_M / 1000, 1) AS ROAD_KM,\n       ROUND(ST_DISTANCE(b.LOCATION, H3_CELL_TO_POINT(t.H3_CELL)) / 1000, 1) AS STRAIGHT_LINE_KM\nFROM BANKING_HOL.RETAIL.BRANCH_CELL_TRAVEL t JOIN BANKING_HOL.RETAIL.BRANCHES b USING (BRANCH_ID)\nWHERE t.PROFILE = &#x27;driving-car&#x27; AND t.H3_CELL = H3_LATLNG_TO_CELL_STRING(53.4794, -2.2453, 8)\nORDER BY DRIVE_MIN;<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> road distances well above the straight line. Altrincham is about 12 km away as the crow flies but nearly 20 km by road.<\/p>\n<h4>Build the closure lookup<\/h4>\n<p class=\"where\">the same SQL file<\/p>\n<p>This is the question the executive demo answers when you click a hexagon: how far is the nearest branch, and how far is the next one if it closes?<\/p>\n<ol>\n<li>Rank every branch for every cell, and keep the first two:<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>CREATE OR REPLACE TABLE MY_CLOSURE_LOOKUP AS\nWITH d AS (SELECT t.H3_CELL, t.BRANCH_ID, b.CITY, t.DURATION_S / 60 AS MINS,\n                  ROW_NUMBER() OVER (PARTITION BY t.H3_CELL ORDER BY t.DURATION_S) AS RANK\n           FROM BANKING_HOL.RETAIL.BRANCH_CELL_TRAVEL t JOIN BANKING_HOL.RETAIL.BRANCHES b USING (BRANCH_ID)\n           WHERE t.PROFILE = &#x27;driving-car&#x27;)\nSELECT H3_CELL, ANY_VALUE(CITY) AS CITY,\n       MAX(IFF(RANK = 1, BRANCH_ID, NULL)) AS NEAREST_BRANCH,\n       MAX(IFF(RANK = 1, MINS, NULL)) AS NEAREST_MIN,\n       MAX(IFF(RANK = 2, BRANCH_ID, NULL)) AS NEXT_BRANCH,\n       MAX(IFF(RANK = 2, MINS, NULL)) AS NEXT_MIN\nFROM d GROUP BY 1;<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> one row for each of about 12,400 neighbourhoods, with its nearest branch and the one customers would drive to if it closed<\/p>\n<h4>Which closures cut customers off<\/h4>\n<p class=\"where\">the same SQL file<\/p>\n<ol>\n<li>Put customers on the grid and count who a closure would push past 20 minutes:<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>SELECT l.NEAREST_BRANCH, b.BRANCH_NAME, COUNT(c.CUSTOMER_ID) AS CUSTOMERS,\n       COUNT_IF(c.CUSTOMER_ID IS NOT NULL AND l.NEAREST_MIN &lt;= 20 AND COALESCE(l.NEXT_MIN, 999) &gt; 20) AS CUSTOMERS_CUT_OFF,\n       ROUND(AVG(l.NEXT_MIN - l.NEAREST_MIN), 1) AS AVG_EXTRA_MIN\nFROM MY_CLOSURE_LOOKUP l\nJOIN BANKING_HOL.RETAIL.BRANCHES b ON b.BRANCH_ID = l.NEAREST_BRANCH\nLEFT JOIN BANKING_HOL.RAW_DATA.RB_CUSTOMERS c ON H3_LATLNG_TO_CELL_STRING(c.HOME_LAT, c.HOME_LON, 8) = l.H3_CELL\nGROUP BY 1, 2 ORDER BY CUSTOMERS_CUT_OFF DESC LIMIT 10;<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a few branches stand out, such as Birmingham West Bromwich, where a closure would leave around 300 customers more than 20 minutes from a branch.<\/p>\n<ol>\n<li>Ask Cortex Code to map it:<\/li>\n<\/ol>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Using BANKING_HOL.ANALYTICS.MY_CLOSURE_LOOKUP, add a Streamlit page with a pydeck H3HexagonLayer for one city, coloured by NEXT_MIN - NEAREST_MIN (the extra drive if the nearest branch closed), with the branches as points and a tooltip showing both branches and both times.<\/pre><\/div>\n<h4>Why the hexagon size matters<\/h4>\n<p class=\"where\">the same SQL file<\/p>\n<ol>\n<li>Roll the neighbourhood cells up to the next size up (res 7, about 5 km\u00b2) and see how much the drive time varies inside one:<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>WITH r7 AS (SELECT H3_CELL_TO_PARENT(H3_CELL, 7) AS H3_7, NEAREST_MIN FROM MY_CLOSURE_LOOKUP)\nSELECT COUNT(DISTINCT H3_7) AS RES7_CELLS, (SELECT COUNT(*) FROM MY_CLOSURE_LOOKUP) AS RES8_CELLS,\n       ROUND(AVG(SPREAD), 1) AS AVG_SPREAD_MIN, ROUND(MAX(SPREAD), 1) AS MAX_SPREAD_MIN\nFROM (SELECT H3_7, MAX(NEAREST_MIN) - MIN(NEAREST_MIN) AS SPREAD FROM r7 GROUP BY 1);<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> drive times inside a single res-7 hexagon differ by about 5 minutes on average, and far more at the edges. That is why the demo map switches to res 8 as you zoom in: a 20-minute rule needs neighbourhood-sized cells.<\/p>\n<h3>How the matrix was built<\/h3>\n<p>The lab&#x27;s matrix was made once with the OpenRouteService routing engine, then shipped as seed data so every attendee account works without it. To build your own:<\/p>\n<ol>\n<li><strong>Install the engine<\/strong> (an account admin, once per account), following <span class=\"ref\">Build Routing Solution in Snowflake with Snowflake CoCo<\/span>. This needs Cortex Code Desktop or the CLI on a laptop with Docker or Podman, because it pushes container images to the account. It can&#x27;t be done from Snowsight.<\/li>\n<li><strong>Add your map region<\/strong> in SQL, for example <code>CALL OPENROUTESERVICE_APP.CORE.START_REGION_PROVISION(&#x27;Manchester&#x27;, &#x27;Manchester&#x27;, &#x27;driving-car&#x27;)<\/code>. A city builds in about 30 minutes.<\/li>\n<li><strong>Make a grid<\/strong> of H3 cells around your branches with <code>H3_GRID_DISK<\/code>.<\/li>\n<li><strong>Call <code>OPENROUTESERVICE_APP.CORE.MATRIX<\/code><\/strong> with the branches as sources and a batch of a few hundred cells as destinations, then unpack its <code>durations<\/code> and <code>distances<\/code> arrays into one row per branch and cell. <code>da4.sql<\/code> has the full statements, tested against a Manchester region: they reproduce the lab&#x27;s matrix to within 0.03 minutes.<\/li>\n<li><strong>Rebuild on a schedule<\/strong>, not per click: when branches open or close, or the road map is refreshed.<\/li>\n<\/ol>\n<h3>Check your work<\/h3>\n<ul>\n<li><code>MY_CLOSURE_LOOKUP<\/code> has a row for every cell in the matrix, with a nearest and (almost always) a next nearest branch<\/li>\n<li>Your ranking names the branches whose closure would push the most customers past 20 minutes<\/li>\n<li>You can say why the demo uses res 8 hexagons when zoomed in<\/li>\n<\/ul>\n<h3>In your bank<\/h3>\n<ul>\n<li><strong>Your branches, your roads.<\/strong> Build the matrix for your own branch list and choose the profiles: driving, walking, and HGV for cash logistics.<\/li>\n<li><strong>Precompute, then look up.<\/strong> Analysts, agents and apps read the table; only the rebuild needs the routing engine.<\/li>\n<li><strong>Resolution where it matters.<\/strong> Use res 8 for neighbourhood rules such as a 20-minute drive, and store res 7 alongside it for city views.<\/li>\n<li><strong>Governed like any other data.<\/strong> Customer home locations stay in Snowflake under your masking and row access policies; only cell centres are sent to the routing engine, inside the account.<\/li>\n<\/ul>", "sql": "-- =====================================================\n-- VIGNETTE DA4: DRIVE-TIME MATRICES WITH OPENROUTESERVICE   (~45 min, advanced)\n-- Persona:  Data Analyst (Retail Banking), advanced geospatial\n-- Question: \"How far is each neighbourhood from a branch, and from the next one\n--            if it closes?\", for every neighbourhood at once, from real roads.\n-- Prereq:   DA3 recommended. Uses BANKING_HOL.RETAIL.BRANCH_CELL_TRAVEL, the matrix\n--           the lab ships (precomputed with OpenRouteService). Nothing to install.\n-- Reference SQL for each step in README.md.\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ANALYTICS;\n\n-- 1.\nSELECT b.CITY, COUNT(DISTINCT t.BRANCH_ID) AS BRANCHES, COUNT(DISTINCT t.H3_CELL) AS CELLS, COUNT(*) AS PAIRS,\n       ROUND(MEDIAN(t.DURATION_S) / 60, 1) AS MEDIAN_DRIVE_MIN\nFROM BANKING_HOL.RETAIL.BRANCH_CELL_TRAVEL t JOIN BANKING_HOL.RETAIL.BRANCHES b USING (BRANCH_ID)\nWHERE t.PROFILE = 'driving-car' GROUP BY 1 ORDER BY PAIRS DESC;\n\n-- 2.\nSELECT b.BRANCH_NAME, ROUND(t.DURATION_S / 60, 1) AS DRIVE_MIN, ROUND(t.DISTANCE_M / 1000, 1) AS ROAD_KM,\n       ROUND(ST_DISTANCE(b.LOCATION, H3_CELL_TO_POINT(t.H3_CELL)) / 1000, 1) AS STRAIGHT_LINE_KM\nFROM BANKING_HOL.RETAIL.BRANCH_CELL_TRAVEL t JOIN BANKING_HOL.RETAIL.BRANCHES b USING (BRANCH_ID)\nWHERE t.PROFILE = 'driving-car' AND t.H3_CELL = H3_LATLNG_TO_CELL_STRING(53.4794, -2.2453, 8)\nORDER BY DRIVE_MIN;\n\n-- 3.\nCREATE OR REPLACE TABLE MY_CLOSURE_LOOKUP AS\nWITH d AS (SELECT t.H3_CELL, t.BRANCH_ID, b.CITY, t.DURATION_S / 60 AS MINS,\n                  ROW_NUMBER() OVER (PARTITION BY t.H3_CELL ORDER BY t.DURATION_S) AS RANK\n           FROM BANKING_HOL.RETAIL.BRANCH_CELL_TRAVEL t JOIN BANKING_HOL.RETAIL.BRANCHES b USING (BRANCH_ID)\n           WHERE t.PROFILE = 'driving-car')\nSELECT H3_CELL, ANY_VALUE(CITY) AS CITY,\n       MAX(IFF(RANK = 1, BRANCH_ID, NULL)) AS NEAREST_BRANCH,\n       MAX(IFF(RANK = 1, MINS, NULL)) AS NEAREST_MIN,\n       MAX(IFF(RANK = 2, BRANCH_ID, NULL)) AS NEXT_BRANCH,\n       MAX(IFF(RANK = 2, MINS, NULL)) AS NEXT_MIN\nFROM d GROUP BY 1;\n\n-- 4.\nSELECT l.NEAREST_BRANCH, b.BRANCH_NAME, COUNT(c.CUSTOMER_ID) AS CUSTOMERS,\n       COUNT_IF(c.CUSTOMER_ID IS NOT NULL AND l.NEAREST_MIN <= 20 AND COALESCE(l.NEXT_MIN, 999) > 20) AS CUSTOMERS_CUT_OFF,\n       ROUND(AVG(l.NEXT_MIN - l.NEAREST_MIN), 1) AS AVG_EXTRA_MIN\nFROM MY_CLOSURE_LOOKUP l\nJOIN BANKING_HOL.RETAIL.BRANCHES b ON b.BRANCH_ID = l.NEAREST_BRANCH\nLEFT JOIN BANKING_HOL.RAW_DATA.RB_CUSTOMERS c ON H3_LATLNG_TO_CELL_STRING(c.HOME_LAT, c.HOME_LON, 8) = l.H3_CELL\nGROUP BY 1, 2 ORDER BY CUSTOMERS_CUT_OFF DESC LIMIT 10;\n\n-- 5.\nWITH r7 AS (SELECT H3_CELL_TO_PARENT(H3_CELL, 7) AS H3_7, NEAREST_MIN FROM MY_CLOSURE_LOOKUP)\nSELECT COUNT(DISTINCT H3_7) AS RES7_CELLS, (SELECT COUNT(*) FROM MY_CLOSURE_LOOKUP) AS RES8_CELLS,\n       ROUND(AVG(SPREAD), 1) AS AVG_SPREAD_MIN, ROUND(MAX(SPREAD), 1) AS MAX_SPREAD_MIN\nFROM (SELECT H3_7, MAX(NEAREST_MIN) - MIN(NEAREST_MIN) AS SPREAD FROM r7 GROUP BY 1);\n\n-- =====================================================\n-- APPENDIX (optional, admin; commented out so this file runs without the ORS app:\n-- uncomment it once OPENROUTESERVICE_APP is installed)\n-- APPENDIX (optional, admin): build the matrix yourself with the OpenRouteService engine.\n-- Needs OPENROUTESERVICE_APP installed with a 'Manchester' region (README: How the matrix\n-- was built). Tested on a Manchester region: matches BRANCH_CELL_TRAVEL to 0.03 minutes.\n-- =====================================================\n-- CREATE OR REPLACE TABLE MY_BRANCH_CELLS AS\n-- SELECT DISTINCT c.value::STRING AS H3_CELL,\n--        ST_X(H3_CELL_TO_POINT(c.value::STRING)) AS LON,\n--        ST_Y(H3_CELL_TO_POINT(c.value::STRING)) AS LAT\n-- FROM BANKING_HOL.RETAIL.BRANCHES b,\n--      LATERAL FLATTEN(H3_GRID_DISK(H3_LATLNG_TO_CELL_STRING(b.LAT, b.LON, 8), 6)) c\n-- WHERE b.CITY = 'Manchester';\n-- SELECT COUNT(*) AS CELLS FROM MY_BRANCH_CELLS;\n\n-- CREATE OR REPLACE TABLE MY_MATRIX_RAW AS\n-- WITH br AS (SELECT ARRAY_AGG([LON, LAT]) WITHIN GROUP (ORDER BY BRANCH_ID) AS LOCS, COUNT(*) AS N\n--             FROM BANKING_HOL.RETAIL.BRANCHES WHERE CITY = 'Manchester'),\n-- ce AS (SELECT H3_CELL, LON, LAT, ROW_NUMBER() OVER (ORDER BY H3_CELL) - 1 AS K FROM MY_BRANCH_CELLS),\n-- calls AS (\n--     SELECT FLOOR(K / 400) AS BATCH,\n--            ARRAY_AGG([LON, LAT]) WITHIN GROUP (ORDER BY K) AS LOCS,\n--            ARRAY_AGG(H3_CELL) WITHIN GROUP (ORDER BY K) AS CELLS\n--     FROM ce GROUP BY 1)\n-- SELECT c.BATCH, c.CELLS,\n--        OPENROUTESERVICE_APP.CORE.MATRIX('driving-car', OBJECT_CONSTRUCT(\n--            'locations', ARRAY_CAT(br.LOCS, c.LOCS),\n--            'metrics', ['duration', 'distance'],\n--            'sources', ARRAY_GENERATE_RANGE(0, br.N),\n--            'destinations', ARRAY_GENERATE_RANGE(br.N, br.N + ARRAY_SIZE(c.LOCS))), 'Manchester') AS M\n-- FROM calls c, br;\n\n-- CREATE OR REPLACE TABLE MY_BRANCH_CELL_TRAVEL AS\n-- WITH br AS (SELECT BRANCH_ID, ROW_NUMBER() OVER (ORDER BY BRANCH_ID) - 1 AS I\n--             FROM BANKING_HOL.RETAIL.BRANCHES WHERE CITY = 'Manchester')\n-- SELECT br.BRANCH_ID, cell.value::STRING AS H3_CELL,\n--        r.M:durations[br.I][cell.index]::FLOAT AS DURATION_S,\n--        r.M:distances[br.I][cell.index]::FLOAT AS DISTANCE_M\n-- FROM MY_MATRIX_RAW r, br, LATERAL FLATTEN(r.CELLS) cell\n-- WHERE r.M:durations[br.I][cell.index] IS NOT NULL;\n-- SELECT COUNT(*) AS PAIRS, ROUND(AVG(DURATION_S) / 60, 1) AS AVG_MIN FROM MY_BRANCH_CELL_TRAVEL;\n\n-- SELECT COUNT(*) AS PAIRS,\n--        ROUND(CORR(m.DURATION_S, l.DURATION_S), 3) AS CORRELATION,\n--        ROUND(AVG(ABS(m.DURATION_S - l.DURATION_S)) / 60, 2) AS AVG_DIFF_MIN\n-- FROM MY_BRANCH_CELL_TRAVEL m\n-- JOIN BANKING_HOL.RETAIL.BRANCH_CELL_TRAVEL l\n--   ON l.BRANCH_ID = m.BRANCH_ID AND l.H3_CELL = m.H3_CELL AND l.PROFILE = 'driving-car';\n", "sql_name": "vignettes/da4_ors_travel_matrix/da4.sql"}, {"code": "DA5", "title": "Customer lifetime value, value at risk and next-best offers", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Analyst (Retail Banking, customer value management)<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~30 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>DS4, or <code>setup/catchup/ds1_model.sql<\/code> then <code>setup/catchup/ds4_predictions.sql<\/code> (uses <code>ML.RB_CUSTOMER_PREDICTIONS<\/code>)<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Of the customers who might leave, which ones are worth the most to keep, how much value is at stake, and what should we offer each of them?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>Table <code>ANALYTICS.CUSTOMER_VALUE<\/code>: every customer&#x27;s 5-year lifetime value and value at risk<\/li>\n<li>Table <code>ANALYTICS.CUSTOMER_VALUE_SEGMENTS<\/code>: four value-and-risk segments and a rules-based next-best offer per customer<\/li>\n<li>A save list ranked by value at risk, and a chart of where the value is<\/li>\n<\/ul>\n<h3>How it fits together<\/h3>\n<p>The data scientists (DS4) own the models: a calibrated chance of leaving and a predicted monthly margin for every customer, in <code>ML.RB_CUSTOMER_PREDICTIONS<\/code>. Customer value management owns what the bank does with them: how value is defined, which customers go in which segment, and what each is offered. Keeping the rules in SQL means the CVM team can read, change and sign them off without retraining anything.<\/p>\n<p><strong>Lifetime value<\/strong> here is 5 years of predicted monthly margin, each month weighted by the chance the customer is still with us and discounted at 10% a year. <strong>Value at risk<\/strong> is what we expect to lose in the next 12 months if we do nothing: the lifetime value of customers worth keeping, times the chance they leave in that year.<\/p>\n<h3>Steps<\/h3>\n<h4>Open a SQL file<\/h4>\n<p class=\"where\">Snowsight &gt; Projects &gt; Workspaces &gt; + Add new &gt; SQL File, role HOL_PARTICIPANT, warehouse BANKING_WH<\/p>\n<ol>\n<li>Name it <code>da5_customer_value.sql<\/code> and set the context:<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>USE ROLE HOL_PARTICIPANT;\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ANALYTICS;<\/pre><\/div>\n<h4>Look at what the models give you<\/h4>\n<p class=\"where\">the same SQL file<\/p>\n<ol>\n<li>Paste and run:<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>SELECT COUNT(*) AS CUSTOMERS,\n       ROUND(AVG(CHURN_3M) * 100, 2) AS AVG_CHANCE_OF_LEAVING_PCT,\n       ROUND(AVG(PREDICTED_MONTHLY_MARGIN_GBP), 2) AS AVG_MONTHLY_MARGIN_GBP,\n       ANY_VALUE(ATTRITION_MODEL_VERSION) AS ATTRITION_MODEL, ANY_VALUE(MARGIN_MODEL_VERSION) AS MARGIN_MODEL\nFROM BANKING_HOL.ML.RB_CUSTOMER_PREDICTIONS;<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> about 18,400 customers, a 2% average chance of leaving in 3 months, about \u00a320 of margin a month, and the model versions that produced them<\/p>\n<h4>Lifetime value and value at risk<\/h4>\n<p class=\"where\">the same SQL file<\/p>\n<ol>\n<li>Paste and run:<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>CREATE OR REPLACE TABLE CUSTOMER_VALUE AS\nWITH k AS (\n    -- nobody is certain to stay: floor the 3-month chance of leaving at 0.1%\n    SELECT CUSTOMER_ID, GREATEST(CHURN_3M, 0.001) AS CHURN_3M, PREDICTED_MONTHLY_MARGIN_GBP AS MARGIN,\n           POWER(1 - GREATEST(CHURN_3M, 0.001), 1 / 3) AS RETENTION,  -- chance of staying each month\n           POWER(1.10, 1 / 12) - 1 AS DISCOUNT               -- 10% a year, monthly\n    FROM BANKING_HOL.ML.RB_CUSTOMER_PREDICTIONS),\nq AS (SELECT *, RETENTION / (1 + DISCOUNT) AS Q FROM k)\nSELECT CUSTOMER_ID, CHURN_3M, ROUND(MARGIN, 2) AS MONTHLY_MARGIN_GBP,\n       ROUND(1 / (1 - RETENTION) / 12, 1) AS EXPECTED_YEARS,\n       -- 60 months of margin, each weighted by the chance they&#x27;re still here and discounted\n       ROUND(MARGIN * Q * (1 - POWER(Q, 60)) / (1 - Q)) AS LIFETIME_VALUE_GBP,\n       -- what we expect to lose in the next 12 months: the value of customers worth keeping, times the chance they go\n       ROUND(GREATEST(MARGIN * Q * (1 - POWER(Q, 60)) / (1 - Q), 0) * (1 - POWER(RETENTION, 12))) AS VALUE_AT_RISK_GBP\nFROM q;\nSELECT COUNT(*) AS CUSTOMERS, ROUND(MEDIAN(LIFETIME_VALUE_GBP)) AS MEDIAN_LTV, ROUND(AVG(LIFETIME_VALUE_GBP)) AS AVG_LTV,\n       ROUND(SUM(LIFETIME_VALUE_GBP)) AS TOTAL_LTV, ROUND(SUM(VALUE_AT_RISK_GBP)) AS VALUE_AT_RISK\nFROM CUSTOMER_VALUE;<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a skewed picture. The median customer is worth a little over \u00a3100 over 5 years, the average several times that, and some are loss-making (a negative lifetime value). Value at risk counts only the customers worth keeping.<\/p>\n<h4>Segments and next-best offers<\/h4>\n<p class=\"where\">the same SQL file<\/p>\n<p>High value is the top quarter by lifetime value; high risk is the fifth most likely to leave.<\/p>\n<table>\n<tr><td><\/td><td>Low risk<\/td><td>High risk<\/td><\/tr>\n<tr><td><strong>High value<\/strong><\/td><td><strong>Grow<\/strong>: offer the next product<\/td><td><strong>Save now<\/strong>: a named adviser calls<\/td><\/tr>\n<tr><td><strong>Low value<\/strong><\/td><td><strong>Maintain<\/strong><\/td><td><strong>Serve digitally<\/strong>: lower-cost channels<\/td><\/tr>\n<\/table>\n<p>The offer is a set of rules in priority order, using the signals DS1 found: a legacy saver gets a better rate, a falling salary gets support, a closing branch gets an introduction to digital and the next branch.<\/p>\n<ol>\n<li>Paste and run:<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>CREATE OR REPLACE TABLE CUSTOMER_VALUE_SEGMENTS AS\nWITH v AS (\n    SELECT v.*, f.PRODUCTS_HELD, f.ON_LEGACY_SAVER, f.SALARY_TREND, f.DIGITAL_ACTIVE, f.BRANCH_AT_RISK, f.SAVINGS_BALANCE,\n           v.LIFETIME_VALUE_GBP &gt;= PERCENTILE_CONT(0.75) WITHIN GROUP (ORDER BY v.LIFETIME_VALUE_GBP) OVER () AS HIGH_VALUE,\n           v.CHURN_3M &gt;= PERCENTILE_CONT(0.80) WITHIN GROUP (ORDER BY v.CHURN_3M) OVER () AS HIGH_RISK\n    FROM CUSTOMER_VALUE v JOIN BANKING_HOL.ML.RB_CHURN_FEATURES f USING (CUSTOMER_ID))\nSELECT CUSTOMER_ID, LIFETIME_VALUE_GBP, VALUE_AT_RISK_GBP, CHURN_3M,\n       CASE WHEN HIGH_VALUE AND HIGH_RISK THEN &#x27;Save now&#x27;\n            WHEN HIGH_VALUE THEN &#x27;Grow&#x27;\n            WHEN HIGH_RISK THEN &#x27;Serve digitally&#x27;\n            ELSE &#x27;Maintain&#x27; END AS SEGMENT,\n       CASE WHEN ON_LEGACY_SAVER = 1 THEN &#x27;Move to a better savings rate&#x27;\n            WHEN SALARY_TREND &lt; 0.8 THEN &#x27;Payment holiday or budgeting support&#x27;\n            WHEN BRANCH_AT_RISK = 1 THEN &#x27;Branch change: introduce digital and nearest branch&#x27;\n            WHEN NOT DIGITAL_ACTIVE AND HIGH_RISK THEN &#x27;App onboarding call&#x27;\n            WHEN HIGH_VALUE AND HIGH_RISK THEN &#x27;Retention call from a named adviser&#x27;\n            WHEN HIGH_VALUE AND PRODUCTS_HELD &lt;= 2 THEN &#x27;Cross-sell: ISA or credit card&#x27;\n            WHEN HIGH_VALUE AND SAVINGS_BALANCE &gt;= 20000 THEN &#x27;Premier upgrade&#x27;\n            WHEN HIGH_VALUE THEN &#x27;Thank-you: fee-free month&#x27;\n            ELSE &#x27;No action&#x27; END AS NEXT_BEST_OFFER\nFROM v;\nSELECT SEGMENT, COUNT(*) AS CUSTOMERS, ROUND(SUM(LIFETIME_VALUE_GBP)) AS LIFETIME_VALUE, ROUND(SUM(VALUE_AT_RISK_GBP)) AS VALUE_AT_RISK\nFROM CUSTOMER_VALUE_SEGMENTS GROUP BY 1 ORDER BY VALUE_AT_RISK DESC;<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> <strong>Save now<\/strong> is a few percent of customers but holds about a third of the value at risk. That&#x27;s the list to work first.<\/p>\n<h4>The save list<\/h4>\n<p class=\"where\">the same SQL file<\/p>\n<ol>\n<li>Paste and run:<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>SELECT c.FIRST_NAME || &#x27; &#x27; || c.LAST_NAME AS CUSTOMER, c.CITY, v.LIFETIME_VALUE_GBP, v.VALUE_AT_RISK_GBP,\n       ROUND(100 * v.CHURN_3M, 1) AS CHANCE_OF_LEAVING_PCT, v.NEXT_BEST_OFFER\nFROM CUSTOMER_VALUE_SEGMENTS v JOIN BANKING_HOL.RAW_DATA.RB_CUSTOMERS c USING (CUSTOMER_ID)\nWHERE v.SEGMENT = &#x27;Save now&#x27;\nORDER BY v.VALUE_AT_RISK_GBP DESC LIMIT 20;<\/pre><\/div>\n<ol>\n<li>Ask Cortex Code for the picture:<\/li>\n<\/ol>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Using BANKING_HOL.ANALYTICS.CUSTOMER_VALUE_SEGMENTS, chart lifetime value against chance of leaving for every customer (log scale for lifetime value), coloured by SEGMENT, and add a bar chart of value at risk by SEGMENT and NEXT_BEST_OFFER. Explain in three sentences where the retention budget should go.<\/pre><\/div>\n<h3>Check your work<\/h3>\n<ul>\n<li><code>CUSTOMER_VALUE<\/code> has a lifetime value and value at risk for every customer in DS4&#x27;s predictions<\/li>\n<li><code>CUSTOMER_VALUE_SEGMENTS<\/code> puts every customer in one of four segments with an offer<\/li>\n<li>Your save list is ranked by value at risk<\/li>\n<\/ul>\n<h3>In your bank<\/h3>\n<ul>\n<li><strong>Agree the definition with finance.<\/strong> Use the same customer profitability numbers finance reports, and agree the horizon and discount rate, so CVM and finance mean the same thing by &quot;worth&quot;.<\/li>\n<li><strong>Rules first, then models.<\/strong> A transparent offer policy is easy to approve and audit. Once campaigns record who took which offer, the data scientists can train a propensity model per offer and measure uplift.<\/li>\n<li><strong>Consumer Duty.<\/strong> Value-based treatment must still give every customer fair value: check what the &quot;Serve digitally&quot; and &quot;Maintain&quot; segments are offered, and how vulnerable customers are treated.<\/li>\n<li><strong>Put it where people ask.<\/strong> Add lifetime value and value at risk to a semantic view (DA1) so relationship managers can ask &quot;who in my book is most at risk?&quot; in plain English. DA6 does this with level of detail metrics, comparing every branch and neighbourhood with its city and the UK.<\/li>\n<\/ul>", "sql": "-- =====================================================\n-- VIGNETTE DA5: CUSTOMER LIFETIME VALUE, VALUE AT RISK AND NEXT-BEST OFFERS   (~30 min)\n-- Persona:  Data Analyst (Retail Banking, customer value management)\n-- Question: \"Of the customers who might leave, which are worth the most to keep,\n--            how much is at stake, and what should we offer each of them?\"\n-- Prereq:   DS4, or setup/catchup/ds1_model.sql then setup/catchup/ds4_predictions.sql\n-- Reference SQL for each step in README.md.\n-- =====================================================\n\n-- 1.\nUSE ROLE HOL_PARTICIPANT;\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ANALYTICS;\n\n-- 2.\nSELECT COUNT(*) AS CUSTOMERS,\n       ROUND(AVG(CHURN_3M) * 100, 2) AS AVG_CHANCE_OF_LEAVING_PCT,\n       ROUND(AVG(PREDICTED_MONTHLY_MARGIN_GBP), 2) AS AVG_MONTHLY_MARGIN_GBP,\n       ANY_VALUE(ATTRITION_MODEL_VERSION) AS ATTRITION_MODEL, ANY_VALUE(MARGIN_MODEL_VERSION) AS MARGIN_MODEL\nFROM BANKING_HOL.ML.RB_CUSTOMER_PREDICTIONS;\n\n-- 3.\nCREATE OR REPLACE TABLE CUSTOMER_VALUE AS\nWITH k AS (\n    -- nobody is certain to stay: floor the 3-month chance of leaving at 0.1%\n    SELECT CUSTOMER_ID, GREATEST(CHURN_3M, 0.001) AS CHURN_3M, PREDICTED_MONTHLY_MARGIN_GBP AS MARGIN,\n           POWER(1 - GREATEST(CHURN_3M, 0.001), 1 / 3) AS RETENTION,  -- chance of staying each month\n           POWER(1.10, 1 / 12) - 1 AS DISCOUNT               -- 10% a year, monthly\n    FROM BANKING_HOL.ML.RB_CUSTOMER_PREDICTIONS),\nq AS (SELECT *, RETENTION / (1 + DISCOUNT) AS Q FROM k)\nSELECT CUSTOMER_ID, CHURN_3M, ROUND(MARGIN, 2) AS MONTHLY_MARGIN_GBP,\n       ROUND(1 / (1 - RETENTION) / 12, 1) AS EXPECTED_YEARS,\n       -- 60 months of margin, each weighted by the chance they're still here and discounted\n       ROUND(MARGIN * Q * (1 - POWER(Q, 60)) / (1 - Q)) AS LIFETIME_VALUE_GBP,\n       -- what we expect to lose in the next 12 months: the value of customers worth keeping, times the chance they go\n       ROUND(GREATEST(MARGIN * Q * (1 - POWER(Q, 60)) / (1 - Q), 0) * (1 - POWER(RETENTION, 12))) AS VALUE_AT_RISK_GBP\nFROM q;\nSELECT COUNT(*) AS CUSTOMERS, ROUND(MEDIAN(LIFETIME_VALUE_GBP)) AS MEDIAN_LTV, ROUND(AVG(LIFETIME_VALUE_GBP)) AS AVG_LTV,\n       ROUND(SUM(LIFETIME_VALUE_GBP)) AS TOTAL_LTV, ROUND(SUM(VALUE_AT_RISK_GBP)) AS VALUE_AT_RISK\nFROM CUSTOMER_VALUE;\n\n-- 4.\nCREATE OR REPLACE TABLE CUSTOMER_VALUE_SEGMENTS AS\nWITH v AS (\n    SELECT v.*, f.PRODUCTS_HELD, f.ON_LEGACY_SAVER, f.SALARY_TREND, f.DIGITAL_ACTIVE, f.BRANCH_AT_RISK, f.SAVINGS_BALANCE,\n           v.LIFETIME_VALUE_GBP >= PERCENTILE_CONT(0.75) WITHIN GROUP (ORDER BY v.LIFETIME_VALUE_GBP) OVER () AS HIGH_VALUE,\n           v.CHURN_3M >= PERCENTILE_CONT(0.80) WITHIN GROUP (ORDER BY v.CHURN_3M) OVER () AS HIGH_RISK\n    FROM CUSTOMER_VALUE v JOIN BANKING_HOL.ML.RB_CHURN_FEATURES f USING (CUSTOMER_ID))\nSELECT CUSTOMER_ID, LIFETIME_VALUE_GBP, VALUE_AT_RISK_GBP, CHURN_3M,\n       CASE WHEN HIGH_VALUE AND HIGH_RISK THEN 'Save now'\n            WHEN HIGH_VALUE THEN 'Grow'\n            WHEN HIGH_RISK THEN 'Serve digitally'\n            ELSE 'Maintain' END AS SEGMENT,\n       CASE WHEN ON_LEGACY_SAVER = 1 THEN 'Move to a better savings rate'\n            WHEN SALARY_TREND < 0.8 THEN 'Payment holiday or budgeting support'\n            WHEN BRANCH_AT_RISK = 1 THEN 'Branch change: introduce digital and nearest branch'\n            WHEN NOT DIGITAL_ACTIVE AND HIGH_RISK THEN 'App onboarding call'\n            WHEN HIGH_VALUE AND HIGH_RISK THEN 'Retention call from a named adviser'\n            WHEN HIGH_VALUE AND PRODUCTS_HELD <= 2 THEN 'Cross-sell: ISA or credit card'\n            WHEN HIGH_VALUE AND SAVINGS_BALANCE >= 20000 THEN 'Premier upgrade'\n            WHEN HIGH_VALUE THEN 'Thank-you: fee-free month'\n            ELSE 'No action' END AS NEXT_BEST_OFFER\nFROM v;\nSELECT SEGMENT, COUNT(*) AS CUSTOMERS, ROUND(SUM(LIFETIME_VALUE_GBP)) AS LIFETIME_VALUE, ROUND(SUM(VALUE_AT_RISK_GBP)) AS VALUE_AT_RISK\nFROM CUSTOMER_VALUE_SEGMENTS GROUP BY 1 ORDER BY VALUE_AT_RISK DESC;\n\n-- 5.\nSELECT c.FIRST_NAME || ' ' || c.LAST_NAME AS CUSTOMER, c.CITY, v.LIFETIME_VALUE_GBP, v.VALUE_AT_RISK_GBP,\n       ROUND(100 * v.CHURN_3M, 1) AS CHANCE_OF_LEAVING_PCT, v.NEXT_BEST_OFFER\nFROM CUSTOMER_VALUE_SEGMENTS v JOIN BANKING_HOL.RAW_DATA.RB_CUSTOMERS c USING (CUSTOMER_ID)\nWHERE v.SEGMENT = 'Save now'\nORDER BY v.VALUE_AT_RISK_GBP DESC LIMIT 20;\n", "sql_name": "vignettes/da5_customer_value/da5.sql"}, {"code": "DA6", "title": "Level of detail analysis in a semantic view", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Analyst (Retail Banking), Tableau and BI users<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~40 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>DA5 (uses <code>ANALYTICS.CUSTOMER_VALUE<\/code> and <code>CUSTOMER_VALUE_SEGMENTS<\/code>; to catch up, run <code>vignettes/da5_customer_value/da5.sql<\/code>)<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>How does each neighbourhood, branch and segment compare with its city and with the UK, on profit per customer and on lifetime value at risk, from one set of definitions everyone shares?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>View <code>ANALYTICS.CUSTOMER_VALUE_DETAIL<\/code>: one row per retail customer with 12-month profit, lifetime value, value at risk and value segment<\/li>\n<li>Semantic view <code>ANALYTICS.SV_CUSTOMER_VALUE<\/code> with <strong>level of detail (LOD) metrics<\/strong>: FIXED, INCLUDE and EXCLUDE, the same ideas as Tableau&#x27;s LOD expressions<\/li>\n<li>Agent <code>ANALYTICS.CUSTOMER_VALUE_ADVISOR<\/code> that answers the same comparisons in plain English<\/li>\n<\/ul>\n<h3>Level of detail, in one paragraph<\/h3>\n<p>A normal metric is worked out at whatever grain the query groups by. An LOD metric is worked out at a different grain:<\/p>\n<table>\n<tr><td><\/td><td>What it does<\/td><td>Here<\/td><\/tr>\n<tr><td><strong>INCLUDE DIMENSIONS<\/strong><\/td><td>adds a finer grain for one calculation, then rolls it up<\/td><td>total each customer&#x27;s profit first, then average across customers<\/td><\/tr>\n<tr><td><strong>FIXED DIMENSIONS<\/strong><\/td><td>calculates at a set grain, whatever the query groups by<\/td><td>the city&#x27;s profit per customer, next to every branch or neighbourhood in it<\/td><\/tr>\n<tr><td><strong>EXCLUDE DIMENSIONS<\/strong><\/td><td>removes a grain for one calculation<\/td><td>the UK total, whatever the query groups by, for shares and comparisons<\/td><\/tr>\n<\/table>\n<p><strong>Preview:<\/strong> LOD metrics in semantic views are in preview (November 2026). They work in SQL and in Semantic Studio; Cortex Analyst and Cortex Agents don&#x27;t use them yet, which is why the last step adds benchmarks agents can use.<\/p>\n<h3>Steps<\/h3>\n<h4>Open a SQL file<\/h4>\n<p class=\"where\">Snowsight &gt; Projects &gt; Workspaces &gt; + Add new &gt; SQL File, role HOL_PARTICIPANT, warehouse BANKING_WH<\/p>\n<ol>\n<li>Name it <code>da6_level_of_detail.sql<\/code> and set the context:<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>USE ROLE HOL_PARTICIPANT;\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ANALYTICS;<\/pre><\/div>\n<h4>One row per customer<\/h4>\n<p class=\"where\">the same SQL file<\/p>\n<ol>\n<li>Paste and run:<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>CREATE OR REPLACE VIEW CUSTOMER_VALUE_DETAIL\n  COMMENT = &#x27;DA6: one row per retail customer with 12-month profit, lifetime value (DA5) and city and UK benchmarks&#x27; AS\nWITH base AS (\n    SELECT c.CUSTOMER_ID, c.CITY, INITCAP(REPLACE(c.SEGMENT, &#x27;_&#x27;, &#x27; &#x27;)) AS SEGMENT, b.BRANCH_NAME,\n           H3_LATLNG_TO_CELL_STRING(c.HOME_LAT, c.HOME_LON, 7) AS NEIGHBOURHOOD,\n           p.PROFIT_12M_GBP, v.LIFETIME_VALUE_GBP, v.VALUE_AT_RISK_GBP,\n           s.SEGMENT AS VALUE_SEGMENT, s.NEXT_BEST_OFFER\n    FROM BANKING_HOL.RAW_DATA.RB_CUSTOMERS c\n    JOIN BANKING_HOL.RETAIL.BRANCHES b ON b.BRANCH_ID = c.HOME_BRANCH_ID\n    JOIN (SELECT CUSTOMER_ID, SUM(PROFIT_GBP) AS PROFIT_12M_GBP\n          FROM BANKING_HOL.RAW_DATA.RB_MONTHLY_SNAPSHOT GROUP BY 1) p USING (CUSTOMER_ID)\n    LEFT JOIN CUSTOMER_VALUE v USING (CUSTOMER_ID)\n    LEFT JOIN CUSTOMER_VALUE_SEGMENTS s USING (CUSTOMER_ID))\n-- the same benchmarks as plain columns, for tools that don&#x27;t use LOD metrics yet (Cortex Analyst, agents)\nSELECT *, ROUND(AVG(PROFIT_12M_GBP) OVER (PARTITION BY CITY), 2) AS CITY_PROFIT_PER_CUSTOMER_GBP,\n          ROUND(AVG(PROFIT_12M_GBP) OVER (), 2) AS UK_PROFIT_PER_CUSTOMER_GBP\nFROM base;\nSELECT COUNT(*) AS CUSTOMERS, COUNT(LIFETIME_VALUE_GBP) AS WITH_LIFETIME_VALUE FROM CUSTOMER_VALUE_DETAIL;<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> 20,000 customers, about 18,400 with a lifetime value (DS4 scored the customers still with the bank on 31 Aug 2026)<\/p>\n<h4>Create the semantic view<\/h4>\n<p class=\"where\">the same SQL file<\/p>\n<p>Read the METRICS block before you run it: ordinary metrics first, then INCLUDE, FIXED and EXCLUDE, then the plain benchmarks for agents.<\/p>\n<ol>\n<li>Paste and run:<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>CREATE OR REPLACE SEMANTIC VIEW SV_CUSTOMER_VALUE\n  TABLES (\n    cust AS CUSTOMER_VALUE_DETAIL PRIMARY KEY (CUSTOMER_ID)\n      COMMENT = &#x27;One row per retail customer: 12-month profit, lifetime value, value at risk&#x27;,\n    months AS BANKING_HOL.RAW_DATA.RB_MONTHLY_SNAPSHOT PRIMARY KEY (CUSTOMER_ID, MONTH)\n      COMMENT = &#x27;One row per customer per month&#x27;)\n  RELATIONSHIPS (months (CUSTOMER_ID) REFERENCES cust)\n  FACTS (\n    cust.profit AS PROFIT_12M_GBP, cust.ltv AS LIFETIME_VALUE_GBP, cust.var AS VALUE_AT_RISK_GBP, cust.one AS 1,\n    cust.city_benchmark AS CITY_PROFIT_PER_CUSTOMER_GBP, cust.uk_benchmark AS UK_PROFIT_PER_CUSTOMER_GBP,\n    months.month_profit AS PROFIT_GBP)\n  DIMENSIONS (\n    cust.customer_id AS CUSTOMER_ID, cust.city AS CITY, cust.segment AS SEGMENT,\n    cust.branch AS BRANCH_NAME WITH SYNONYMS = (&#x27;home branch&#x27;),\n    cust.neighbourhood AS NEIGHBOURHOOD WITH SYNONYMS = (&#x27;hexagon&#x27;, &#x27;area&#x27;, &#x27;H3 cell&#x27;),\n    cust.value_segment AS VALUE_SEGMENT, cust.next_best_offer AS NEXT_BEST_OFFER,\n    months.month AS MONTH)\n  METRICS (\n    -- ordinary metrics: grouped by whatever the query groups by\n    cust.customers AS COUNT(cust.customer_id),\n    cust.total_profit AS SUM(cust.profit),\n    cust.profit_per_customer AS SUM(cust.profit) / COUNT(cust.customer_id),\n    cust.lifetime_value AS SUM(cust.ltv),\n    cust.value_at_risk AS SUM(cust.var),\n    months.avg_profit_per_customer_month AS AVG(months.month_profit)\n      COMMENT = &#x27;Average of customer-months: NOT the same as average profit per customer&#x27;,\n    -- INCLUDE: work out each customer&#x27;s total first, then average across customers\n    avg_profit_per_customer AS AVG(SUM(months.month_profit) INCLUDE DIMENSIONS (cust.customer_id))\n      COMMENT = &#x27;Average 12-month profit per customer, whatever the query groups by&#x27;,\n    -- FIXED: the city&#x27;s figures, next to every neighbourhood, branch or segment in it\n    city_profit AS SUM(SUM(cust.profit) FIXED DIMENSIONS (cust.city)),\n    city_customers AS SUM(SUM(cust.one) FIXED DIMENSIONS (cust.city)),\n    city_profit_per_customer AS city_profit / city_customers,\n    vs_city_pct AS 100 * (cust.profit_per_customer / city_profit_per_customer - 1)\n      COMMENT = &#x27;Profit per customer against the city average, in percent&#x27;,\n    -- EXCLUDE: drop every customer dimension, so this is the UK whatever the query groups by\n    uk_profit AS SUM(SUM(cust.profit) EXCLUDE DIMENSIONS (cust.city, cust.segment, cust.branch, cust.neighbourhood, cust.value_segment, cust.next_best_offer)),\n    uk_customers AS SUM(SUM(cust.one) EXCLUDE DIMENSIONS (cust.city, cust.segment, cust.branch, cust.neighbourhood, cust.value_segment, cust.next_best_offer)),\n    uk_value_at_risk AS SUM(SUM(cust.var) EXCLUDE DIMENSIONS (cust.city, cust.segment, cust.branch, cust.neighbourhood, cust.value_segment, cust.next_best_offer)),\n    uk_profit_per_customer AS uk_profit / uk_customers,\n    vs_uk_pct AS 100 * (cust.profit_per_customer / uk_profit_per_customer - 1),\n    share_of_uk_profit_pct AS 100 * cust.total_profit / uk_profit,\n    share_of_uk_value_at_risk_pct AS 100 * cust.value_at_risk / uk_value_at_risk,\n    -- the same benchmarks from plain columns: what Cortex Analyst and agents can use today\n    cust.city_profit_per_customer_benchmark AS AVG(cust.city_benchmark),\n    cust.uk_profit_per_customer_benchmark AS AVG(cust.uk_benchmark))\n  COMMENT = &#x27;DA6: retail customer profit and value, with level of detail (LOD) metrics for city and UK comparisons&#x27;;\nSHOW SEMANTIC METRICS IN SV_CUSTOMER_VALUE;<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the semantic view created, with about 20 metrics<\/p>\n<h4>INCLUDE: per customer, not per customer-month<\/h4>\n<p class=\"where\">the same SQL file<\/p>\n<p>The classic BI mistake: averaging the monthly rows gives profit per customer-<em>month<\/em>. INCLUDE totals each customer first.<\/p>\n<ol>\n<li>Paste and run:<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>SELECT * FROM SEMANTIC_VIEW(SV_CUSTOMER_VALUE\n    DIMENSIONS cust.segment\n    METRICS cust.customers, months.avg_profit_per_customer_month, avg_profit_per_customer)\nORDER BY avg_profit_per_customer DESC;<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> two very different numbers per segment. Premier customers make about \u00a3155 per customer-month but about \u00a31,750 per customer a year. Only the second answers &quot;what is a Premier customer worth?&quot;<\/p>\n<h4>FIXED: each branch against its city<\/h4>\n<p class=\"where\">the same SQL file<\/p>\n<ol>\n<li>Paste and run:<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>SELECT * FROM SEMANTIC_VIEW(SV_CUSTOMER_VALUE\n    DIMENSIONS cust.city, cust.branch\n    METRICS cust.customers, cust.profit_per_customer, city_profit_per_customer, vs_city_pct)\nWHERE city = &#x27;Leeds&#x27;\nORDER BY vs_city_pct DESC;<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> every Leeds branch next to the same Leeds figure (about \u00a3213 a customer), and how far above or below it each branch is. Leeds Horsforth is about double the city average; Leeds City Centre is well under half of it.<\/p>\n<ol>\n<li>Now move the filter <strong>inside<\/strong> the semantic view clause and compare:<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>SELECT * FROM SEMANTIC_VIEW(SV_CUSTOMER_VALUE\n    DIMENSIONS cust.branch\n    METRICS cust.profit_per_customer, uk_profit_per_customer\n    WHERE cust.city = &#x27;Leeds&#x27;);<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> &quot;UK profit per customer&quot; is now the Leeds figure. A WHERE inside <code>SEMANTIC_VIEW()<\/code> filters the data <em>before<\/em> the LOD calculation (like a context filter in Tableau); a WHERE outside filters the rows <em>after<\/em> it.<\/p>\n<h4>EXCLUDE: shares of the UK<\/h4>\n<p class=\"where\">the same SQL file<\/p>\n<ol>\n<li>Paste and run:<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>SELECT * FROM SEMANTIC_VIEW(SV_CUSTOMER_VALUE\n    DIMENSIONS cust.city\n    METRICS cust.customers, cust.total_profit, share_of_uk_profit_pct, cust.value_at_risk, share_of_uk_value_at_risk_pct)\nORDER BY share_of_uk_value_at_risk_pct DESC;<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> London holds about a quarter of UK profit and of value at risk. Compare each city&#x27;s two shares: where value at risk runs ahead of profit, the book is more fragile.<\/p>\n<ol>\n<li>The same by value segment (from DA5):<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>SELECT * FROM SEMANTIC_VIEW(SV_CUSTOMER_VALUE\n    DIMENSIONS cust.value_segment\n    METRICS cust.customers, cust.lifetime_value, share_of_uk_value_at_risk_pct, vs_uk_pct)\nORDER BY share_of_uk_value_at_risk_pct DESC;<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> <strong>Save now<\/strong> is a few percent of customers but about a third of the UK&#x27;s value at risk.<\/p>\n<p><strong>Preview note:<\/strong> ask for the city (FIXED) comparisons and the UK (EXCLUDE) comparisons in separate queries. In the preview, mixing the two in one query can return wrong numbers.<\/p>\n<h4>Neighbourhoods against their city<\/h4>\n<p class=\"where\">the same SQL file<\/p>\n<p>This is what the executive demo&#x27;s lasso does by hand: an area against the rest of its city.<\/p>\n<ol>\n<li>Paste and run:<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>SELECT * FROM SEMANTIC_VIEW(SV_CUSTOMER_VALUE\n    DIMENSIONS cust.city, cust.neighbourhood\n    METRICS cust.customers, cust.profit_per_customer, vs_city_pct)\nWHERE city = &#x27;London&#x27; AND customers &gt;= 30\nORDER BY vs_city_pct DESC LIMIT 10;<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> London neighbourhoods (H3 hexagons) where customers are worth more than twice the London average<\/p>\n<h4>Look at it in Semantic Studio<\/h4>\n<p class=\"where\">Snowsight &gt; <strong>Catalog<\/strong> &gt; Database Explorer &gt; BANKING_HOL &gt; ANALYTICS &gt; Semantic Views &gt; <strong>SV_CUSTOMER_VALUE<\/strong><\/p>\n<ol>\n<li>Open the semantic view and find the LOD metrics (<code>avg_profit_per_customer<\/code>, <code>city_profit_per_customer<\/code>, <code>uk_profit<\/code>).<\/li>\n<li>Read their definitions next to the ordinary metrics: the LOD clause is part of the governed definition, so every tool that queries the view gets the same answer.<\/li>\n<\/ol>\n<h4>Ask an agent the same questions<\/h4>\n<p class=\"where\">the same SQL file, then Snowflake CoWork<\/p>\n<p>Agents don&#x27;t use LOD metrics yet: given only those, an agent works the city and UK averages out with its own SQL. The semantic view also carries the same benchmarks as plain metrics (<code>city_profit_per_customer_benchmark<\/code>, <code>uk_profit_per_customer_benchmark<\/code>), so the agent can use the governed figures.<\/p>\n<ol>\n<li>Paste and run:<\/li>\n<\/ol>\n<div class=\"code\"><button class=\"btn ghost cp\">Copy<\/button><pre>CREATE OR REPLACE AGENT BANKING_HOL.ANALYTICS.CUSTOMER_VALUE_ADVISOR\n  COMMENT = &#x27;DA6: answers customer profit and value questions, with city and UK comparisons&#x27;\n  PROFILE = &#x27;{&quot;display_name&quot;: &quot;Customer Value Advisor&quot;, &quot;color&quot;: &quot;blue&quot;}&#x27;\n  FROM SPECIFICATION\n  $$\n  models:\n    orchestration: auto\n  instructions:\n    response: &gt;\n      You help a UK retail bank&#x27;s customer value team. Give numbers in pounds, round percentages to whole\n      numbers, and always say what each figure is compared with (the city average or the UK average).\n    orchestration: &gt;\n      Use the Analyst tool for every question. To compare an area, branch or segment with its city or the UK,\n      use the city_profit_per_customer_benchmark and uk_profit_per_customer_benchmark metrics alongside\n      profit_per_customer.\n    sample_questions:\n      - question: &quot;Which Leeds branches have the highest profit per customer, against the Leeds and UK averages?&quot;\n      - question: &quot;How much of the UK&#x27;s value at risk sits in each city?&quot;\n      - question: &quot;Which London neighbourhoods are most profitable per customer compared with London as a whole?&quot;\n  tools:\n    - tool_spec:\n        type: &quot;cortex_analyst_text_to_sql&quot;\n        name: &quot;Analyst&quot;\n        description: &quot;Retail customers: 12-month profit, lifetime value and value at risk, by city, branch, neighbourhood, segment and value segment, with city and UK benchmarks.&quot;\n  tool_resources:\n    Analyst:\n      semantic_view: &quot;BANKING_HOL.ANALYTICS.SV_CUSTOMER_VALUE&quot;\n      execution_environment:\n        type: &quot;warehouse&quot;\n        warehouse: &quot;BANKING_WH&quot;\n  $$;\nSELECT SNOWFLAKE.CORTEX.DATA_AGENT_RUN(&#x27;BANKING_HOL.ANALYTICS.CUSTOMER_VALUE_ADVISOR&#x27;,\n  $${&quot;messages&quot;:[{&quot;role&quot;:&quot;user&quot;,&quot;content&quot;:[{&quot;type&quot;:&quot;text&quot;,&quot;text&quot;:&quot;Which Leeds branches have the highest profit per customer, against the Leeds and UK averages?&quot;}]}]}$$) AS RESPONSE;<\/pre><\/div>\n<ol>\n<li>Open <strong>Snowflake CoWork<\/strong>, pick <strong>Customer Value Advisor<\/strong> and ask: <em>How much of the UK&#x27;s value at risk sits in each city?<\/em><\/li>\n<\/ol>\n<p class=\"expect\"><strong>What you should see:<\/strong> the same Leeds figures as the FIXED step (about \u00a3213 for Leeds and \u00a3233 for the UK), with the agent&#x27;s SQL using the benchmark metrics<\/p>\n<h3>Check your work<\/h3>\n<ul>\n<li><code>SV_CUSTOMER_VALUE<\/code> exists with INCLUDE, FIXED and EXCLUDE metrics<\/li>\n<li>The Leeds branch comparison gives every branch the same city figure<\/li>\n<li><code>CUSTOMER_VALUE_ADVISOR<\/code> answers the Leeds question with the Leeds and UK averages<\/li>\n<\/ul>\n<h3>In your bank<\/h3>\n<ul>\n<li><strong>Bring your Tableau logic with you.<\/strong> LOD expressions in a semantic view mean the &quot;per customer&quot;, &quot;against the region&quot; and &quot;share of total&quot; logic lives once, in Snowflake, instead of in every workbook.<\/li>\n<li><strong>Context filters still matter.<\/strong> Decide where a filter belongs (inside the semantic view query, or after it) the same way you decide what is a context filter in Tableau.<\/li>\n<li><strong>Agents next.<\/strong> When Cortex Analyst and agents support LOD metrics, the benchmark columns can go: the agent will use the same LOD definitions as everyone else.<\/li>\n<li><strong>Performance.<\/strong> At scale, materialize the semantic view&#x27;s busiest metrics so dashboards and agents don&#x27;t recompute them on every question.<\/li>\n<\/ul>", "sql": "-- =====================================================\n-- VIGNETTE DA6: LEVEL OF DETAIL ANALYSIS IN A SEMANTIC VIEW   (~40 min)\n-- Persona:  Data Analyst (Retail Banking), Tableau and BI users\n-- Question: \"How does each neighbourhood, branch and segment compare with its city\n--            and the UK, from one set of shared definitions?\"\n-- Prereq:   DA5 (ANALYTICS.CUSTOMER_VALUE, CUSTOMER_VALUE_SEGMENTS)\n-- LOD metrics in semantic views are in preview; Cortex Analyst and agents don't use them yet.\n-- Reference SQL for each step in README.md.\n-- =====================================================\n\n-- 1.\nUSE ROLE HOL_PARTICIPANT;\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ANALYTICS;\n\n-- 2.\nCREATE OR REPLACE VIEW CUSTOMER_VALUE_DETAIL\n  COMMENT = 'DA6: one row per retail customer with 12-month profit, lifetime value (DA5) and city and UK benchmarks' AS\nWITH base AS (\n    SELECT c.CUSTOMER_ID, c.CITY, INITCAP(REPLACE(c.SEGMENT, '_', ' ')) AS SEGMENT, b.BRANCH_NAME,\n           H3_LATLNG_TO_CELL_STRING(c.HOME_LAT, c.HOME_LON, 7) AS NEIGHBOURHOOD,\n           p.PROFIT_12M_GBP, v.LIFETIME_VALUE_GBP, v.VALUE_AT_RISK_GBP,\n           s.SEGMENT AS VALUE_SEGMENT, s.NEXT_BEST_OFFER\n    FROM BANKING_HOL.RAW_DATA.RB_CUSTOMERS c\n    JOIN BANKING_HOL.RETAIL.BRANCHES b ON b.BRANCH_ID = c.HOME_BRANCH_ID\n    JOIN (SELECT CUSTOMER_ID, SUM(PROFIT_GBP) AS PROFIT_12M_GBP\n          FROM BANKING_HOL.RAW_DATA.RB_MONTHLY_SNAPSHOT GROUP BY 1) p USING (CUSTOMER_ID)\n    LEFT JOIN CUSTOMER_VALUE v USING (CUSTOMER_ID)\n    LEFT JOIN CUSTOMER_VALUE_SEGMENTS s USING (CUSTOMER_ID))\n-- the same benchmarks as plain columns, for tools that don't use LOD metrics yet (Cortex Analyst, agents)\nSELECT *, ROUND(AVG(PROFIT_12M_GBP) OVER (PARTITION BY CITY), 2) AS CITY_PROFIT_PER_CUSTOMER_GBP,\n          ROUND(AVG(PROFIT_12M_GBP) OVER (), 2) AS UK_PROFIT_PER_CUSTOMER_GBP\nFROM base;\nSELECT COUNT(*) AS CUSTOMERS, COUNT(LIFETIME_VALUE_GBP) AS WITH_LIFETIME_VALUE FROM CUSTOMER_VALUE_DETAIL;\n\n-- 3.\nCREATE OR REPLACE SEMANTIC VIEW SV_CUSTOMER_VALUE\n  TABLES (\n    cust AS CUSTOMER_VALUE_DETAIL PRIMARY KEY (CUSTOMER_ID)\n      COMMENT = 'One row per retail customer: 12-month profit, lifetime value, value at risk',\n    months AS BANKING_HOL.RAW_DATA.RB_MONTHLY_SNAPSHOT PRIMARY KEY (CUSTOMER_ID, MONTH)\n      COMMENT = 'One row per customer per month')\n  RELATIONSHIPS (months (CUSTOMER_ID) REFERENCES cust)\n  FACTS (\n    cust.profit AS PROFIT_12M_GBP, cust.ltv AS LIFETIME_VALUE_GBP, cust.var AS VALUE_AT_RISK_GBP, cust.one AS 1,\n    cust.city_benchmark AS CITY_PROFIT_PER_CUSTOMER_GBP, cust.uk_benchmark AS UK_PROFIT_PER_CUSTOMER_GBP,\n    months.month_profit AS PROFIT_GBP)\n  DIMENSIONS (\n    cust.customer_id AS CUSTOMER_ID, cust.city AS CITY, cust.segment AS SEGMENT,\n    cust.branch AS BRANCH_NAME WITH SYNONYMS = ('home branch'),\n    cust.neighbourhood AS NEIGHBOURHOOD WITH SYNONYMS = ('hexagon', 'area', 'H3 cell'),\n    cust.value_segment AS VALUE_SEGMENT, cust.next_best_offer AS NEXT_BEST_OFFER,\n    months.month AS MONTH)\n  METRICS (\n    -- ordinary metrics: grouped by whatever the query groups by\n    cust.customers AS COUNT(cust.customer_id),\n    cust.total_profit AS SUM(cust.profit),\n    cust.profit_per_customer AS SUM(cust.profit) / COUNT(cust.customer_id),\n    cust.lifetime_value AS SUM(cust.ltv),\n    cust.value_at_risk AS SUM(cust.var),\n    months.avg_profit_per_customer_month AS AVG(months.month_profit)\n      COMMENT = 'Average of customer-months: NOT the same as average profit per customer',\n    -- INCLUDE: work out each customer's total first, then average across customers\n    avg_profit_per_customer AS AVG(SUM(months.month_profit) INCLUDE DIMENSIONS (cust.customer_id))\n      COMMENT = 'Average 12-month profit per customer, whatever the query groups by',\n    -- FIXED: the city's figures, next to every neighbourhood, branch or segment in it\n    city_profit AS SUM(SUM(cust.profit) FIXED DIMENSIONS (cust.city)),\n    city_customers AS SUM(SUM(cust.one) FIXED DIMENSIONS (cust.city)),\n    city_profit_per_customer AS city_profit / city_customers,\n    vs_city_pct AS 100 * (cust.profit_per_customer / city_profit_per_customer - 1)\n      COMMENT = 'Profit per customer against the city average, in percent',\n    -- EXCLUDE: drop every customer dimension, so this is the UK whatever the query groups by\n    uk_profit AS SUM(SUM(cust.profit) EXCLUDE DIMENSIONS (cust.city, cust.segment, cust.branch, cust.neighbourhood, cust.value_segment, cust.next_best_offer)),\n    uk_customers AS SUM(SUM(cust.one) EXCLUDE DIMENSIONS (cust.city, cust.segment, cust.branch, cust.neighbourhood, cust.value_segment, cust.next_best_offer)),\n    uk_value_at_risk AS SUM(SUM(cust.var) EXCLUDE DIMENSIONS (cust.city, cust.segment, cust.branch, cust.neighbourhood, cust.value_segment, cust.next_best_offer)),\n    uk_profit_per_customer AS uk_profit / uk_customers,\n    vs_uk_pct AS 100 * (cust.profit_per_customer / uk_profit_per_customer - 1),\n    share_of_uk_profit_pct AS 100 * cust.total_profit / uk_profit,\n    share_of_uk_value_at_risk_pct AS 100 * cust.value_at_risk / uk_value_at_risk,\n    -- the same benchmarks from plain columns: what Cortex Analyst and agents can use today\n    cust.city_profit_per_customer_benchmark AS AVG(cust.city_benchmark),\n    cust.uk_profit_per_customer_benchmark AS AVG(cust.uk_benchmark))\n  COMMENT = 'DA6: retail customer profit and value, with level of detail (LOD) metrics for city and UK comparisons';\nSHOW SEMANTIC METRICS IN SV_CUSTOMER_VALUE;\n\n-- 4.\nSELECT * FROM SEMANTIC_VIEW(SV_CUSTOMER_VALUE\n    DIMENSIONS cust.segment\n    METRICS cust.customers, months.avg_profit_per_customer_month, avg_profit_per_customer)\nORDER BY avg_profit_per_customer DESC;\n\n-- 5.\nSELECT * FROM SEMANTIC_VIEW(SV_CUSTOMER_VALUE\n    DIMENSIONS cust.city, cust.branch\n    METRICS cust.customers, cust.profit_per_customer, city_profit_per_customer, vs_city_pct)\nWHERE city = 'Leeds'\nORDER BY vs_city_pct DESC;\n\n-- 6.\nSELECT * FROM SEMANTIC_VIEW(SV_CUSTOMER_VALUE\n    DIMENSIONS cust.branch\n    METRICS cust.profit_per_customer, uk_profit_per_customer\n    WHERE cust.city = 'Leeds');\n\n-- 7.\nSELECT * FROM SEMANTIC_VIEW(SV_CUSTOMER_VALUE\n    DIMENSIONS cust.city\n    METRICS cust.customers, cust.total_profit, share_of_uk_profit_pct, cust.value_at_risk, share_of_uk_value_at_risk_pct)\nORDER BY share_of_uk_value_at_risk_pct DESC;\n\n-- 8.\nSELECT * FROM SEMANTIC_VIEW(SV_CUSTOMER_VALUE\n    DIMENSIONS cust.value_segment\n    METRICS cust.customers, cust.lifetime_value, share_of_uk_value_at_risk_pct, vs_uk_pct)\nORDER BY share_of_uk_value_at_risk_pct DESC;\n\n-- 9.\nSELECT * FROM SEMANTIC_VIEW(SV_CUSTOMER_VALUE\n    DIMENSIONS cust.city, cust.neighbourhood\n    METRICS cust.customers, cust.profit_per_customer, vs_city_pct)\nWHERE city = 'London' AND customers >= 30\nORDER BY vs_city_pct DESC LIMIT 10;\n\n-- 10.\nCREATE OR REPLACE AGENT BANKING_HOL.ANALYTICS.CUSTOMER_VALUE_ADVISOR\n  COMMENT = 'DA6: answers customer profit and value questions, with city and UK comparisons'\n  PROFILE = '{\"display_name\": \"Customer Value Advisor\", \"color\": \"blue\"}'\n  FROM SPECIFICATION\n  $$\n  models:\n    orchestration: auto\n  instructions:\n    response: >\n      You help a UK retail bank's customer value team. Give numbers in pounds, round percentages to whole\n      numbers, and always say what each figure is compared with (the city average or the UK average).\n    orchestration: >\n      Use the Analyst tool for every question. To compare an area, branch or segment with its city or the UK,\n      use the city_profit_per_customer_benchmark and uk_profit_per_customer_benchmark metrics alongside\n      profit_per_customer.\n    sample_questions:\n      - question: \"Which Leeds branches have the highest profit per customer, against the Leeds and UK averages?\"\n      - question: \"How much of the UK's value at risk sits in each city?\"\n      - question: \"Which London neighbourhoods are most profitable per customer compared with London as a whole?\"\n  tools:\n    - tool_spec:\n        type: \"cortex_analyst_text_to_sql\"\n        name: \"Analyst\"\n        description: \"Retail customers: 12-month profit, lifetime value and value at risk, by city, branch, neighbourhood, segment and value segment, with city and UK benchmarks.\"\n  tool_resources:\n    Analyst:\n      semantic_view: \"BANKING_HOL.ANALYTICS.SV_CUSTOMER_VALUE\"\n      execution_environment:\n        type: \"warehouse\"\n        warehouse: \"BANKING_WH\"\n  $$;\nSELECT SNOWFLAKE.CORTEX.DATA_AGENT_RUN('BANKING_HOL.ANALYTICS.CUSTOMER_VALUE_ADVISOR',\n  $${\"messages\":[{\"role\":\"user\",\"content\":[{\"type\":\"text\",\"text\":\"Which Leeds branches have the highest profit per customer, against the Leeds and UK averages?\"}]}]}$$) AS RESPONSE;\n", "sql_name": "vignettes/da6_level_of_detail/da6.sql"}, {"code": "DS0", "title": "Tour the retail data as a data scientist", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Scientist<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~20 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>Facilitator setup complete<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>What can we predict from the retail banking data, what does a good training set look like, and where are the traps?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>Nothing yet: you tour the retail data product with Cortex Code as a data scientist (the labels, the features, the class balance and the leakage traps), then pick a model to build in DS1 or DS2.<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Open Cortex Code<\/h4>\n<p class=\"where\">Snowsight home page, the <strong>Home / CoCo<\/strong> toggle (top left) &gt; <strong>CoCo<\/strong><\/p>\n<ol>\n<li>At the top left of Snowsight, switch the toggle from <strong>Home<\/strong> to <strong>CoCo<\/strong>.<\/li>\n<li>Close the <strong>CoCo mode (preview)<\/strong> pop-up if it appears.<\/li>\n<li>Press <strong>New session<\/strong>.<\/li>\n<li>Paste each prompt in this module into the <strong>How can I help?<\/strong> box.<\/li>\n<\/ol>\n<p>When Cortex Code wants to run a query, it shows a <strong>Run this command?<\/strong> card:<\/p>\n<ul>\n<li><strong>Allow<\/strong> lets it run<\/li>\n<li><strong>Skip<\/strong> stops it<\/li>\n<\/ul>\n<p><strong>Tip:<\/strong> you&#x27;re signed in as <code>HOL_PARTICIPANT<\/code>, with <code>BANKING_WH<\/code> and <code>BANKING_HOL<\/code> as your defaults. Cortex Code uses them, so you don&#x27;t need to set a role or warehouse.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> the Cortex Code screen with a <strong>How can I help?<\/strong> box<\/p>\n<h4>Find the labels<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>I&#x27;m a data scientist exploring the retail banking tables in BANKING_HOL.RAW_DATA (the RB_ tables). Which columns could be targets for a model? For attrition (RB_CUSTOMERS.CHURNED and CHURN_DATE) and fraud (RB_TRANSACTIONS.IS_FRAUD and FRAUD_TYPE), show the rate, the counts and how they change by month, and say how imbalanced each one is.<\/pre><\/div>\n<p><strong>Tip:<\/strong> rare labels are normal in banking. Accuracy is a useless metric when 98% of customers stay.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> about 9% of customers left over the year and about 0.4% of transactions are fraud, in four fraud types, so both labels are heavily imbalanced<\/p>\n<h4>Meet the features<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>For attrition, which signals in RB_CUSTOMERS, RB_ACCOUNTS joined to RB_PRODUCTS, RB_EMPLOYMENT and RB_MONTHLY_SNAPSHOT look different for customers who left? Compare leavers with stayers on tenure, product count, savings rate (and legacy savings products), salary trend, app logins, branch visits, home branch and complaints. Show it as one table.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> leavers have shorter tenure (about 59 months against 89), fewer products and three times the complaints, and are five times as likely to be branch-reliant at one of the three closure branches. Low-rate legacy savers only stand out when the balance is large.<\/p>\n<h4>Spot the leakage<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>If I train an attrition model on these tables, which columns would leak the answer? Check CHURN_DATE, CHURN_REASON, RB_MONTHLY_SNAPSHOT.CHURNED_FLAG, RB_ACCOUNTS.CLOSED_DATE and STATUS, and the snapshot months just before a customer leaves. Explain how to build point-in-time features from an observation date, so the model only sees what we knew at the time.<\/pre><\/div>\n<p><strong>Important:<\/strong> a model that sees the future looks brilliant in training and fails in production.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> all of those columns leak, and so do the last months before leaving, when salary credits fade. The fix is one observation date (for example 31 Aug 2026), features only from before it, and the label from the 3 months after.<\/p>\n<h4>See what fraud looks like<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>For RB_TRANSACTIONS, profile the four fraud types: typical amount, hour of day, online or not, new payee, merchant country and how quickly the transactions follow each other. What features would an anomaly detector need, given we can&#x27;t rely on labels for new fraud patterns?<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> card testing is a burst of tiny online payments then a big one; impossible travel is two countries within an hour; account takeover is night-time transfers to new payees; APP scams are large Faster Payments to new payees, often from older customers<\/p>\n<h4>Pick your model<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Summarise what we found as a short modelling brief for two models: an attrition classifier (target, observation window, features, leakage to avoid, metric) and a fraud anomaly detector (features, how to evaluate without trusting labels). Which tables would each read?<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a two-part brief. Then build them:<\/p>\n<ul>\n<li><strong>DS1<\/strong> trains the attrition model in a notebook, tracks it in an experiment and registers it<\/li>\n<li><strong>DS2<\/strong> builds the fraud anomaly model the same way<\/li>\n<\/ul>\n<h3>Check your work<\/h3>\n<p>You have profiled the retail labels and features, including the monthly snapshot and the transaction ledger.<\/p>\n<h3>In your bank<\/h3>\n<p>At a bank a model like this goes through model risk review. Point-in-time features, a tracked experiment and a registered, versioned model are the evidence that review asks for.<\/p>", "sql": "-- =====================================================\n-- DS0: TOUR THE RETAIL DATA AS A DATA SCIENTIST - reference queries\n-- Run as HOL_PARTICIPANT.\n-- =====================================================\nUSE SECONDARY ROLES NONE;\nUSE WAREHOUSE BANKING_WH;\n\n-- 1. The labels and how imbalanced they are\nSELECT 'attrition (customers who left)' AS LABEL, COUNT_IF(CHURNED) AS POSITIVES, COUNT(*) AS TOTAL,\n       ROUND(100 * COUNT_IF(CHURNED) / COUNT(*), 2) AS PCT FROM BANKING_HOL.RAW_DATA.RB_CUSTOMERS\nUNION ALL\nSELECT 'fraud (transactions)', COUNT_IF(IS_FRAUD), COUNT(*), ROUND(100 * COUNT_IF(IS_FRAUD) / COUNT(*), 2)\nFROM BANKING_HOL.RAW_DATA.RB_TRANSACTIONS;\n\n-- 2. Leavers against stayers\nSELECT c.CHURNED,\n       ROUND(AVG(DATEDIFF(month, c.CUSTOMER_SINCE, '2026-11-20'::DATE))) AS AVG_TENURE_MONTHS,\n       ROUND(AVG(h.PRODUCTS), 2) AS AVG_PRODUCTS,\n       ROUND(100 * AVG(h.LEGACY_SAVER), 1) AS PCT_LEGACY_SAVER,\n       ROUND(100 * AVG(IFF(c.HOME_BRANCH_ID IN ('BR-MAN-90', 'BR-LDS-90', 'BR-CDF-90') AND NOT c.DIGITAL_ACTIVE, 1, 0)), 1) AS PCT_BRANCH_RELIANT_AT_CLOSURE,\n       ROUND(AVG(c.COMPLAINTS_12M), 2) AS AVG_COMPLAINTS\nFROM BANKING_HOL.RAW_DATA.RB_CUSTOMERS c\nJOIN (SELECT a.CUSTOMER_ID, COUNT(*) AS PRODUCTS, MAX(IFF(p.TIER = 'LEGACY', 1, 0)) AS LEGACY_SAVER\n      FROM BANKING_HOL.RAW_DATA.RB_ACCOUNTS a JOIN BANKING_HOL.RAW_DATA.RB_PRODUCTS p ON p.PRODUCT_ID = a.PRODUCT_ID\n      GROUP BY 1) h ON h.CUSTOMER_ID = c.CUSTOMER_ID\nGROUP BY 1;\n\n-- 3. Leakage: salary credits fade in the months before a customer leaves\nSELECT DATEDIFF(month, s.MONTH, c.CHURN_DATE) AS MONTHS_BEFORE_LEAVING, ROUND(AVG(s.SALARY_IN_GBP)) AS AVG_SALARY_IN\nFROM BANKING_HOL.RAW_DATA.RB_MONTHLY_SNAPSHOT s\nJOIN BANKING_HOL.RAW_DATA.RB_CUSTOMERS c ON c.CUSTOMER_ID = s.CUSTOMER_ID\nWHERE c.CHURNED AND DATEDIFF(month, s.MONTH, c.CHURN_DATE) BETWEEN 0 AND 6\nGROUP BY 1 ORDER BY 1 DESC;\n\n-- 4. What each fraud type looks like\nSELECT FRAUD_TYPE, COUNT(*) AS TXNS, ROUND(MEDIAN(-AMOUNT_GBP), 2) AS MEDIAN_AMOUNT,\n       ROUND(AVG(HOUR(TXN_TS)), 1) AS AVG_HOUR, ROUND(100 * AVG(IFF(IS_ONLINE, 1, 0))) AS PCT_ONLINE,\n       ROUND(100 * AVG(IFF(IS_NEW_PAYEE, 1, 0))) AS PCT_NEW_PAYEE, ROUND(100 * AVG(IFF(MERCHANT_COUNTRY <> 'GB', 1, 0))) AS PCT_ABROAD\nFROM BANKING_HOL.RAW_DATA.RB_TRANSACTIONS\nWHERE IS_FRAUD GROUP BY 1 ORDER BY 2 DESC;\n", "sql_name": "vignettes/ds0_retail_data_tour/ds0.sql"}, {"code": "DS1", "title": "Predict attrition with an experiment and the Model Registry", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Data Scientist<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~45 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>DS0 recommended. Uses the RB_ tables in <code>BANKING_HOL.RAW_DATA<\/code> and the <code>BANKING_HOL.ML<\/code> schema, built at provisioning<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Which retail customers will leave in the next 3 months, why, and who should the retention team call first?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>View <code>ML.RB_CHURN_FEATURES<\/code>: point-in-time features observed on 31 Aug 2026, labelled with who left in the 3 months after<\/li>\n<li>An ML Job on <code>DS_TRAINING_POOL<\/code> that trains the models, away from the notebook&#x27;s own small compute<\/li>\n<li>Experiment <code>ML.RB_ATTRITION<\/code> with two tracked runs (logistic baseline and XGBoost) and their metrics<\/li>\n<li>Model <code>ML.RB_ATTRITION_MODEL<\/code> in the Model Registry, best run as the default version<\/li>\n<li>Table <code>ML.RB_ATTRITION_SCORES<\/code>: a churn probability and risk band for every customer, scored with the registered model<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Go back Home and open the banking-hol-pack Workspace<\/h4>\n<p class=\"where\">the <strong>Home / CoCo<\/strong> toggle &gt; <strong>Home<\/strong>, then <strong>Projects &gt; Workspaces<\/strong> &gt; the <strong>My Workspace<\/strong> dropdown (top left) &gt; <strong>banking-hol-pack<\/strong><\/p>\n<ol>\n<li>Switch the toggle
