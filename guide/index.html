R (PARTITION BY CUSTOMER_NAME ORDER BY SUM(AMOUNT) DESC) AS RN\n    FROM BANKING_HOL.COWORK_PACK.PAYMENT_ACTIVITY\n    WHERE STATUS = 'FAILED'\n      AND PAYMENT_DATE >= DATEADD('week', -1, DATE_TRUNC('week', CURRENT_DATE()))\n      AND PAYMENT_DATE <  DATE_TRUNC('week', CURRENT_DATE())\n    GROUP BY 1, 2, 3\n)\nWHERE RN = 1\nORDER BY CLIENT_FAILED_VALUE DESC\nLIMIT 5;\n\n-- 6. Dashboard tile queries (what Cortex Code should generate for payments_ops)\n--    Scorecards\nSELECT SUM(AMOUNT) AS PAYMENT_VALUE,\n       ROUND(COUNT_IF(STATUS = 'COMPLETED') / NULLIF(COUNT(*), 0) * 100, 1) AS SUCCESS_RATE_PCT,\n       SUM(IFF(STATUS = 'FAILED', AMOUNT, 0)) AS FAILED_VALUE\nFROM BANKING_HOL.COWORK_PACK.PAYMENT_ACTIVITY\nWHERE PAYMENT_DATE >= DATEADD('month', -12, CURRENT_DATE());\n--    Top 10 clients by failed value\nSELECT CUSTOMER_NAME, CUSTOMER_SECTOR, RM_NAME, SUM(AMOUNT) AS FAILED_VALUE, COUNT(*) AS FAILED_PAYMENTS\nFROM BANKING_HOL.COWORK_PACK.PAYMENT_ACTIVITY\nWHERE STATUS = 'FAILED' AND PAYMENT_DATE >= DATEADD('month', -12, CURRENT_DATE())\nGROUP BY 1, 2, 3\nORDER BY FAILED_VALUE DESC\nLIMIT 10;\n--    Failed payments by error code\nSELECT ERROR_CODE, COUNT(*) AS FAILED_PAYMENTS, SUM(AMOUNT) AS FAILED_VALUE\nFROM BANKING_HOL.COWORK_PACK.PAYMENT_ACTIVITY\nWHERE STATUS = 'FAILED' AND PAYMENT_DATE >= DATEADD('month', -12, CURRENT_DATE())\nGROUP BY 1\nORDER BY FAILED_PAYMENTS DESC;\n", "sql_name": "vignettes/ops3_cowork_dashboards/ops3.sql"}, {"code": "OPS4", "title": "Stay inside impact tolerance", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Payments Ops analyst / team lead<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~35 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td><code>setup/catchup/core_analytics.sql<\/code><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Operational resilience rules ask us to keep each important business service within its impact tolerance. Would we know a CHAPS payment was going to miss the cut-off in time to do something about it, and could we prove it afterwards?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li><code>IMPORTANT_BUSINESS_SERVICES<\/code> with an impact tolerance for each service<\/li>\n<li><code>V_TOLERANCE_BREACHES<\/code>: payments in flight that are past their limit and not yet escalated<\/li>\n<li>Snowflake Alert <code>ALERT_IMPACT_TOLERANCE<\/code>, which calls <code>RAISE_ESCALATIONS<\/code> and records each breach in <code>ESCALATIONS<\/code><\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Write down the important business services<\/h4>\n<p class=\"where\">the Cortex Code sidebar<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>In BANKING_HOL.ANALYTICS create a table IMPORTANT_BUSINESS_SERVICES (SERVICE, PAYMENT_TYPE, IMPACT_TOLERANCE, CUTOFF_UK as a TIME, ESCALATE_MINUTES_BEFORE, OWNER) with two rows: &#x27;Make a high-value same-day payment&#x27; for CHAPS, tolerance &#x27;Settled before the 18:00 CHAPS cut-off on the day it is sent&#x27;, cut-off 18:00, escalate 60 minutes before; and &#x27;Make a real-time payment&#x27; for FASTER_PAYMENTS, tolerance &#x27;Back within 2 hours of a disruption&#x27;, cut-off 23:59, escalate 120 minutes before. Owner for both: Head of Payments Operations.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the tolerance is now data next to the payments, not a line in a policy document<\/p>\n<h4>Measure payments against the tolerance<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>In BANKING_HOL.ANALYTICS create a table PAYMENTS_IN_FLIGHT (PAYMENT_ID, RECEIVED_AT TIMESTAMP_NTZ, PAYMENT_TYPE, CLIENT_NAME, AMOUNT_GBP NUMBER(15,2), STATUS, PROCESSING_TIME_MS) and a table ESCALATIONS (ESCALATION_ID, RAISED_AT TIMESTAMP_LTZ, PAYMENT_ID, SERVICE, MINUTES_TO_CUTOFF, OWNER, MESSAGE). Then create a view V_TOLERANCE_BREACHES of in-flight payments with STATUS PENDING or FAILED whose PROCESSING_TIME_MS is over the scheme&#x27;s MAX_PROCESSING_TIME_MS in BANKING_HOL.RAW_DATA.SLA_DEFINITIONS, joined to IMPORTANT_BUSINESS_SERVICES, with MINUTES_TO_CUTOFF from the current UK time (CONVERT_TIMEZONE to Europe/London) to today&#x27;s CUTOFF_UK, and only payments with no row in ESCALATIONS yet.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> an empty view for now: nothing is in flight<\/p>\n<h4>Escalate with a Snowflake Alert<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>In BANKING_HOL.ANALYTICS create a SQL stored procedure RAISE_ESCALATIONS() that inserts one ESCALATIONS row per row of V_TOLERANCE_BREACHES (id &#x27;ESC-&#x27; plus the payment id, the service, minutes to cut-off, the owner, and a one-line message naming the client, scheme, amount and either the minutes left or that the tolerance was breached), then suspends the alert ALERT_IMPACT_TOLERANCE and returns how many it raised. Then create the alert ALERT_IMPACT_TOLERANCE on BANKING_WH, schedule 1 minute, that runs when V_TOLERANCE_BREACHES has any rows and calls RAISE_ESCALATIONS. Leave it suspended.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a suspended alert: it only costs anything while it is switched on, and it switches itself off after escalating<\/p>\n<h4>Test it with a stuck payment<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Insert a test row into BANKING_HOL.ANALYTICS.PAYMENTS_IN_FLIGHT: id &#x27;TEST-&#x27; plus 10 random characters, received now, CHAPS, client &#x27;Liverpool Freight&#x27;, 250000, status PENDING, processing time 9000 ms. Then resume ALERT_IMPACT_TOLERANCE.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the alert switched on, with one breach waiting in <code>V_TOLERANCE_BREACHES<\/code><\/p>\n<h4>Watch it escalate<\/h4>\n<p>Give the alert about a minute to run, then:<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Show the history of ALERT_IMPACT_TOLERANCE for the last hour from INFORMATION_SCHEMA.ALERT_HISTORY, the rows in ESCALATIONS, and whether the alert is now suspended.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> one run in state <code>TRIGGERED<\/code>, one escalation, and the alert suspended again<\/p>\n<h4>Brief the board<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Using IMPORTANT_BUSINESS_SERVICES, ESCALATIONS and the alert history of ALERT_IMPACT_TOLERANCE, write a short board-ready note: for each important business service, its impact tolerance, how many breaches were escalated, how long after the payment arrived each was escalated, and whether any escalation came too late to act.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> evidence for the operational resilience self-assessment, straight from the alert history<\/p>\n<h3>Check your work<\/h3>\n<p><code>ALERT_IMPACT_TOLERANCE<\/code> shows a <code>TRIGGERED<\/code> run, <code>ESCALATIONS<\/code> has a row for your test payment, and the alert is suspended again.<\/p>\n<h3>In your bank<\/h3>\n<p>In production the alert would read the live payments feed (the DE2 dynamic table or the DE3 stream) and send to the operations on-call channel through a notification integration. The executive demo&#x27;s &quot;A payment at risk&quot; stop is this module, finished.<\/p>", "sql": "-- =====================================================\n-- OPS4: Stay inside impact tolerance (solution / catch-up)\n-- Operational resilience: an important business service, its impact tolerance, and a\n-- Snowflake Alert that escalates a breach before the tolerance is reached.\n-- Run as HOL_PARTICIPANT. Writes only to BANKING_HOL.ANALYTICS; nothing is emailed.\n-- =====================================================\nUSE ROLE HOL_PARTICIPANT;\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ANALYTICS;\n\n-- 1. The important business services and their impact tolerances, as data\nCREATE OR REPLACE TABLE IMPORTANT_BUSINESS_SERVICES (\n    SERVICE                VARCHAR,\n    PAYMENT_TYPE           VARCHAR,\n    IMPACT_TOLERANCE       VARCHAR,\n    CUTOFF_UK              TIME,      -- the payment must settle before this, UK time\n    ESCALATE_MINUTES_BEFORE NUMBER,   -- escalate while there is still this much time to act\n    OWNER                  VARCHAR\n);\nINSERT INTO IMPORTANT_BUSINESS_SERVICES VALUES\n  ('Make a high-value same-day payment', 'CHAPS', 'Settled before the 18:00 CHAPS cut-off on the day it is sent', '18:00', 60, 'Head of Payments Operations'),\n  ('Make a real-time payment', 'FASTER_PAYMENTS', 'Back within 2 hours of a disruption', '23:59', 120, 'Head of Payments Operations');\n\n-- 2. Payments in flight today (the lab's sources are read-only, so tests go here)\nCREATE OR REPLACE TABLE PAYMENTS_IN_FLIGHT (\n    PAYMENT_ID         VARCHAR,\n    RECEIVED_AT        TIMESTAMP_NTZ,\n    PAYMENT_TYPE       VARCHAR,\n    CLIENT_NAME        VARCHAR,\n    AMOUNT_GBP         NUMBER(15, 2),\n    STATUS             VARCHAR,\n    PROCESSING_TIME_MS NUMBER\n);\n\n-- 3. Breaches against tolerance: in flight past the scheme's limit, not yet escalated\nCREATE OR REPLACE TABLE ESCALATIONS (\n    ESCALATION_ID VARCHAR, RAISED_AT TIMESTAMP_LTZ, PAYMENT_ID VARCHAR, SERVICE VARCHAR,\n    MINUTES_TO_CUTOFF NUMBER, OWNER VARCHAR, MESSAGE VARCHAR\n);\nCREATE OR REPLACE VIEW V_TOLERANCE_BREACHES AS\nWITH now_uk AS (SELECT CONVERT_TIMEZONE('Europe/London', CURRENT_TIMESTAMP())::TIMESTAMP_NTZ AS T)\nSELECT p.PAYMENT_ID, p.PAYMENT_TYPE, p.CLIENT_NAME, p.AMOUNT_GBP, p.PROCESSING_TIME_MS, s.MAX_PROCESSING_TIME_MS,\n       b.SERVICE, b.IMPACT_TOLERANCE, b.OWNER,\n       DATEDIFF(minute, n.T, TIMESTAMP_NTZ_FROM_PARTS(n.T::DATE, b.CUTOFF_UK)) AS MINUTES_TO_CUTOFF\nFROM PAYMENTS_IN_FLIGHT p\nJOIN BANKING_HOL.RAW_DATA.SLA_DEFINITIONS s ON s.PAYMENT_TYPE = p.PAYMENT_TYPE\nJOIN IMPORTANT_BUSINESS_SERVICES b ON b.PAYMENT_TYPE = p.PAYMENT_TYPE\nCROSS JOIN now_uk n\nWHERE p.STATUS IN ('PENDING', 'FAILED') AND p.PROCESSING_TIME_MS > s.MAX_PROCESSING_TIME_MS\n  AND NOT EXISTS (SELECT 1 FROM ESCALATIONS e WHERE e.PAYMENT_ID = p.PAYMENT_ID);\n\n-- 4. The escalation: one row per breach, then the alert switches itself off until the next test\nCREATE OR REPLACE PROCEDURE RAISE_ESCALATIONS()\nRETURNS VARCHAR\nLANGUAGE SQL\nAS\n$$\nDECLARE\n  n INTEGER;\nBEGIN\n  INSERT INTO BANKING_HOL.ANALYTICS.ESCALATIONS\n  SELECT 'ESC-' || SUBSTR(PAYMENT_ID, 1, 20), CURRENT_TIMESTAMP(), PAYMENT_ID, SERVICE, MINUTES_TO_CUTOFF, OWNER,\n         CLIENT_NAME || ': ' || PAYMENT_TYPE || ' of GBP ' || TRIM(TO_CHAR(AMOUNT_GBP, '999,999,990')) || ' held past its limit. Service \"'\n         || SERVICE || '\": ' || IFF(MINUTES_TO_CUTOFF > 0, MINUTES_TO_CUTOFF || ' minutes to the cut-off.', 'cut-off passed: impact tolerance breached.')\n  FROM BANKING_HOL.ANALYTICS.V_TOLERANCE_BREACHES;\n  n := SQLROWCOUNT;\n  ALTER ALERT BANKING_HOL.ANALYTICS.ALERT_IMPACT_TOLERANCE SUSPEND;\n  RETURN n || ' escalation(s) raised';\nEND;\n$$;\n\n-- 5. The Snowflake Alert: checks every minute while switched on\nCREATE OR REPLACE ALERT ALERT_IMPACT_TOLERANCE\n  WAREHOUSE = BANKING_WH\n  SCHEDULE = '1 MINUTE'\n  IF (EXISTS (SELECT PAYMENT_ID, SERVICE, MINUTES_TO_CUTOFF FROM BANKING_HOL.ANALYTICS.V_TOLERANCE_BREACHES))\n  THEN CALL BANKING_HOL.ANALYTICS.RAISE_ESCALATIONS();\n\n-- 6. Test it: a stuck GBP 250,000 CHAPS payment, then switch the alert on\nINSERT INTO PAYMENTS_IN_FLIGHT\nSELECT 'TEST-' || UPPER(LEFT(REPLACE(UUID_STRING(), '-', ''), 10)), CURRENT_TIMESTAMP()::TIMESTAMP_NTZ, 'CHAPS', 'Liverpool Freight', 250000, 'PENDING', 9000;\nALTER ALERT ALERT_IMPACT_TOLERANCE RESUME;\n\n-- About a minute later: TRIGGERED, one escalation, and the alert suspended again\nSELECT NAME, STATE, SCHEDULED_TIME, SQL_ERROR_MESSAGE\nFROM TABLE(BANKING_HOL.INFORMATION_SCHEMA.ALERT_HISTORY(SCHEDULED_TIME_RANGE_START => DATEADD(hour, -1, CURRENT_TIMESTAMP())))\nWHERE NAME = 'ALERT_IMPACT_TOLERANCE' ORDER BY SCHEDULED_TIME DESC;\nSELECT * FROM ESCALATIONS ORDER BY RAISED_AT DESC;\n", "sql_name": "vignettes/ops4_impact_tolerance/ops4.sql"}, {"code": "AI1", "title": "Agent with custom tools", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>AI Builder<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~45 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>DA1 (<code>SV_CLIENT_360<\/code>), or run <code>client_360.sql<\/code> if you skipped it<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Ops staff ask about specific payments by ID and about scheme rules - not just aggregates. Give the agent precise tools.<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>UDF tools <code>PAYMENT_LOOKUP<\/code>, <code>SCHEME_RULES<\/code><\/li>\n<li>Agent <code>BANKING_HOL.AGENTS.PAYMENTS_INVESTIGATOR<\/code><\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Build the payment lookup tool<\/h4>\n<p class=\"where\">the Cortex Code sidebar<\/p>\n<p>Deterministic tools keep exact lookups exact, with no text-to-SQL guessing.<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>In BANKING_HOL.AGENTS create a SQL table function GET_PAYMENT_DETAILS(PAYMENT_ID_IN VARCHAR) that returns one payment from BANKING_HOL.ANALYTICS.STG_PAYMENTS (matching UPPER(TRIM(PAYMENT_ID_IN))) with its date, type, amount, currency, status, processing time, error code, error description and IS_RETRYABLE (from RAW_DATA.ERROR_CODES), customer name and RM name (via STG_ACCOUNTS and STG_CUSTOMERS), and its count of open alerts. Agent tools need a scalar return, so also create PAYMENT_LOOKUP(PAYMENT_ID VARCHAR) RETURNS VARIANT that returns that row as a JSON object, or {&quot;error&quot;: &quot;No payment found with ID ...&quot;}. Test it on the first FAILED payment.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a JSON object for one failed payment, including its error and retryability<\/p>\n<h4>Build the scheme rules tool<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>In BANKING_HOL.AGENTS create SCHEME_RULES(SCHEME VARCHAR) RETURNS VARIANT: look up BANKING_HOL.RAW_DATA.PAYMENT_SCHEMES by SCHEME_CODE (UPPER, spaces replaced by underscores) joined to SLA_DEFINITIONS on PAYMENT_TYPE, and return a JSON object with scheme, name, settlement_cycle, domestic, max_value_gbp, cutoff_time_uk (CUTOFF_TIME as a string), currency, sla_target_success_rate and sla_max_p95_ms. For unknown schemes return an error listing the valid ones. Test it with &#x27;chaps&#x27;.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> CHAPS rules with <code>cutoff_time_uk<\/code> of <code>15:45:00<\/code><\/p>\n<h4>Create the agent with Cortex Code<\/h4>\n<p class=\"where\">banking-hol-pack Workspace &gt; <strong>+ &gt; Agent<\/strong> &gt; <strong>Create with CoCo<\/strong> (recommended)<\/p>\n<ol>\n<li>Rename the new agent file to <code>payments_investigator<\/code> straight away.<\/li>\n<li>Paste this brief into Cortex Code.<\/li>\n<\/ol>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a Cortex Agent BANKING_HOL.AGENTS.PAYMENTS_INVESTIGATOR with display name &quot;Payments Investigator&quot;. Tools: a generic function tool PaymentLookup on BANKING_HOL.AGENTS.PAYMENT_LOOKUP (input payment_id string), a generic function tool SchemeRules on BANKING_HOL.AGENTS.SCHEME_RULES (input scheme string), and a Cortex Analyst tool Client360 on your semantic view BANKING_HOL.ANALYTICS.SV_CLIENT_360, all on warehouse BANKING_WH. Orchestration: for a specific payment ID call PaymentLookup; for a scheme&#x27;s cutoff, limit, settlement cycle or SLA call SchemeRules; use Client360 for aggregate questions about clients, payments, alerts and feedback. Deploy it.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> <code>PAYMENTS_INVESTIGATOR<\/code> deployed in <code>BANKING_HOL.AGENTS<\/code><\/p>\n<h4>Test it on a real payment<\/h4>\n<p class=\"where\">Snowsight &gt; <strong>AI &amp; ML &gt; Agents &gt; PAYMENTS_INVESTIGATOR<\/strong> &gt; Playground<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Give me the ID of one failed CHAPS payment from BANKING_HOL.RAW_DATA.PAYMENTS.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a payment ID. Ask the agent &quot;What happened to payment &lt;ID&gt;, can it be retried, and can I still send a CHAPS payment today?&quot;. It should call <code>PaymentLookup<\/code>, then <code>SchemeRules<\/code>, and report retryability and the 15:45 cutoff.<\/p>\n<h4>Go further<\/h4>\n<p class=\"where\">the Cortex Code sidebar<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Add a third tool to PAYMENTS_INVESTIGATOR that lists open alerts for a customer name, using a new UDF in BANKING_HOL.AGENTS. Redeploy the agent and test it.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the agent answers &quot;What open alerts does &lt;client&gt; have?&quot; with the new tool<\/p>\n<h3>Check your work<\/h3>\n<p>Asking about a failed CHAPS payment calls <code>PaymentLookup<\/code> then <code>SchemeRules<\/code> and reports retryability and the 15:45 cutoff.<\/p>\n<h3>In your bank<\/h3>\n<p>Deterministic tools for lookups keep answers exact and auditable; text-to-SQL is reserved for analytical questions.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE AI1: AGENT WITH CUSTOM TOOLS   (~45 min)\n-- Persona: AI Builder\n-- Question: \"Ops staff ask about specific payments by ID and about scheme\n--            rules - not just aggregates. Give the agent precise tools.\"\n-- Prereq:   DA1 (SV_CLIENT_360), or setup/catchup/client_360.sql if you skipped it\n-- Builds:   2 UDF tools + PAYMENTS_INVESTIGATOR agent\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.AGENTS;\n\n-- -----------------------------------------------------\n-- AI1.1 Tool 1: exact payment lookup (deterministic - no text-to-SQL guessing)\n-- -----------------------------------------------------\nCREATE OR REPLACE FUNCTION GET_PAYMENT_DETAILS(PAYMENT_ID_IN VARCHAR)\nRETURNS TABLE (PAYMENT_ID VARCHAR, PAYMENT_DATE TIMESTAMP, PAYMENT_TYPE VARCHAR,\n               AMOUNT NUMBER(15,2), CURRENCY VARCHAR, STATUS VARCHAR,\n               PROCESSING_TIME_MS NUMBER, ERROR_CODE VARCHAR, ERROR_DESCRIPTION VARCHAR,\n               IS_RETRYABLE BOOLEAN, CUSTOMER_NAME VARCHAR, RM_NAME VARCHAR,\n               OPEN_ALERTS NUMBER)\nCOMMENT = 'Look up one payment by PAYMENT_ID with its error, client, RM and open alert count'\nAS\n$$\n    SELECT p.PAYMENT_ID, p.PAYMENT_DATE, p.PAYMENT_TYPE, p.AMOUNT, p.CURRENCY, p.STATUS,\n           p.PROCESSING_TIME_MS, p.ERROR_CODE, e.ERROR_DESCRIPTION, e.IS_RETRYABLE,\n           c.CUSTOMER_NAME, c.RM_NAME,\n           (SELECT COUNT(*) FROM BANKING_HOL.RAW_DATA.OPERATIONAL_ALERTS al\n             WHERE al.PAYMENT_ID = p.PAYMENT_ID AND al.STATUS <> 'RESOLVED')\n    FROM BANKING_HOL.ANALYTICS.STG_PAYMENTS p\n    LEFT JOIN BANKING_HOL.RAW_DATA.ERROR_CODES e  ON p.ERROR_CODE = e.ERROR_CODE\n    LEFT JOIN BANKING_HOL.ANALYTICS.STG_ACCOUNTS a ON p.ORIGINATOR_ACCOUNT_ID = a.ACCOUNT_ID\n    LEFT JOIN BANKING_HOL.ANALYTICS.STG_CUSTOMERS c ON a.CUSTOMER_ID = c.CUSTOMER_ID\n    WHERE p.PAYMENT_ID = UPPER(TRIM(PAYMENT_ID_IN))\n$$;\n\n-- Agent custom tools need a scalar return - wrap the table function as JSON\nCREATE OR REPLACE FUNCTION PAYMENT_LOOKUP(PAYMENT_ID VARCHAR)\nRETURNS VARIANT\nCOMMENT = 'Agent tool: payment details as JSON'\nAS\n$$\n    SELECT COALESCE(ARRAY_AGG(OBJECT_CONSTRUCT(*))[0],\n                    OBJECT_CONSTRUCT('error', 'No payment found with ID ' || PAYMENT_ID))\n    FROM TABLE(GET_PAYMENT_DETAILS(PAYMENT_ID))\n$$;\n\nSELECT PAYMENT_LOOKUP((SELECT MIN(PAYMENT_ID) FROM BANKING_HOL.RAW_DATA.PAYMENTS WHERE STATUS = 'FAILED')) AS RESULT;\n\n-- -----------------------------------------------------\n-- AI1.2 Tool 2: scheme rules (\"can I still send this today?\")\n-- -----------------------------------------------------\nCREATE OR REPLACE FUNCTION SCHEME_RULES(SCHEME VARCHAR)\nRETURNS VARIANT\nCOMMENT = 'Agent tool: payment scheme rules - settlement cycle, value limit, cutoff and SLA'\nAS\n$$\n    SELECT COALESCE(ARRAY_AGG(OBJECT_CONSTRUCT(\n               'scheme', s.SCHEME_CODE, 'name', s.SCHEME_NAME,\n               'settlement_cycle', s.SETTLEMENT_CYCLE, 'domestic', s.IS_DOMESTIC,\n               'max_value_gbp', s.MAX_VALUE_GBP, 'cutoff_time_uk', s.CUTOFF_TIME::STRING,\n               'currency', s.OPERATING_CURRENCY,\n               'sla_target_success_rate', sla.TARGET_SUCCESS_RATE,\n               'sla_max_p95_ms', sla.MAX_PROCESSING_TIME_MS))[0],\n             OBJECT_CONSTRUCT('error', 'Unknown scheme. Valid: CHAPS, FASTER_PAYMENTS, BACS, SWIFT, SEPA, WIRE_TRANSFER'))\n    FROM BANKING_HOL.RAW_DATA.PAYMENT_SCHEMES s\n    LEFT JOIN BANKING_HOL.RAW_DATA.SLA_DEFINITIONS sla ON sla.PAYMENT_TYPE = s.SCHEME_CODE\n    WHERE s.SCHEME_CODE = UPPER(REPLACE(TRIM(SCHEME), ' ', '_'))\n$$;\n\nSELECT SCHEME_RULES('chaps') AS RESULT;\n\n-- -----------------------------------------------------\n-- AI1.3 The agent: Analyst for aggregates + custom tools for precision\n-- -----------------------------------------------------\nCREATE OR REPLACE AGENT BANKING_HOL.AGENTS.PAYMENTS_INVESTIGATOR\n  COMMENT = 'Banking HOL - investigates individual payments and scheme rules, plus KPI questions'\n  PROFILE = '{\"display_name\": \"Payments Investigator\", \"color\": \"green\"}'\n  FROM SPECIFICATION\n  $$\n  models:\n    orchestration: auto\n  instructions:\n    response: >\n      You help payments operations investigate individual payments. Be precise and brief.\n      When reporting a payment, state status, error and whether it is retryable first.\n    orchestration: >\n      If the user gives a payment ID (format PAY followed by digits), call PaymentLookup.\n      For questions about a scheme's cutoff, limit, settlement cycle or SLA, call SchemeRules.\n      For counts, volumes, trends or comparisons across clients, RMs, alerts or feedback, use Client360.\n      You can chain tools, e.g. look up a payment then check its scheme's cutoff.\n  tools:\n    - tool_spec:\n        type: generic\n        name: PaymentLookup\n        description: Returns full details for a single payment ID, including error, retryability, client, RM and open alerts.\n        input_schema:\n          type: object\n          properties:\n            payment_id:\n              type: string\n              description: The payment ID, e.g. PAY0000000123\n          required: [payment_id]\n    - tool_spec:\n        type: generic\n        name: SchemeRules\n        description: Returns rules for a payment scheme - settlement cycle, max value, daily cutoff time and SLA targets.\n        input_schema:\n          type: object\n          properties:\n            scheme:\n              type: string\n              description: One of CHAPS, FASTER_PAYMENTS, BACS, SWIFT, SEPA, WIRE_TRANSFER\n          required: [scheme]\n    - tool_spec:\n        type: cortex_analyst_text_to_sql\n        name: Client360\n        description: Corporate client 360 from DA1 - payment totals, success rate and failed value per client, RM, alerts and AI-scored feedback sentiment.\n  tool_resources:\n    PaymentLookup:\n      type: function\n      identifier: BANKING_HOL.AGENTS.PAYMENT_LOOKUP\n      execution_environment:\n        type: warehouse\n        warehouse: BANKING_WH\n    SchemeRules:\n      type: function\n      identifier: BANKING_HOL.AGENTS.SCHEME_RULES\n      execution_environment:\n        type: warehouse\n        warehouse: BANKING_WH\n    Client360:\n      semantic_view: BANKING_HOL.ANALYTICS.SV_CLIENT_360\n      execution_environment:\n        type: warehouse\n        warehouse: BANKING_WH\n  $$;\n\n-- -----------------------------------------------------\n-- AI1.4 Test (Snowsight: AI & ML > Agents > PAYMENTS_INVESTIGATOR > Playground)\n-- Grab a failed payment ID to ask about:\nSELECT PAYMENT_ID, PAYMENT_TYPE, AMOUNT FROM BANKING_HOL.RAW_DATA.PAYMENTS WHERE STATUS = 'FAILED' LIMIT 3;\n-- Try:\n--   \"What happened to payment <ID>? Can we retry it, and is there still time before the scheme cutoff today?\"\n--   \"What's the maximum value for Faster Payments, and how many failed last week?\"\n-- CoCo prompt: \"Add a third tool to PAYMENTS_INVESTIGATOR that lists the open alerts\n--   for a given customer name, using a new UDF in BANKING_HOL.AGENTS.\"\n-- -----------------------------------------------------\n\nSELECT 'AI1 complete' AS STATUS;\n", "sql_name": "vignettes/ai1_agent_tools/ai1.sql"}, {"code": "AI2", "title": "Snowflake-managed MCP server", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>AI Builder<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~30 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>DA1 (<code>SV_CLIENT_360<\/code>, or run <code>client_360.sql<\/code>), OPS1&#x27;s agent (run <code>ops1.sql<\/code> if you skipped OPS1), AI1 and the knowledge extension from facilitator setup<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Teams use different AI clients. Expose governed payments tools to all of them once.<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>MCP server <code>BANKING_HOL.AGENTS.PAYMENTS_MCP<\/code> with Analyst, Agent, UDF and knowledge-extension tools<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Create the MCP server<\/h4>\n<p class=\"where\">the Cortex Code sidebar<\/p>\n<p>One server, four governed tools, nothing to host.<\/p>\n<p>Every call runs as the caller&#x27;s role.<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a Snowflake-managed MCP server BANKING_HOL.AGENTS.PAYMENTS_MCP with four tools: &quot;client-360-analyst&quot; (CORTEX_ANALYST_MESSAGE on BANKING_HOL.ANALYTICS.SV_CLIENT_360), &quot;payments-360-agent&quot; (CORTEX_AGENT_RUN on SNOWFLAKE_INTELLIGENCE.AGENTS.CORPORATE_PAYMENTS_360, read-only), &quot;payment-lookup&quot; (GENERIC function tool on BANKING_HOL.AGENTS.PAYMENT_LOOKUP, warehouse BANKING_WH, input payment_id string, read-only and idempotent) and &quot;snowflake-docs&quot; (CORTEX_SEARCH_SERVICE_QUERY on SNOWFLAKE_DOCS_CKE.SHARED.CKE_SNOWFLAKE_DOCS_SERVICE). Then describe it.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> <code>PAYMENTS_MCP<\/code> listed by <code>SHOW MCP SERVERS IN SCHEMA BANKING_HOL.AGENTS<\/code> with four tools<\/p>\n<h4>Get the endpoint<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Give me the MCP endpoint URL for BANKING_HOL.AGENTS.PAYMENTS_MCP in this account (https://&lt;account_url&gt;/api/v2/databases/BANKING_HOL/schemas/AGENTS/mcp-servers/PAYMENTS_MCP), and the MCP client JSON config for a server called banking-payments using a bearer token.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> your account&#x27;s endpoint URL and a ready-to-paste config<\/p>\n<h4>Connect a client and call the tools<\/h4>\n<ol>\n<li>Open <strong>Settings &gt; Authentication &gt; Programmatic access tokens<\/strong> in Snowsight.<\/li>\n<li>Create a short-lived programmatic access token restricted to <code>HOL_PARTICIPANT<\/code>.<\/li>\n<li>Add the config to an MCP client, such as Cortex Code Desktop or CLI.<\/li>\n<li>Ask the client this question:<\/li>\n<\/ol>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Using the banking-payments tools, which clients have open critical alerts?<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> your client lists <code>client-360-analyst<\/code>, <code>payments-360-agent<\/code>, <code>payment-lookup<\/code> and <code>snowflake-docs<\/code>, and answers using them<\/p>\n<h3>Check your work<\/h3>\n<p>Your MCP client lists <code>client-360-analyst<\/code>, <code>payments-360-agent<\/code>, <code>payment-lookup<\/code> and <code>snowflake-docs<\/code>.<\/p>\n<h3>In your bank<\/h3>\n<p>Control reach with <code>GRANT USAGE ON MCP SERVER<\/code>; every call runs as the caller&#x27;s role.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE AI2: SNOWFLAKE-MANAGED MCP SERVER   (~30 min)\n-- Persona: AI Builder\n-- Question: \"Our teams use different AI clients (Cortex Code, Claude, Copilot,\n--            in-house apps). Expose governed payments tools to all of them once.\"\n-- Prereq:   DA1 (SV_CLIENT_360), OPS1 (CORPORATE_PAYMENTS_360), AI1 (PAYMENT_LOOKUP)\n--           and the Marketplace knowledge extension installed by facilitator setup.\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.AGENTS;\n\n-- -----------------------------------------------------\n-- AI2.1 One server, four governed tools. No infrastructure to host.\n-- Every call runs as the calling user's role - RBAC, masking and row\n-- access policies all still apply.\n-- -----------------------------------------------------\nCREATE OR REPLACE MCP SERVER PAYMENTS_MCP\n  FROM SPECIFICATION $$\n    tools:\n      - name: \"client-360-analyst\"\n        type: \"CORTEX_ANALYST_MESSAGE\"\n        identifier: \"BANKING_HOL.ANALYTICS.SV_CLIENT_360\"\n        title: \"Corporate Client 360\"\n        description: \"Ask natural-language questions about corporate clients: payment volumes, success rates, failed value, alerts and feedback sentiment.\"\n\n      - name: \"payments-360-agent\"\n        type: \"CORTEX_AGENT_RUN\"\n        identifier: \"SNOWFLAKE_INTELLIGENCE.AGENTS.CORPORATE_PAYMENTS_360\"\n        title: \"Corporate Payments 360 Agent\"\n        description: \"Full client briefings combining client 360 and scheme-level payments operations data.\"\n        annotations:\n          readOnlyHint: true\n          openWorldHint: false\n\n      - name: \"payment-lookup\"\n        type: \"GENERIC\"\n        identifier: \"BANKING_HOL.AGENTS.PAYMENT_LOOKUP\"\n        title: \"Payment Lookup\"\n        description: \"Returns full details for one payment ID: status, error, retryability, client, RM and open alerts.\"\n        annotations:\n          readOnlyHint: true\n          destructiveHint: false\n          idempotentHint: true\n          openWorldHint: false\n        config:\n          type: \"function\"\n          warehouse: \"BANKING_WH\"\n          input_schema:\n            type: \"object\"\n            properties:\n              payment_id:\n                description: \"Payment ID, e.g. PAY0000000123\"\n                type: \"string\"\n\n      - name: \"snowflake-docs\"\n        type: \"CORTEX_SEARCH_SERVICE_QUERY\"\n        identifier: \"SNOWFLAKE_DOCS_CKE.SHARED.CKE_SNOWFLAKE_DOCS_SERVICE\"\n        title: \"Snowflake Documentation (Knowledge Extension)\"\n        description: \"Search official Snowflake documentation. Provider-hosted Marketplace Knowledge Extension - no internal data is indexed.\"\n  $$;\n\nSHOW MCP SERVERS IN SCHEMA BANKING_HOL.AGENTS;\nDESCRIBE MCP SERVER PAYMENTS_MCP;\n\n-- -----------------------------------------------------\n-- AI2.2 Connect a client\n-- Endpoint:\n--   https://<account_url>/api/v2/databases/BANKING_HOL/schemas/AGENTS/mcp-servers/PAYMENTS_MCP\n-- Find <account_url>:\nSELECT REPLACE(LOWER(CURRENT_ORGANIZATION_NAME() || '-' || CURRENT_ACCOUNT_NAME()), '_', '-') || '.snowflakecomputing.com' AS ACCOUNT_URL;\n--\n-- Cortex Code (CLI / Desktop) - add to your MCP settings:\n--   {\n--     \"mcpServers\": {\n--       \"banking-payments\": {\n--         \"type\": \"http\",\n--         \"url\": \"https://<account_url>/api/v2/databases/BANKING_HOL/schemas/AGENTS/mcp-servers/PAYMENTS_MCP\",\n--         \"headers\": { \"Authorization\": \"Bearer <PAT>\" }\n--       }\n--     }\n--   }\n-- Create a short-lived PAT restricted to HOL_PARTICIPANT (Snowsight: Settings >\n-- Authentication > Programmatic access tokens) or use OAuth for production.\n--\n-- Then ask your client:\n--   \"Using the banking-payments tools, which clients have open critical alerts?\"\n--   \"Look up payment <ID> and tell me if it can be retried.\"\n--   \"How do I create a dynamic table? Check the Snowflake docs tool.\"\n-- -----------------------------------------------------\n\n-- In your bank: the MCP server is a schema object - grant USAGE on it\n-- only to roles that should reach these tools:\n--   GRANT USAGE ON MCP SERVER BANKING_HOL.AGENTS.PAYMENTS_MCP TO ROLE <consumer_role>;\n\nSELECT 'AI2 complete' AS STATUS;\n", "sql_name": "vignettes/ai2_mcp_server/ai2.sql"}, {"code": "AI3", "title": "Marketplace knowledge extension", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>AI Builder<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~30 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>Facilitator setup 00 (installs <code>SNOWFLAKE_DOCS_CKE<\/code>), DA1 (<code>SV_CLIENT_360<\/code>), or run <code>client_360.sql<\/code> if you skipped it<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Agents need trusted unstructured knowledge, but internal (PII) data cannot be vectorised yet. What can we do?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>Agent <code>SNOWFLAKE_INTELLIGENCE.AGENTS.PAYMENTS_PLATFORM_COPILOT<\/code> combining <code>SV_CLIENT_360<\/code> with a provider-hosted search service<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>See what came from the Marketplace<\/h4>\n<p class=\"where\">Snowsight &gt; <strong>Data Products &gt; Marketplace<\/strong>, search &quot;Cortex Knowledge Extension&quot;; then the Cortex Code sidebar<\/p>\n<ol>\n<li>Browse the knowledge extension listings. Finance publishers are there too.<\/li>\n<li>Open the Cortex Code sidebar in the banking-hol-pack Workspace and paste this prompt.<\/li>\n<\/ol>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Show the Cortex Search services in database SNOWFLAKE_DOCS_CKE and explain what a Cortex Knowledge Extension is: who built and hosts it, what we can see of its source data, and how we pay for it.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the <code>CKE_SNOWFLAKE_DOCS_SERVICE<\/code> search service. You didn&#x27;t build it and can&#x27;t see its source table.<\/p>\n<h4>Query it directly<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Use SNOWFLAKE.CORTEX.SEARCH_PREVIEW on SNOWFLAKE_DOCS_CKE.SHARED.CKE_SNOWFLAKE_DOCS_SERVICE to answer &quot;How do I apply a masking policy to a column?&quot;, returning DOCUMENT_TITLE, SOURCE_URL and the first 200 characters of CHUNK for the top 3 results.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> three documentation excerpts with their URLs<\/p>\n<h4>Create an agent that uses both<\/h4>\n<p class=\"where\">banking-hol-pack Workspace &gt; <strong>+ &gt; Agent<\/strong> &gt; <strong>Create with CoCo<\/strong> (recommended)<\/p>\n<ol>\n<li>Rename the new agent file to <code>payments_platform_copilot<\/code> straight away.<\/li>\n<li>Paste this brief into Cortex Code.<\/li>\n<\/ol>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a Cortex Agent SNOWFLAKE_INTELLIGENCE.AGENTS.PAYMENTS_PLATFORM_COPILOT with display name &quot;Payments Platform Copilot&quot;. Tools: a Cortex Analyst tool Client360 on BANKING_HOL.ANALYTICS.SV_CLIENT_360 (warehouse BANKING_WH) for client, alert and sentiment data, and a Cortex Search tool PlatformDocs on SNOWFLAKE_DOCS_CKE.SHARED.CKE_SNOWFLAKE_DOCS_SERVICE (max 4 results, title column DOCUMENT_TITLE, id column SOURCE_URL) for how-to questions about Snowflake. Instructions: use Client360 for data questions, PlatformDocs for how-to questions, both when a question needs both, and cite documentation URLs. Deploy it.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> <code>PAYMENTS_PLATFORM_COPILOT<\/code> deployed in <code>SNOWFLAKE_INTELLIGENCE.AGENTS<\/code><\/p>\n<h4>Ask a question that needs both<\/h4>\n<p class=\"where\">Snowsight &gt; <strong>AI &amp; ML &gt; CoWork<\/strong> &gt; <strong>Payments Platform Copilot<\/strong><\/p>\n<ol>\n<li>Ask &quot;Which 3 clients have the most open critical alerts, and how could I build a dynamic table to keep that list up to date?&quot;<\/li>\n<\/ol>\n<p class=\"expect\"><strong>What you should see:<\/strong> the agent calls both <code>Client360<\/code> and <code>PlatformDocs<\/code>, names three clients and cites documentation URLs<\/p>\n<h3>Check your work<\/h3>\n<p>The agent calls both <code>Client360<\/code> and <code>PlatformDocs<\/code> and cites documentation URLs.<\/p>\n<h3>In your bank<\/h3>\n<p>Many banks haven&#x27;t approved Cortex Search over internal data. Knowledge extensions are built and hosted by the provider; no bank data is indexed. Finance publishers (e.g. Investopedia, FactSet) offer extensions too - personalised listings must be requested by the account admin.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE AI3: MARKETPLACE KNOWLEDGE EXTENSION (instead of Cortex Search)   (~30 min)\n-- Persona: AI Builder\n-- Question: \"Our agents need trusted unstructured knowledge, but we are not\n--            allowed to vectorise internal (PII) data yet. What can we do?\"\n-- Prereq:   Facilitator setup 00 (installs SNOWFLAKE_DOCS_CKE), DA1 (SV_CLIENT_360)\n--\n-- A Cortex Knowledge Extension (CKE) is a search service that a Marketplace\n-- provider builds, hosts and refreshes. You query it through a share - no\n-- internal data is embedded, indexed or sent to the provider.\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BANKING_WH;\n\n-- -----------------------------------------------------\n-- AI3.1 What did we get from the Marketplace?\n-- Snowsight: Data Products > Marketplace > search \"Cortex Knowledge Extension\"\n-- (Finance publishers such as Investopedia are listed; personalised listings\n--  must be requested by the account admin.)\n-- -----------------------------------------------------\nSHOW CORTEX SEARCH SERVICES IN DATABASE SNOWFLAKE_DOCS_CKE;\n-- Note: we did not create this service, we cannot see its source table,\n-- and we pay only for the queries we run.\n\n-- -----------------------------------------------------\n-- AI3.2 Query it directly\n-- -----------------------------------------------------\nSELECT r.value:DOCUMENT_TITLE::STRING AS TITLE,\n       r.value:SOURCE_URL::STRING     AS URL,\n       LEFT(r.value:CHUNK::STRING, 200) AS EXCERPT\nFROM TABLE(FLATTEN(PARSE_JSON(SNOWFLAKE.CORTEX.SEARCH_PREVIEW(\n        'SNOWFLAKE_DOCS_CKE.SHARED.CKE_SNOWFLAKE_DOCS_SERVICE',\n        '{\"query\": \"How do I apply a masking policy to a column?\",\n          \"columns\": [\"DOCUMENT_TITLE\", \"SOURCE_URL\", \"CHUNK\"],\n          \"limit\": 3}')):results)) r;\n\n-- -----------------------------------------------------\n-- AI3.3 Combine governed internal data + external knowledge in one agent\n-- -----------------------------------------------------\nCREATE OR REPLACE AGENT SNOWFLAKE_INTELLIGENCE.AGENTS.PAYMENTS_PLATFORM_COPILOT\n  COMMENT = 'Banking HOL - client data (semantic view) + Snowflake docs (Marketplace knowledge extension)'\n  PROFILE = '{\"display_name\": \"Payments Platform Copilot\", \"color\": \"orange\"}'\n  FROM SPECIFICATION\n  $$\n  models:\n    orchestration: auto\n  instructions:\n    response: >\n      Be concise. When you use documentation, cite the source URL.\n      Never present documentation content as if it were bank data.\n    orchestration: >\n      Use Client360 for any question about our clients, payments, alerts or feedback.\n      Use PlatformDocs for how-to questions about Snowflake features\n      (Iceberg, dynamic tables, policies, semantic views, agents).\n      A question may need both, e.g. \"which clients have X, and how do I monitor that?\"\n  tools:\n    - tool_spec:\n        type: cortex_analyst_text_to_sql\n        name: Client360\n        description: Corporate client payments health, alerts and feedback sentiment.\n    - tool_spec:\n        type: cortex_search\n        name: PlatformDocs\n        description: Official Snowflake documentation from a Marketplace Cortex Knowledge Extension.\n  tool_resources:\n    Client360:\n      semantic_view: BANKING_HOL.ANALYTICS.SV_CLIENT_360\n      execution_environment:\n        type: warehouse\n        warehouse: BANKING_WH\n    PlatformDocs:\n      name: SNOWFLAKE_DOCS_CKE.SHARED.CKE_SNOWFLAKE_DOCS_SERVICE\n      max_results: 4\n      title_column: DOCUMENT_TITLE\n      id_column: SOURCE_URL\n  $$;\n\n-- -----------------------------------------------------\n-- AI3.4 Try it in Snowflake CoWork (\"Payments Platform Copilot\"):\n--   \"Which 3 clients have the most open critical alerts, and how could I build\n--    a dynamic table that keeps that list up to date?\"\n--   \"How do Snowflake-managed Iceberg tables differ from ones using an external volume?\"\n-- Or from SQL:\nSELECT SNOWFLAKE.CORTEX.DATA_AGENT_RUN(\n  'SNOWFLAKE_INTELLIGENCE.AGENTS.PAYMENTS_PLATFORM_COPILOT',\n  $${\"messages\":[{\"role\":\"user\",\"content\":[{\"type\":\"text\",\"text\":\"Which 3 clients have the most open critical alerts, and how could I build a dynamic table to keep that list up to date?\"}]}]}$$\n) AS RESPONSE;\n-- -----------------------------------------------------\n\n-- Discussion: the same pattern works for licensed external content already\n-- used by the investment bank (LSEG, FactSet, S&P - several publish CKEs),\n-- giving retail and corporate banking AI over trusted text with no PII risk.\n\nSELECT 'AI3 complete' AS STATUS;\n", "sql_name": "vignettes/ai3_knowledge_extension/ai3.sql"}, {"code": "AI4", "title": "AI SQL on the voice of the customer and financial crime evidence", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>AI Builder<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~40 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>None. Uses the retail text and evidence in <code>BANKING_HOL.RAW_DATA<\/code> and <code>@RETAIL.FINCRIME_EVIDENCE<\/code>, built at provisioning<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>What are retail customers telling us on calls and in complaints before they leave, and can AI read a fraud case file (notes, phishing screenshots, police reports) so an investigator can decide faster?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>Table <code>ANALYTICS.RB_CALL_INSIGHTS<\/code>: sentiment, call reason and vulnerability cues for recent calls, joined to who left<\/li>\n<li>Structured fields pulled out of complaints and police report PDFs with AI_EXTRACT<\/li>\n<li>A &quot;why they left&quot; summary from leavers&#x27; calls with AI_AGG<\/li>\n<li>Phishing screenshot analysis and a fraud case decision draft with AI_COMPLETE<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Open Cortex Code<\/h4>\n<p class=\"where\">the <strong>CoCo<\/strong> tab, <strong>New session<\/strong><\/p>\n<ol>\n<li>At the top left of Snowsight, switch the toggle from <strong>Home<\/strong> to <strong>CoCo<\/strong>.<\/li>\n<li>Press <strong>New session<\/strong>.<\/li>\n<li>Paste each prompt in this module into the <strong>How can I help?<\/strong> box, and <strong>Allow<\/strong> the queries.<\/li>\n<\/ol>\n<p><strong>Tip:<\/strong> every function in this module is an approved AI SQL function, governed by the account&#x27;s AI gateway. Nothing leaves Snowflake.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> the Cortex Code screen with a <strong>How can I help?<\/strong> box<\/p>\n<h4>Meet the unstructured data<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Show me the unstructured retail data in BANKING_HOL.RAW_DATA: RB_CALL_TRANSCRIPTS, RB_EMAILS, RB_COMPLAINTS, RB_FRAUD_CASES, RB_SAR_NARRATIVES, RB_DISPUTES and RB_EVIDENCE_FILES, plus the files on stage @BANKING_HOL.RETAIL.FINCRIME_EVIDENCE. Give row counts, how each links to RB_CUSTOMERS and RB_TRANSACTIONS, and show one call transcript in full.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> 1,000 call transcripts (each with start and end times), 300 emails, 200 complaints, 300 fraud cases, 60 SAR narratives, 120 disputes and 150 evidence files. Every row links to a retail customer, and fraud calls, cases and disputes link to the actual transaction.<\/p>\n<p><strong>Tip:<\/strong> the people and the text are synthetic, written to match each customer&#x27;s records: leavers call before they leave, fraud victims call about their own fraud.<\/p>\n<h4>Enrich call transcripts<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create the table BANKING_HOL.ANALYTICS.RB_CALL_INSIGHTS from the 300 most recent calls in RB_CALL_TRANSCRIPTS (since 1 Aug 2026), with AI_SENTIMENT&#x27;s overall sentiment, a CALL_REASON from AI_CLASSIFY (savings rates, branch access, service complaint, fraud or scam, financial difficulty, card or app problem, product question, account admin), and VULNERABILITY_CUES from AI_CLASSIFY in multi-label mode (mentions health or disability, bereavement, money worries, none). Join RB_CUSTOMERS for CHURNED and AFFORDABILITY_BAND. Then show, by call reason, the call count, the share negative and the share of callers who later left.<\/pre><\/div>\n<p><strong>Tip:<\/strong> score once into a table, then query it as often as you like. Re-running AI functions on the same text spends credits again.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> about 300 enriched calls. Service complaints and savings-rate calls are the most negative, and those callers are the most likely to have left.<\/p>\n<h4>Pull fields out of complaints<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>For 10 complaints in RB_COMPLAINTS, use AI_EXTRACT to pull out the product, any amount in pounds and the customer&#x27;s requested outcome, as columns next to CATEGORY and STATUS.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> one row per complaint with product, amount and requested outcome filled in from the free text<\/p>\n<h4>Find out why customers left<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Use AI_AGG over every call transcript from customers who churned, in the 3 months before their CHURN_DATE, to list the top 5 reasons they gave, how often each came up, and one action the bank could take for each.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> one summary naming reasons such as low savings rates, branch closures, unresolved complaints and switching offers, each with an action<\/p>\n<h4>Read the fraud evidence<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Using RB_EVIDENCE_FILES and the stage @BANKING_HOL.RETAIL.FINCRIME_EVIDENCE: for 5 police report PDFs, use AI_EXTRACT with TO_FILE to pull the crime reference number, date reported and amount lost, and compare the amount with LOSS_GBP in RB_FRAUD_CASES. Then for 3 phishing screenshots, use AI_COMPLETE with the image to say which organisation the message impersonates and list its red flags.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> crime references starting NFRC, amounts that match the case losses, and screenshots identified as fake parcel-delivery, HMRC refund or bank &quot;new payee&quot; messages, each with red flags such as a lookalike web address<\/p>\n<h4>Draft a fraud case decision<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>For one APP scam case in RB_FRAUD_CASES, combine the investigator notes, the customer&#x27;s fraud call transcript (RB_CALL_TRANSCRIPTS in the FRAUD queue with the same TXN_ID as the case&#x27;s FIRST_FRAUD_TXN_ID), the customer&#x27;s VULNERABLE_FLAG and age from RB_CUSTOMERS, and the recorded DECISION. Use AI_COMPLETE to draft a 150-word case summary with a reimbursement recommendation that cites the evidence, and flag anything in the sources that disagrees.<\/pre><\/div>\n<p><strong>Important:<\/strong> AI drafts, people decide. The investigator still owns the reimbursement decision.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> a decision draft that quotes the case&#x27;s amounts and dates and agrees with the recorded decision, or flags where the sources disagree<\/p>\n<h4>Check SAR narrative quality<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Check every narrative in RB_SAR_NARRATIVES against a simple standard. Use AI_EXTRACT with four questions: why the bank considers the activity suspicious, the specific date, the specific amount in pounds, and the action the bank took, each answering None if the narrative doesn&#x27;t say. Turn the answers into one finding per SAR (COMPLETE, MISSING_REASON, MISSING_DATES_AMOUNTS or MISSING_ACTION), then compare it with the QA_ISSUE column in a confusion table and show the share that match.<\/pre><\/div>\n<p><strong>Tip:<\/strong> QA_ISSUE is the answer key: the gap each narrative was written with. In real life you wouldn&#x27;t have one, so a check like this is a first pass before a person reviews the SAR.<\/p>\n<p><strong>Tip:<\/strong> Asking AI_EXTRACT one question per element works better than asking AI_CLASSIFY to judge &quot;complete or not&quot;: classifiers lean towards &quot;complete&quot; when something is simply absent.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> about 80 to 85% match. Every complete SAR passes, and missing dates, amounts and actions are caught; a missing reason is the hardest, because the model infers one from the activity<\/p>\n<h3>Check your work<\/h3>\n<p>The call insights table exists, and you have read the financial crime evidence with AI SQL.<\/p>\n<h3>In your bank<\/h3>\n<p>At many banks, AI SQL functions are approved and run through the AI gateway, so this is work a fraud or complaints team could do today. Search over these documents is the next step (AI5, optional, as Cortex Search isn&#x27;t approved yet).<\/p>", "sql": "-- =====================================================\n-- AI4: AI SQL ON CALL TRANSCRIPTS, COMPLAINTS AND FINANCIAL CRIME EVIDENCE - reference SQL\n-- Approved AI SQL functions only (AI_SENTIMENT, AI_CLASSIFY, AI_EXTRACT, AI_AGG, AI_COMPLETE).\n-- Run as HOL_PARTICIPANT. Samples keep the AI credits small; drop the LIMITs to do the lot.\n-- =====================================================\nUSE SECONDARY ROLES NONE;\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ANALYTICS;\n\n-- 1. Enrich call transcripts once: sentiment, reason and vulnerability cues\nCREATE OR REPLACE TABLE RB_CALL_INSIGHTS AS\nSELECT t.CALL_ID, t.CUSTOMER_ID, t.CALL_START_TS, t.QUEUE, t.TOPIC,\n       AI_SENTIMENT(t.TRANSCRIPT):categories[0]:sentiment::VARCHAR AS SENTIMENT,\n       AI_CLASSIFY(t.TRANSCRIPT, ['savings rates', 'branch access', 'service complaint', 'fraud or scam',\n                                 'financial difficulty', 'card or app problem', 'product question', 'account admin']):labels[0]::VARCHAR AS CALL_REASON,\n       AI_CLASSIFY(t.TRANSCRIPT, ['mentions health or disability', 'mentions bereavement', 'mentions money worries', 'none'],\n                   {'output_mode': 'multi'}):labels AS VULNERABILITY_CUES,\n       c.CHURNED, c.AFFORDABILITY_BAND\nFROM BANKING_HOL.RAW_DATA.RB_CALL_TRANSCRIPTS t\nJOIN BANKING_HOL.RAW_DATA.RB_CUSTOMERS c ON c.CUSTOMER_ID = t.CUSTOMER_ID\nWHERE t.CALL_START_TS >= '2026-08-01'\nLIMIT 300;\n\n-- Does call sentiment line up with who left?\nSELECT CALL_REASON, COUNT(*) AS CALLS, ROUND(100 * AVG(IFF(SENTIMENT = 'negative', 1, 0))) AS PCT_NEGATIVE,\n       ROUND(100 * AVG(IFF(CHURNED, 1, 0))) AS PCT_CALLERS_WHO_LEFT\nFROM RB_CALL_INSIGHTS GROUP BY 1 ORDER BY CALLS DESC;\n\n-- 2. Pull structured fields out of complaints\nSELECT COMPLAINT_ID, CATEGORY,\n       AI_EXTRACT(text => COMPLAINT_TEXT, responseFormat => {\n           'product': 'Which bank product is the complaint about?',\n           'amount_gbp': 'What amount of money in pounds is mentioned, as a number?',\n           'requested_outcome': 'What does the customer want the bank to do?'}):response AS EXTRACTED\nFROM BANKING_HOL.RAW_DATA.RB_COMPLAINTS\nLIMIT 10;\n\n-- 3. What leavers said in the 3 months before leaving, in one paragraph\nSELECT AI_AGG(t.TRANSCRIPT, 'These calls are from retail bank customers who closed their accounts soon after. List the top 5 reasons they gave, with how often each came up, and one action the bank could take for each.') AS WHY_THEY_LEFT\nFROM BANKING_HOL.RAW_DATA.RB_CALL_TRANSCRIPTS t\nJOIN BANKING_HOL.RAW_DATA.RB_CUSTOMERS c ON c.CUSTOMER_ID = t.CUSTOMER_ID\nWHERE c.CHURNED AND t.CALL_START_TS BETWEEN DATEADD(month, -3, c.CHURN_DATE) AND c.CHURN_DATE;\n\n-- 4. Police report PDFs: extract the crime reference and loss, and reconcile to the case\nSELECT e.CASE_ID, f.LOSS_GBP AS CASE_LOSS_GBP,\n       AI_EXTRACT(file => TO_FILE('@BANKING_HOL.RETAIL.FINCRIME_EVIDENCE', e.FILE_NAME), responseFormat => {\n           'crime_reference': 'What is the crime reference number?',\n           'date_reported': 'What date was it reported?',\n           'amount_lost': 'What amount was lost, as a number?'}):response AS FROM_PDF\nFROM BANKING_HOL.RAW_DATA.RB_EVIDENCE_FILES e\nJOIN BANKING_HOL.RAW_DATA.RB_FRAUD_CASES f ON f.CASE_ID = e.CASE_ID\nWHERE e.EVIDENCE_TYPE = 'POLICE_REPORT_PDF'\nLIMIT 5;\n\n-- 5. Phishing screenshots: who is being impersonated, and the red flags\nSELECT e.CASE_ID, e.FILE_NAME,\n       AI_COMPLETE('claude-sonnet-4-5',\n                   'This is a screenshot a fraud victim sent to their bank. Which organisation does the message impersonate, and what are its red flags? Answer in two short lines.',\n                   TO_FILE('@BANKING_HOL.RETAIL.FINCRIME_EVIDENCE', e.FILE_NAME)) AS ANALYSIS\nFROM BANKING_HOL.RAW_DATA.RB_EVIDENCE_FILES e\nWHERE e.EVIDENCE_TYPE = 'PHISHING_SCREENSHOT'\nLIMIT 3;\n\n-- 6. One fraud case file, summarised into a decision draft from every source\nSELECT f.CASE_ID, f.DECISION, c.AGE, c.VULNERABLE_FLAG,\n       AI_COMPLETE('claude-sonnet-4-5', CONCAT(\n           'You are a fraud operations team leader. Draft a 150-word case summary and a reimbursement recommendation, ',\n           'citing the evidence, and flag anything in the sources that disagrees. Case notes: ', f.INVESTIGATOR_NOTES,\n           ' Customer call: ', COALESCE(t.TRANSCRIPT, 'none'),\n           ' Customer age: ', c.AGE, '. On the vulnerable customers register: ', IFF(c.VULNERABLE_FLAG, 'yes', 'no'),\n           '. Decision recorded: ', f.DECISION)) AS DECISION_DRAFT\nFROM BANKING_HOL.RAW_DATA.RB_FRAUD_CASES f\nJOIN BANKING_HOL.RAW_DATA.RB_CUSTOMERS c ON c.CUSTOMER_ID = f.CUSTOMER_ID\nLEFT JOIN BANKING_HOL.RAW_DATA.RB_CALL_TRANSCRIPTS t\n       ON t.CUSTOMER_ID = f.CUSTOMER_ID AND t.QUEUE = 'FRAUD' AND t.TXN_ID = f.FIRST_FRAUD_TXN_ID\nWHERE f.FRAUD_TYPE = 'APP_SCAM' AND t.CALL_ID IS NOT NULL\nORDER BY f.CASE_ID\nLIMIT 1;\n\n-- 7. SAR narrative quality check: one AI_EXTRACT question per element, scored against the planted QA_ISSUE\nWITH x AS (\n    SELECT SAR_ID, QA_ISSUE,\n           AI_EXTRACT(text => NARRATIVE, responseFormat => {\n               'reason': 'Why does the bank consider this activity suspicious? Answer None if no reason is given.',\n               'date':   'What is the specific date of the activity? Answer None if no date is given.',\n               'amount': 'What specific amount of money in pounds is mentioned? Answer None if none.',\n               'action': 'What action did the bank take or will it take? Answer None if no action is stated.'}):response AS R\n    FROM BANKING_HOL.RAW_DATA.RB_SAR_NARRATIVES\n), f AS (\n    SELECT SAR_ID, QA_ISSUE,\n           CASE WHEN COALESCE(R:date::STRING, 'none') ILIKE 'none%' OR COALESCE(R:amount::STRING, 'none') ILIKE 'none%' THEN 'MISSING_DATES_AMOUNTS'\n                WHEN COALESCE(R:action::STRING, 'none') ILIKE 'none%' THEN 'MISSING_ACTION'\n                WHEN COALESCE(R:reason::STRING, 'none') ILIKE 'none%' THEN 'MISSING_REASON'\n                ELSE 'COMPLETE' END AS AI_FINDING\n    FROM x\n)\nSELECT QA_ISSUE, AI_FINDING, COUNT(*) AS SARS,\n       ROUND(100 * SUM(COUNT_IF(QA_ISSUE = AI_FINDING)) OVER () / SUM(COUNT(*)) OVER ()) AS PCT_MATCH\nFROM f GROUP BY 1, 2 ORDER BY 1, 3 DESC;\n", "sql_name": "vignettes/ai4_aisql_customer_voice/ai4.sql"}, {"code": "AI5", "title": "Cortex Search over call transcripts and case notes", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>AI Builder<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~35 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>AI4 recommended. Cortex Search must be enabled in your account (it isn&#x27;t yet approved at many banks): the prerequisite check below tells you. Needs the <code>BANKING_HOL.SEARCH_LAB<\/code> schema from <code>setup/10b_search_lab.sql<\/code><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Can a complaints handler or fraud investigator find &quot;every call like this one&quot; in plain English, instead of keyword searches and spreadsheets? And when a police report says &quot;Liz Moor&quot; or &quot;MOORE, Elizabeth&quot;, can they tell whether that&#x27;s our customer?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>Cortex Search service <code>SEARCH_LAB.RB_CALL_SEARCH<\/code> over all 1,000 call transcripts, filterable by queue, topic and whether the customer left<\/li>\n<li>Cortex Search service <code>SEARCH_LAB.RB_FINCRIME_SEARCH<\/code> over fraud case notes and SAR narratives<\/li>\n<li>Cortex Search service <code>SEARCH_LAB.RB_CUSTOMER_NAME_SEARCH<\/code> over customer names, for fuzzy name matching<\/li>\n<li><code>SEARCH_LAB.RB_NAME_MATCHES<\/code>: names from police reports, other banks&#x27; referrals, dispute forms and the watchlist, matched to customers or sent for review<\/li>\n<li>Plain-English searches with filters, and a comparison with AI4&#x27;s AI SQL approach<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Open Cortex Code<\/h4>\n<p class=\"where\">the <strong>CoCo<\/strong> tab, in your AI4 session or a <strong>New session<\/strong><\/p>\n<ol>\n<li>Switch the toggle at the top left from <strong>Home<\/strong> to <strong>CoCo<\/strong>.<\/li>\n<li>Press <strong>New session<\/strong> if you aren&#x27;t carrying on from AI4.<\/li>\n<\/ol>\n<p><strong>Important:<\/strong> Cortex Search isn&#x27;t approved at many banks yet. Everything here is a preview of what approval would add on top of the approved AI SQL in AI4.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> the Cortex Code screen with a <strong>How can I help?<\/strong> box<\/p>\n<h4>Create a search service over call transcripts<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a Cortex Search service BANKING_HOL.SEARCH_LAB.RB_CALL_SEARCH on the TRANSCRIPT column of BANKING_HOL.RAW_DATA.RB_CALL_TRANSCRIPTS, joined to RB_CUSTOMERS so it carries CHURNED as &#x27;yes&#x27; or &#x27;no&#x27;. Return CALL_ID, CUSTOMER_ID, CALL_START_TS, QUEUE, TOPIC and CHURNED, make QUEUE, TOPIC and CHURNED filterable attributes, use warehouse BANKING_WH and a target lag of 1 day. Then show the service.<\/pre><\/div>\n<p><strong>Tip:<\/strong> the service indexes the text itself and keeps itself up to date. There&#x27;s no embedding pipeline to build.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> the service is created and shows as active after a minute or two<\/p>\n<h4>Search in plain English<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Use SNOWFLAKE.CORTEX.SEARCH_PREVIEW on RB_CALL_SEARCH to find the 5 calls most like &quot;customer upset that their local branch is closing and they can&#x27;t use the app&quot;, then the 5 most like &quot;caller told to move money to a safe account&quot; filtered to the FRAUD queue. Show CALL_ID, CUSTOMER_ID, the topic and whether they left.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the first search returns retention calls from customers who left, and the second returns fraud reports. The words in your query don&#x27;t have to appear in the transcript.<\/p>\n<h4>Search the financial crime narratives<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a second Cortex Search service BANKING_HOL.SEARCH_LAB.RB_FINCRIME_SEARCH over fraud case investigator notes (RB_FRAUD_CASES) and SAR narratives (RB_SAR_NARRATIVES) together, with a DOC_TYPE attribute (FRAUD_CASE or SAR) and FRAUD_TYPE. Then search it for &quot;money mule receiving funds and moving them on within minutes&quot; and show the top 5 with their document type and customer.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> SAR narratives and account takeover cases describing funds moved on quickly to new payees<\/p>\n<h4>Search customers by name<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a Cortex Search service BANKING_HOL.SEARCH_LAB.RB_CUSTOMER_NAME_SEARCH over every customer in BANKING_HOL.RAW_DATA.RB_CUSTOMERS. Search on FULL_NAME (FIRST_NAME and LAST_NAME joined with a space), return CUSTOMER_ID, CITY and DOB (DATE_OF_BIRTH as YYYY-MM-DD text), make CITY an attribute, and use warehouse BANKING_WH with a target lag of 1 day. Then use CORTEX_SEARCH_RETRIEVE to show the 5 closest customers to &quot;Liz Moor&quot; and to &quot;MOORE, Elizabeth&quot;.<\/pre><\/div>\n<p><strong>Tip:<\/strong> Cortex Search combines keyword and meaning-based matching, so spelling slips, initials, reversed order and nicknames still find the right people. Nothing here compares names letter by letter.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> Elizabeth Moore near the top for both searches, alongside other customers with similar names<\/p>\n<h4>Match names from outside records<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>BANKING_HOL.RAW_DATA.RB_NAME_MENTIONS holds people named in police reports, other banks&#x27; mule referrals, dispute forms and the watchlist, spelt as those records spelt them: NAME_AS_WRITTEN, DOB_AS_WRITTEN (DD/MM/YYYY, sometimes blank) and TOWN. Match each one to a customer in two stages, and save the result as BANKING_HOL.SEARCH_LAB.RB_NAME_MATCHES:\n1. Candidates: for every mention, use LATERAL CORTEX_SEARCH_RETRIEVE on RB_CUSTOMER_NAME_SEARCH to get the 10 closest customers by name.\n2. Decide: score each candidate: 50 points if the date of birth matches (also try day and month swapped), 20 if the town matches, plus 0.3 times JAROWINKLER_SIMILARITY of the names (turn &quot;SURNAME, First&quot; round first). Keep the best candidate: MATCH at 75 or more, REVIEW from 45, otherwise NO_MATCH.\nThen check it against the answer key: TRUE_CUSTOMER_ID is the real customer (NULL for people who aren&#x27;t customers) and VARIATION says how the name was changed. Show right matches, wrong matches, reviews and no-matches by VARIATION, and compare with matching on JAROWINKLER_SIMILARITY of the name alone across all customers.<\/pre><\/div>\n<p><strong>Important:<\/strong> Treat a match as a lead, not a fact: anything marked REVIEW goes to an investigator, and nobody&#x27;s record is changed on a name match alone.<\/p>\n<p><strong>Tip:<\/strong> Search narrows 20,000 customers to 10 candidates per name; the date of birth and town then decide. Name similarity alone matches many people who just share a common name.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> around 6 in 10 mentions matched to the right customer and none to the wrong one, about 2 in 10 sent for review (mostly records with no date of birth), and no non-customer matched. Name similarity alone makes dozens of wrong matches<\/p>\n<h4>Compare search with AI SQL<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Compare Cortex Search with the approved AI SQL approach from AI4, on the same call transcripts in BANKING_HOL.RAW_DATA.RB_CALL_TRANSCRIPTS. In AI4, AI_SENTIMENT and AI_CLASSIFY labelled each transcript into BANKING_HOL.ANALYTICS.RB_CALL_INSIGHTS (columns SENTIMENT, CALL_REASON, VULNERABILITY_CUES), and AI_AGG summarised groups of transcripts in one paragraph. If RB_CALL_INSIGHTS doesn&#x27;t exist (AI4 was skipped), don&#x27;t build it: run AI_CLASSIFY on 20 transcripts instead. Answer one question both ways, &quot;customers worried about savings rates who might leave&quot;: first with RB_CALL_SEARCH, then with AI_CLASSIFY or the RB_CALL_INSIGHTS labels plus AI_AGG over those calls. Show both results side by side, then explain when a search service is the right tool, when AI SQL is enough, and how an agent would use RB_CALL_SEARCH as a tool.<\/pre><\/div>\n<p><strong>Tip:<\/strong> Search returns the most relevant calls in a second, without reading every row. AI SQL reads and labels every row, so it can count and summarise them all.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> search finds the closest-matching calls to a plain-English question and can ground an agent; AI SQL labels, counts and summarises every call in a table<\/p>\n<h3>Check your work<\/h3>\n<p>Your Cortex Search service over call transcripts exists in <code>BANKING_HOL.SEARCH_LAB<\/code>, and every outside name mention has a match decision in <code>SEARCH_LAB.RB_NAME_MATCHES<\/code>.<\/p>\n<h3>In your bank<\/h3>\n<p>Until Cortex Search is approved, AI4&#x27;s AI SQL covers the scoring and summarising, and AI3&#x27;s knowledge extension covers documentation search. This module is the business case for approving it: plain-English retrieval over the bank&#x27;s own documents, governed in the same account.<\/p>", "sql": "-- =====================================================\n-- AI5: CORTEX SEARCH OVER CALL TRANSCRIPTS AND CASE NOTES - reference SQL\n-- Semantic search over unstructured text: calls and case notes.\n-- Needs setup/10b_search_lab.sql. Run as HOL_PARTICIPANT.\n-- =====================================================\nUSE SECONDARY ROLES NONE;\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.SEARCH_LAB;\n\n-- 1. A search service over every call transcript, with filterable attributes\nCREATE OR REPLACE CORTEX SEARCH SERVICE RB_CALL_SEARCH\n    ON TRANSCRIPT\n    ATTRIBUTES QUEUE, TOPIC, CHURNED\n    WAREHOUSE = BANKING_WH\n    TARGET_LAG = '1 day'\n    COMMENT = 'AI5: semantic search over retail call transcripts'\nAS\nSELECT t.CALL_ID, t.CUSTOMER_ID, t.CALL_START_TS, t.QUEUE, t.TOPIC, IFF(c.CHURNED, 'yes', 'no') AS CHURNED, t.TRANSCRIPT\nFROM BANKING_HOL.RAW_DATA.RB_CALL_TRANSCRIPTS t\nJOIN BANKING_HOL.RAW_DATA.RB_CUSTOMERS c ON c.CUSTOMER_ID = t.CUSTOMER_ID;\n\n-- 2. Ask it in plain English, with and without a filter\nSELECT PARSE_JSON(SNOWFLAKE.CORTEX.SEARCH_PREVIEW('BANKING_HOL.SEARCH_LAB.RB_CALL_SEARCH',\n    '{\"query\": \"customer upset that their local branch is closing and they cannot use the app\", \"columns\": [\"CALL_ID\", \"CUSTOMER_ID\", \"QUEUE\", \"CHURNED\"], \"limit\": 5}'))['results'] AS RESULTS;\n\nSELECT PARSE_JSON(SNOWFLAKE.CORTEX.SEARCH_PREVIEW('BANKING_HOL.SEARCH_LAB.RB_CALL_SEARCH',\n    '{\"query\": \"caller told to move money to a safe account\", \"columns\": [\"CALL_ID\", \"CUSTOMER_ID\", \"TOPIC\"], \"filter\": {\"@eq\": {\"QUEUE\": \"FRAUD\"}}, \"limit\": 5}'))['results'] AS RESULTS;\n\n-- 3. A second service over the financial crime narratives (case notes and SARs together)\nCREATE OR REPLACE CORTEX SEARCH SERVICE RB_FINCRIME_SEARCH\n    ON BODY\n    ATTRIBUTES DOC_TYPE, FRAUD_TYPE\n    WAREHOUSE = BANKING_WH\n    TARGET_LAG = '1 day'\n    COMMENT = 'AI5: semantic search over fraud case notes and SAR narratives'\nAS\nSELECT CASE_ID AS DOC_ID, 'FRAUD_CASE' AS DOC_TYPE, FRAUD_TYPE, CUSTOMER_ID, INVESTIGATOR_NOTES AS BODY FROM BANKING_HOL.RAW_DATA.RB_FRAUD_CASES\nUNION ALL\nSELECT SAR_ID, 'SAR', NULL, CUSTOMER_ID, NARRATIVE FROM BANKING_HOL.RAW_DATA.RB_SAR_NARRATIVES;\n\nSELECT PARSE_JSON(SNOWFLAKE.CORTEX.SEARCH_PREVIEW('BANKING_HOL.SEARCH_LAB.RB_FINCRIME_SEARCH',\n    '{\"query\": \"money mule receiving funds and moving them on within minutes\", \"columns\": [\"DOC_ID\", \"DOC_TYPE\", \"CUSTOMER_ID\"], \"limit\": 5}'))['results'] AS RESULTS;\n\n-- 4. Fuzzy name matching: a search service over customer names\nCREATE OR REPLACE CORTEX SEARCH SERVICE RB_CUSTOMER_NAME_SEARCH\n    ON FULL_NAME\n    ATTRIBUTES CITY\n    WAREHOUSE = BANKING_WH\n    TARGET_LAG = '1 day'\n    COMMENT = 'AI5: fuzzy search over customer names'\nAS\nSELECT CUSTOMER_ID, FIRST_NAME || ' ' || LAST_NAME AS FULL_NAME, CITY, TO_VARCHAR(DATE_OF_BIRTH, 'YYYY-MM-DD') AS DOB\nFROM BANKING_HOL.RAW_DATA.RB_CUSTOMERS;\n\nSELECT * FROM TABLE(CORTEX_SEARCH_RETRIEVE(service_name => 'BANKING_HOL.SEARCH_LAB.RB_CUSTOMER_NAME_SEARCH', query => 'Liz Moor', limit => 5));\n\n-- 5. Match every outside name: search for 10 candidates, then decide on date of birth, town and name similarity\nCREATE OR REPLACE TABLE RB_NAME_MATCHES AS\nWITH cand AS (\n    SELECT m.MENTION_ID, r.CUSTOMER_ID,\n           (r.DOB::DATE = TRY_TO_DATE(m.DOB_AS_WRITTEN, 'DD/MM/YYYY') OR r.DOB::DATE = TRY_TO_DATE(m.DOB_AS_WRITTEN, 'MM/DD/YYYY')) AS DOB_MATCH,\n           UPPER(r.CITY) = UPPER(m.TOWN) AS TOWN_MATCH,\n           JAROWINKLER_SIMILARITY(UPPER(r.FULL_NAME), UPPER(REGEXP_REPLACE(m.NAME_AS_WRITTEN, '^([^,]+), (.+)$', '\\\\2 \\\\1'))) AS NAME_SIM\n    FROM BANKING_HOL.RAW_DATA.RB_NAME_MENTIONS m,\n    LATERAL CORTEX_SEARCH_RETRIEVE(service_name => 'BANKING_HOL.SEARCH_LAB.RB_CUSTOMER_NAME_SEARCH', query => m.NAME_AS_WRITTEN, limit => 10) r\n), best AS (\n    SELECT *, 50 * COALESCE(DOB_MATCH::INT, 0) + 20 * COALESCE(TOWN_MATCH::INT, 0) + 0.3 * NAME_SIM AS SCORE\n    FROM cand QUALIFY ROW_NUMBER() OVER (PARTITION BY MENTION_ID ORDER BY SCORE DESC) = 1\n)\nSELECT m.MENTION_ID, m.SOURCE, m.NAME_AS_WRITTEN, m.DOB_AS_WRITTEN, m.TOWN, b.CUSTOMER_ID AS MATCHED_CUSTOMER_ID,\n       b.DOB_MATCH, b.TOWN_MATCH, b.NAME_SIM, b.SCORE,\n       CASE WHEN b.SCORE >= 75 THEN 'MATCH' WHEN b.SCORE >= 45 THEN 'REVIEW' ELSE 'NO_MATCH' END AS DECISION,\n       m.TRUE_CUSTOMER_ID, m.VARIATION\nFROM BANKING_HOL.RAW_DATA.RB_NAME_MENTIONS m LEFT JOIN best b USING (MENTION_ID);\n\n-- Score it against the answer key\nSELECT VARIATION, COUNT(*) AS MENTIONS,\n       COUNT_IF(DECISION = 'MATCH' AND MATCHED_CUSTOMER_ID = TRUE_CUSTOMER_ID) AS RIGHT_MATCH,\n       COUNT_IF(DECISION = 'MATCH' AND MATCHED_CUSTOMER_ID IS DISTINCT FROM TRUE_CUSTOMER_ID) AS WRONG_MATCH,\n       COUNT_IF(DECISION = 'REVIEW') AS REVIEW, COUNT_IF(DECISION = 'NO_MATCH') AS NO_MATCH\nFROM RB_NAME_MATCHES GROUP BY ROLLUP (VARIATION) ORDER BY VARIATION NULLS LAST;\n\n-- For comparison: name similarity alone, across every customer\nWITH m AS (SELECT MENTION_ID, TRUE_CUSTOMER_ID, UPPER(REGEXP_REPLACE(NAME_AS_WRITTEN, '^([^,]+), (.+)$', '\\\\2 \\\\1')) AS Q FROM BANKING_HOL.RAW_DATA.RB_NAME_MENTIONS),\nb AS (SELECT m.*, c.CUSTOMER_ID, JAROWINKLER_SIMILARITY(UPPER(c.FIRST_NAME || ' ' || c.LAST_NAME), m.Q) AS SIM\n      FROM m JOIN BANKING_HOL.RAW_DATA.RB_CUSTOMERS c ON TRUE QUALIFY ROW_NUMBER() OVER (PARTITION BY MENTION_ID ORDER BY SIM DESC) = 1)\nSELECT COUNT_IF(SIM >= 90 AND CUSTOMER_ID = TRUE_CUSTOMER_ID) AS RIGHT_MATCH,\n       COUNT_IF(SIM >= 90 AND CUSTOMER_ID IS DISTINCT FROM TRUE_CUSTOMER_ID) AS WRONG_MATCH\nFROM b;\n\nSHOW CORTEX SEARCH SERVICES IN SCHEMA BANKING_HOL.SEARCH_LAB;\n", "sql_name": "vignettes/ai5_cortex_search/ai5.sql"}, {"code": "APP0", "title": "Plan an app with Cortex Code", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>App Builder<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~20 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>Facilitator setup complete. No Git account needed.<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Fraud investigators get names from police reports, other banks and dispute forms, spelt every which way. They need one screen to see who each name probably is, what we know about that customer, and to record a decision. What should that app do, and what data does it need?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>A one-page plan for a fraud investigator app, written with Cortex Code: who uses it, the screens, the data, the actions, and who can see what<\/li>\n<li><code>APPS.FRAUD_REVIEW_QUEUE<\/code>: every outside name mention with its best candidate customer, the evidence (date of birth, town, name similarity) and the customer&#x27;s fraud history<\/li>\n<li><code>APPS.MATCH_DECISIONS<\/code>: an empty table the app will save each investigator decision to<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Open Cortex Code<\/h4>\n<p class=\"where\">Snowsight home page, the <strong>Home / CoCo<\/strong> toggle (top left) &gt; <strong>CoCo<\/strong><\/p>\n<ol>\n<li>At the top left of Snowsight, switch the toggle from <strong>Home<\/strong> to <strong>CoCo<\/strong>.<\/li>\n<li>Close the <strong>CoCo mode (preview)<\/strong> pop-up if it appears.<\/li>\n<li>Press <strong>New session<\/strong>.<\/li>\n<\/ol>\n<p><strong>Tip:<\/strong> everything in this pathway stays in your own Snowflake account. You don&#x27;t need a Git account: Cortex Code and your workspace keep the code.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> the Cortex Code screen with a <strong>How can I help?<\/strong> box<\/p>\n<h4>Plan the app<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>I want to build a Streamlit in Snowflake app for fraud investigators. They receive names from police reports, other banks&#x27; mule referrals, dispute forms and our watchlist, in BANKING_HOL.RAW_DATA.RB_NAME_MENTIONS (NAME_AS_WRITTEN, DOB_AS_WRITTEN, TOWN, SOURCE_DESCRIPTION), and need to decide which of our customers in BANKING_HOL.RAW_DATA.RB_CUSTOMERS each one is, using that customer&#x27;s fraud cases in BANKING_HOL.RAW_DATA.RB_FRAUD_CASES. Look at those tables, then write a one-page plan: who uses the app, the screens (a queue and a review panel), the data each screen needs, the actions (confirm, reject, escalate), what gets saved and where (schema BANKING_HOL.APPS), and who should be able to see what. Don&#x27;t build anything yet.<\/pre><\/div>\n<p><strong>Tip:<\/strong> planning first is the quickest way to a good app. Push back on the plan in plain English (&quot;investigators also need the customer&#x27;s city&quot;) before anything is built.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> a short plan with a queue screen, a review panel, three decision buttons, a decisions table in <code>BANKING_HOL.APPS<\/code>, and a note that a name match is a lead, not a fact<\/p>\n<h4>Build the review queue<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Build the data for the plan as BANKING_HOL.APPS.FRAUD_REVIEW_QUEUE, one row per name mention. Find candidate customers whose LAST_NAME starts with the same 3 letters as the mention&#x27;s surname (turn &quot;SURNAME, First&quot; round first). Score each candidate: 50 points if DATE_OF_BIRTH matches DOB_AS_WRITTEN (try DD/MM/YYYY and MM/DD/YYYY), 20 if the city matches TOWN, plus 0.3 times JAROWINKLER_SIMILARITY of the upper-cased names. Keep the best candidate per mention with its CUSTOMER_ID, name, city and date of birth, the evidence columns, SCORE, SUGGESTED (MATCH at 75 or more, REVIEW from 45, otherwise NO_MATCH) and CANDIDATE_FRAUD_CASES (how many RB_FRAUD_CASES that customer has). Then show the count of mentions by SUGGESTED.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> about 300 mentions: around 165 MATCH, 60 REVIEW and 70 NO_MATCH, with a handful of REVIEW candidates who already have fraud cases<\/p>\n<h4>Create the decisions table<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create an empty table BANKING_HOL.APPS.MATCH_DECISIONS for the app to save to: MENTION_ID, CUSTOMER_ID, DECISION (CONFIRMED, REJECTED or ESCALATED), NOTE, DECIDED_BY and DECIDED_AT defaulting to the current timestamp. Add a comment that DECIDED_BY is the app viewer, not the app owner.<\/pre><\/div>\n<p><strong>Important:<\/strong> the app will run with its owner&#x27;s rights, so <code>CURRENT_USER()<\/code> inside it returns the owner. The app must record the person using it from Streamlit (<code>st.user<\/code>), which APP1 does.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> an empty <code>MATCH_DECISIONS<\/code> table in <code>BANKING_HOL.APPS<\/code><\/p>\n<h3>Check your work<\/h3>\n<p><code>BANKING_HOL.APPS.FRAUD_REVIEW_QUEUE<\/code> has a suggested decision for every outside name mention.<\/p>\n<h3>In your bank<\/h3>\n<p>In production the queue would come from AI5&#x27;s Cortex Search matching once it&#x27;s approved. The plain SQL scoring here works in any account and gives the investigator the same evidence to decide on.<\/p>", "sql": "-- =====================================================\n-- APP0: PLAN AN APP - reference SQL\n-- The data behind the APP1 fraud investigator app: outside name mentions with\n-- their best candidate customer (no Cortex Search needed), the customer's fraud\n-- history, and an empty table the app saves dec
