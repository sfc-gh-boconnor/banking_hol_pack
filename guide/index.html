isions to. Run as HOL_PARTICIPANT.\n-- Cortex Code builds the same objects from the APP0 prompts; this is the fallback.\n-- =====================================================\nUSE SECONDARY ROLES NONE;\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.APPS;\n\n-- 1. The review queue: each outside mention, its best candidate and the evidence.\n--    Candidates share the first 3 letters of the surname; score = 50 for date of birth,\n--    20 for town, plus 0.3 x name similarity (the same scoring as AI5, without search).\nCREATE OR REPLACE TABLE FRAUD_REVIEW_QUEUE COMMENT = 'APP0: outside name mentions matched to customers, for investigator review' AS\nWITH m AS (\n    SELECT n.*, UPPER(REGEXP_REPLACE(n.NAME_AS_WRITTEN, '^([^,]+), (.+)$', '\\\\2 \\\\1')) AS Q\n    FROM BANKING_HOL.RAW_DATA.RB_NAME_MENTIONS n),\ncand AS (\n    SELECT m.MENTION_ID, c.CUSTOMER_ID, c.FIRST_NAME || ' ' || c.LAST_NAME AS CUSTOMER_NAME, c.CITY, c.DATE_OF_BIRTH,\n           (c.DATE_OF_BIRTH = TRY_TO_DATE(m.DOB_AS_WRITTEN, 'DD/MM/YYYY') OR c.DATE_OF_BIRTH = TRY_TO_DATE(m.DOB_AS_WRITTEN, 'MM/DD/YYYY')) AS DOB_MATCH,\n           UPPER(c.CITY) = UPPER(m.TOWN) AS TOWN_MATCH,\n           JAROWINKLER_SIMILARITY(UPPER(c.FIRST_NAME || ' ' || c.LAST_NAME), m.Q) AS NAME_SIM\n    FROM m JOIN BANKING_HOL.RAW_DATA.RB_CUSTOMERS c ON LEFT(UPPER(c.LAST_NAME), 3) = LEFT(SPLIT_PART(m.Q, ' ', -1), 3)),\nbest AS (\n    SELECT *, 50 * COALESCE(DOB_MATCH::INT, 0) + 20 * COALESCE(TOWN_MATCH::INT, 0) + 0.3 * NAME_SIM AS SCORE\n    FROM cand QUALIFY ROW_NUMBER() OVER (PARTITION BY MENTION_ID ORDER BY SCORE DESC) = 1)\nSELECT m.MENTION_ID, m.SOURCE, m.SOURCE_DESCRIPTION, m.NAME_AS_WRITTEN, m.DOB_AS_WRITTEN, m.TOWN,\n       b.CUSTOMER_ID AS CANDIDATE_CUSTOMER_ID, b.CUSTOMER_NAME AS CANDIDATE_NAME, b.CITY AS CANDIDATE_CITY, b.DATE_OF_BIRTH AS CANDIDATE_DOB,\n       b.DOB_MATCH, b.TOWN_MATCH, ROUND(b.NAME_SIM) AS NAME_SIM, ROUND(b.SCORE) AS SCORE,\n       CASE WHEN b.SCORE >= 75 THEN 'MATCH' WHEN b.SCORE >= 45 THEN 'REVIEW' ELSE 'NO_MATCH' END AS SUGGESTED,\n       (SELECT COUNT(*) FROM BANKING_HOL.RAW_DATA.RB_FRAUD_CASES f WHERE f.CUSTOMER_ID = b.CUSTOMER_ID) AS CANDIDATE_FRAUD_CASES\nFROM m LEFT JOIN best b USING (MENTION_ID);\n\n-- 2. Where the app saves what the investigator decided (one row per decision; the latest wins)\nCREATE TABLE IF NOT EXISTS MATCH_DECISIONS (\n    MENTION_ID   VARCHAR,\n    CUSTOMER_ID  VARCHAR,\n    DECISION     VARCHAR COMMENT 'CONFIRMED, REJECTED or ESCALATED',\n    NOTE         VARCHAR,\n    DECIDED_BY   VARCHAR COMMENT 'The app viewer (st.user), not the app owner',\n    DECIDED_AT   TIMESTAMP_LTZ DEFAULT CURRENT_TIMESTAMP()\n) COMMENT = 'APP1: investigator decisions saved by the FRAUD_INVESTIGATOR app';\n\n-- What the app will show first: the queue by suggested decision\nSELECT SUGGESTED, COUNT(*) AS MENTIONS, COUNT_IF(CANDIDATE_FRAUD_CASES > 0) AS WITH_FRAUD_HISTORY\nFROM FRAUD_REVIEW_QUEUE GROUP BY 1 ORDER BY 1;\n", "sql_name": "vignettes/app0_plan_an_app/app0.sql"}, {"code": "APP1", "title": "Build and ship the fraud investigator app", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>App Builder<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~45 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>APP0 (<code>APPS.FRAUD_REVIEW_QUEUE<\/code> and <code>APPS.MATCH_DECISIONS<\/code>). No Git account needed.<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Can someone who isn&#x27;t a full-time developer turn the APP0 plan into a working, governed app that investigators use today, without a Git account, a laptop install or a deployment pipeline?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>A Streamlit app in your private workspace, written by Cortex Code: a review queue, a review panel with the evidence and fraud history, and Confirm / Not our customer / Escalate buttons<\/li>\n<li>The deployed app <code>BANKING_HOL.APPS.FRAUD_INVESTIGATOR<\/code>, shared view-only with another role<\/li>\n<li>Decisions saved to <code>APPS.MATCH_DECISIONS<\/code>, with who made each one<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Create a Streamlit app in your workspace<\/h4>\n<p class=\"where\"><strong>Projects &gt; Workspaces<\/strong>, your private workspace (<strong>My Workspace<\/strong>)<\/p>\n<ol>\n<li>Open <strong>Projects &gt; Workspaces<\/strong>.<\/li>\n<li>Select <strong>+ Add new &gt; Streamlit app<\/strong>, and name the folder <code>fraud_investigator<\/code>.<\/li>\n<li>Open <code>streamlit_app.py<\/code> in the new folder.<\/li>\n<\/ol>\n<p><strong>Tip:<\/strong> your workspace is private, and Snowflake keeps its files. That&#x27;s why there&#x27;s no Git step: Git is optional, for when a team wants version control.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> a folder with <code>streamlit_app.py<\/code>, <code>pyproject.toml<\/code>, <code>snowflake.yml<\/code> and <code>.streamlit/config.toml<\/code><\/p>\n<h4>Write the app with Cortex Code<\/h4>\n<p class=\"where\">Paste into: the Cortex Code panel in the workspace (the <strong>CoCo<\/strong> icon at the lower right)<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Replace fraud_investigator/streamlit_app.py with a Streamlit in Snowflake app titled &quot;Fraud investigator&quot; for fraud investigators, using get_active_session(). Read BANKING_HOL.APPS.FRAUD_REVIEW_QUEUE with each mention&#x27;s latest decision from BANKING_HOL.APPS.MATCH_DECISIONS. At the top: a multi-select segmented control for SUGGESTED (default REVIEW) and three metrics (in the queue, decided, candidate has fraud history). Left: the queue as a dataframe with single-row selection, candidates with fraud history first. Right: for the selected row, the mention as written, the best candidate with date of birth, town and name similarity, and that customer&#x27;s cases from BANKING_HOL.RAW_DATA.RB_FRAUD_CASES; an optional note; and buttons Confirm match, Not our customer and Escalate that insert CONFIRMED, REJECTED or ESCALATED into MATCH_DECISIONS. Record DECIDED_BY from st.user (the viewer), never CURRENT_USER(), which returns the app owner. Use bind parameters for every value, cache reads with st.cache_data and clear the cache after a save. Keep the dependencies in pyproject.toml to streamlit and snowflake-snowpark-python.<\/pre><\/div>\n<p><strong>Important:<\/strong> an app runs with its owner&#x27;s rights by default, so everyone who opens it sees what the owner role can see. Keep the app to the data investigators need.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> Cortex Code edits <code>streamlit_app.py<\/code> (and <code>pyproject.toml<\/code> if needed) in your workspace and explains the layout<\/p>\n<h4>Run it<\/h4>\n<p class=\"where\">the action bar at the top of <code>streamlit_app.py<\/code><\/p>\n<ol>\n<li>Press <strong>Run<\/strong> (or Cmd+Enter / Ctrl+Enter).<\/li>\n<li>Select a REVIEW row, then press <strong>Escalate<\/strong>.<\/li>\n<li>Ask Cortex Code for any change in plain English, for example &quot;show the customer&#x27;s city next to their name&quot;, and press <strong>Run<\/strong> again.<\/li>\n<\/ol>\n<p><strong>Tip:<\/strong> the running app is a private development app that only you can see. The first start takes a minute or two.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> the queue on the left; after you select a row, the evidence and fraud history on the right, and a &quot;Saved&quot; message when you press a button<\/p>\n<h4>Deploy it<\/h4>\n<p class=\"where\">the project pane toolbar &gt; <strong>Settings<\/strong>, then <strong>Deploy<\/strong><\/p>\n<ol>\n<li>Select <strong>Settings<\/strong>, then the <strong>Targets<\/strong> tab, and choose the deploy target.<\/li>\n<li>Set <strong>App ID<\/strong> to <code>FRAUD_INVESTIGATOR<\/code> and <strong>App title<\/strong> to <code>Fraud investigator<\/code>.<\/li>\n<li>Set <strong>Owner role of deployed app<\/strong> to <code>HOL_PARTICIPANT<\/code> and <strong>App location<\/strong> to <code>BANKING_HOL<\/code> / <code>APPS<\/code>.<\/li>\n<li>Set <strong>Execution<\/strong> to warehouse <code>BANKING_WH<\/code> and compute pool <code>HOL_COMPUTE_POOL_CPU<\/code>.<\/li>\n<li>Select <strong>Save settings<\/strong>, then <strong>Deploy<\/strong>, choose the target and select <strong>Deploy<\/strong>.<\/li>\n<\/ol>\n<p><strong>Tip:<\/strong> these settings are saved in <code>snowflake.yml<\/code>, so the next deploy uses them too. If the deploy reports a missing package, add <code>PYPI_ACCESS_INTEGRATION<\/code> on the <strong>Network<\/strong> tab.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> the target shows as deployed, and the app opens at its own URL outside the workspace<\/p>\n<h4>Share it and record a decision<\/h4>\n<p class=\"where\">the project pane toolbar &gt; <strong>Share<\/strong><\/p>\n<ol>\n<li>Select <strong>Share<\/strong>, add the role <code>HOL_RESTRICTED<\/code> as <strong>View only<\/strong>, and select <strong>Save grants<\/strong>.<\/li>\n<li>Open the deployed app and record a decision on one REVIEW row.<\/li>\n<\/ol>\n<p><strong>Tip:<\/strong> sharing grants USAGE on the app. Anyone with that role can use it without access to your workspace or its code.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> the decision appears in the queue&#x27;s last-decision column<\/p>\n<h3>Check your work<\/h3>\n<p><code>BANKING_HOL.APPS.FRAUD_INVESTIGATOR<\/code> is deployed, and <code>APPS.MATCH_DECISIONS<\/code> holds at least one decision.<\/p>\n<h3>In your bank<\/h3>\n<p>Here the app is built and deployed from a private workspace with no Git. A team would move it to a Git-backed or shared workspace for review before production. A reference version is in <code>streamlit_app.py<\/code> and <code>pyproject.toml<\/code>.<\/p>", "sql": "-- =====================================================\n-- APP1: BUILD AND SHIP THE FRAUD INVESTIGATOR APP - reference SQL\n-- The app itself is built in a workspace (streamlit_app.py, pyproject.toml).\n-- This file deploys the reference version the same way, as HOL_PARTICIPANT,\n-- for facilitators or anyone who can't use Workspaces, then checks it.\n-- =====================================================\nUSE SECONDARY ROLES NONE;\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.APPS;\n\n-- 1. Upload the two files from this folder to a stage (Snowsight: Data > Add data, or snow stage copy)\nCREATE STAGE IF NOT EXISTS APP1_SOURCE COMMENT = 'APP1: fraud investigator app source';\n-- From the lab repository (or upload them: PUT file://streamlit_app.py @APP1_SOURCE AUTO_COMPRESS = FALSE OVERWRITE = TRUE;)\nCOPY FILES INTO @APP1_SOURCE\n  FROM @BANKING_HOL_SETUP.PUBLIC.HOL_REPO/branches/main/vignettes/app1_fraud_investigator_app/\n  FILES = ('streamlit_app.py', 'pyproject.toml');\n\n-- 2. Create the app on the container runtime and publish it\nCREATE OR REPLACE STREAMLIT FRAUD_INVESTIGATOR\n    FROM @APP1_SOURCE\n    MAIN_FILE = 'streamlit_app.py'\n    TITLE = 'Fraud investigator'\n    QUERY_WAREHOUSE = BANKING_WH\n    COMPUTE_POOL = HOL_COMPUTE_POOL_CPU\n    RUNTIME_NAME = 'SYSTEM$ST_CONTAINER_RUNTIME_PY3_11'\n    EXTERNAL_ACCESS_INTEGRATIONS = (PYPI_ACCESS_INTEGRATION);\nALTER STREAMLIT FRAUD_INVESTIGATOR ADD LIVE VERSION FROM LAST;\n\n-- 3. Share it view-only\nGRANT USAGE ON STREAMLIT FRAUD_INVESTIGATOR TO ROLE HOL_RESTRICTED;\n\n-- 4. Check: the app exists, and decisions are being saved\nSHOW STREAMLITS LIKE 'FRAUD_INVESTIGATOR' IN SCHEMA BANKING_HOL.APPS;\nSELECT DECISION, COUNT(*) AS DECISIONS, MAX(DECIDED_AT) AS LATEST, ANY_VALUE(DECIDED_BY) AS BY_SOMEONE\nFROM MATCH_DECISIONS GROUP BY 1;\n", "sql_name": "vignettes/app1_fraud_investigator_app/app1.sql"}, {"code": "GOV1", "title": "PII policies", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Governance / Risk<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~45 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td><code>setup/catchup/core_analytics.sql<\/code><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Prove account identifiers are protected wherever they flow - dashboards, semantic views, agents - and that people only see clients in their region.<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li><code>GOVERNANCE.ACCOUNT_REGISTER<\/code><\/li>\n<li>Tag <code>DATA_SENSITIVITY<\/code> with tag-based masking policy<\/li>\n<li>Row access policy <code>RAP_ACCOUNT_REGION<\/code><\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Let Snowflake find the sensitive data<\/h4>\n<p class=\"where\">the Cortex Code sidebar<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a table BANKING_HOL.GOVERNANCE.ACCOUNT_REGISTER as a copy of BANKING_HOL.ANALYTICS.STG_ACCOUNTS, run SYSTEM$CLASSIFY on it with auto_tag true, and show which columns were tagged and with what.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> Snowflake&#x27;s classifier flags identifier columns such as IBAN and account number<\/p>\n<h4>Apply the bank&#x27;s sensitivity tags<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>In BANKING_HOL.GOVERNANCE create (or replace) a tag DATA_SENSITIVITY with allowed values PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED. On ACCOUNT_REGISTER set IBAN and ACCOUNT_NUMBER to RESTRICTED, SORT_CODE to CONFIDENTIAL and BIC to INTERNAL.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> four tagged columns, with <code>IBAN<\/code> = <code>RESTRICTED<\/code><\/p>\n<h4>Mask every tagged column with one policy<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a masking policy BANKING_HOL.GOVERNANCE.MASK_RESTRICTED_STRING for strings: HOL_ADMIN (the data owner) sees the real value; CONFIDENTIAL values (read with SYSTEM$GET_TAG_ON_CURRENT_COLUMN on BANKING_HOL.GOVERNANCE.DATA_SENSITIVITY) keep their shape with digits replaced by *; everything else shows &#x27;****&#x27; plus the last 4 characters. Attach it to the DATA_SENSITIVITY tag, then remove the tag from BIC so it stays readable.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> one policy that protects every column carrying the tag, now and in future<\/p>\n<h4>Filter rows by region<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Create a mapping table BANKING_HOL.GOVERNANCE.REGION_ENTITLEMENTS (ROLE_NAME, CURRENCY) with HOL_RESTRICTED mapped to GBP. Create a row access policy RAP_ACCOUNT_REGION on a currency column: HOL_PARTICIPANT sees all rows, otherwise only currencies mapped to a role in the session. Add it to ACCOUNT_REGISTER on CURRENCY and grant SELECT on ACCOUNT_REGISTER to HOL_RESTRICTED.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the row access policy attached to <code>ACCOUNT_REGISTER<\/code><\/p>\n<h4>Test as each persona<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Show 8 rows (ACCOUNT_ID, CUSTOMER_NAME, CURRENCY, SORT_CODE, ACCOUNT_NUMBER, IBAN) and the row count of BANKING_HOL.GOVERNANCE.ACCOUNT_REGISTER, first as my current role and then as HOL_RESTRICTED, and explain the difference. Switch back to HOL_PARTICIPANT at the end.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> as the builder, 36 rows with masked identifiers; as <code>HOL_RESTRICTED<\/code>, 23 GBP-only masked rows<\/p>\n<h4>Policies follow the data into AI<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Show me every column in BANKING_HOL tagged DATA_SENSITIVITY and the masking policy protecting it. Then tell me the IBAN for any client in ACCOUNT_REGISTER.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> Cortex Code runs as your role, so it only ever sees and returns the masked IBAN<\/p>\n<h3>Check your work<\/h3>\n<p>Builder sees 36 masked rows; <code>HOL_RESTRICTED<\/code> sees 23 GBP-only masked rows; <code>HOL_ADMIN<\/code> sees full IBANs.<\/p>\n<h3>In your bank<\/h3>\n<p>In production, central governance applies tags and policies to the Iceberg source tables so every downstream object and agent inherits them.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE GOV1: CLASSIFY, TAG, MASK AND FILTER PII   (~45 min)\n-- Persona: Governance / Risk / Data Owner\n-- Question: \"Prove that account identifiers are protected wherever they flow -\n--            dashboards, semantic views and AI agents - and that people only\n--            see the clients in their region.\"\n-- Prereq:   setup/catchup/core_analytics.sql (STG_ACCOUNTS, STG_CUSTOMERS)\n-- Uses:     HOL_RESTRICTED role (granted to HOL_PARTICIPANT) to test as a consumer\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.GOVERNANCE;\n\n-- Reset (makes this script safe to run first time and to re-run)\nCREATE TAG IF NOT EXISTS DATA_SENSITIVITY;\nCREATE MASKING POLICY IF NOT EXISTS MASK_RESTRICTED_STRING AS (VAL STRING) RETURNS STRING -> VAL;\nALTER TAG DATA_SENSITIVITY UNSET MASKING POLICY MASK_RESTRICTED_STRING;\nDROP TABLE IF EXISTS ACCOUNT_REGISTER;\n\n-- -----------------------------------------------------\n-- GOV1.1 Let Snowflake find the sensitive data\n-- -----------------------------------------------------\nCREATE OR REPLACE TABLE ACCOUNT_REGISTER AS\nSELECT * FROM BANKING_HOL.ANALYTICS.STG_ACCOUNTS;   -- governed copy we own, for the lab\n\nCALL SYSTEM$CLASSIFY('BANKING_HOL.GOVERNANCE.ACCOUNT_REGISTER', {'auto_tag': true});\n\nSELECT COLUMN_NAME, TAG_NAME, TAG_VALUE\nFROM TABLE(BANKING_HOL.INFORMATION_SCHEMA.TAG_REFERENCES_ALL_COLUMNS(\n        'BANKING_HOL.GOVERNANCE.ACCOUNT_REGISTER', 'table'))\nORDER BY COLUMN_NAME;\n\n-- -----------------------------------------------------\n-- GOV1.2 The bank's own tag taxonomy\n-- -----------------------------------------------------\nCREATE OR REPLACE TAG DATA_SENSITIVITY\n    ALLOWED_VALUES 'PUBLIC', 'INTERNAL', 'CONFIDENTIAL', 'RESTRICTED'\n    COMMENT = 'Bank-style data sensitivity classification';\n\nALTER TABLE ACCOUNT_REGISTER MODIFY COLUMN IBAN           SET TAG DATA_SENSITIVITY = 'RESTRICTED';\nALTER TABLE ACCOUNT_REGISTER MODIFY COLUMN ACCOUNT_NUMBER SET TAG DATA_SENSITIVITY = 'RESTRICTED';\nALTER TABLE ACCOUNT_REGISTER MODIFY COLUMN SORT_CODE      SET TAG DATA_SENSITIVITY = 'CONFIDENTIAL';\nALTER TABLE ACCOUNT_REGISTER MODIFY COLUMN BIC            SET TAG DATA_SENSITIVITY = 'INTERNAL';\n\n-- -----------------------------------------------------\n-- GOV1.3 Tag-based masking: protect every column carrying the tag, now and in future\n-- -----------------------------------------------------\nCREATE OR REPLACE MASKING POLICY MASK_RESTRICTED_STRING AS (VAL STRING) RETURNS STRING ->\n    CASE\n        WHEN IS_ROLE_IN_SESSION('HOL_ADMIN') THEN VAL                              -- data owner\n        WHEN SYSTEM$GET_TAG_ON_CURRENT_COLUMN('BANKING_HOL.GOVERNANCE.DATA_SENSITIVITY') = 'CONFIDENTIAL'\n             THEN REGEXP_REPLACE(VAL, '[0-9]', '*')                                 -- shape kept, digits hidden\n        WHEN VAL IS NULL THEN NULL\n        ELSE '****' || RIGHT(VAL, 4)                                               -- last 4 only\n    END\n    COMMENT = 'Masks RESTRICTED/CONFIDENTIAL strings for everyone except the data owner';\n\nALTER TAG DATA_SENSITIVITY SET MASKING POLICY MASK_RESTRICTED_STRING;\n-- Note: the policy applies to every tagged value; INTERNAL and PUBLIC columns\n-- fall through to last-4 here - refine the CASE for your own taxonomy.\nALTER TABLE ACCOUNT_REGISTER MODIFY COLUMN BIC UNSET TAG DATA_SENSITIVITY;\n\n-- -----------------------------------------------------\n-- GOV1.4 Row access: users only see clients for their region\n-- -----------------------------------------------------\nCREATE OR REPLACE TABLE REGION_ENTITLEMENTS (ROLE_NAME STRING, CURRENCY STRING);\nINSERT INTO REGION_ENTITLEMENTS VALUES\n    ('HOL_RESTRICTED', 'GBP');      -- UK desk: sterling accounts only\n\nCREATE OR REPLACE ROW ACCESS POLICY RAP_ACCOUNT_REGION AS (ACCT_CURRENCY STRING) RETURNS BOOLEAN ->\n    IS_ROLE_IN_SESSION('HOL_PARTICIPANT')   -- lab builders see all\n    OR EXISTS (SELECT 1 FROM BANKING_HOL.GOVERNANCE.REGION_ENTITLEMENTS e\n               WHERE IS_ROLE_IN_SESSION(e.ROLE_NAME) AND e.CURRENCY = ACCT_CURRENCY);\n\nALTER TABLE ACCOUNT_REGISTER ADD ROW ACCESS POLICY RAP_ACCOUNT_REGION ON (CURRENCY);\n\n-- (USAGE on the GOVERNANCE schema is granted to HOL_RESTRICTED by facilitator setup)\nGRANT SELECT ON TABLE ACCOUNT_REGISTER TO ROLE HOL_RESTRICTED;\n\n-- -----------------------------------------------------\n-- GOV1.5 Test as each persona\n-- -----------------------------------------------------\n-- As the builder: all rows, but RESTRICTED values masked (not the data owner)\nSELECT ACCOUNT_ID, CUSTOMER_NAME, CURRENCY, SORT_CODE, ACCOUNT_NUMBER, IBAN\nFROM ACCOUNT_REGISTER ORDER BY ACCOUNT_ID LIMIT 8;\n\nSELECT 'HOL_PARTICIPANT' AS AS_ROLE, COUNT(*) AS VISIBLE_ACCOUNTS FROM ACCOUNT_REGISTER;\n\n-- As the restricted UK desk: GBP accounts only, masked\nUSE ROLE HOL_RESTRICTED;\nSELECT ACCOUNT_ID, CUSTOMER_NAME, CURRENCY, SORT_CODE, ACCOUNT_NUMBER, IBAN\nFROM BANKING_HOL.GOVERNANCE.ACCOUNT_REGISTER ORDER BY ACCOUNT_ID LIMIT 8;\nSELECT 'HOL_RESTRICTED' AS AS_ROLE, COUNT(*) AS VISIBLE_ACCOUNTS FROM BANKING_HOL.GOVERNANCE.ACCOUNT_REGISTER;\n\nUSE ROLE HOL_PARTICIPANT;\n\n-- -----------------------------------------------------\n-- GOV1.6 Policies follow the data into AI\n-- Ask CoCo or an agent built over ACCOUNT_REGISTER for \"the IBAN for Royal Trust PLC\":\n-- the agent runs as YOUR role, so it only ever returns the masked value.\n-- Bonus CoCo prompt:\n--   \"Show me every column in BANKING_HOL tagged DATA_SENSITIVITY and the\n--    masking policy protecting it.\"\n-- -----------------------------------------------------\n\n-- In your bank: in production, tag + masking policies are owned by a central\n-- governance role and applied to the Iceberg source tables themselves, so every\n-- downstream view, dbt model, semantic view and agent inherits them automatically.\n\nSELECT 'GOV1 complete' AS STATUS;\n", "sql_name": "vignettes/gov1_pii_policies/gov1.sql"}, {"code": "GOV2", "title": "Lineage, audit and trust", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Governance / Risk / Audit<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~30 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>C1 only. GOV2 uses a ready-made audit pack in <code>BANKING_HOL.AUDIT_PACK<\/code>, so it doesn&#x27;t depend on any other module<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>If a source Iceberg table changes, what breaks? And who - human or agent - has been reading client data?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>Lineage and access-history queries<\/li>\n<li>Business comments on the SLA data product<\/li>\n<li>A daily Cortex Code automation <code>RESTRICTED_COLUMN_WATCH<\/code> reporting new reads of restricted columns<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Ask the agent a few questions first<\/h4>\n<p class=\"where\">Snowsight &gt; <strong>AI &amp; ML &gt; Agents &gt; PAYMENTS_AUDIT_AGENT<\/strong> (the chat on the right)<\/p>\n<p><strong>Important:<\/strong> do this step now, at the start of the module. Agent usage takes up to about 45 minutes to reach ACCOUNT_USAGE.<\/p>\n<ol>\n<li>Paste the first question from the card below into the agent chat.<\/li>\n<li>Ask &quot;What is the success rate by payment scheme?&quot;<\/li>\n<li>Ask &quot;How many client accounts does each relationship manager look after?&quot;<\/li>\n<\/ol>\n<p>The queries you ask here are what you&#x27;ll audit in &quot;What are our agents doing?&quot; later.<\/p>\n<p>GOV2 audits a ready-made <strong>audit pack<\/strong> in <code>BANKING_HOL.AUDIT_PACK<\/code>, built on the Iceberg sources:<\/p>\n<ul>\n<li>a daily SLA data product (<code>PAYMENT_SLA_DAILY<\/code>)<\/li>\n<li>a client accounts view with restricted columns (<code>CLIENT_ACCOUNTS<\/code>)<\/li>\n<li>a semantic view (<code>SV_PAYMENTS_AUDIT<\/code>)<\/li>\n<li>an agent (<code>PAYMENTS_AUDIT_AGENT<\/code>)<\/li>\n<\/ul>\n<p>The pack is separate from everything the other modules build, so you can still do those afterwards.<\/p>\n<p class=\"where\">Paste into: the <strong>PAYMENTS_AUDIT_AGENT<\/strong> chat (not CoCo)<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Which payment scheme had the most SLA breach days?<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> an answer to each question, with the SQL the agent ran over SV_PAYMENTS_AUDIT. Carry on with the next steps while the usage data arrives.<\/p>\n<h4>Impact analysis on the Iceberg source<\/h4>\n<p class=\"where\">the <strong>CoCo<\/strong> tab (Home/CoCo toggle at the top of the left nav &gt; <strong>New session<\/strong>); also Snowsight &gt; <strong>Catalog &gt; BANKING_HOL &gt; RAW_DATA &gt; PAYMENTS &gt; Lineage<\/strong><\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>If I drop the column PROCESSING_TIME_MS from BANKING_HOL.RAW_DATA.PAYMENTS, which downstream objects and agents break? Use SNOWFLAKE.CORE.GET_LINEAGE downstream to 3 levels, and explain any objects shown as ***.***.***.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the audit pack chain <code>PAYMENT_SLA_DAILY<\/code> &gt; <code>SV_PAYMENTS_AUDIT<\/code> &gt; <code>PAYMENTS_AUDIT_AGENT<\/code>, so the agent breaks, plus any staging views, marts and dynamic tables you built in other modules. Masked rows are objects your role can&#x27;t see: lineage never leaks them.<\/p>\n<h4>Where does the data product come from?<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Show the upstream lineage of the agent BANKING_HOL.AUDIT_PACK.PAYMENTS_AUDIT_AGENT to 3 levels (use OBJECT_DOMAIN CORTEX_AGENT), so I can see which semantic view, tables and Iceberg sources its answers come from.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the path back from the agent through <code>SV_PAYMENTS_AUDIT<\/code> and <code>PAYMENT_SLA_DAILY<\/code> to the Iceberg tables in <code>RAW_DATA<\/code><\/p>\n<h4>Who read restricted columns?<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>From SNOWFLAKE.ACCOUNT_USAGE.ACCESS_HISTORY, show who accessed the IBAN, ACCOUNT_NUMBER or SORT_CODE columns of any BANKING_HOL object in the last day, with time, user and object.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> recent reads, including your GOV1 queries if you did GOV1. To be sure there&#x27;s something to find, first run <code>SELECT * FROM BANKING_HOL.AUDIT_PACK.CLIENT_ACCOUNTS LIMIT 5<\/code>. ACCOUNT_USAGE can lag by up to about 3 hours, so this may be empty early in the day.<\/p>\n<h4>Turn the access check into a daily automation<\/h4>\n<p class=\"where\">the <strong>CoCo<\/strong> tab, in the same session as the step above<\/p>\n<p><strong>Autonomous Data Engineering:<\/strong> autonomous agents.<\/p>\n<ul>\n<li>A Cortex Code automation runs a prompt on a schedule, unattended. It&#x27;s GA in the CLI and public preview in Desktop.<\/li>\n<li>Cortex Code Cloud Agents take the same idea to longer, background tasks.<\/li>\n<\/ul>\n<ol>\n<li>Cortex Code offers to run the access-history query as a daily <strong>Cortex Code automation<\/strong>. Accept the offer, or ask for it with this prompt:<\/li>\n<\/ol>\n<p>A Cortex Code automation is a scheduled, unattended Cortex Code run in a Snowflake-managed sandbox.<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Set up a daily Cortex Code automation called RESTRICTED_COLUMN_WATCH that runs at 08:00 Europe/London. Each run: query SNOWFLAKE.ACCOUNT_USAGE.ACCESS_HISTORY for reads of the IBAN, ACCOUNT_NUMBER or SORT_CODE columns of any BANKING_HOL object in the last 24 hours, and report who read them, when, and from which object. It runs unattended, so it must not ask questions and must stay read-only. Create it paused, run it once now so I can see the report, then start the schedule.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> Cortex Code summarises the automation (name, schedule, read-only), creates it paused, runs it once and shows the report, then asks before starting the schedule. See it under <strong>Automations<\/strong> in the CoCo side nav (below <strong>New session<\/strong>). Each run uses your default role (<code>HOL_PARTICIPANT<\/code>), so it sees exactly what you see: masked values stay masked. Your lab login has no email address, so there&#x27;s no emailed run report; read the report in the run&#x27;s thread instead.<\/p>\n<h4>What are our agents doing?<\/h4>\n<p class=\"where\">the <strong>CoCo<\/strong> tab (Home/CoCo toggle at the top of the left nav &gt; <strong>New session<\/strong>); also Snowsight &gt; <strong>AI &amp; ML &gt; Agents &gt; PAYMENTS_AUDIT_AGENT &gt; Monitoring<\/strong><\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>From SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY, show queries in the last day against BANKING_HOL that used SEMANTIC_VIEW, with user, role, start time, duration and a preview of the SQL.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the queries your agents and Cortex Analyst generated, including the three questions you asked at the start, attributed to the user who asked. If they aren&#x27;t there yet, usage can take up to about 45 minutes to appear: carry on with the last step and come back to this one.<\/p>\n<h4>Document the data product<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Add a table comment to BANKING_HOL.AUDIT_PACK.PAYMENT_SLA_DAILY that starts &quot;Daily SLA compliance per payment scheme. Owner: Payments Operations.&quot; and states its grain (day x scheme) and source, plus a column comment on SLA_STATUS explaining COMPLIANT, AT RISK and BREACH. Then produce a one-page data product card for it: owner, grain, lineage, quality checks, sensitivity tags and consumers.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the comments saved, so humans and AI find the right table, and a data product card, which you see when you switch back to <strong>Home<\/strong> (Home/CoCo toggle)<\/p>\n<h3>Check your work<\/h3>\n<p>Downstream lineage from <code>RAW_DATA.PAYMENTS<\/code> reaches <code>PAYMENTS_AUDIT_AGENT<\/code>, the agent&#x27;s questions show in query history, and <code>PAYMENT_SLA_DAILY<\/code> is documented.<\/p>\n<h3>In your bank<\/h3>\n<p>ACCOUNT_USAGE views have up to ~3 hours latency - run history queries at the end of the session.<\/p>", "sql": "-- =====================================================\n-- VIGNETTE GOV2: LINEAGE, AUDIT AND TRUST   (~30 min)\n-- Persona: Governance / Risk / Audit\n-- Question: \"If a source Iceberg table changes, what breaks? And who - human\n--            or AI agent - has been reading client data?\"\n-- Prereq:   C1 only. Uses the ready-made audit pack in BANKING_HOL.AUDIT_PACK\n--           (setup/06_audit_pack.sql); ask PAYMENTS_AUDIT_AGENT a few questions first.\n-- Note:     ACCOUNT_USAGE views have up to ~3 hours latency. Run the\n--           immediate checks first; revisit the history queries at the end of the day.\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.AUDIT_PACK;\n\n-- -----------------------------------------------------\n-- GOV2.1 Impact analysis: what depends on the PAYMENTS Iceberg table? (immediate)\n-- Snowsight: Catalog > BANKING_HOL > RAW_DATA > PAYMENTS > Lineage tab\n-- -----------------------------------------------------\nSELECT DISTANCE, TARGET_OBJECT_DOMAIN, TARGET_OBJECT_DATABASE || '.' || TARGET_OBJECT_SCHEMA || '.' || TARGET_OBJECT_NAME AS DOWNSTREAM_OBJECT\nFROM TABLE(SNOWFLAKE.CORE.GET_LINEAGE('BANKING_HOL.RAW_DATA.PAYMENTS', 'TABLE', 'DOWNSTREAM', 3))\nORDER BY DISTANCE, DOWNSTREAM_OBJECT;\n\n-- And upstream: where do the agent's answers come from?\nSELECT DISTANCE, SOURCE_OBJECT_DOMAIN, SOURCE_OBJECT_DATABASE || '.' || SOURCE_OBJECT_SCHEMA || '.' || SOURCE_OBJECT_NAME AS UPSTREAM_OBJECT\nFROM TABLE(SNOWFLAKE.CORE.GET_LINEAGE('BANKING_HOL.AUDIT_PACK.PAYMENTS_AUDIT_AGENT', 'CORTEX_AGENT', 'UPSTREAM', 3))\nORDER BY DISTANCE, UPSTREAM_OBJECT;\n-- A row shown as ***.***.*** is an object in the lineage that your role has no\n-- privileges on (here the platform team's SEED schema). Lineage never leaks\n-- the existence of objects you are not entitled to see.\n\n-- Object dependencies (views, dynamic tables, semantic views) - immediate\nSELECT REFERENCING_OBJECT_NAME, REFERENCING_OBJECT_DOMAIN, REFERENCED_OBJECT_NAME\nFROM SNOWFLAKE.ACCOUNT_USAGE.OBJECT_DEPENDENCIES\nWHERE REFERENCED_DATABASE = 'BANKING_HOL'\nORDER BY REFERENCED_OBJECT_NAME\nLIMIT 50;\n\n-- Make sure there is a restricted-column read to find\nSELECT * FROM BANKING_HOL.AUDIT_PACK.CLIENT_ACCOUNTS LIMIT 5;\n\n-- -----------------------------------------------------\n-- GOV2.2 Who accessed restricted columns? (ACCOUNT_USAGE latency applies)\n-- -----------------------------------------------------\nSELECT ah.QUERY_START_TIME, ah.USER_NAME,\n       obj.value:objectName::STRING     AS OBJECT_NAME,\n       col.value:columnName::STRING     AS COLUMN_NAME\nFROM SNOWFLAKE.ACCOUNT_USAGE.ACCESS_HISTORY ah,\n     LATERAL FLATTEN(ah.BASE_OBJECTS_ACCESSED) obj,\n     LATERAL FLATTEN(obj.value:columns) col\nWHERE obj.value:objectName::STRING ILIKE 'BANKING_HOL.%'\n  AND col.value:columnName::STRING IN ('IBAN', 'ACCOUNT_NUMBER', 'SORT_CODE')\n  AND ah.QUERY_START_TIME >= DATEADD('day', -1, CURRENT_TIMESTAMP())\nORDER BY ah.QUERY_START_TIME DESC\nLIMIT 20;\n\n-- -----------------------------------------------------\n-- GOV2.3 What are our agents doing? Every agent call is observable\n-- Snowsight: AI & ML > Agents > PAYMENTS_AUDIT_AGENT > Monitoring\n-- -----------------------------------------------------\nSELECT QUERY_TYPE, USER_NAME, ROLE_NAME, START_TIME, TOTAL_ELAPSED_TIME / 1000 AS SECONDS,\n       LEFT(QUERY_TEXT, 120) AS QUERY_PREVIEW\nFROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY\nWHERE DATABASE_NAME = 'BANKING_HOL'\n  AND QUERY_TEXT ILIKE '%SEMANTIC_VIEW%'\n  AND START_TIME >= DATEADD('day', -1, CURRENT_TIMESTAMP())\nORDER BY START_TIME DESC\nLIMIT 20;\n\n-- -----------------------------------------------------\n-- GOV2.4 Document the data product so humans and AI find the right thing\n-- -----------------------------------------------------\nCOMMENT ON TABLE PAYMENT_SLA_DAILY IS\n  'Daily SLA compliance per payment scheme. Owner: Payments Operations. Grain: day x scheme. Source: Iceberg RAW_DATA.PAYMENTS and RAW_DATA.SLA_DEFINITIONS.';\nCOMMENT ON COLUMN PAYMENT_SLA_DAILY.SLA_STATUS IS\n  'COMPLIANT = met success-rate and P95 targets; AT RISK = within 5% of success target; BREACH = otherwise';\n\n-- Ask CoCo:\n--   \"If I drop column PROCESSING_TIME_MS from BANKING_HOL.RAW_DATA.PAYMENTS,\n--    which downstream objects and agents break? Use lineage to check.\"\n--   \"Produce a one-page data product card for PAYMENT_SLA_DAILY: owner, grain,\n--    lineage, quality checks, sensitivity tags and consumers.\"\n\n-- In your bank: Trust Center and Horizon Catalog surface the same lineage,\n-- classification and access history centrally for the CDO / data office.\n\nSELECT 'GOV2 complete' AS STATUS;\n", "sql_name": "vignettes/gov2_lineage_audit/gov2.sql"}, {"code": "GOV3", "title": "AI governance with Cortex AI Gateway", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>AI governance lead / platform team<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~40 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>C1 only. Uses the account&#x27;s Cortex AI Gateway (<code>SNOWFLAKE<\/code>, created by Snowflake)<\/td><\/tr>\n<tr><td><strong>Reference<\/strong><\/td><td><span class=\"ref\"><code>gov3.sql<\/code><\/span>, <span class=\"ref\"><code>gov3_gateway_calls.py<\/code><\/span><\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>Our teams use coding agents, SDK apps and Snowflake agents. How do we control which models they can reach, see what every request did, and attribute AI spend to each person, without slowing the builders down?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>Notebook <code>gov3_ai_gateway<\/code> that calls two model families through the gateway and reads back what it recorded<\/li>\n<li>A key pair on your own user, restricted to <code>HOL_PARTICIPANT<\/code> and expiring after a day<\/li>\n<li>A drafted model policy for the gateway (only an account administrator can apply it)<\/li>\n<li>A per-user, per-model view of AI usage from the gateway&#x27;s traces<\/li>\n<\/ul>\n<h3>One governed door for every AI client<\/h3>\n<p>Cortex AI Gateway (preview) gives every AI client in the organisation one endpoint. It speaks the industry-standard APIs (OpenAI Chat Completions and Responses, Anthropic Messages), so any client that lets you change its base URL can use it: coding agents, the OpenAI and Anthropic SDKs, agent frameworks. Inference stays inside the Snowflake perimeter, and every request is tied to the Snowflake user who sent it, so access control, traces and cost attribution come for free.<\/p>\n<ul>\n<li><strong>Access:<\/strong> USAGE on the gateway lets a role send requests. It doesn&#x27;t widen which models a user may reach: model access controls such as <code>CORTEX_MODELS_ALLOWLIST<\/code> still apply.<\/li>\n<li><strong>Specification:<\/strong> which models the gateway exposes, and what it logs.<\/li>\n<li><strong>Observability:<\/strong> traces and spans for every request, in an event table in your account.<\/li>\n<li><strong>Cost:<\/strong> per-user attribution, budgets and per-user quotas.<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Open the starter notebook and create its service<\/h4>\n<p class=\"where\">the <strong>banking-hol-pack<\/strong> Workspace (not My Workspace) &gt; file explorer &gt; <code>notebooks/gov3_ai_gateway.ipynb<\/code><\/p>\n<ol>\n<li>Open <code>notebooks/<\/code> &gt; <strong>gov3_ai_gateway.ipynb<\/strong> in the file explorer.<\/li>\n<li>In the notebook toolbar, click the arrow next to the status dot (right of the blue run button).<\/li>\n<li>Choose <strong>Create new service<\/strong>.<\/li>\n<\/ol>\n<ul>\n<li>Already created one in another module? Pick it under <strong>Select service<\/strong> instead, usually <code>USER_SERVICE_1<\/code>.<\/li>\n<\/ul>\n<ol>\n<li>Expand <strong>Service settings<\/strong> and fill in <strong>Connect your notebook<\/strong> as below. Only the three <strong>bold<\/strong> rows change.<\/li>\n<\/ol>\n<table>\n<tr><td>Setting<\/td><td>Value<\/td><\/tr>\n<tr><td>Service name<\/td><td>leave the default (e.g. <code>USER_SERVICE_1<\/code>)<\/td><\/tr>\n<tr><td>Artifact repositories<\/td><td>leave as is (<code>SNOWFLAKE.SNOWPARK.PYPI_SHARED_REPOSITORY<\/code>)<\/td><\/tr>\n<tr><td>Enable distributed compute<\/td><td>off<\/td><\/tr>\n<tr><td>Runtime<\/td><td>leave as is (v3.0 \u00b7 Python 3.12)<\/td><\/tr>\n<tr><td>Compute type<\/td><td>CPU<\/td><\/tr>\n<tr><td>Custom image<\/td><td>leave empty<\/td><\/tr>\n<tr><td><strong>Compute pool<\/strong><\/td><td><strong>NOTEBOOK_POOL<\/strong> (change it from HOL_COMPUTE_POOL_CPU)<\/td><\/tr>\n<tr><td><strong>Idle timeout<\/strong><\/td><td><strong>1 hour<\/strong> (change it from 24 hours)<\/td><\/tr>\n<tr><td><strong>External access integrations<\/strong><\/td><td><strong>HOL_NOTEBOOK_ACCESS_INTEGRATION<\/strong> (lets notebooks reach Postgres and the AI Gateway; set it here so one service works for every notebook module)<\/td><\/tr>\n<tr><td>Secrets<\/td><td>leave empty<\/td><\/tr>\n<\/table>\n<ol>\n<li>Click <strong>Create and connect<\/strong>. The first start takes 1-2 minutes.<\/li>\n<li>Check the role is <strong>HOL_PARTICIPANT<\/strong> and the warehouse is <strong>BANKING_WH<\/strong>, using the role and warehouse button in the notebook toolbar.<\/li>\n<\/ol>\n<p><strong>Important:<\/strong> if you can&#x27;t see <code>notebooks/<\/code> and <code>vignettes/<\/code>, you&#x27;re in the wrong Workspace. Pick <strong>banking-hol-pack<\/strong> from the Workspace dropdown (top left).<\/p>\n<p>The starter notebook has one numbered heading per step, so Cortex Code puts each cell in the right place.<\/p>\n<p>A notebook runs on its own <strong>notebook service<\/strong>, which you create once with these settings.<\/p>\n<p class=\"expect\"><strong>What you should see:<\/strong> the starter notebook open in banking-hol-pack with its numbered headings, and the status dot showing the service connected<\/p>\n<h4>Inspect the gateway<\/h4>\n<p class=\"where\">the Cortex Code sidebar, with <code>gov3_ai_gateway<\/code> open<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>In the open notebook gov3_ai_gateway, put each cell I ask for under its matching numbered heading. Under heading 1, add a SQL cell named gateway that runs SHOW AI GATEWAYS and a SQL cell named gateway_spec that runs DESCRIBE AI GATEWAY SNOWFLAKE. Run them and explain the specification: which models it exposes, whether logging is on, and whether prompts and responses are captured.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> one gateway, <code>SNOWFLAKE<\/code>, with its base URL. The specification exposes every model (<code>name: &#x27;*&#x27;<\/code>) and logs every request&#x27;s metadata; prompts and responses are <strong>not<\/strong> captured unless an administrator turns payload capture on.<\/p>\n<h4>Give yourself a short-lived key<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Add a Python cell named make_key that generates an RSA key pair in memory with the cryptography package and registers the public key on my own user with ALTER USER ADD KEY PAIR GOV3_GATEWAY_KEY PUBLIC_KEY = &#x27;&lt;base64 DER public key&gt;&#x27; ROLE_RESTRICTION = &#x27;HOL_PARTICIPANT&#x27; DAYS_TO_EXPIRY = 1, using get_active_session(). Remove any existing GOV3_GATEWAY_KEY first (REMOVE KEY PAIR has no IF EXISTS, so wrap it in try/except). Keep the private key in a variable called key; never print or save it. Then run SHOW USER KEY PAIRS. Use vignettes/gov3_ai_gateway/gov3_gateway_calls.py in the Workspace as the reference.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> <code>GOV3_GATEWAY_KEY<\/code> listed with role restriction <code>HOL_PARTICIPANT<\/code> and an expiry tomorrow. The gateway accepts the same tokens as other Snowflake REST APIs: OAuth, a key-pair JWT or a programmatic access token. A key that&#x27;s tied to one role and expires in a day can only do what the lab role can, and only today.<\/p>\n<h4>Call two model families through the gateway<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Add a Python cell named gateway_calls that builds a key-pair JWT from key (issuer ACCOUNT.USER.SHA256:&lt;public key fingerprint&gt;, subject ACCOUNT.USER, 50 minute expiry, signed RS256 with cryptography) and calls the gateway at https://&lt;org&gt;-&lt;account&gt;.snowflakecomputing.com/api/v2/aigateways/snowflake, with underscores in the host replaced by hyphens. Send the header X-Snowflake-Authorization-Token-Type: KEYPAIR_JWT and the conversation header x-snowflake-ai-gateway-conversation-id: gov3-lab. Make two calls with urllib: openai-gpt-5 on /v1/chat/completions asking &quot;In two sentences, why might a CHAPS payment be returned, and what should the operations team check first?&quot;, and claude-sonnet-4-5 on /v1/messages asking the same about a delayed SEPA payment. Print each answer and its token usage. Use gov3_gateway_calls.py as the reference.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> two answers, one from each model family, each with its token counts. Same endpoint, same credential, two API formats: the gateway routes each request to the right model. Any client that can change its base URL (a coding agent, the OpenAI SDK, an agent framework) could make these calls.<\/p>\n<h4>See what the gateway recorded<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Add a SQL cell named my_traces over TABLE(AGENT_TRACE_TABLE(&#x27;SNOWFLAKE&#x27;)) for the last hour: one row per trace with the start time, user (resource_attributes:&quot;user&quot;), model (record_attributes:&quot;gen_ai.request.model&quot;), conversation id (record_attributes:&quot;gen_ai.conversation.id&quot;), input and output tokens (record_attributes:&quot;gen_ai.usage.input_tokens&quot; and &quot;gen_ai.usage.output_tokens&quot;), duration in milliseconds, and status (http.status_code below 400 is success). Run it and explain the difference between a conversation, a trace and a span.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> your two calls, tagged with your user, the model, the <code>gov3-lab<\/code> conversation and their tokens and duration. You see only your own traces: a role with <strong>MONITOR<\/strong> on the gateway sees everyone&#x27;s. The same data is charted in Snowsight under <strong>AI &amp; ML &gt; AI Gateway &gt; Observability<\/strong>.<\/p>\n<h4>Draft a tighter model policy<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Add a markdown cell explaining the gateway specification, then a code cell (don&#x27;t run it) with the ALTER AI GATEWAY SNOWFLAKE FROM SPECIFICATION statement an account administrator would run to expose only claude-sonnet-4-5, claude-haiku-4-5 and openai-gpt-5, keep logging on, turn on prompt and response capture, and exclude users tagged BANKING_HOL.GOVERNANCE.PAYLOAD_CAPTURE_EXEMPT from capture. Explain why FROM SPECIFICATION replaces the whole specification, why captured prompts make the trace table sensitive, and how CORTEX_MODELS_ALLOWLIST differs from the gateway&#x27;s model list.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> a reviewed specification change, not applied: attendees aren&#x27;t account administrators, which is the point. The gateway list controls what this door exposes; <code>CORTEX_MODELS_ALLOWLIST<\/code> controls which models anyone in the account can use at all. Capturing prompts helps audit and evaluation but puts customer data into the trace table, so restrict who can read it, and exempt sensitive users.<\/p>\n<h4>See who is using which model<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Add a SQL cell named usage_by_model over TABLE(AGENT_TRACE_TABLE(&#x27;SNOWFLAKE&#x27;)) for the last day: requests, input tokens and output tokens per user and model, plus the failure count. Then add a markdown cell explaining where an AI governance lead gets authoritative credits (SNOWFLAKE.ACCOUNT_USAGE.AI_GATEWAY_USAGE_HISTORY, which lags), and the controls they can apply: budgets, per-user quotas, and revoking USAGE on the gateway from a role.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> your usage by model. Traces show what happened per request; credits come from <code>AI_GATEWAY_USAGE_HISTORY<\/code>, and per-user quotas or a budget stop spend before it surprises you.<\/p>\n<h3>Business Ontology: one vocabulary for every agent (concept)<\/h3>\n<p>Governing the door is half the story; the other half is making sure every AI client means the same thing by the same words. <strong>Business Ontology<\/strong> (private preview) is a business-wide vocabulary: terms such as <strong>Client<\/strong>, <strong>Payment<\/strong>, <strong>SLA breach<\/strong>, <strong>Churn risk<\/strong>, <strong>Branch<\/strong> and <strong>Catchment<\/strong> are defined once, related to each other (a Payment belongs to a Client; an SLA breach is a Payment that missed its scheme&#x27;s target), and linked to the Snowflake objects that implement them, such as the semantic views this lab builds: <code>SV_CLIENT_360<\/code> (DA1), <code>SV_PAYMENTS_AUDIT<\/code> (GOV2) and <code>SV_BRANCH_NETWORK<\/code> (DA3). Agents and Cortex Sense ground their answers in those definitions, so &quot;churn risk&quot; means the same in the payments agent, the branch advisor and a coding agent behind the gateway. It&#x27;s enabled per account during the preview, so this lab describes it rather than building it.<\/p>\n<h3>Check your work<\/h3>\n<p><code>gov3_traces<\/code> passes once the gateway has recorded at least two of your requests today. Remove your key when you&#x27;re done: <code>ALTER USER REMOVE KEY PAIR GOV3_GATEWAY_KEY<\/code> (it expires tomorrow anyway).<\/p>\n<h3>In your bank<\/h3>\n<p>One endpoint, one identity, one trace table for every AI client means the AI governance lead can answer &quot;who used which model, on what, at what cost&quot; from Snowflake alone, and change the policy in one place.<\/p>", "sql": "-- =====================================================\n-- GOV3: AI governance with Cortex AI Gateway - reference SQL\n-- The calls themselves are Python (gov3_gateway_calls.py); this is the SQL around them.\n-- =====================================================\nUSE ROLE HOL_PARTICIPANT;\nUSE WAREHOUSE BANKING_WH;\n\n-- 1. The gateway Snowflake created for this account, and its specification\nSHOW AI GATEWAYS;\nDESCRIBE AI GATEWAY SNOWFLAKE;\n\n-- 2. Your key pair (registered from the notebook with ALTER USER ADD KEY PAIR)\nSHOW USER KEY PAIRS;\n\n-- 3. What the gateway recorded for you in the last hour: one row per trace\nWITH spans AS (\n    SELECT trace:\"trace_id\"::STRING                                         AS TRACE_ID,\n           resource_attributes:\"user\"::STRING                               AS USER_NAME,\n           record_attributes:\"gen_ai.request.model\"::STRING                 AS MODEL,\n           record_attributes:\"gen_ai.conversation.id\"::STRING               AS CONVERSATION_ID,\n           TRY_TO_NUMBER(record_attributes:\"gen_ai.usage.input_tokens\"::STRING)  AS INPUT_TOKENS,\n           TRY_TO_NUMBER(record_attributes:\"gen_ai.usage.output_tokens\"::STRING) AS OUTPUT_TOKENS,\n           TRY_TO_NUMBER(record_attributes:\"http.status_code\"::STRING)      AS HTTP_STATUS,\n           start_timestamp, timestamp\n    FROM TABLE(AGENT_TRACE_TABLE('SNOWFLAKE'))\n    WHERE timestamp >= DATEADD('hour', -1, CURRENT_TIMESTAMP())\n)\nSELECT TRACE_ID, MIN(start_timestamp) AS STARTED_AT, MAX(USER_NAME) AS USER_NAME, MAX(MODEL) AS MODEL,\n       MAX(CONVERSATION_ID) AS CONVERSATION_ID, SUM(INPUT_TOKENS) AS INPUT_TOKENS, SUM(OUTPUT_TOKENS) AS OUTPUT_TOKENS,\n       DATEDIFF('millisecond', MIN(start_timestamp), MAX(timestamp)) AS DURATION_MS,\n       IFF(COUNT_IF(HTTP_STATUS >= 400) = 0, 'SUCCESS', 'FAILURE') AS STATUS\nFROM spans\nGROUP BY TRACE_ID\nORDER BY STARTED_AT DESC;\n\n-- 4. Draft only: a tighter specification. Needs ACCOUNTADMIN, and FROM SPECIFICATION\n--    replaces the whole specification, so start from what DESCRIBE returns.\n-- CREATE TAG IF NOT EXISTS BANKING_HOL.GOVERNANCE.PAYLOAD_CAPTURE_EXEMPT;\n-- ALTER AI GATEWAY SNOWFLAKE FROM SPECIFICATION $$\n-- schema_version: 1\n-- models:\n--   - name: claude-sonnet-4-5\n--   - name: claude-haiku-4-5\n--   - name: openai-gpt-5\n-- logging:\n--   enabled: true\n--   capture_payload:\n--     request_response: true\n--     exclude_tags:\n--       - BANKING_HOL.GOVERNANCE.PAYLOAD_CAPTURE_EXEMPT\n-- $$;\n\n-- 5. Usage per user and model in the last day (your own rows unless you have MONITOR)\nSELECT resource_attributes:\"user\"::STRING                                       AS USER_NAME,\n       record_attributes:\"gen_ai.request.model\"::STRING                         AS MODEL,\n       COUNT(*)                                                                 AS REQUESTS,\n       SUM(TRY_TO_NUMBER(record_attributes:\"gen_ai.usage.input_tokens\"::STRING))  AS INPUT_TOKENS,\n       SUM(TRY_TO_NUMBER(record_attributes:\"gen_ai.usage.output_tokens\"::STRING)) AS OUTPUT_TOKENS,\n       COUNT_IF(TRY_TO_NUMBER(record_attributes:\"http.status_code\"::STRING) >= 400) AS FAILURES\nFROM TABLE(AGENT_TRACE_TABLE('SNOWFLAKE'))\nWHERE timestamp >= DATEADD('day', -1, CURRENT_TIMESTAMP())\n  AND record_attributes:\"gen_ai.operation.name\"::STRING = 'chat'\nGROUP BY 1, 2\nORDER BY REQUESTS DESC;\n\n-- Authoritative credits (lags; needs Account Usage access):\n-- SELECT * FROM SNOWFLAKE.ACCOUNT_USAGE.AI_GATEWAY_USAGE_HISTORY ORDER BY START_TIME DESC LIMIT 50;\n\n-- 6. Clean up\n-- ALTER USER REMOVE KEY PAIR GOV3_GATEWAY_KEY;\n", "sql_name": "vignettes/gov3_ai_gateway/gov3.sql"}, {"code": "GOV4", "title": "Answer a customer's data request", "body": "<table>\n<tr><td><strong>Persona<\/strong><\/td><td>Governance / Risk<\/td><\/tr>\n<tr><td><strong>Time<\/strong><\/td><td>~40 min<\/td><\/tr>\n<tr><td><strong>Prerequisites<\/strong><\/td><td>GOV1<\/td><\/tr>\n<\/table>\n<h3>Business question<\/h3>\n<blockquote>A customer has asked for a copy of everything we hold about them. UK GDPR gives us a month, the search has to be reasonable and proportionate, and financial crime records can&#x27;t simply be handed over. Can we answer it from the data itself, and prove who has seen it?<\/blockquote>\n<h3>What you&#x27;ll build<\/h3>\n<ul>\n<li>Copies of the customer tables in <code>GOVERNANCE<\/code>, with a <code>PERSONAL_DATA<\/code> tag on every personal column<\/li>\n<li>Stored procedure <code>DATA_REQUEST<\/code>: everything held about one customer, found from the tags<\/li>\n<li><code>DATA_REQUESTS<\/code>: each request with its due date, the pack and an AI-drafted cover letter<\/li>\n<\/ul>\n<h3>Steps<\/h3>\n<h4>Bring the customer data into GOVERNANCE<\/h4>\n<p class=\"where\">the Cortex Code sidebar<\/p>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>In BANKING_HOL.GOVERNANCE create table copies (CREATE OR REPLACE TABLE ... AS SELECT *) of these tables from BANKING_HOL.RAW_DATA, keeping their names: RB_CUSTOMERS, RB_ACCOUNTS, RB_TRANSACTIONS, RB_CALL_TRANSCRIPTS, RB_COMPLAINTS, RB_EMAILS, RB_FRAUD_CASES and RB_SAR_NARRATIVES. Show the row count of each.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> eight tables; the sources in <code>RAW_DATA<\/code> stay read-only<\/p>\n<h4>Tag personal data once, by kind<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>In BANKING_HOL.GOVERNANCE create a tag PERSONAL_DATA with allowed values IDENTITY, CONTACT, FINANCIAL, COMMUNICATIONS, FINANCIAL_CRIME. Set it on: RB_CUSTOMERS first name, last name and date of birth (IDENTITY), address line 1 and postcode (CONTACT), annual income and credit score (FINANCIAL); RB_ACCOUNTS product and balance, RB_TRANSACTIONS amount and merchant (FINANCIAL); RB_CALL_TRANSCRIPTS transcript, RB_COMPLAINTS complaint text, RB_EMAILS body (COMMUNICATIONS); RB_FRAUD_CASES investigator notes and RB_SAR_NARRATIVES narrative (FINANCIAL_CRIME). Then show every tagged column in GOVERNANCE with its value.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> 16 tagged columns. From now on, the tags say where personal data lives<\/p>\n<h4>Find everything about one customer<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>In BANKING_HOL.GOVERNANCE create a table DATA_REQUESTS (REQUEST_ID, CUSTOMER_ID, RECEIVED_AT TIMESTAMP_LTZ, DUE_BY DATE, TABLES_FOUND, ROWS_FOUND, HELD_BACK, LETTER, PACK VARIANT). Then create a Python stored procedure DATA_REQUEST(CUSTOMER VARCHAR) returning VARIANT that: finds every table in GOVERNANCE with a CUSTOMER_ID column and at least one PERSONAL_DATA-tagged column (using INFORMATION_SCHEMA.COLUMNS and TAG_REFERENCES_ALL_COLUMNS, not a hard-coded list); for each that has rows for the customer, collects the tagged columns (up to 50 rows, bind the customer id); puts any table tagged FINANCIAL_CRIME in a held_back list instead, with only its row count; lists who read those tables in the last 30 days from SNOWFLAKE.ACCOUNT_USAGE.ACCESS_HISTORY (flatten BASE_OBJECTS_ACCESSED in a CTE); drafts a short cover letter with AI_COMPLETE (claude-sonnet-4-5) that never mentions fraud or anything held back; and inserts a DATA_REQUESTS row with DUE_BY one month from today.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> one procedure that finds the data from the tags, so a newly tagged table is included automatically<\/p>\n<h4>Answer the request<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>Call BANKING_HOL.GOVERNANCE.DATA_REQUEST(&#x27;RB101023&#x27;), then show the newest row of DATA_REQUESTS: due date, tables found, rows found, how many tables were held back, and the letter.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> about 5 tables and 50 records, 2 held back (a fraud case and a SAR), and a due date a month from today<\/p>\n<h4>Explain what was held back<\/h4>\n<div class=\"prompt\"><div class=\"plabel\"><span>Paste into Cortex Code<\/span><button class=\"btn ghost cp\">Copy<\/button><\/div><pre>For the newest request in BANKING_HOL.GOVERNANCE.DATA_REQUESTS, explain in plain English which records were held back and why a bank would refer financial crime records to its money laundering reporting officer before releasing anything, and what a reviewer should check before the pack goes out.<\/pre><\/div>\n<p class=\"expect\"><strong>What you should see:<\/strong> the reason in plain words, for the person who signs the response off<\/p>\n<h3>Check your work<\/h3>\n<p><code>DATA_REQUESTS<\/code> has a row for RB101023 with a due date, the tables found, two held back, and a letter that doesn&#x27;t mention them.<\/p>\n<h3>In your bank<\/h3>\n<p>In production the tags sit on the source data products, set by classification, so every copy and pipeline inherits them, and the response goes through the bank&#x27;s data protection review. The executive demo&#x27;s &quot;A customer asks for their data&quot; stop is this module, finished.<\/p>", "sql": "-- =====================================================\n-- GOV4: Answer a customer's data request (solution / catch-up)\n-- UK GDPR right of access: tag personal data once, find everything held about one customer,\n-- show who read it, and log the response with its one-month due date.\n-- Run as HOL_PARTICIPANT after GOV1. Works on copies in BANKING_HOL.GOVERNANCE (the sources stay read-only).\n-- =====================================================\nUSE ROLE HOL_PARTICIPANT;\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.GOVERNANCE;\n\n-- 1. Copies of the retail tables that hold customers\nCREATE OR REPLACE TABLE RB_CUSTOMERS        AS SELECT * FROM BANKING_HOL.RAW_DATA.RB_CUSTOMERS;\nCREATE OR REPLACE TABLE RB_ACCOUNTS         AS SELECT * FROM BANKING_HOL.RAW_DATA.RB_ACCOUNTS;\nCREATE OR REPLACE TABLE RB_TRANSACTIONS     AS SELECT * FROM BANKING_HOL.RAW_DATA.RB_TRANSACTIONS;\nCREATE OR REPLACE TABLE RB_CALL_TRANSCRIPTS AS SELECT * FROM BANKING_HOL.RAW_DATA.RB_CALL_TRANSCRIPTS;\nCREATE OR REPLACE TABLE RB_COMPLAINTS       AS SELECT * FROM BANKING_HOL.RAW_DATA.RB_COMPLAINTS;\nCREATE OR REPLACE TABLE RB_EMAILS           AS SELECT * FROM BANKING_HOL.RAW_DATA.RB_EMAILS;\nCREATE OR REPLACE TABLE RB_FRAUD_CASES      AS SELECT * FROM BANKING_HOL.RAW_DATA.RB_FRAUD_CASES;\nCREATE OR REPLACE TABLE RB_SAR_NARRATIVES   AS SELECT * FROM BANKING_HOL.RAW_DATA.RB_SAR_NARRATIVES;\n\n-- 2. Tag personal data by kind, once\nCREATE OR REPLACE TAG PERSONAL_DATA ALLOWED_VALUES 'IDENTITY', 'CONTACT', 'FINANCIAL', 'COMMUNICATIONS', 'FINANCIAL_CRIME'\n  COMMENT = 'Which kind of personal data a column holds (UK GDPR right of access)';\nALTER TABLE RB_CUSTOMERS MODIFY\n  COLUMN FIRST_NAME SET TAG PERSONAL_DATA = 'IDENTITY', COLUMN LAST_NAME SET TAG PERSONAL_DATA = 'IDENTITY',\n  COLUMN DATE_OF_BIRTH SET TAG PERSONAL_DATA = 'IDENTITY', COLUMN ADDRESS_LINE_1 SET TAG PERSONAL_DATA = 'CONTACT',\n  COLUMN POSTCODE SET TAG PERSONAL_DATA = 'CONTACT', COLUMN ANNUAL_INCOME_GBP SET TAG PERSONAL_DATA = 'FINANCIAL',\n  COLUMN CREDIT_SCORE SET TAG PERSONAL_DATA = 'FINANCIAL';\nALTER TABLE RB_ACCOUNTS MODIFY COLUMN PRODUCT SET TAG PERSONAL_DATA = 'FINANCIAL', COLUMN BALANCE_GBP SET TAG PERSONAL_DATA = 'FINANCIAL';\nALTER TABLE RB_TRANSACTIONS MODIFY COLUMN AMOUNT_GBP SET TAG PERSONAL_DATA = 'FINANCIAL', COLUMN MERCHANT SET TAG PERSONAL_DATA = 'FINANCIAL';\nALTER TABLE RB_CALL_TRANSCRIPTS MODIFY COLUMN TRANSCRIPT SET TAG PERSONAL_DATA = 'COMMUNICATIONS';\nALTER TABLE RB_COMPLAINTS MODIFY COLUMN COMPLAINT_TEXT SET TAG PERSONAL_DATA = 'COMMUNICATIONS';\nALTER TABLE RB_EMAILS MODIFY COLUMN BODY SET TAG PERSONAL_DATA = 'COMMUNICATIONS';\nALTER TABLE RB_FRAUD_CASES MODIFY COLUMN INVESTIGATOR_NOTES SET TAG PERSONAL_DATA = 'FINANCIAL_CRIME';\nALTER TABLE RB_SAR_NARRATIVES MODIFY COLUMN NARRATIVE SET TAG PERSONAL_DATA = 'FINANCIAL_CRIME';\n\n-- 3. Where does personal data live? (driven by the tags, not a hand-kept list)\nSELECT 'RB_CUSTOMERS' AS TABLE_NAME, COLUMN_NAME, TAG_VALUE\nFROM TABLE(BANKING_HOL.INFORMATION_SCHEMA.TAG_REFERENCES_ALL_COLUMNS('BANKING_HOL.GOVERNANCE.RB_CUSTOMERS', 'table'))\nWHERE TAG_NAME = 'PERSONAL_DATA';\n\n-- 4. The request log, with the legal due date (one month; up to two more for complex requests)\nCREATE OR REPLACE TABLE DATA_REQUESTS (\n    REQUEST_ID VARCHAR, CUSTOMER_ID VARCHAR, RECEIVED_AT TIMESTAMP_LTZ, DUE_BY DATE,\n    TABLES_FOUND NUMBER, ROWS_FOUND NUMBER, HELD_BACK NUMBER, LETTER VARCHAR, PACK VARIANT\n);\n\n-- 5. One call answers a request: every tagged table holding the customer, financial crime\n--    records held back for the MLRO, who read those tables in 30 days, and a drafted letter\nCREATE OR REPLACE PROCEDURE DATA_REQUEST(CUSTOMER VARCHAR)\nRETURNS VARIANT\nLANGUAGE PYTHON\nRUNTIME_VERSION = '3.11'\nPACKAGES = ('snowflake-snowpark-python')\nHANDLER = 'run'\nAS\n$$\nimport json, uuid\n\nDB, SCH, TAG = \"BANKING_HOL\", \"GOVERNANCE\", \"PERSONAL_DATA\"\nHELD = {\"FINANCIAL_CRIME\"}\n\ndef q(s):\n    return '\"' + s.replace('\"', '\"\"') + '\"'\n\ndef run(session, customer):\n    cust = session.sql(f\"SELECT CUSTOMER_ID, FIRST_NAME || ' ' || LAST_NAME AS NAME FROM {DB}.{SCH}.RB_CUSTOMERS WHERE CUSTOMER_ID = ?\",\n                       params=[customer]).collect()\n    if not cust:\n        return {\"error\": f\"No customer {customer}\"}\n    tables = [r[\"TABLE_NAME\"] for r in session.sql(\n        f\"SELECT TABLE_NAME FROM {DB}.INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA = '{SCH}' AND COLUMN_NAME = 'CUSTOMER_ID' ORDER BY 1\").collect()]\n    found, held_back = [], []\n    for t in tables:\n        fqn = f\"{DB}.{SCH}.{t}\"\n        tags = session.sql(f\"SELECT COLUMN_NAME, TAG_VALUE FROM TABLE({DB}.INFORMATION_SCHEMA.TAG_REFERENCES_ALL_COLUMNS('{fqn}', 'table')) WHERE TAG_NAME = '{TAG}'\").collect()\n        if not tags:\n            continue\n        n = session.sql(f\"SELECT COUNT(*) AS N FROM {fqn} WHERE CUSTOMER_ID = ?\", params=[customer]).collect()[0][\"N\"]\n        if n == 0:\n            continue\n        kinds = sorted({r[\"TAG_VALUE\"] for r in tags})\n        entry = {\"table\": t, \"rows\": n, \"kinds\": kinds}\n        if HELD & set(kinds):\n            held_back.append(entry)\n            continue\n        cols = \", \".join(f\"LEFT({q(r['COLUMN_NAME'])}::VARCHAR, 200) AS {q(r['COLUMN_NAME'])}\" for r in tags)\n        entry[\"records\"] = [r.as_dict() for r in session.sql(f\"SELECT {cols} FROM {fqn} WHERE CUSTOMER_ID = ? LIMIT 50\", params=[customer]).collect()]\n        found.append(entry)\n    names = \"', '\".join(f\"{DB}.{SCH}.{e['table']}\" for e in found + held_back)\n    access = [r.as_dict() for r in session.sql(f\"\"\"\n        WITH reads AS (\n          SELECT DISTINCT ah.QUERY_ID, ah.USER_NAME, ah.QUERY_START_TIME\n          FROM SNOWFLAKE.ACCOUNT_USAGE.ACCESS_HISTORY ah, LATERAL FLATTEN(ah.BASE_OBJECTS_ACCESSED) o\n          WHERE ah.QUERY_START_TIME > DATEADD(day, -30, CURRENT_TIMESTAMP()) AND o.value:objectName::VARCHAR IN ('{names}'))\n        SELECT USER_NAME, COUNT(*) AS QUERIES, TO_VARCHAR(MAX(QUERY_START_TIME), 'YYYY-MM-DD HH24:MI') AS LAST_READ\n        FROM reads GROUP BY 1 ORDER BY QUERIES DESC\"\"\").collect()]\n    rows = sum(e[\"rows\"] for e in found)\n    summary = \"; \".join(f\"{e['table']} ({e['rows']})\" for e in found)\n    letter = session.sql(\"SELECT AI_COMPLETE('claude-sonnet-4-5', ?) AS L\", params=[\n        f\"Write a short plain-English cover letter (under 170 words, no markdown, no bracketed placeholders) from the bank to {cust[0]['NAME']} \"\n        f\"answering their request for a copy of their personal data. Enclosed: {summary}. Say we searched every system that holds their \"\n        \"personal data, there is no charge, and they can complain to the Information Commissioner's Office. Do not mention fraud, \"\n        \"financial crime or anything held back. Sign off as the Data Protection Team.\"]).collect()[0][\"L\"]\n    req = \"DSR-\" + uuid.uuid4().hex[:8].upper()\n    pack = {\"request_id\": req, \"customer\": cust[0].as_dict(), \"tables\": found, \"held_back\": held_back, \"access\": access}\n    session.sql(f\"\"\"INSERT INTO {DB}.{SCH}.DATA_REQUESTS\n                    SELECT ?, ?, CURRENT_TIMESTAMP(), DATEADD(month, 1, CURRENT_DATE()), ?, ?, ?, ?, PARSE_JSON(?)\"\"\",\n                params=[req, customer, len(found), rows, len(held_back), letter, json.dumps(pack, default=str)]).collect()\n    return {\"request_id\": req, \"tables\": len(found), \"rows\": rows, \"held_back\": [e[\"table\"] for e in held_back], \"readers\": len(access)}\n$$;\n\n-- 6. Answer one (RB101023 has a fraud case and a SAR, so two tables are held back)\nCALL DATA_REQUEST('RB101023');\nSELECT REQUEST_ID, CUSTOMER_ID, DUE_BY, TABLES_FOUND, ROWS_FOUND, HELD_BACK, LEFT(LETTER, 200) AS LETTER_START\nFROM DATA_REQUESTS ORDER BY RECEIVED_AT DESC;\n", "sql_name": "vignettes/gov4_data_request/gov4.sql"}, {"code": "client_360", "title": "Catch-up: client 360", "body": "<p>Run this if a vignette lists it as a prerequisite and you have not built it yet.<\/p>", "sql": "-- =====================================================\n-- BANKING HOL PACK - CATCH-UP SCRIPT\n-- CLIENT 360 SEMANTIC VIEW (what DA1 builds)\n--\n-- Run this if you skipped DA1 and your module needs SV_CLIENT_360\n-- (OPS1, AI1, AI2, AI3). Safe to re-run.\n--   1. Creates the staging views and FEEDBACK_ENRICHED only if they are missing,\n--      so it keeps anything DE1 (dbt) or DA2 (AI enrichment) already built.\n--      Scoring FEEDBACK_ENRICHED calls AI_SENTIMENT and AI_CLASSIFY once per\n--      feedback row (about 2,000 rows).\n--   2. Builds DA1's contract views and the semantic view SV_CLIENT_360.\n-- Keep sections 1 and 2 in step with core_analytics.sql and da1.sql.\n-- =====================================================\n\nUSE ROLE HOL_PARTICIPANT;\nUSE SECONDARY ROLES NONE;   -- see exactly what an attendee sees\nUSE WAREHOUSE BANKING_WH;\nUSE SCHEMA BANKING_HOL.ANALYTICS;\n\n-- =====================================================\n-- 1. Analytics layer, only what is missing\n-- =====================================================\n-- ---------- Staging views ----------\nCREATE VIEW IF NOT EXISTS STG_PAYMENTS AS\nSELECT\n    PAYMENT_ID,\n    PAYMENT_DATE::TIMESTAMP                             AS PAYMENT_DATE,\n    DATE_TRUNC('DAY', PAYMENT_DATE::TIMESTAMP)          AS PAYMENT_DAY,\n    ORIGINATOR_ACCOUNT_ID,\n    BENEFICIARY_ACCOUNT_ID,\n    UPPER(TRIM(PAYMENT_TYPE))                           AS PAYMENT_TYPE,\n    UPPER(TRIM(CHANNEL))                                AS CHANNEL,\n    UPPER(TRIM(CURRENCY))                               AS CURRENCY,\n    AMOUNT::NUMBER(15,2)                                AS AMOUNT,\n    FX_RATE,\n    UPPER(TRIM(STATUS))                                 AS STATUS,\n    PROCESSING_TIME_MS::NUMBER                          AS PROCESSING_TIME_MS,\n    ERROR_CODE,\n    UPPER(TRIM(REGION))                                 AS REGION,\n    SETTLEMENT_DATE,\n    CASE WHEN STATUS = 'COMPLETED' THEN TRUE ELSE FALSE END  AS IS_SUCCESSFUL,\n    CASE WHEN STATUS = 'FAILED'    THEN TRUE ELSE FALSE END  AS IS_FAILED,\n    CASE WHEN ERROR_CODE IS NOT NULL THEN TRUE ELSE FALSE END AS HAS_ERROR\nFROM BANKING_HOL.RAW_DATA.PAYMENTS;\n\nCREATE VIEW IF NOT EXISTS STG_FEEDBACK AS\nSELECT\n    FEEDBACK_ID,\n    FEEDBACK_DATE::TIMESTAMP            AS FEEDBACK_DATE,\n    DATE_TRUNC('DAY', FEEDBACK_DATE)    AS FEEDBACK_DAY,\n    CUSTOMER_ID,\n    PAYMENT_ID,\n    UPPER(TRIM(FEEDBACK_CHANNEL))       AS FEEDBACK_CHANNEL,\n    TRIM(FEEDBACK_TEXT)                 AS FEEDBACK_TEXT,\n    UPPER(TRIM(PAYMENT_TYPE))           AS PAYMENT_TYPE,\n    RATING::NUMBER(1)                   AS RATING,\n    LENGTH(TRIM(FEEDBACK_TEXT))         AS FEEDBACK_LENGTH,\n    CASE WHEN RATING >= 4 THEN 'SATISFIED'\n         WHEN RATING = 3  THEN 'NEUTRAL'\n         ELSE 'DISSATISFIED' END        AS SATISFACTION_TIER\nFROM BANKING_HOL.RAW_DATA.CUSTOMER_FEEDBACK\nWHERE FEEDBACK_TEXT IS NOT NULL AND LENGTH(TRIM(FEEDBACK_TEXT)) > 0;\n\nCREATE VIEW IF NOT EXISTS STG_CUSTOMERS AS\nSELECT\n    c.CUSTOMER_ID,\n    UPPER(TRIM(c.CUSTOMER_NAME))        AS CUSTOMER_NAME,\n    UPPER(TRIM(c.SECTOR))               AS SECTOR,\n    c.COUNTRY,\n    c.ONBOARDING_DATE,\n    UPPER(TRIM(c.KYC_STATUS))           AS KYC_STATUS,\n    c.RM_ID,\n    r.RM_NAME,\n    r.TEAM                              AS RM_TEAM,\n    r.REGION                            AS RM_REGION\nFROM BANKING_HOL.RAW_DATA.CUSTOMERS c\nLEFT JOIN BANKING_HOL.RAW_DATA.RELATIONSHIP_MANAGERS r ON c.RM_ID = r.RM_ID;\n\nCREATE VIEW IF NOT EXISTS STG_ACCOUNTS AS\nSELECT\n    a.ACCOUNT_ID, a.CUSTOMER_ID, a.SORT_CODE, a.ACCOUNT_NUMBER, a.IBAN, a.BIC,\n    UPPER(TRIM(a.CURRENCY))             AS CURRENCY,\n    UPPER(TRIM(a.ACCOUNT_TYPE))         AS ACCOUNT_TYPE,\n    UPPER(TRIM(a.STATUS))               AS STATUS,\n    a.OPENED_DATE,\n    c.CUSTOMER_NAME,\n    c.SECTOR                            AS CUSTOMER_SECTOR\nFROM BANKING_HOL.RAW_DATA.ACCOUNTS a\nLEFT JOIN BANKING_HOL.RAW_DATA.CUSTOMERS c ON a.CUSTOMER_ID = c.CUSTOMER_ID;\n\n-- ---------- AI enrichment (skipped if DA2 or core_analytics.sql already built it) ----------\nCREATE TABLE IF NOT EXISTS FEEDBACK_ENRICHED AS\nWITH ai_scored AS (\n    SELECT f.*, c.CUSTOMER_NAME, c.SECTOR AS CUSTOMER_SECTOR, c.RM_NAME,\n           -- AI_SENTIMENT returns a label, so map the overall label to -1, 0 or 1\n           -- (legacy SNOWFLAKE.CORTEX.SENTIMENT is blocked on new accounts)\n           DECODE(GET(FILTER(AI_SENTIMENT(f.FEEDBACK_TEXT):categories, c -> c:name::STRING = 'overall'), 0):sentiment::STRING,\n                  'positive', 1, 'negative', -1, 0)::FLOAT AS SENTIMENT_SCORE,\n           AI_CLASSIFY(f.FEEDBACK_TEXT,\n               ['Performance Issue','Service Quality','Technical Problem',\n                'Positive Experience','Feature Request']) AS CLASSIFICATION_RESULT\n    FROM STG_FEEDBACK f\n    LEFT JOIN STG_CUSTOMERS c ON f.CUSTOMER_ID = c.CUSTOMER_ID\n)\nSELECT FEEDBACK_ID, FEEDBACK_DATE, CUSTOMER_ID, CUSTOMER_NAME, CUSTOMER_SECTOR, RM_NAME,\n       PAYMENT_ID, FEEDBACK_CHANNEL, FEEDBACK_TEXT, PAYMENT_TYPE, RATING, SENTIMENT_SCORE,\n       CASE WHEN SENTIMENT_SCORE >  0.3 THEN 'POSITIVE'\n            WHEN SENTIMENT_SCORE < -0.3 THEN 'NEGATIVE'\n            ELSE 'NEUTRAL' END                      AS SENTIMENT_LABEL,\n       CLASSIFICATION_RESULT:labels[0]::STRING      AS TOPIC_CATEGORY\nFROM ai_scored;\n\n-- =====================================================\n-- 2. DA1: contract views and SV_CLIENT_360\n-- =====================================================\n-- -----------------------------------------------------\n-- DA1.1 Stable interface views (semantic views should sit on contracts, not raw)\n-- -----------------------------------------------------\nCREATE OR REPLACE VIEW V_CLIENT_PAYMENT_SUMMARY\n    COMMENT = 'One row per corporate client: payment volumes, success and latency'\nAS\nSELECT c.CUSTOMER_ID,\n       COUNT(*)                                                     AS TOTAL_PAYMENTS,\n       COUNT_IF(p.IS_SUCCESSFUL)                                    AS SUCCESSFUL_PAYMENTS,\n       COUNT_IF(p.IS_FAILED)                                        AS FAILED_PAYMENTS,\n       SUM(p.AMOUNT)                                                AS TOTAL_VOLUME_GBP,\n       SUM(IFF(p.IS_FAILED, p.AMOUNT, 0))                           AS FAILED_VOLUME_GBP,\n       ROUND(AVG(p.PROCESSING_TIME_MS), 0)                          AS AVG_PROCESSING_TIME_MS,\n       MAX(p.PAYMENT_DATE)                                          AS LAST_PAYMENT_DATE\nFROM STG_PAYMENTS p\nJOIN STG_ACCOUNTS  a ON p.ORIGINATOR_ACCOUNT_ID = a.ACCOUNT_ID\nJOIN STG_CUSTOMERS c ON a.CUSTOMER_ID = c.CUSTOMER_ID\nGROUP BY c.CUSTOMER_ID;\n\nCREATE OR REPLACE VIEW V_CLIENT_ALERTS\n    COMMENT = 'Operational alerts attributed to the originating corporate client'\nAS\nSELECT al.ALERT_ID, a.CUSTOMER_ID, al.ALERT_TIME::TIMESTAMP AS ALERT_TIME,\n       al.SEVERITY, al.PAYMENT_TYPE, al.STATUS AS ALERT_STATUS,\n       al.ASSIGNED_TO, al.RESOLUTION_TIME_MIN, al.ALERT_DESCRIPTION\nFROM BANKING_HOL.RAW_DATA.OPERATIONAL_ALERTS al\nJOIN BANKING_HOL.RAW_DATA.PAYMENTS p ON al.PAYMENT_ID = p.PAYMENT_ID\nJOIN BANKING_HOL.RAW_DATA.ACCOUNTS a ON p.ORIGINATOR_ACCOUNT_ID = a.ACCOUNT_ID;\n\n-- -----------------------------------------------------\n-- DA1.2 The semantic view: business names, relationships, metrics, synonyms\n-- Tip: you can also build this in Snowsight (AI & ML > Cortex Analyst > Create)\n-- or ask CoCo: \"Create a semantic view over STG_CUSTOMERS, V_CLIENT_PAYMENT_SUMMARY,\n-- FEEDBACK_ENRICHED and V_CLIENT_ALERTS joined on CUSTOMER_ID.\"\n-- -----------------------------------------------------\nCREATE OR REPLACE SEMANTIC VIEW SV_CLIENT_360\n\n  TABLES (\n    clients AS BANKING_HOL.ANALYTICS.STG_CUSTOMERS\n      PRIMARY KEY (CUSTOMER_ID)\n      WITH SYNONYMS = ('customers', 'corporate clients', 'accounts')\n      COMMENT = 'Corporate banking clients with KYC status and assigned relationship manager',\n    payments AS BANKING_HOL.ANALYTICS.V_CLIENT_PAYMENT_SUMMARY\n      PRIMARY KEY (CUSTOMER_ID)\n      COMMENT = 'Payment activity summary per client',\n    feedback AS BANKING_HOL.ANALYTICS.FEEDBACK_ENRICHED\n      PRIMARY KEY (FEEDBACK_ID)\n      WITH SYNONYMS = ('complaints', 'customer feedback', 'sentiment')\n      COMMENT = 'Client feedback with AI sentiment and topic',\n    alerts AS BANKING_HOL.ANALYTICS.V_CLIENT_ALERTS\n      PRIMARY KEY (ALERT_ID)\n      WITH SYNONYMS = ('incidents', 'operational alerts')\n      COMMENT = 'Operational payment alerts per client'\n  )\n\n  RELATIONSHIPS (\n    payments_to_clients AS payments (CUSTOMER_ID) REFERENCES clients,\n    feedback_to_clients AS feedback (CUSTOMER_ID) REFERENCES clients,\n    alerts_to_clients   AS alerts   (CUSTOMER_ID) REFERENCES clients\n  )\n\n  FACTS (\n    payments.total_payments      AS TOTAL_PAYMENTS,\n    payments.successful_payments AS SUCCESSFUL_PAYMENTS,\n    payments.failed_payments     AS FAILED_PAYMENTS,\n    payments.total_volume_gbp    AS TOTAL_VOLUME_GBP,\n    payments.failed_volume_gbp   AS FAILED_VOLUME_GBP,\n    feedback.sentiment_score     AS SENTIMENT_SCORE,\n    feedback.rating              AS RATING,\n    alerts.resolution_time_min   AS RESOLUTION_TIME_MIN\n  )\n\n  DIMENSIONS (\n    clients.customer_name AS CUSTOMER_NAME\n      WITH SYNONYMS = ('client', 'client name', 'company')\n      COMMENT = 'Registered legal entity name (upper case)',\n    clients.sector        AS SECTOR WITH SYNONYMS = ('industry'),\n    clients.country       AS COUNTRY COMMENT = 'ISO alpha-3 country code',\n    clients.kyc_status    AS KYC_STATUS COMMENT = 'APPROVED, PENDING_REVIEW, EXPIRED',\n    clients.rm_name       AS RM_NAME WITH SYNONYMS = ('relationship manager', 'RM', 'banker'),\n    clients.rm_team       AS RM_TEAM COMMENT = 'Corporate, Institutional or SME banking team',\n    feedback.sentiment_label AS SENTIMENT_LABEL COMMENT = 'POSITIVE, NEUTRAL, NEGATIVE',\n    feedback.topic_category  AS TOPIC_CATEGORY,\n    feedback.feedback_payment_type AS PAYMENT_TYPE COMMENT = 'Payment scheme the feedback refers to',\n    feedback.feedback_date   AS FEEDBACK_DATE,\n    alerts.severity       AS SEVERITY COMMENT = 'LOW, MEDIUM, HIGH, CRITICAL',\n    alerts.alert_status   AS ALERT_STATUS COMMENT = 'OPEN, ACKNOWLEDGED, INVESTIGATING, RESOLVED',\n    alerts.alert_time     AS ALERT_TIME\n  )\n\n  METRICS (\n    payments.payment_count     AS SUM(payments.total_payments) WITH SYNONYMS = ('number of payments'),\n    payments.payment_volume    AS SUM(payments.total_volume_gbp) WITH SYNONYMS = ('volume', 'value'),\n    payments.failed_volume     AS SUM(payments.failed_volume_gbp) WITH SYNONYMS = ('value at risk'),\n    payments.success_rate_pct  AS ROUND(SUM(payments.successful_payments) / NULLIF(SUM(payments.total_payments), 0) * 100, 2)\n      COMMENT = 'Weighted payment success rate %',\n    feedback.avg_sentiment     AS ROUND(AVG(feedback.sentiment_score), 3),\n    feedback.negative_feedback_count AS COUNT_IF(feedback.sentiment_label = 'NEGATIVE'),\n    alerts.open_alert_count    AS COUNT_IF(alerts.alert_status <> 'RESOLVED') WITH SYNONYMS = ('open incidents'),\n    alerts.critical_alert_count AS COUNT_IF(alerts.severity = 'CRITICAL'),\n    alerts.avg_resolution_min  AS ROUND(AVG(alerts.resolution_time_min), 0)\n  )\n\n  COMMENT = 'Corporate Client 360 for Payments Operations: payments health, feedback sentiment and operational alerts per client'\n\n  AI_SQL_GENERATION 'Sentiment labels are stored in upper case: POSITIVE, NEUTRAL or NEGATIVE. \"Negative sentiment\" for a client means their average sentiment score is below 0. Client names are stored in upper case; match them case-insensitively with ILIKE. Round percentages to 1 decimal place.'\n\n  AI_VERIFIED_QUERIES (\n    wors
